        c.globalAlpha = 1;
        c.fillStyle = "#c9974a"; c.font = "16px sans-serif";
        c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("💍", w / 2, h - 74 + Math.sin(t * 2) * 3);
      },
      newborn(c, w, h, t) {
        const s = 1 + Math.sin(t * 2.2) * 0.05;
        c.save(); c.translate(w / 2, h - 40); c.scale(s, s);
        c.fillStyle = "#f4d58d"; roundRect(c, -30, -14, 60, 34, 14); c.fill();
        c.fillStyle = "#e8b88a"; c.beginPath(); c.arc(0, -18, 13, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#0f2620";
        c.beginPath(); c.arc(-4.5, -19, 1.6, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(4.5, -19, 1.6, 0, Math.PI * 2); c.fill();
        c.strokeStyle = "#0f2620"; c.lineWidth = 1.3;
        c.beginPath(); c.arc(0, -15, 4.5, 0.2, Math.PI - 0.2); c.stroke();
        c.restore();
        for (let i = 0; i < 5; i++) {
          const a = t * 1.1 + (i / 5) * Math.PI * 2;
          c.fillStyle = "rgba(244,213,141,0.6)";
          c.beginPath(); c.arc(w / 2 + Math.cos(a) * 52, h - 46 + Math.sin(a) * 22, 2.5, 0, Math.PI * 2); c.fill();
        }
      },
      hajj(c, w, h, t) {
        c.fillStyle = "#0a1e1a"; roundRect(c, w / 2 - 30, h - 66, 60, 66, 3); c.fill();
        c.strokeStyle = "#c9974a"; c.lineWidth = 2;
        c.beginPath(); c.moveTo(w / 2 - 30, h - 40); c.lineTo(w / 2 + 30, h - 40); c.stroke();
        for (let i = 0; i < 7; i++) {
          const a = -t * 0.7 + (i / 7) * Math.PI * 2;
          c.globalAlpha = 0.35 + 0.35 * Math.sin(a * 2 + t);
          drawMiniPerson(c, w / 2 + Math.cos(a) * 74, h - 18 + Math.sin(a) * 9, "#e0e8e4", 0.24);
        }
        c.globalAlpha = 1;
        c.fillStyle = "#f4d58d";
        c.beginPath(); c.arc(w / 2, h - 82, 3 + Math.abs(Math.sin(t * 1.6)) * 2, 0, Math.PI * 2); c.fill();
      },
      side_business(c, w, h, t) {
        c.fillStyle = "#1d3d35"; c.fillRect(w / 2 - 44, h - 52, 88, 52);
        c.fillStyle = "#c9974a";
        for (let i = 0; i < 5; i++) {
          const up = i / 4;
          c.globalAlpha = 0.35 + up * 0.65;
          c.fillRect(w / 2 - 52 + i * 26, h - 62 - up * 24, 6, 8 + up * 20);
        }
        c.globalAlpha = 1;
        c.fillStyle = "#2a5043";
        c.beginPath(); c.moveTo(w / 2 - 52, h - 52); c.lineTo(w / 2, h - 74); c.lineTo(w / 2 + 52, h - 52);
        c.closePath(); c.fill();
        const flip = Math.sin(t * 3);
        c.save(); c.translate(w / 2, h - 96); c.scale(1, Math.abs(flip) * 0.9 + 0.1);
        c.fillStyle = flip > 0 ? "#2ecc71" : "#e74c3c";
        c.beginPath(); c.arc(0, 0, 11, 0, Math.PI * 2); c.fill();
        c.restore();
      },
      appliance(c, w, h, t) {
        c.fillStyle = "#cfd8d3"; roundRect(c, w / 2 - 26, h - 82, 52, 82, 5); c.fill();
        c.fillStyle = "#8aa89b"; c.fillRect(w / 2 - 26, h - 50, 52, 2);
        c.fillStyle = "#2a5043"; c.fillRect(w / 2 + 16, h - 74, 3, 16); c.fillRect(w / 2 + 16, h - 44, 3, 16);
        const flash = Math.sin(t * 9) > 0.4;
        if (flash) {
          c.fillStyle = "#f4d58d";
          c.beginPath();
          c.moveTo(w / 2 + 44, h - 74); c.lineTo(w / 2 + 32, h - 52);
          c.lineTo(w / 2 + 42, h - 52); c.lineTo(w / 2 + 30, h - 28);
          c.lineTo(w / 2 + 52, h - 58); c.lineTo(w / 2 + 41, h - 58);
          c.closePath(); c.fill();
        }
      },
    };

    function drawMiniPerson(c, x, y, shirt, scale) {
      c.save(); c.translate(x, y); c.scale(scale * 2, scale * 2);
      c.fillStyle = "#2a1c0d"; c.fillRect(-6, 4, 5, 10); c.fillRect(1, 4, 5, 10);
      c.fillStyle = shirt; roundRect(c, -8, -6, 16, 14, 4); c.fill();
      c.fillStyle = "#e8b88a"; c.beginPath(); c.arc(0, -12, 7, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#3a2a1a"; c.beginPath(); c.arc(0, -15, 7.2, Math.PI, Math.PI * 2); c.fill();
      c.restore();
    }

    function animateEventArt(canvas, eventId) {
      const art = EVENT_ART[eventId];
      if (!art) return;
      const c = canvas.getContext("2d");
      const t0 = performance.now();
      (function frame() {
        if (!canvas.isConnected) return; // يتوقف تلقائيًا عند إغلاق البطاقة
        const t = (performance.now() - t0) / 1000;
        c.clearRect(0, 0, canvas.width, canvas.height);
        c.save();
        art(c, canvas.width, canvas.height, t);
        c.restore();
        requestAnimationFrame(frame);
      })();
    }

    // ==================== نظام الوحدات المنبثقة (Modals) ====================
    let modalStack = [];
    function isModalOpen() { return modalStack.length > 0; }

    function mountCommon(root) {
      root.querySelectorAll(".term").forEach((el) => {
        el.addEventListener("click", () => {
          const term = el.dataset.term;
          pushModal(`<h2>${term}</h2><p style="line-height:2">${DICTIONARY[term]}</p><button class="btn" data-close>فهمت</button>`);
        });
      });
      root.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", () => popModal()));
      root.querySelectorAll("[data-close-all]").forEach((el) => el.addEventListener("click", () => closeAllModals()));
    }

    // mandatory: بطاقة لا تُغلق بالنقر خارجها ولا بمفتاح Escape.
    // بدونها كان اللاعب يتفادى أي حدث سيئ (فقدان وظيفة، انهيار، طارئ صحي)
    // أو يتخطى الزكاة بنقرة واحدة خارج البطاقة، فيفقد نظام العواقب معناه.
    function pushModal(html, onMount, opts = {}) {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `<div class="modal">${html}</div>`;
      overlay.dataset.mandatory = opts.mandatory ? "1" : "";
      if (!opts.mandatory) {
        overlay.addEventListener("click", (e) => { if (e.target === overlay) popModal(); });
      }
      document.getElementById("modalRoot").appendChild(overlay);
      // مفتاح اتجاه كان مضغوطًا لحظة الفتح لن يصل له keyup مفيد، فتظل
      // الشخصية تمشي خلف النافذة حتى تُغلق.
      if (typeof pressed !== "undefined") pressed.clear();
      modalStack.push(overlay);
      mountCommon(overlay);
      if (onMount) onMount(overlay);
    }

    // يمنع تنفيذ الإجراء مرتين عند النقر/اللمس السريع مرّتين. المعالج يبني
    // النافذة من جديد، لكن النقرة الثانية تصل إلى الزر القديم المنفصل ومعه
    // قيم الحقول السابقة — فكان الإيداع يتضاعف والتخصيص يقدّم شهرين.
    function once(handler) {
      let used = false;
      return function (ev) {
        if (used) return;
        used = true;
        handler.call(this, ev);
      };
    }

    function topModalIsMandatory() {
      const top = modalStack[modalStack.length - 1];
      return !!(top && top.dataset.mandatory);
    }

    // الإزالة تنتظر حركة الخروج. الاختبارات تقرأ عدد النوافذ فور الإغلاق،
    // فنُخرج العنصر من المكدّس ونزيل صفته فورًا ولا نؤخّر إلا حذفه من الصفحة.
    // حركة الخروج تُبقي العنصر لحظةً في الصفحة. وفي محاكاة سريعة (مئات
    // الأشهر في ثوانٍ) تراكمت 71 طبقة كاملة الشاشة معًا فهبطت الإطارات إلى
    // 0.6/ث. فنحدّ المتزامنَ منها: ما زاد يُزال فورًا، والحركة تُرى في اللعب
    // الطبيعي حيث لا تُغلق إلا نافذة أو اثنتان.
    const MAX_CLOSING = 2;
    function dismiss(overlay) {
      if (!overlay || overlay.classList.contains("closing")) return;
      overlay.dataset.mandatory = "";
      overlay.style.pointerEvents = "none";
      if (document.querySelectorAll(".modal-overlay.closing").length >= MAX_CLOSING) {
        overlay.remove();
        return;
      }
      overlay.classList.add("closing");
      let done = false;
      const kill = () => { if (done) return; done = true; overlay.remove(); };
      overlay.addEventListener("animationend", kill, { once: true });
      setTimeout(kill, 220);
    }
    function popModal() {
      dismiss(modalStack.pop());
      refreshHud();
    }

    function closeAllModals() {
      modalStack.forEach(dismiss);
      modalStack = [];
      refreshHud();
    }

    function term(t) { return `<span class="term" data-term="${t}">${t}</span>`; }

    // ==================== مباني المدينة ====================
    function openBank() {
      const d = derive(state);
      const pct = Math.min(100, (state.emergency / d.emergencyTarget) * 100);
      pushModal(`
        <h2>🏦 البنك</h2>
        <p class="muted" style="margin-bottom:6px">${term("صندوق الطوارئ")}: <b>${fmt(state.emergency)}</b> ريال (الهدف ${fmt(d.emergencyTarget)} = 6 أشهر من خروجك الشهري)</p>
        ${d.commitments > 0 ? `<p class="muted" style="font-size:11px;margin-bottom:6px">
          خروجك الشهري ${fmt(d.effExpenses + d.commitments)} = مصروفات ${fmt(d.effExpenses)} + التزامات ثابتة ${fmt(d.commitments)}
          — الشهر بلا دخل لا يتوقف فيه قسط الإسكان ولا التأمين.</p>` : ""}
        <div class="progress"><div class="progress-fill" style="width:${pct}%;background:#c9974a"></div></div>
        <p class="muted" style="margin:10px 0 16px">${d.coverage.toFixed(1)} شهر من أصل 6 · النقد المتاح: ${fmt(state.cash)} ريال</p>
        <div class="slider-row"><span>إيداع من الجاري</span></div>
        <div class="row-actions">
          <input type="number" id="depositAmt" min="0" max="${Math.max(0, state.cash)}" value="0" />
          <button class="btn btn-sm" id="depositBtn">إيداع</button>
        </div>
        <div class="slider-row" style="margin-top:8px"><span>سحب للجاري</span></div>
        <div class="row-actions">
          <input type="number" id="withdrawAmt" min="0" max="${Math.max(0, state.emergency)}" value="0" />
          <button class="btn btn-sm btn-outline" id="withdrawBtn">سحب</button>
        </div>
        <div class="inline-error" id="bankErr"></div>
        <div class="card" style="margin-top:12px;padding:12px${state.insurance?.health ? ";border-color:#2ecc71" : ""}">
          <h3 style="font-size:14px;color:${state.insurance?.health ? "#2ecc71" : "#c9974a"};margin-bottom:4px">☂ ${term("التأمين")} الصحي</h3>
          <p class="muted" style="font-size:12px;line-height:1.8">
            ${state.insurance?.health
              ? `مؤمَّن — قسط <b>${fmt(INSURANCE_PREMIUM)}</b> ريالًا شهريًا، ويتحمل التأمين 75% من أي فاتورة علاج.`
              : `قسط <b>${fmt(INSURANCE_PREMIUM)}</b> ريالًا شهريًا يتحمل 75% من أي فاتورة علاج.`}
          </p>
          <p class="muted" style="font-size:11px;line-height:1.8;margin-top:6px">
            أغلب الفواتير صغيرة (${fmt(MEDICAL_TIERS[0].cost)}) لكن ${Math.round(MEDICAL_TIERS[2].p * 100)}% منها تبلغ
            <b style="color:#e74c3c">${fmt(MEDICAL_TIERS[2].cost)}</b> ريالًا. القسط أغلى قليلاً من متوسط ما يوفّره —
            وهذا ثمن ألّا تصطدم بفاتورة تعادل دخل شهرين وأنت غير مستعد.
          </p>
          <button class="btn btn-sm ${state.insurance?.health ? "btn-outline" : ""}" style="margin-top:8px" id="insBtn">
            ${state.insurance?.health ? "إلغاء التأمين" : "اشترك في التأمين"}
          </button>
        </div>
        <button class="btn btn-outline" style="margin-top:10px" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#bankErr");
        root.querySelector("#insBtn").addEventListener("click", once(() => {
          const on = !state.insurance?.health;
          SFX.build();
          setState({ ...state, insurance: { ...(state.insurance || {}), premium: INSURANCE_PREMIUM, health: on },
            eventLog: [...state.eventLog, on ? "☂ اشتركت في التأمين الصحي" : "ألغيت التأمين الصحي"] });
          popModal(); openBank();
        }));
        root.querySelector("#depositBtn").addEventListener("click", once(() => {
          const amt = Math.floor(Number(root.querySelector("#depositAmt").value));
          if (!amt || amt <= 0 || amt > state.cash) { err.textContent = "مبلغ غير صالح."; return; }
          setState({ ...state, cash: state.cash - amt, emergency: state.emergency + amt });
          popModal(); openBank();
        }));
        root.querySelector("#withdrawBtn").addEventListener("click", once(() => {
          const amt = Math.floor(Number(root.querySelector("#withdrawAmt").value));
          if (!amt || amt <= 0 || amt > state.emergency) { err.textContent = "مبلغ غير صالح."; return; }
          setState({ ...state, cash: state.cash + amt, emergency: state.emergency - amt });
          popModal(); openBank();
        }));
      });
    }

    const ASSET_LABELS = Object.fromEntries(Object.entries(ASSETS).map(([k, a]) => [k, a.label]));

    function openMarket() {
      const held = Object.values(state.investments).filter((i) => i.amount > 0).length;
      const rows = Object.entries(state.investments).map(([key, inv]) => {
        const mv = lastAssetMoves[key];
        const mvHtml = mv
          ? `<span style="color:${mv.pct >= 0 ? "#2ecc71" : "#e74c3c"};font-size:11px">${mv.pct >= 0 ? "▲" : "▼"} ${Math.abs(mv.pct * 100).toFixed(1)}%${mv.crashed ? " ⚠" : ""}</span>`
          : `<span class="muted" style="font-size:11px">—</span>`;
        return `
        <div class="card" style="margin:8px 0;padding:12px">
          <div style="display:flex;justify-content:space-between"><span>${ASSET_LABELS[key]}</span><span style="color:${inv.amount > inv.cost ? '#2ecc71' : inv.amount < inv.cost ? '#e74c3c' : '#8aa89b'}">${fmt(inv.amount)} <span class="muted" style="font-size:11px">(تكلفة ${fmt(inv.cost)})</span></span></div>
          <div style="display:flex;justify-content:space-between;margin-top:6px">
            <span class="muted" style="font-size:11px">متوقع ${expectedAnnual(key).toFixed(1)}%/سنة · مخاطرة ${ASSETS[key].risk}</span>
            ${mvHtml}
          </div>
          ${ASSETS[key].income > 0 ? `<div style="display:flex;justify-content:space-between;margin-top:4px">
            <span class="muted" style="font-size:11px">منها دخل إيجاري يُضاف نقدًا</span>
            <span style="font-size:11px;color:#2ecc71">${inv.amount > 0 ? `+${fmt(inv.rentalIncome || Math.round(inv.amount * ASSETS[key].income))}/شهر` : `${(ASSETS[key].income * 1200).toFixed(1)}%/سنة`}</span>
          </div>` : ""}
          <div class="row-actions" style="margin-top:8px">
            <input type="number" min="0" id="amt_${key}" placeholder="مبلغ" />
            <button class="btn btn-sm" data-buy="${key}">شراء</button>
            <button class="btn btn-sm btn-outline" data-sell="${key}">بيع</button>
          </div>
          ${inv.amount > 0 ? `<button class="btn btn-sm btn-outline" style="margin-top:6px;width:100%" data-sellall="${key}">بيع المركز كاملًا (${fmt(inv.amount)})</button>` : ""}
        </div>`;
      }).join("");
      pushModal(`
        <h2>📈 البورصة</h2>
        <p class="muted" style="margin-bottom:10px">النقد المتاح: ${fmt(state.cash)} ريال</p>
        ${rows}
        <p style="margin:10px 0;font-size:13px">
          ${term("التنويع")}: تملك حاليًا <b style="color:${held >= 3 ? "#2ecc71" : "#c9974a"}">${held}</b> من 4 أصول.
          كل أصل يتحرك مستقلاً، فكلما نوّعت قلّ تذبذب محفظتك ${term("المخاطر")}.
        </p>
        <div class="inline-error" id="marketErr"></div>
        <button class="btn btn-outline" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#marketErr");
        root.querySelectorAll("[data-buy]").forEach((btn) => {
          btn.addEventListener("click", once(() => {
            const key = btn.dataset.buy;
            const amt = Math.floor(Number(root.querySelector(`#amt_${key}`).value));
            if (!amt || amt <= 0 || amt > state.cash) { err.textContent = "مبلغ غير صالح."; return; }
            const inv = { ...state.investments[key], amount: state.investments[key].amount + amt, cost: state.investments[key].cost + amt };
            setState({ ...state, cash: state.cash - amt, investments: { ...state.investments, [key]: inv } });
            popModal(); openMarket();
          }));
        });
        // البيع الجزئي ضروري: المستشار ينبّه على التركّز في أصل واحد، وبيع
        // المركز كاملًا كان الأداة الوحيدة لعلاجه — فلا يمكن إعادة التوازن
        // ولا جني ربح جزئي. التكلفة تُخفَّض بنسبة المُباع (متوسط التكلفة)
        // كي يبقى الربح/الخسارة المعروض صحيحًا بعد البيع.
        const sell = (key, amt) => {
          const inv = state.investments[key];
          if (inv.amount <= 0) { err.textContent = "لا يوجد رصيد لبيعه."; return; }
          const sold = Math.min(Math.max(0, Math.floor(amt)), inv.amount);
          if (sold <= 0) { err.textContent = "مبلغ غير صالح."; return; }
          const left = inv.amount - sold;
          const share = left / inv.amount;
          const next = left === 0
            ? { ...inv, amount: 0, cost: 0, rentalIncome: 0 }
            : { ...inv, amount: left, cost: Math.round(inv.cost * share),
                rentalIncome: Math.round((inv.rentalIncome || 0) * share) };
          // ما تحقّق فعلاً = ثمن البيع ناقص التكلفة التي خرجت معه
          const costOut = inv.cost - next.cost;
          const prev = Number.isFinite(Number(state.realizedPL)) ? Number(state.realizedPL) : 0;
          SFX.coin();
          setState({ ...state, cash: state.cash + sold, realizedPL: prev + (sold - costOut),
            investments: { ...state.investments, [key]: next } });
          popModal(); openMarket();
        };
        root.querySelectorAll("[data-sell]").forEach((btn) => {
          btn.addEventListener("click", once(() => {
            const key = btn.dataset.sell;
            const amt = Math.floor(Number(root.querySelector(`#amt_${key}`).value));
            if (!amt || amt <= 0) { err.textContent = "أدخل مبلغًا لبيعه، أو استخدم بيع المركز كاملًا."; return; }
            if (amt > state.investments[key].amount) { err.textContent = "المبلغ أكبر من رصيدك في هذا الأصل."; return; }
            sell(key, amt);
          }));
        });
        root.querySelectorAll("[data-sellall]").forEach((btn) => {
          btn.addEventListener("click", once(() => sell(btn.dataset.sellall, state.investments[btn.dataset.sellall].amount)));
        });
      });
    }

    function openWork() {
      const d = derive(state);
      if (d.surplus > 0) {
        openAllocation(d.surplus);
      } else {
        pushModal(`
          <h2>💼 العمل</h2>
          ${lastReportHtml()}
          <p style="margin:12px 0;line-height:1.8">${
            // السبب يجب أن يكون صحيحًا: دخل يغطي المصروفات ثم تلتهمه الالتزامات
            // ليس "دخلاً لا يغطي المصروفات" — والعلاج مختلف تمامًا بين الحالتين.
            d.effIncome >= d.effExpenses && d.commitments > 0
              ? `دخلك (${fmt(d.effIncome)}) يغطي مصروفاتك (${fmt(d.effExpenses)})، لكن التزاماتك الثابتة (${fmt(d.commitments)} — قسط الإسكان والتأمين) تستهلك الفائض وتزيد ${fmt(-d.surplus)}. سدّد جزءًا من قرض الإسكان لتخفيض القسط، أو ارفع دخلك.`
              : `الدخل الشهري (${fmt(d.effIncome)}) لا يغطي المصروفات (${fmt(d.effExpenses)}) هذا الشهر.`
          } سينتقل الراتب مباشرة دون تخصيص فائض، والعجز يغطّيه البنك دَينًا عليك.</p>
          <button class="btn" id="proceedBtn">بدء الشهر التالي</button>
        `, (root) => {
          root.querySelector("#proceedBtn").addEventListener("click", () => {
            closeAllModals();
            advanceMonth();
          });
        });
      }
    }

    // سداد الدين بند توزيع مثل غيره. كان المستشار يقول "سداده أعلى عائد
    // مضمون متاح لك" وشاشة الراتب لا تعرض له سطرًا أصلاً، فيُطالَب اللاعب
    // بقرار لا سبيل إليه في اللحظة التي يوزّع فيها ماله.
    const ALLOC_FIELDS = [
      ["debtPay", "💳 سداد الدين"], ["emergency", "🛡 صندوق الطوارئ"], ["savings", "💰 ادخار عام"], ["investStocks", "📈 أسهم"],
      ["investBonds", "📋 سندات"], ["investReal", "🏠 عقار"], ["investCrypto", "₿ عملات رقمية"], ["leisure", "🎉 إنفاق شخصي (يُصرف، يرفع الرضا)"]
    ];
    // بند لا معنى له الآن لا يُعرض: لا سطر لسداد دين لا وجود له
    function allocFieldsFor(s) {
      return ALLOC_FIELDS.filter(([k]) => k !== "debtPay" || (s.debt || 0) > 0);
    }
    function allocMax(key, surplus, s) {
      return key === "debtPay" ? Math.min(surplus, Math.max(0, Math.round(s.debt || 0))) : surplus;
    }

    function openAllocation(surplus) {
      const fields = allocFieldsFor(state);
      const rows = fields.map(([key, label]) => `
        <div style="margin-bottom:12px">
          <div class="slider-row"><span>${label}${key === "debtPay" ? ` <span class="muted" style="font-size:11px">(رصيدك ${fmt(state.debt)} بفائدة ${(debtMonthlyRate(state.creditScore) * 100).toFixed(2)}%/شهر)</span>` : ""}</span><span class="val" id="val_${key}">0</span></div>
          <input type="range" min="0" max="${allocMax(key, surplus, state)}" value="0" id="range_${key}" />
        </div>
      `).join("");
      pushModal(`
        <h2>💼 يوم الراتب — تخصيص الفائض</h2>
        <p class="muted" style="margin-bottom:6px">الفائض هذا الشهر: <b id="surplusLabel">${fmt(surplus)}</b> ريال · الموزّع: <span id="totalLabel">0</span></p>
        ${(() => {
          const d = derive(state);
          return d.commitments > 0
            ? `<p class="muted" style="margin-bottom:8px;font-size:11px">
                 ${fmt(d.grossSurplus)} دخلاً صافيًا، خُصم منها <b style="color:#e67e22">${fmt(d.commitments)}</b>
                 التزامات ثابتة (قسط الإسكان والتأمين) — والباقي وحده قابل للتوزيع.</p>`
            : "";
        })()}
        <p class="muted" style="margin-bottom:12px;font-size:11px">
          الرضا الآن <b id="moraleNow" style="color:${moraleLabel(state.morale ?? 70).color}">${Math.round(state.morale ?? 70)}</b>
          → بعد التوزيع <b id="moraleAfter">${Math.round(state.morale ?? 70)}</b>
          <span id="burnoutWarn" style="color:#e74c3c"></span>
        </p>
        ${lastReportHtml()}
        ${(() => {
          // أهم تحذير واحد عند لحظة القرار نفسها، لا بعد فوات الأوان
          const top = currentAdvice(1)[0];
          return top ? `<div class="card" style="padding:10px;margin-bottom:12px;border-color:${SEV_COLOR[top.sev]}">
            <div style="font-size:11px;color:${SEV_COLOR[top.sev]};margin-bottom:3px">${top.icon} ${SEV_LABEL[top.sev]}</div>
            <p style="font-size:12px;line-height:1.7;margin:0">${top.body}</p>
          </div>` : "";
        })()}
        ${rows}
        <div class="inline-error" id="allocErr"></div>
        ${state.lastAlloc ? `<button class="btn btn-outline" style="margin-bottom:10px" id="repeatAlloc">↺ كرّر توزيع الشهر الماضي</button>` : ""}
        <button class="btn" id="confirmAlloc">تأكيد التخصيص</button>
      `, (root) => {
        const alloc = Object.fromEntries(ALLOC_FIELDS.map(([k]) => [k, 0]));
        const totalLabel = root.querySelector("#totalLabel");
        const err = root.querySelector("#allocErr");
        const moraleAfterEl = root.querySelector("#moraleAfter");
        const burnoutWarn = root.querySelector("#burnoutWarn");
        function refreshMoralePreview() {
          // ‎-4 هو التآكل الشهري الأساسي؛ نعرض للاعب أثر خياره قبل أن يؤكده
          const projected = Math.max(0, Math.min(100,
            (state.morale ?? 70) + moraleFromLeisure(alloc.leisure, state.monthlyExpenses) - 4));
          moraleAfterEl.textContent = Math.round(projected);
          moraleAfterEl.style.color = moraleLabel(projected).color;
          burnoutWarn.textContent = projected < MORALE_BURNOUT ? " ⚠ خطر الإرهاق (دخلك سينخفض)" : "";
        }
        fields.forEach(([key]) => {
          root.querySelector(`#range_${key}`).addEventListener("input", (e) => {
            alloc[key] = Number(e.target.value);
            root.querySelector(`#val_${key}`).textContent = fmt(alloc[key]);
            totalLabel.textContent = fmt(Object.values(alloc).reduce((a, b) => a + b, 0));
            refreshMoralePreview();
          });
        });
        refreshMoralePreview();
        root.querySelector("#confirmAlloc").addEventListener("click", once(() => {
          const total = Object.values(alloc).reduce((a, b) => a + b, 0);
          if (total !== surplus) { err.textContent = `يجب أن يساوي التخصيص الفائض بالكامل (${fmt(surplus)}).`; return; }
          applyAllocation(alloc, surplus);
        }));

        const repeatBtn = root.querySelector("#repeatAlloc");
        if (repeatBtn) {
          repeatBtn.addEventListener("click", () => {
            applyAllocation(scaleAlloc(state.lastAlloc, surplus), surplus);
          });
        }
      });
    }

    // يحوّل نِسَب الشهر الماضي إلى مبالغ تساوي فائض هذا الشهر تمامًا،
    // مع إسناد فروق التقريب إلى أكبر بند حتى لا يختلّ المجموع.
    function scaleAlloc(ratios, surplus) {
      const out = Object.fromEntries(ALLOC_FIELDS.map(([k]) => [k, 0]));
      // نُطهّر النِّسَب أولاً: lastAlloc يُحفظ في المتصفح ولا يمرّ بتحقّق
      // القيم الافتراضية، فحفظ معدَّل أو تالف قد يحمل نِسَبًا سالبة أو مجموعًا
      // مخالفًا للواحد، فينتج توزيع سالب يخصم من نقدك بدل أن يضيف إليه.
      const clean = {};
      let sum = 0;
      for (const [key] of ALLOC_FIELDS) {
        const r = Number(ratios?.[key]);
        const v = Number.isFinite(r) && r > 0 ? r : 0;
        clean[key] = v;
        sum += v;
      }
      if (sum <= 0) { out.savings = surplus; return out; }

      let running = 0, biggestKey = ALLOC_FIELDS[0][0], biggestRatio = -1;
      for (const [key] of ALLOC_FIELDS) {
        const share = clean[key] / sum;                 // نُعيد التطبيع ليكون المجموع 1
        out[key] = Math.max(0, Math.floor(share * surplus));
        running += out[key];
        if (share > biggestRatio) { biggestRatio = share; biggestKey = key; }
      }
      out[biggestKey] = Math.max(0, out[biggestKey] + surplus - running);
      // نسبة الشهر الماضي قد تفوق دينك اليوم (أو تكون سدّدته كله):
      // ما زاد يذهب إلى الادخار بدل أن يُرفض التوزيع أو يضيع
      const cap = allocMax("debtPay", surplus, state);
      if (out.debtPay > cap) { out.savings += out.debtPay - cap; out.debtPay = cap; }
      return out;
    }

    // كم رضًا يشتريه ريال واحد من الإنفاق الشخصي (نسبةً إلى مستوى معيشتك)
    function moraleFromLeisure(amount, monthlyExpenses) {
      const perPoint = Math.max(1, monthlyExpenses * 0.04);
      return Math.min(30, Math.round(amount / perPoint));
    }

    function applyAllocation(alloc, surplus) {
      let s = { ...state, investments: cloneInvestments(state.investments) };
      // ما زاد عن رصيد الدين لا يُحرق: يعود إلى النقد
      const payDebt = Math.min(Math.max(0, Math.round(alloc.debtPay || 0)), Math.max(0, Math.round(s.debt || 0)));
      s.debt = Math.max(0, (s.debt || 0) - payDebt);
      s.cash += Math.max(0, Math.round(alloc.debtPay || 0)) - payDebt;
      s.emergency += alloc.emergency;
      // الادخار العام يبقى نقدًا؛ أما الإنفاق الشخصي فيُصرف فعلاً ويشتري رضًا
      s.cash += alloc.savings;
      s.morale = Math.max(0, Math.min(100, (s.morale ?? 70) + moraleFromLeisure(alloc.leisure, s.monthlyExpenses)));
      s.investments.stocks.amount += alloc.investStocks; s.investments.stocks.cost += alloc.investStocks;
      s.investments.bonds.amount += alloc.investBonds; s.investments.bonds.cost += alloc.investBonds;
      s.investments.realEstate.amount += alloc.investReal; s.investments.realEstate.cost += alloc.investReal;
      s.investments.crypto.amount += alloc.investCrypto; s.investments.crypto.cost += alloc.investCrypto;
      s.cash -= surplus;
      // نحفظ التوزيع كنِسَب كي يصلح لفائض مختلف في الأشهر القادمة
      s.lastAlloc = Object.fromEntries(ALLOC_FIELDS.map(([k]) => [k, surplus > 0 ? alloc[k] / surplus : 0]));
      closeAllModals();
      advanceMonth(s);
    }

    function openHome() {
      pushModal(`
        <h2>🏠 المنزل</h2>
        ${(() => {
          // نعرض الأرقام الفعلية بعد الآثار المؤقتة (بطالة، أقساط) لا الأساسية،
          // فقد كان اللاعب يرى دخله كاملاً وهو عاطل عن العمل.
          const d = derive(state);
          const incDiff = d.effIncome !== state.monthlyIncome;
          const expDiff = d.effExpenses !== state.monthlyExpenses;
          return `
        <p class="muted" style="margin-bottom:4px">الدخل الشهري: <b style="color:${incDiff ? "#e67e22" : "inherit"}">${fmt(d.effIncome)}</b> ريال${incDiff ? ` <span style="font-size:11px">(الأساسي ${fmt(state.monthlyIncome)} — أثر مؤقت)</span>` : ""}</p>
        <p class="muted" style="margin-bottom:16px">المصروفات الشهرية: <b style="color:${expDiff ? "#e67e22" : "inherit"}">${fmt(d.effExpenses)}</b> ريال${expDiff ? ` <span style="font-size:11px">(الأساسي ${fmt(state.monthlyExpenses)} — أثر مؤقت)</span>` : ""}</p>`;
        })()}
        <div class="card" style="margin-bottom:14px;padding:12px">
          <div style="display:flex;justify-content:space-between;padding:3px 0">
            <span class="muted">${term("الدين إلى الدخل السنوي")}</span>
            <b>${state.monthlyIncome > 0 ? ((state.debt / (state.monthlyIncome * 12)) * 100).toFixed(0) : "—"}%</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:3px 0">
            <span class="muted">${term("نسبة الدين إلى الدخل")} (قسطك)</span>
            <b>${state.monthlyIncome > 0 ? (((state.housing.loanPayment || 0) + (state.tempEffects || []).filter(e => e.type === "expense").reduce((a, e) => a + e.amount, 0)) / state.monthlyIncome * 100).toFixed(0) : "—"}%</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:3px 0">
            <span class="muted">${term("التصنيف الائتماني")}</span>
            <b style="color:${creditLabel(state.creditScore).color}">${state.creditScore} · ${creditLabel(state.creditScore).text}</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:3px 0">
            <span class="muted">فائدة الدين الحالية</span>
            <b>${(debtMonthlyRate(state.creditScore) * 100).toFixed(2)}%/شهر</b>
          </div>
          <p class="muted" style="font-size:11px;margin-top:6px">كلما قلّ دينك مقابل دخلك ارتفع تصنيفك وانخفضت فائدتك.</p>
        </div>
        ${housingPanelHtml()}
        <div class="slider-row"><span>سداد جزء من الدين (${fmt(state.debt)})</span></div>
        <div class="row-actions">
          <input type="number" id="payAmt" min="0" max="${Math.max(0, Math.min(state.cash, state.debt))}" value="0" />
          <button class="btn btn-sm" id="payBtn">سداد</button>
        </div>
        <div class="inline-error" id="homeErr"></div>
        ${state.housing.stage !== "owned"
          ? `<button class="btn btn-outline" id="downsizeBtn" ${state.cash < 150 ? "disabled" : ""}>الانتقال لسكن أرخص (تكلفة 150، يخفض الإيجار 10%)</button>`
          : ""}
        <button class="btn btn-outline" style="margin-top:10px" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#homeErr");
        root.querySelector("#payBtn").addEventListener("click", once(() => {
          const amt = Math.floor(Number(root.querySelector("#payAmt").value));
          if (!amt || amt <= 0 || amt > state.cash || amt > state.debt) { err.textContent = "مبلغ غير صالح."; return; }
          setState({ ...state, cash: state.cash - amt, debt: state.debt - amt });
          popModal(); openHome();
        }));
        const downsize = root.querySelector("#downsizeBtn");
        if (downsize) {
          downsize.addEventListener("click", () => {
            if (state.cash < 150) return;
            const cut = Math.round(state.rent * 0.1);
            setState({ ...state, cash: state.cash - 150, rent: state.rent - cut, monthlyExpenses: state.monthlyExpenses - cut });
            popModal(); openHome();
          });
        }
        wireHousingPanel(root, err);
      });
    }

    // ==================== لوحة البناء داخل المنزل ====================
    function housingPanelHtml() {
      const h = state.housing;
      if (h.stage === "renting" || h.stage === "waiting") {
        return `<div class="card" style="margin-bottom:14px;padding:12px">
          <h3 style="font-size:14px;color:#c9974a;margin-bottom:6px">🏠 السكن</h3>
          <p class="muted" style="font-size:12px;line-height:1.8">
            أنت مستأجر — <b>${fmt(state.rent)}</b> ريالًا شهريًا من أصل ${fmt(state.monthlyExpenses)}.
            ${h.stage === "waiting"
              ? `طلب منحة الأرض قيد المعالجة (متبقٍ ${h.waitMonths} أشهر).`
              : `تقدّم بطلب منحة أرض من دار البلدية لتبدأ مسار التملك.`}
          </p>
        </div>`;
      }
      const progress = Math.min(1, h.built / HOME_COST);
      const remaining = Math.max(0, HOME_COST - h.built);
      const owned = h.stage === "owned";
      const maxLoan = Math.max(0, MAX_HOUSING_LOAN - h.loan);
      return `<div class="card" style="margin-bottom:14px;padding:12px${owned ? ";border-color:#2ecc71" : ""}">
        <h3 style="font-size:14px;color:${owned ? "#2ecc71" : "#c9974a"};margin-bottom:6px">🏠 ${owned ? "منزلك (مملوك)" : "بناء المنزل"}</h3>
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span class="muted">${buildPhase(progress).name}</span>
          <b>${fmt(h.built)} / ${fmt(HOME_COST)}</b>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${progress * 100}%;background:${owned ? "#2ecc71" : "#c9974a"}"></div></div>
        ${owned
          ? `<p class="muted" style="font-size:11px;margin-top:8px">لم تعد تدفع إيجارًا — وفّرت ${fmt(state.housing.savedRent || 0)} ريالًا شهريًا.</p>`
          : `<div class="row-actions" style="margin-top:10px">
               <input type="number" min="0" id="buildAmt" placeholder="مبلغ البناء (متبقٍ ${fmt(remaining)})" />
               <button class="btn btn-sm" id="buildBtn">ابنِ</button>
             </div>`}
        ${h.loan > 0
          ? `<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:10px">
               <span class="muted">قرض الإسكان المتبقي</span><b>${fmt(h.loan)} · قسط ${fmt(h.loanPayment)}/شهر</b>
             </div>
             <div class="row-actions" style="margin-top:8px">
               <input type="number" min="0" id="repayHousing" placeholder="سداد مبكر (حتى ${fmt(Math.min(state.cash, h.loan))})" />
               <button class="btn btn-sm btn-outline" id="repayHousingBtn">سدّد</button>
             </div>
             <p class="muted" style="font-size:11px;margin-top:6px">السداد المبكر يقلّل رصيد القرض وفائدته، ويخفض قسطك الشهري تناسبيًا.</p>`
          : ""}
        ${/* المتبقي من سقف التمويل يبقى متاحًا ما دام البناء جاريًا: كان الحقل
             يختفي بمجرد وجود أي قرض، فمن اقترض 5,000 يفقد 25,000 يستحقها. */""}
        ${!owned && maxLoan > 0
          ? `<div class="row-actions" style="margin-top:10px">
               <input type="number" min="0" max="${maxLoan}" id="loanAmt" placeholder="${h.loan > 0 ? "اقترض المتبقي" : "قرض إسكان"} (حتى ${fmt(maxLoan)})" />
               <button class="btn btn-sm btn-outline" id="loanBtn">اقترض</button>
             </div>
             <p class="muted" style="font-size:11px;margin-top:6px">${term("قرض الإسكان")}: مدعوم ${(HOUSING_LOAN_RATE * 1200).toFixed(1)}% سنويًا على ${HOUSING_LOAN_TERM / 12} سنة${h.loan > 0 ? ` · المتاح من السقف ${fmt(maxLoan)} من ${fmt(MAX_HOUSING_LOAN)}` : ""}.</p>`
          : ""}
      </div>`;
    }

    function wireHousingPanel(root, err) {
      const buildBtn = root.querySelector("#buildBtn");
      if (buildBtn) {
        buildBtn.addEventListener("click", once(() => {
          const remaining = HOME_COST - state.housing.built;
          const amt = Math.floor(Number(root.querySelector("#buildAmt").value));
          if (!amt || amt <= 0 || amt > state.cash || amt > remaining) { err.textContent = "مبلغ غير صالح."; return; }
          const built = state.housing.built + amt;
          const finished = built >= HOME_COST;
          let s = { ...state, cash: state.cash - amt, housing: { ...state.housing, built, stage: finished ? "owned" : "building" } };
          if (finished) {
            // التملك يُسقط الإيجار من المصروفات نهائيًا
            s.housing.savedRent = state.rent;
            s.monthlyExpenses = Math.max(0, state.monthlyExpenses - state.rent);
            s.rent = 0;
            s.morale = Math.min(100, (state.morale ?? 70) + 20);
            s.eventLog = [...state.eventLog, "🏡 اكتمل منزلك — لا إيجار بعد اليوم"];
          }
          setState(s);
          popModal();
          if (finished) celebrateHome(); else openHome();
        }));
      }
      const repayBtn = root.querySelector("#repayHousingBtn");
      if (repayBtn) {
        repayBtn.addEventListener("click", once(() => {
          const h = state.housing;
          const max = Math.min(state.cash, h.loan);
          const amt = Math.floor(Number(root.querySelector("#repayHousing").value));
          if (!amt || amt <= 0 || amt > max) { err.textContent = "مبلغ غير صالح."; return; }
          const remaining = h.loan - amt;
          // القسط ينكمش بنفس نسبة انكماش الرصيد، ويصفر عند السداد الكامل
          const payment = remaining <= 0 ? 0 : Math.max(1, Math.round(h.loanPayment * (remaining / h.loan)));
          SFX.spend();
          setState({ ...state, cash: state.cash - amt,
            housing: { ...h, loan: Math.max(0, remaining), loanPayment: payment },
            eventLog: [...state.eventLog, remaining <= 0 ? "✅ سدّدت قرض الإسكان بالكامل" : `🏦 سداد مبكر ${fmt(amt)} من قرض الإسكان`] });
          popModal(); openHome();
        }));
      }
      const loanBtn = root.querySelector("#loanBtn");
      if (loanBtn) {
        loanBtn.addEventListener("click", once(() => {
          const maxLoan = MAX_HOUSING_LOAN - state.housing.loan;
          const amt = Math.floor(Number(root.querySelector("#loanAmt").value));
          if (!amt || amt <= 0 || amt > maxLoan) { err.textContent = "مبلغ غير صالح."; return; }
          const payment = Math.ceil(amt / HOUSING_LOAN_TERM) + Math.ceil(amt * HOUSING_LOAN_RATE);
          setState({ ...state, cash: state.cash + amt,
            housing: { ...state.housing, loan: state.housing.loan + amt, loanPayment: state.housing.loanPayment + payment },
            eventLog: [...state.eventLog, `🏦 حصلت على قرض إسكان ${fmt(amt)}`] });
          popModal(); openHome();
        }));
      }
    }

    function celebrateHome() {
      pushModal(`
        <h2>🏡 أصبح لك بيت!</h2>
        <canvas class="celebrate-art" id="homeArt" width="340" height="140"></canvas>
        <p style="line-height:1.9;text-align:center">
          اكتمل بناء منزلك على أرض المنحة. توقّف الإيجار نهائيًا،
          وانخفضت مصروفاتك الشهرية إلى <b style="color:#2ecc71">${fmt(state.monthlyExpenses)}</b> ريالًا.
        </p>
        <button class="btn" style="margin-top:14px" data-close-all>الحمد لله</button>
      `, (root) => {
        const cv = root.querySelector("#homeArt");
        if (cv) animateConfetti(cv);
      });
    }

    function openGoals() {
      const goalsHtml = state.goals.length ? state.goals.map((g) => `
        <div class="card" style="margin:8px 0;padding:12px${g.done ? ";border-color:#2ecc71" : ""}">
          <div style="display:flex;justify-content:space-between"><span>${g.done ? "✅ " : ""}${esc(g.name)}</span><span>${fmt(g.saved)} / ${fmt(g.target)}</span></div>
          <div class="progress"><div class="progress-fill" style="width:${Math.min(100, (g.saved / g.target) * 100)}%;background:#2ecc71"></div></div>
          ${g.spent
            ? `<p class="muted" style="margin-top:8px;font-size:13px">صُرف الهدف ✔</p>`
            : g.done
              ? `<p class="muted" style="margin-top:8px;font-size:13px;color:#2ecc71">مكتمل 🎉 — المبلغ محفوظ لك ويُحتسب في ثروتك</p>
                 <div class="row-actions" style="margin-top:8px">
                   <button class="btn btn-sm" data-spend="${g.id}">اصرفه على ما ادّخرت له</button>
                   <button class="btn btn-sm btn-outline" data-withdraw="${g.id}">أعِده نقدًا</button>
                 </div>`
              : `<div class="row-actions" style="margin-top:8px">
                   <input type="number" min="0" id="contrib_${g.id}" placeholder="مبلغ المساهمة" />
                   <button class="btn btn-sm" data-contrib="${g.id}">ساهم</button>
                   ${g.saved > 0 ? `<button class="btn btn-sm btn-outline" data-withdraw="${g.id}">استرد ${fmt(g.saved)}</button>` : ""}
                 </div>`}
        </div>
      `).join("") : `<p class="muted" style="margin-bottom:12px">لا توجد أهداف بعد.</p>`;
      pushModal(`
        <h2>🎯 لوحة الأهداف</h2>
        ${goalsHtml}
        <div class="inline-error" id="goalsErr"></div>
        <div style="margin-top:8px">
          <input id="newGoalName" placeholder="اسم الهدف" />
          <input id="newGoalTarget" type="number" min="1" placeholder="المبلغ المستهدف" />
          <button class="btn btn-sm btn-outline" id="addGoalBtn">+ إضافة هدف</button>
        </div>
        <button class="btn btn-outline" style="margin-top:14px" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#goalsErr");
        root.querySelectorAll("[data-contrib]").forEach((btn) => {
          btn.addEventListener("click", once(() => {
            const id = Number(btn.dataset.contrib);
            const goal = state.goals.find((g) => g.id === id);
            const amt = Math.floor(Number(root.querySelector(`#contrib_${id}`).value));
            const room = goal.target - goal.saved;
            if (!amt || amt <= 0 || amt > state.cash || amt > room) { err.textContent = "مبلغ غير صالح."; return; }
            const justCompleted = !goal.done && goal.saved + amt >= goal.target;
            const goals = state.goals.map((g) => g.id === id
              ? { ...g, saved: g.saved + amt, done: g.done || g.saved + amt >= g.target }
              : g);
            const log = justCompleted ? [...state.eventLog, `🎯 تحقق الهدف: ${goal.name}`] : state.eventLog;
            setState({ ...state, cash: state.cash - amt, goals, eventLog: log });
            popModal();
            if (justCompleted) celebrateGoal(goal.name); else openGoals();
          }));
        });
        // الاسترداد ضروري: بلا مخرج يصير الهدف احتجازًا لمالك لا ادّخارًا له
        root.querySelectorAll("[data-withdraw]").forEach((btn) => {
          btn.addEventListener("click", once(() => {
            const id = Number(btn.dataset.withdraw);
            const goal = state.goals.find((g) => g.id === id);
            if (!goal || !(goal.saved > 0)) { err.textContent = "لا يوجد رصيد في هذا الهدف."; return; }
            SFX.coin();
            setState({ ...state, cash: state.cash + goal.saved,
              goals: state.goals.map((g) => g.id === id ? { ...g, saved: 0, done: false } : g),
              eventLog: [...state.eventLog, `↩️ استرددت ${fmt(goal.saved)} من هدف: ${goal.name}`] });
            popModal(); openGoals();
          }));
        });
        // صرف الهدف المكتمل: المال يخرج فعلاً مقابل ما ادّخرت له، ويرفع رضاك
        root.querySelectorAll("[data-spend]").forEach((btn) => {
          btn.addEventListener("click", once(() => {
            const id = Number(btn.dataset.spend);
            const goal = state.goals.find((g) => g.id === id);
            if (!goal || goal.spent) return;
            SFX.badge();
            setState({ ...state,
              goals: state.goals.map((g) => g.id === id ? { ...g, spent: true } : g),
              morale: Math.min(100, (state.morale ?? 70) + 12),
              eventLog: [...state.eventLog, `🛍️ صرفت ${fmt(goal.saved)} على هدف: ${goal.name}`] });
            popModal(); openGoals();
          }));
        });
        root.querySelector("#addGoalBtn").addEventListener("click", once(() => {
          const name = root.querySelector("#newGoalName").value.trim();
          const target = Math.floor(Number(root.querySelector("#newGoalTarget").value));
          if (!name || !target || target <= 0) { err.textContent = "أدخل اسمًا ومبلغًا صحيحين."; return; }
          setState({ ...state, goals: [...state.goals, { id: Date.now(), name, target, saved: 0 }] });
          popModal(); openGoals();
        }));
      });
    }

    function showEnding(kind) {
      const d = derive(state);
      const months = (state.year - 1) * 12 + state.month;
      const doneGoals = state.goals.filter((g) => g.done).length;
      const win = kind === "win";
      pushModal(`
        <h2>${win ? "🏆 استقلال مالي!" : "💸 إفلاس"}</h2>
        <canvas class="celebrate-art" id="endArt" width="340" height="140"></canvas>
        <p style="line-height:1.9;text-align:center">
          ${win
            ? `بلغت ثروتك المُدِرّة ثمانية أضعاف مصروفاتك السنوية — أول عتبة على طريق ${term("الاستقلال المالي")}.`
            : `تراكمت الديون وتجاوزت خسائرك ما تملك. جرّب توازنًا أفضل بين الطوارئ والاستثمار.`}
        </p>
        <div class="card" style="margin:14px 0;padding:12px">
          <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">صافي الثروة</span><b style="color:${win ? "#2ecc71" : "#e74c3c"}">${fmt(d.netWorth)}</b></div>
          <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">منها مُدِرّة للدخل</span><b>${fmt(d.investableNetWorth)}</b></div>
          ${state.housing.stage === "owned" ? `<div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">قيمة المنزل</span><b>${fmt(d.homeEquity)}</b></div>` : ""}
          <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">المدة</span><b>${months} شهرًا</b></div>
          <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">أهداف مكتملة</span><b>${doneGoals}</b></div>
          <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">أحداث مررت بها</span><b>${state.eventLog.length}</b></div>
        </div>
        <button class="btn" id="restartBtn">ابدأ من جديد</button>
        <button class="btn btn-outline" style="margin-top:10px" data-close-all>تابع الاستكشاف</button>
      `, (root) => {
        const cv = root.querySelector("#endArt");
        if (cv) win ? animateConfetti(cv) : drawEndSlump(cv);
        root.querySelector("#restartBtn").addEventListener("click", once(() => {
          closeAllModals(); openScenarioPicker();
        }));
      }, { mandatory: true });
    }

    function drawEndSlump(canvas) {
      const c = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      c.clearRect(0, 0, W, H);
      c.strokeStyle = "rgba(138,168,155,0.2)"; c.lineWidth = 1;
      for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(10, (H / 4) * i); c.lineTo(W - 10, (H / 4) * i); c.stroke(); }
      const data = state.history.length > 1 ? state.history.map((p) => p.netWorth) : [0, -2000, -5000, -8000, BANKRUPT_AT];
      const max = Math.max(...data, 1000), min = Math.min(...data, BANKRUPT_AT);
      const range = max - min || 1;
      c.beginPath(); c.strokeStyle = "#e74c3c"; c.lineWidth = 2.5;
      data.forEach((v, i) => {
        const x = 14 + (i / (data.length - 1 || 1)) * (W - 28);
        const y = H - 14 - ((v - min) / range) * (H - 34);
        i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      });
      c.stroke();
      c.fillStyle = "#e74c3c"; c.font = "bold 13px sans-serif";
      c.textAlign = "left"; c.textBaseline = "middle";
      c.fillText("▼", 16, 16);
    }

    function celebrateGoal(goalName) {
      pushModal(`
        <h2>🎉 تحقق الهدف!</h2>
        <canvas class="celebrate-art" id="confettiArt" width="340" height="140"></canvas>
        <p style="line-height:1.9;text-align:center;font-size:16px">أكملت هدف <b style="color:#2ecc71">${esc(goalName)}</b> بالكامل.</p>
        <button class="btn" style="margin-top:14px" id="backToGoals">عودة إلى الأهداف</button>
      `, (root) => {
        const canvas = root.querySelector("#confettiArt");
        if (canvas) animateConfetti(canvas);
        root.querySelector("#backToGoals").addEventListener("click", () => { popModal(); openGoals(); });
      });
    }

    const CONFETTI_COLORS = ["#e74c3c", "#3498db", "#f1c40f", "#9b59b6", "#2ecc71", "#c9974a"];
    function animateConfetti(canvas) {
      const c = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      const bits = [];
      for (let i = 0; i < 70; i++) {
        bits.push({
          x: Math.random() * W, y: -Math.random() * H,
          vy: 40 + Math.random() * 70, vx: (Math.random() - 0.5) * 30,
          w: 3 + Math.random() * 4, h: 5 + Math.random() * 5,
          spin: Math.random() * Math.PI, spinV: (Math.random() - 0.5) * 6,
          color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        });
      }
      let last = performance.now();
      (function frame(now) {
        if (!canvas.isConnected) return; // يتوقف تلقائيًا عند إغلاق البطاقة
        const dt = Math.min(0.05, (now - last) / 1000 || 0);
        last = now;
        c.clearRect(0, 0, W, H);
        c.fillStyle = "#2ecc71";
        c.font = "bold 26px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("★", W / 2, H / 2);
        for (const b of bits) {
          b.y += b.vy * dt; b.x += b.vx * dt; b.spin += b.spinV * dt;
          if (b.y > H + 8) { b.y = -8; b.x = Math.random() * W; }
          c.save(); c.translate(b.x, b.y); c.rotate(b.spin);
          c.fillStyle = b.color; c.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
          c.restore();
        }
        requestAnimationFrame(frame);
      })(last);
    }

    // ==================== تقرير الشهر المنصرم ====================
    // كان الشهر يمرّ فتتغيّر الاستثمارات والتصنيف والرضا والأقساط في صمت،
    // ولا يرى اللاعب إلا رقمًا طائرًا واحدًا. هذا يعرض ما حدث فعلاً.
    function lastReportHtml() {
      const r = state.lastReport;
      if (!r) return "";
      // التقرير يُحفظ في المتصفح ولا يمرّ بتحقّق القيم الافتراضية (ليس في
      // INITIAL_STATE)، فحفظ قديم يحمل اسم أصل لم يعد موجودًا كان يرمي
      // استثناءً يمنع فتح شاشة الراتب أصلاً — أي يوقف اللعبة.
      const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
      const rows = [];
      const assets = r.assets && typeof r.assets === "object" && !Array.isArray(r.assets) ? r.assets : {};
      for (const [key, a] of Object.entries(assets)) {
        if (!ASSETS[key] || !a || typeof a !== "object") continue;
        const delta = num(a.delta);
        if (!delta && !a.crashed) continue;
        rows.push([`${ASSETS[key].label}${a.crashed ? " ⚠" : ""}`,
          `${delta >= 0 ? "+" : "−"}${fmt(Math.abs(delta))}`,
          delta >= 0 ? "#2ecc71" : "#e74c3c"]);
      }
      if (num(r.rent)) rows.push(["دخل إيجاري", `+${fmt(num(r.rent))}`, "#2ecc71"]);
      if (num(r.loanPaid)) rows.push(["قسط الإسكان", `−${fmt(num(r.loanPaid))}`, "#e67e22"]);
      if (num(r.debtInterest)) rows.push(["فائدة الدين", `−${fmt(num(r.debtInterest))}`, "#e74c3c"]);
      if (num(r.emergencyUsed)) rows.push(["عجز غطّاه صندوق الطوارئ", `−${fmt(num(r.emergencyUsed))}`, "#e67e22"]);
      if (num(r.overdraft)) rows.push(["عجز غطّاه البنك دَينًا", `+${fmt(num(r.overdraft))} دَين`, "#e74c3c"]);
      if (num(r.premium)) rows.push(["قسط التأمين", `−${fmt(num(r.premium))}`, "#e67e22"]);
      const credit = num(r.creditTo) - num(r.creditFrom);
      if (credit) rows.push(["التصنيف الائتماني", `${credit > 0 ? "+" : "−"}${Math.abs(credit)}`, credit > 0 ? "#2ecc71" : "#e74c3c"]);
      const morale = num(r.moraleTo) - num(r.moraleFrom);
      if (morale) rows.push(["الرضا", `${morale > 0 ? "+" : "−"}${Math.abs(morale)}`, morale > 0 ? "#2ecc71" : "#e74c3c"]);
      if (!rows.length && !r.inflation) return "";
      return `<div class="card" style="padding:10px;margin-bottom:12px">
        <h3 style="font-size:13px;color:#c9974a;margin-bottom:6px">📄 ما حدث الشهر الماضي</h3>
        ${rows.map(([k, v, c]) => `<div style="display:flex;justify-content:space-between;padding:2px 0">
          <span class="muted" style="font-size:12px">${k}</span><b style="font-size:12px;color:${c}">${v}</b></div>`).join("")}
        ${r.inflation ? `<p class="muted" style="font-size:11px;margin-top:6px">📈 ${term("التضخم")} السنوي: ارتفع دخلك 2% ومصروفاتك 1.5%.</p>` : ""}
      </div>`;
    }

    // ==================== المستشار المالي ====================
    // قواعد تقرأ حالتك الحالية وتُظهر أهم ما يستحق انتباهك الآن.
    // الترتيب بالخطورة: خطر (3) ثم تنبيه (2) ثم فرصة (1).
    const ADVICE_RULES = [
      { id: "no_emergency", sev: 3, urgency: 50, icon: "🛡", term: "صندوق الطوارئ",
        test: (s, d) => d.coverage < 1,
        text: (s, d) => `صندوق طوارئك يغطي ${d.coverage.toFixed(1)} شهر فقط. أي طارئ سيدفعك للاقتراض — اجعله ٣ أشهر على الأقل.` },
      { id: "burnout", sev: 3, urgency: 20, icon: "😫", term: "الاستثمار في الذات",
        test: (s) => (s.morale ?? 70) < MORALE_BURNOUT,
        text: () => `أنت في حالة إرهاق ودخلك منخفض 12%. خصّص جزءًا من فائضك للإنفاق الشخصي حتى يتعافى رضاك.` },
      { id: "debt_heavy", sev: 3, urgency: 30, icon: "💳", term: "الدين إلى الدخل السنوي",
        test: (s) => s.monthlyIncome > 0 && s.debt / (s.monthlyIncome * 12) > 0.4,
        text: (s) => `دينك يعادل ${Math.round(s.debt / (s.monthlyIncome * 12) * 100)}% من دخلك السنوي، وفائدته ${(debtMonthlyRate(s.creditScore) * 100).toFixed(2)}%/شهر. سداده أعلى عائد مضمون متاح لك.` },
      // العجز الشهري كان يمرّ بلا أي تنبيه ما دام صندوق الطوارئ ممتلئًا،
      // مع أنه اللحظة التي يحتاج فيها اللاعب الإرشاد أكثر من أي وقت.
      { id: "deficit", sev: 3, urgency: 10, icon: "📉", term: "صندوق الطوارئ",
        test: (s, d) => d.surplus < 0,
        text: (s, d) => {
          const months = d.effExpenses > 0 ? (s.emergency / -d.surplus) : 0;
          const cover = `بهذا المعدّل يكفي صندوق طوارئك ${months.toFixed(1)} شهرًا، ثم يصير العجز دَينًا عليك.`;
          // التزامات ثابتة تلتهم فائضًا موجبًا حالةٌ أخرى: قصّ المصروف لن يحلّها
          return d.effIncome >= d.effExpenses && d.commitments > 0
            ? `التزاماتك الثابتة (${fmt(d.commitments)}) تتجاوز ما يفيض عن مصروفاتك بـ${fmt(-d.surplus)} شهريًا. ${cover} سدّد جزءًا من قرض الإسكان ليقلّ القسط.`
            : `مصروفاتك تتجاوز دخلك بـ${fmt(-d.surplus)} شهريًا. ${cover} قلّل المصروف أو ارفع الدخل.`;
        } },
      { id: "zakat_due", sev: 3, urgency: 40, icon: "🤲", term: "الزكاة",
        test: (s) => (s.zakat?.unpaid ?? 0) > 0,
        text: (s) => `عليك زكاة مؤجّلة قدرها ${fmt(s.zakat.unpaid)} ريالًا في ذمتك.` },
      { id: "morale_falling", sev: 2, urgency: 40, icon: "😟", term: null,
        test: (s) => (s.morale ?? 70) >= MORALE_BURNOUT && (s.morale ?? 70) < 45,
        text: (s) => `رضاك ${Math.round(s.morale)} ويتآكل ٤ نقاط شهريًا. اقتربت من الإرهاق الذي يخفض دخلك.` },
      { id: "concentrated", sev: 2, urgency: 20, icon: "🧺", term: "التنويع",
        test: (s, d) => { const held = Object.values(s.investments).filter(i => i.amount > 0); return d.totalInv > 800 && held.length === 1; },
        text: (s) => { const k = Object.entries(s.investments).find(([, i]) => i.amount > 0)?.[0]; return `كل استثمارك في ${ASSETS[k]?.label ?? "أصل واحد"}. توزيعه على أصول تتحرك مستقلة يقلّل تذبذب محفظتك دون خفض عائدك كثيرًا.`; } },
      // النقد المرصود للبناء ليس خاملاً: كانت النصيحة تطالب من يدّخر لإكمال
      // منزله باستثمار المبلغ، فتؤخّر بيته وتعرّض مال البناء لتقلّب السوق.
      { id: "build_ready", sev: 2, urgency: 45, icon: "🧱", term: "البناء التدريجي",
        test: (s) => ["land", "building"].includes(s.housing.stage) && s.cash >= 500 && s.housing.built < HOME_COST,
        text: (s) => `لديك ${fmt(s.cash)} ريالًا ومتبقٍ ${fmt(HOME_COST - s.housing.built)} على إكمال منزلك. كل دفعة بناء تقرّب سقوط الإيجار عنك.` },
      { id: "idle_cash", sev: 2, urgency: 50, icon: "💤", term: "تكلفة الفرصة البديلة",
        test: (s, d) => s.cash > d.effExpenses * 6 && d.totalInv < s.cash * 0.5
                        && !(["land", "building"].includes(s.housing.stage) && s.housing.built < HOME_COST),
        text: (s, d) => `لديك ${fmt(s.cash)} ريالًا نقدًا خاملاً — أكثر من ٦ أشهر مصروفات. النقد الزائد يتآكل بالتضخم بدل أن ينمو.` },
      // المعيار الصحيح ليس "هل التأمين رابح في المتوسط" — ليس كذلك، وهذا
      // طبيعي — بل: هل تستطيع دفع أسوأ فاتورة نقدًا دون أن تنهار ميزانيتك؟
      { id: "no_insurance", sev: 2, urgency: 10, icon: "☂", term: "التأمين",
        test: (s) => !s.insurance?.health && (s.cash + s.emergency) < MEDICAL_TIERS[2].cost,
        text: (s) => `أسوأ فاتورة علاج تبلغ ${fmt(MEDICAL_TIERS[2].cost)} ريالًا، ولا تملك سوى ${fmt(s.cash + s.emergency)} سائلة. قسط ${fmt(INSURANCE_PREMIUM)} ريالًا يهبط بنصيبك منها إلى ${fmt(insuredShare(MEDICAL_TIERS[2].cost))} — ليس ربحًا في المتوسط، بل حماية من ضربة لا تحتملها.` },
      { id: "no_land", sev: 1, urgency: 10, icon: "🏜", term: "منحة الأرض",
        test: (s) => s.housing.stage === "renting" && s.year >= 1,
        text: (s) => `ما زلت تدفع ${fmt(s.rent)} ريالًا إيجارًا شهريًا. طلب منحة الأرض مجاني ويستغرق ٦ أشهر — كلما بكّرت بكّر توقّف الإيجار.` },
      { id: "no_education", sev: 1, urgency: 20, icon: "🎓", term: "الاستثمار في الذات",
        test: (s) => (s.education?.level ?? 0) === 0 && !s.education?.pending && s.cash >= 400,
        text: () => `لم تلتحق بأي دورة بعد. أول دورة تكلف ٤٠٠ وترفع دخلك 8% مدى الحياة — عائدها يفوق أي أصل مالي.` },
      { id: "lifestyle", sev: 1, urgency: 30, icon: "📈", term: "تضخّم نمط الحياة",
        test: (s) => s.monthlyExpenses > 780,
        text: (s) => `مصروفاتك ارتفعت إلى ${fmt(s.monthlyExpenses)}، وهدف استقلالك ارتفع معها إلى ${fmt(fiTarget(s))}.` },
      // من أكمل طوارئه ولم يستثمر شيئًا لم يكن ينبّهه أحد: النقد لا يتراكم
      // لديه (ينفقه) فلا تُفعَّل قاعدة النقد الخامل، ويبقى بلا نمو للأبد.
      { id: "not_investing", sev: 2, urgency: 30, icon: "🌱", term: "الفائدة المركبة",
        test: (s, d) => d.coverage >= 3 && d.totalInv < s.monthlyIncome && d.surplus > 0
                        && !(["land", "building"].includes(s.housing.stage) && s.housing.built < HOME_COST),
        text: (s, d) => `صندوق طوارئك يكفي ${d.coverage.toFixed(1)} شهرًا، لكن استثماراتك ${fmt(d.totalInv)} فقط. ما بعد الطوارئ يُستثمر لينمو، وإلا بقيت ثروتك واقفة.` },
      { id: "no_goal", sev: 1, urgency: 40, icon: "🎯", term: null,
        test: (s) => s.goals.length === 0 && s.year >= 1,
        text: () => `لم تحدّد أي هدف ادخاري. الأهداف تجعل الادخار ملموسًا بدل أن يكون رقمًا مجردًا.` },
    ];

    function currentAdvice(limit = 3) {
      const d = derive(state);
      const hits = [];
      for (const r of ADVICE_RULES) {
        let ok = false;
        try { ok = r.test(state, d); } catch { ok = false; }
        if (ok) hits.push({ ...r, body: r.text(state, d) });
      }
      // الخطورة وحدها لا تكفي: خمس قواعد بخطورة 3 قد تتحقق معًا، وكان الترتيب
      // يتحدّد بموضع القاعدة في المصفوفة فيفوز "لا صندوق طوارئ" دائمًا —
      // فيُنصح لاعبٌ دخله لا يغطي مصروفه بأن يبني صندوق طوارئ من فائض معدوم.
      // urgency يرتّب داخل الخطورة الواحدة: أوقف النزيف قبل أن تسدّ النقص.
      hits.sort((a, b) => b.sev - a.sev || (a.urgency ?? 50) - (b.urgency ?? 50));
      return hits.slice(0, limit);
    }

    const SEV_COLOR = { 3: "#e74c3c", 2: "#e67e22", 1: "#c9974a" };
    const SEV_LABEL = { 3: "خطر", 2: "تنبيه", 1: "فرصة" };

    function adviceHtml() {
      const list = currentAdvice();
      if (!list.length) {
        return `<div class="card" style="margin:10px 0;padding:12px;border-color:#2ecc71">
          <h3 style="font-size:14px;color:#2ecc71;margin-bottom:4px">✅ المستشار المالي</h3>
          <p class="muted" style="font-size:12px">وضعك سليم حاليًا: طوارئ كافية، دين محدود، ومحفظة متوازنة.</p>
        </div>`;
      }
      return `<div class="card" style="margin:10px 0;padding:12px">
        <h3 style="font-size:14px;color:#c9974a;margin-bottom:8px">💡 المستشار المالي</h3>
        ${list.map((a) => `
          <div style="padding:8px 0;border-bottom:1px solid rgba(29,61,53,0.6)">

    // ==================== إحصاءات الجولة ====================
    function statsRowsHtml() {
      const d = derive(state);
      const months = (state.year - 1) * 12 + state.month;
      const hist = state.history || [];
      const peak = hist.length ? Math.max(...hist.map((p) => p.netWorth)) : d.netWorth;
      const trough = hist.length ? Math.min(...hist.map((p) => p.netWorth)) : d.netWorth;
      const growth = hist.length > 1 ? d.netWorth - hist[0].netWorth : 0;
      const invested = Object.values(state.investments).reduce((a, i) => a + i.cost, 0);
      const gains = d.totalInv - invested;
      // المحقَّقة تُقرأ من الحفظ فقد تكون تالفة؛ نحرسها كي لا يفسد السطر
      const realized = Number.isFinite(Number(state.realizedPL)) ? Math.round(Number(state.realizedPL)) : 0;
      const eduName = ["لا شيء", "دورة مهنية", "دبلوم تخصصي", "شهادة احترافية"][state.education?.level ?? 0] || "—";
      const rows = [
        ["بدايتك", `${scenarioById(state.scenario).icon} ${scenarioById(state.scenario).name}`],
        ["المدة", `${months} شهرًا (${(months / 12).toFixed(1)} سنة)`],
        ["الدخل الشهري", `${fmt(state.monthlyIncome)} (بدأت بـ1,000)`],
        ["التزامات ثابتة شهريًا", `${fmt(d.commitments)} (قسط إسكان وتأمين)`],
        ["الفائض القابل للتوزيع", fmt(d.surplus)],
        ["أعلى ثروة بلغتها", fmt(peak)],
        ["أدنى ثروة مررت بها", fmt(trough)],
        ["نمو الثروة منذ البداية", (growth >= 0 ? "+" : "−") + fmt(Math.abs(growth))],
        ["رأس المال المستثمر حاليًا", fmt(invested)],
        ["ربح/خسارة غير محقَّقة (ما تملكه الآن)", (gains >= 0 ? "+" : "−") + fmt(Math.abs(gains))],
        ["ربح/خسارة محقَّقة (مما بِعته)", (realized >= 0 ? "+" : "−") + fmt(Math.abs(realized))],
        ["إجمالي أداء استثماراتك", (gains + realized >= 0 ? "+" : "−") + fmt(Math.abs(gains + realized))],
        ["دخل إيجاري شهري", fmt(state.investments.realEstate.rentalIncome || 0)],
        ["مستواك التعليمي", eduName],
        ["التأمين الصحي", state.insurance?.health ? "مفعّل" : "غير مفعّل"],
        ["الحالة الاجتماعية", state.married ? `متزوج · ${state.children ?? 0} أبناء` : "أعزب"],
        ["أحداث مررت بها", String((state.eventLog || []).length)],
      ];
      return rows.map(([k, v], i) => `
        <div style="display:flex;justify-content:space-between;padding:4px 0${i < rows.length - 1 ? ";border-bottom:1px solid rgba(29,61,53,0.6)" : ""}">
          <span class="muted" style="font-size:12px">${k}</span><b style="font-size:12px">${v}</b>
        </div>`).join("");
    }

          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">هدف الاستقلال المالي</span><b>${fmt(fiTarget(state))}</b></div>

          <p class="muted" style="font-size:11px;margin-top:4px">لا يُحتسب بيت السكن هنا — فهو لا يموّل مصروفاتك، لكنه يدخل في صافي ثروتك. اعرف أكثر: ${term("الاستقلال المالي")}</p>

          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">سنوات زكّيت فيها</span><b>${state.zakat?.paidCount ?? 0}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">مجموع ما أخرجت</span><b style="color:#2ecc71">${fmt(state.zakat?.totalPaid ?? 0)}</b></div>
          ${(state.zakat?.unpaid ?? 0) > 0 ? `<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">مؤجّلة في ذمتك</span><b style="color:#e74c3c">${fmt(state.zakat.unpaid)}</b></div>` : ""}
          ${(state.zakat?.unpaid ?? 0) > 0 ? `
          <div class="inline-error" id="arrearsErr"></div>
          <button class="btn btn-sm" style="margin-top:8px;width:100%" id="payArrears" ${state.cash >= state.zakat.unpaid ? "" : "disabled"}>

        </div>
        ${(() => {
          const recs = loadRecords();

        // النصاب بقيت في ذمته أبدًا — تحذير دائم بلا فعل ممكن.
        const arrearsBtn = root.querySelector("#payArrears");
        if (arrearsBtn) {
          arrearsBtn.addEventListener("click", once(() => {
            const owed = state.zakat?.unpaid ?? 0;
            if (owed <= 0) return;
            if (state.cash < owed) { root.querySelector("#arrearsErr").textContent = "النقد لا يكفي."; return; }
            const z = state.zakat;
            SFX.success();
            setState({ ...state, cash: state.cash - owed,
              morale: Math.min(100, (state.morale ?? 70) + 6),
              zakat: { ...z, paidCount: (z.paidCount || 0) + 1, totalPaid: (z.totalPaid || 0) + owed, unpaid: 0 },
              eventLog: [...state.eventLog, `🤲 أخرجت زكاة متأخرة ${fmt(owed)}`] });
            popModal(); openTownHall();
          }));
        }
        root.querySelector("#resetBtn").addEventListener("click", () => {
          pushModal(`
            <h2>إعادة بدء اللعبة</h2>
            <p style="line-height:1.9">سيُمحى تقدّمك بالكامل ويعود كل شيء إلى البداية. هل أنت متأكد؟</p>
            <button class="btn" style="margin-top:14px" id="confirmReset">نعم، ابدأ من جديد</button>
            <button class="btn btn-outline" style="margin-top:10px" data-close>تراجع</button>
          `, (r2) => { r2.querySelector("#confirmReset").addEventListener("click", once(() => {
              closeAllModals(); openScenarioPicker();
            })); });
        });
        const canvas = root.querySelector("#chartCanvas");
        const ctx = canvas.getContext("2d");
        const data = state.history;
        if (data.length > 0) {
          const w = canvas.width, h = canvas.height;
          const maxVal = Math.max(...data.map((p) => p.netWorth), 10000);
          const minVal = Math.min(...data.map((p) => p.netWorth), 0);
          const range = maxVal - minVal || 1;
          const stepX = w / (data.length - 1 || 1);
          ctx.beginPath();
          ctx.strokeStyle = "#c9974a";
          ctx.lineWidth = 2;
          data.forEach((pt, i) => {
            const x = i * stepX;
            const y = h - ((pt.netWorth - minVal) / range) * (h - 20) - 10;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          });
          ctx.stroke();
          ctx.fillStyle = "#8aa89b";
          ctx.font = "10px sans-serif";
          ctx.fillText(fmt(minVal), 5, h - 5);
          ctx.fillText(fmt(maxVal), 5, 15);
        } else {
          // بلا هذه الرسالة يظهر مربع أسود فارغ للاعب الجديد بلا تفسير
          ctx.fillStyle = "#8aa89b";
          ctx.font = "12px 'Noto Kufi Arabic', sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("لا توجد بيانات بعد", canvas.width / 2, canvas.height / 2 - 8);
          ctx.font = "10px 'Noto Kufi Arabic', sans-serif";
          ctx.fillStyle = "rgba(138,168,155,0.7)";
          ctx.fillText("يُرسم المنحنى بعد أول شهر من اللعب", canvas.width / 2, canvas.height / 2 + 12);
        }
      });
    }

    // ==================== المعهد: الاستثمار في الذات ====================

        body = `<p class="muted" style="margin-bottom:10px">أتممت جميع المسارات التعليمية المتاحة 🎓</p>`;

        if (btn) {
          btn.addEventListener("click", once(() => {

          }));

    function openLibrary() {
      const rows = Object.keys(DICTIONARY).map((t) => `<div class="term-row" data-term="${t}">${t}</div>`).join("");
      pushModal(`<h2>📖 المكتبة</h2>

    // ==================== المدينة (الخريطة والمباني) ====================
    const TILE = 32, COLS = 16, ROWS = 20;
    const WORLD_W = COLS * TILE, WORLD_H = ROWS * TILE;

    function rect(tx, ty, tw, th) { return { x: tx * TILE, y: ty * TILE, w: tw * TILE, h: th * TILE }; }

    // ==================== الإسقاط الإيزومتري ====================
    // منطق اللعبة كله يبقى بإحداثيات العالم المستطيلة (حركة، تصادم، قرب من
    // الباب). الإسقاط طبقة عرض فقط: نقطة العالم (x,y) تصير معيّنًا على الشاشة.
    // النسبة أحدّ قليلًا من 2:1 كي يملأ المعيّن شاشة الهاتف الطولية.
    const ISO_KX = 0.5, ISO_KY = 0.33;
    const ISO_W = (WORLD_W + WORLD_H) * ISO_KX;      // عرض المعيّن
    const ISO_H = (WORLD_W + WORLD_H) * ISO_KY;      // ارتفاعه
    const ISO_SKY = 96;                              // فسحة فوقه لارتفاع المباني
    const ISO_OX = WORLD_H * ISO_KX;                 // إزاحة الأصل أفقيًا
    const ISO_OY = ISO_SKY;
    function isoX(wx, wy) { return (wx - wy) * ISO_KX + ISO_OX; }
    function isoY(wx, wy) { return (wx + wy) * ISO_KY + ISO_OY; }
    // عمق الرسم: كل ما زاد (x+y) كان أقرب إلى الناظر
    function isoDepth(wx, wy) { return wx + wy; }

    const BUILDINGS = [
      { id: "bank", name: "البنك", emoji: "🏦", color: "#c9974a", open: openBank, ...rect(1, 1, 4, 4) },
      { id: "market", name: "البورصة", emoji: "📈", color: "#2ecc71", open: openMarket, ...rect(11, 1, 4, 4) },
      { id: "goals", name: "لوحة الأهداف", emoji: "🎯", color: "#9b59b6", open: openGoals, ...rect(6, 4, 4, 3) },
      { id: "work", name: "العمل", emoji: "💼", color: "#4a90c9", open: openWork, ...rect(1, 8, 4, 4) },
      { id: "home", name: "المنزل", emoji: "🏠", color: "#d98c4a", open: openHome, ...rect(11, 8, 4, 4) },
      { id: "townhall", name: "دار البلدية", emoji: "📰", color: "#7f8c8d", open: openTownHall, ...rect(1, 15, 4, 4) },
      { id: "library", name: "المكتبة", emoji: "📖", color: "#16a085", open: openLibrary, ...rect(11, 15, 4, 4) },
      { id: "institute", name: "المعهد", emoji: "🎓", color: "#8e6bc9", open: openInstitute, ...rect(6, 15, 4, 3) },
    ];

    BUILDINGS.forEach((b) => { b.doorX = b.x + b.w / 2; b.doorY = b.y + b.h + 10; });

    const PLAZA_X = WORLD_W / 2, PLAZA_Y = 11 * TILE;
    const player = { x: 224, y: 352, w: 22, h: 26, speed: 170, facing: "down", animT: 0 };
    let currentBuilding = null;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function collides(px, py) {
      return BUILDINGS.some((b) => rectsOverlap(px, py, player.w, player.h, b.x, b.y, b.w, b.h));
    }

    const pressed = new Set();

    function updatePlayer(dt) {
      player.animT += dt;
      // في الإيزومتري محورا العالم مائلان على الشاشة. لو حرّكنا اللاعب على
      // محاور العالم لسار قُطريًا وهو يضغط "أعلى". فنُدير الاتجاه: "أعلى"
      // على الشاشة = ‎(-1,-1) في العالم، و"يمين" = ‎(+1,-1).
      let ix = 0, iy = 0;
      if (pressed.has("up")) iy -= 1;
      if (pressed.has("down")) iy += 1;
      if (pressed.has("left")) ix -= 1;
      if (pressed.has("right")) ix += 1;
      let dx = 0, dy = 0;
      if (ix !== 0 || iy !== 0) {
        dx = ix + iy;
        dy = iy - ix;
        const m = Math.hypot(dx, dy);
        dx /= m; dy /= m;
        if (iy < 0) player.facing = "up";
        else if (iy > 0) player.facing = "down";
        else if (ix < 0) player.facing = "left";
        else player.facing = "right";
      }
      const step = player.speed * dt;

      let nx = clamp(player.x + dx * step, 0, WORLD_W - player.w);
      if (!collides(nx, player.y)) player.x = nx;
      let ny = clamp(player.y + dy * step, 0, WORLD_H - player.h);
      if (!collides(player.x, ny)) player.y = ny;

      const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
      let nearest = null, nearestDist = 36;
      for (const b of BUILDINGS) {
        const d = Math.hypot(cx - b.doorX, cy - b.doorY);
        if (d < nearestDist) { nearest = b; nearestDist = d; }
      }
      currentBuilding = nearest;
      updateInteractBtn();
    }

    const interactBtn = document.getElementById("interactBtn");
    function updateInteractBtn() {
      if (currentBuilding) {
        interactBtn.textContent = `${currentBuilding.emoji} ادخل ${currentBuilding.name}`;
        interactBtn.classList.remove("hidden");
      } else {
        interactBtn.classList.add("hidden");
      }
    }
    interactBtn.addEventListener("click", () => { if (currentBuilding) currentBuilding.open(); });

    // ==================== الرسم ====================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
      r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
      return `rgb(${r},${g},${b})`;
    }

    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function nearAnyBuilding(x, y, margin) {
      return BUILDINGS.some((b) => x > b.x - margin && x < b.x + b.w + margin && y > b.y - margin && y < b.y + b.h + margin);
    }

    // ==================== زخارف ثابتة (مولّدة ببذرة ثابتة كي لا تتغير كل تحديث) ====================
    const rng = mulberry32(2024);
    const TREES = [];
    {
      let attempts = 0;
      while (TREES.length < 12 && attempts < 500) {
        attempts++;
        const tx = 14 + rng() * (WORLD_W - 28);
        const ty = 14 + rng() * (WORLD_H - 28);

        if (Math.hypot(tx - PLAZA_X, ty - PLAZA_Y) < 44) continue;
        TREES.push({ x: tx, y: ty, r: 9 + rng() * 5, seed: rng() });
      }
    }
    const GROUND_DOTS = [];
    {
      let attempts = 0;
      while (GROUND_DOTS.length < 170 && attempts < 3000) {
        attempts++;
        const gx = rng() * WORLD_W, gy = rng() * WORLD_H;
        if (nearAnyBuilding(gx, gy, 6)) continue;
        GROUND_DOTS.push({ x: gx, y: gy, s: rng() < 0.5 ? 2 : 3, tone: rng() });
      }
    }

    // ==================== الفصول (تتبع الشهر داخل اللعبة) ====================
    // النخيل لا يتساقط ورقه ولا يصفرّ، فالفصول تُقرأ في الأرض والضوء والثمر
    // لا في لون السعف. والأرض رملية حصوية لا مروجًا خضراء.
    const SEASONS = {
      winter: { name: "شتاء", leaf: "#2c6b4c", leafHi: "#3f8a63", ground: ["#3a3428", "#241f18"],
                dot: "rgba(150,170,180,0.22)", tint: "rgba(120,170,200,0.06)", dates: null },
      spring: { name: "ربيع", leaf: "#2f8a52", leafHi: "#46a86a", ground: ["#3f3a29", "#28231a"],
                dot: "rgba(120,150,100,0.25)", tint: "rgba(150,210,160,0.04)", dates: null },
      summer: { name: "صيف", leaf: "#256444", leafHi: "#357f57", ground: ["#4a4130", "#2e2820"],
                dot: "rgba(190,165,120,0.30)", tint: "rgba(240,190,110,0.05)", dates: "#c9974a" },
      autumn: { name: "خريف", leaf: "#2a6247", leafHi: "#3d8059", ground: ["#453c2c", "#2a241b"],
                dot: "rgba(180,150,105,0.28)", tint: "rgba(220,170,90,0.05)", dates: "#8a4b2a" },
    };
    function seasonForMonth(m) {
      if (m === 12 || m === 1 || m === 2) return "winter";
      if (m <= 5) return "spring";
      if (m <= 8) return "summer";
      return "autumn";
    }
    let renderedSeason = null;
    // بصمة كل ما تعتمد عليه الخلفية المُجهَّزة مسبقًا. الاكتفاء بالفصل كان
    // يترك المنزل على حاله في الخريطة رغم تخصيص الأرض والبناء وحتى التملك،
    // فلا يرى اللاعب بيته يُبنى إلا صدفةً عند تبدّل الفصل.
    let renderedBgKey = null;
    function bgKey(s) {
      const h = s.housing || INITIAL_STATE.housing;
      const step = Math.floor(Math.min(1, (h.built || 0) / HOME_COST) * 20);
      return `${seasonForMonth(s.month)}|${h.stage}|${step}`;
    }

    // ==================== سكان المدينة (شخصيات غير قابلة للعب) ====================
    const NPC_PALETTES = [
      { shirt: "#4a90c9", sleeve: "#3d79a8", skin: "#e8b88a", hair: "#2a1c0d" },
      { shirt: "#9b59b6", sleeve: "#82489a", skin: "#d9a072", hair: "#4a3520" },
      { shirt: "#2ecc71", sleeve: "#26a75d", skin: "#f0c9a0", hair: "#1a1208" },
      { shirt: "#e74c3c", sleeve: "#c2402f", skin: "#c98c5e", hair: "#33220f" },
      { shirt: "#16a085", sleeve: "#128271", skin: "#e8b88a", hair: "#5a3d1f" },
    ];
    const NPCS = [];
    function randomWalkableSpot(rand) {
      for (let i = 0; i < 200; i++) {
        const x = 16 + rand() * (WORLD_W - 32);
        const y = 16 + rand() * (WORLD_H - 32);
        if (!nearAnyBuilding(x, y, 14)) return { x, y };
      }
      return { x: PLAZA_X, y: PLAZA_Y };
    }
    for (let i = 0; i < 5; i++) {
      const spot = randomWalkableSpot(rng);
      NPCS.push({
        x: spot.x, y: spot.y, target: randomWalkableSpot(rng),
        speed: 26 + rng() * 20, animT: rng() * 10, facing: "down", moving: true,
        pauseT: 0, palette: NPC_PALETTES[i % NPC_PALETTES.length],
      });
    }

    function updateNPCs(dt) {
      for (const n of NPCS) {
        n.animT += dt;
        if (n.pauseT > 0) { n.pauseT -= dt; n.moving = false; continue; }
        const dx = n.target.x - n.x, dy = n.target.y - n.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 4) {
          n.target = randomWalkableSpot(Math.random);
          n.pauseT = 0.6 + Math.random() * 2.2;
          n.moving = false;
          continue;
        }
        n.moving = true;
        const step = Math.min(dist, n.speed * dt);
        const nx = n.x + (dx / dist) * step, ny = n.y + (dy / dist) * step;
        if (nearAnyBuilding(nx, ny, 8)) {
          n.target = randomWalkableSpot(Math.random);
          continue;
        }
        n.x = nx; n.y = ny;
        if (Math.abs(dx) > Math.abs(dy)) n.facing = dx < 0 ? "left" : "right";
        else n.facing = dy < 0 ? "up" : "down";
      }
    }

    // ==================== سحب متحركة ====================
    const CLOUDS = [];
    for (let i = 0; i < 4; i++) {
      CLOUDS.push({ x: rng() * WORLD_W, y: 20 + rng() * (WORLD_H - 60), r: 22 + rng() * 20, speed: 5 + rng() * 7, alpha: 0.05 + rng() * 0.05 });
    }
    function updateClouds(dt) {
      for (const cl of CLOUDS) {
        cl.x += cl.speed * dt;
        if (cl.x - cl.r * 2 > WORLD_W) { cl.x = -cl.r * 2; cl.y = 20 + Math.random() * (WORLD_H - 60); }
      }
    }

    // ==================== أعمدة الإنارة ====================
    const LAMPS = [];
    for (const b of BUILDINGS) {
      const dx = b.doorX - PLAZA_X, dy = b.doorY - PLAZA_Y;
      const len = Math.hypot(dx, dy);
      const t = 0.55;
      const lx = PLAZA_X + dx * t - (dy / len) * 15;
      const ly = PLAZA_Y + dy * t + (dx / len) * 15;
