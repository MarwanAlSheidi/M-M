    }

    // ==================== دورة الليل والنهار ====================
    const DAY_MS = 150000; // دورة كاملة كل دقيقتين ونصف تقريبًا
    function nightFactor(now) {
      const phase = (now % DAY_MS) / DAY_MS;      // 0..1
      const raw = (Math.cos(phase * Math.PI * 2) + 1) / 2; // 1 ليلاً، 0 نهارًا
      return raw * raw * 0.62;                    // نُبقي الليل مقروءًا
    }

    // ==================== طقس حسب الفصل ====================
    const WEATHER = [];
    // لا ثلج في عُمان. الشتاء موسم المطر، والصيف غبار محمول، وما بينهما صفاء.
    function weatherKindFor(seasonKey) {
      if (seasonKey === "winter") return "rain";
      if (seasonKey === "summer") return "dust";
      return null;
    }
    function updateWeather(dt, seasonKey) {
      const kind = weatherKindFor(seasonKey);
      if (!kind) { WEATHER.length = 0; return; }
      if (WEATHER.length && WEATHER[0].kind !== kind) WEATHER.length = 0;
      const cap = kind === "rain" ? 60 : 34;
      if (WEATHER.length < cap && Math.random() < (kind === "rain" ? 0.9 : 0.4)) {
        WEATHER.push({
          kind,
          x: Math.random() * WORLD_W, y: kind === "dust" ? Math.random() * WORLD_H : -8,
          vy: kind === "rain" ? 210 + Math.random() * 90 : 6 + Math.random() * 10,
          sway: Math.random() * Math.PI * 2,
          swaySpeed: kind === "rain" ? 0 : 0.5 + Math.random() * 0.9,
          size: kind === "rain" ? 4 + Math.random() * 4 : 0.7 + Math.random() * 1.1,
          spin: Math.random() * Math.PI,
          life: 0,
        });
      }
      for (let i = WEATHER.length - 1; i >= 0; i--) {
        const p = WEATHER[i];
        p.sway += p.swaySpeed * dt;
        p.y += p.vy * dt;
        p.x += (p.kind === "rain" ? 26 : Math.sin(p.sway) * 14) * dt;
        p.spin += dt * 1.6;
        p.life += dt;
        if (p.y > WORLD_H + 8 || p.x > WORLD_W + 8 || (p.kind === "dust" && p.life > 14)) WEATHER.splice(i, 1);
      }
    }
    function drawWeather(c) {
      for (const p of WEATHER) {
        if (p.kind === "rain") {
          c.strokeStyle = "rgba(174,206,222,0.45)";
          c.lineWidth = 1;
          c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - 2.2, p.y - p.size); c.stroke();
        } else {
          c.globalAlpha = 0.5 + Math.sin(p.sway) * 0.25;
          c.fillStyle = "rgba(226,206,164,0.7)";
          c.beginPath(); c.arc(p.x, p.y, p.size, 0, Math.PI * 2); c.fill();
          c.globalAlpha = 1;
        }
      }
    }

    // ==================== غبار الخطوات ====================
    const DUST = [];
    function updateDust(dt, moving) {
      if (moving && Math.random() < 0.35) {
        DUST.push({ x: player.x + player.w / 2 + (Math.random() - 0.5) * 6, y: player.y + player.h - 2, life: 0, max: 0.45, r: 1.5 + Math.random() * 1.5 });
      }
      for (let i = DUST.length - 1; i >= 0; i--) {
        const d = DUST[i];

        if (d.life > d.max) DUST.splice(i, 1);

    }

    // ==================== الأرقام الطائرة ====================
    function updateFloaters(dt) {
      for (let i = FLOATERS.length - 1; i >= 0; i--) {
        const f = FLOATERS[i];
        f.life += dt;
        if (f.life > f.max) FLOATERS.splice(i, 1);
      }
    }

    // ==================== رذاذ النافورة ====================
    const DROPS = [];
    function updateFountain(dt) {
      if (DROPS.length < 26 && Math.random() < 0.5) {
        const a = Math.random() * Math.PI * 2;
        DROPS.push({ x: PLAZA_X, y: PLAZA_Y, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12 - 22, life: 0, max: 0.9 + Math.random() * 0.4 });
      }
      for (let i = DROPS.length - 1; i >= 0; i--) {
        const d = DROPS[i];
        d.life += dt;
        d.vy += 46 * dt;
        d.x += d.vx * dt; d.y += d.vy * dt;
        if (d.life > d.max) DROPS.splice(i, 1);

    }

    // ==================== المباني: مجسّم إيزومتري واحد بمعاملات ====================
    // ثمانية رسّامين منفصلين أنتجوا ثمانية صناديق بألوان مشبعة عشوائية بلا
    // لغة مشتركة. الآن رسّام واحد بطابع عُماني موحّد — جدار طيني، شرفات،
    // أقواس، باب منقوش — وما يميّز كل مبنى معاملاته لا أسلوبه.
    const CLAY = "#c8a77a";                     // جدار طيني: أساس اللوحة كلها
    function shade(hex, f) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
      return `rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,b)})`;
    }
    // الارتفاع كان يصنع ألواحًا: كتلة 172 بكسلًا طولًا مقابل 128 عرضًا تقرأ
    // برجًا لا مبنى. الآن طابقان أو ثلاثة، وكل مبنى يتميّز بسقفه ونوافذه
    // وعدد طوابقه لا بلونه وحده.
    const BUILDING_STYLE = {
      bank:      { h: 46, floors: 2, accent: "#c9974a", roof: "dome",  arches: 3, merlons: true,  props: "columns" },
      market:    { h: 52, floors: 3, accent: "#2ecc71", roof: "flat",  arches: 3, merlons: true,  props: "screen"  },
      goals:     { h: 22, floors: 1, accent: "#9b59b6", roof: "flat",  arches: 1, merlons: false, props: "banner"  },
      work:      { h: 58, floors: 3, accent: "#4a90c9", roof: "flat",  arches: 4, merlons: false, props: "tanks"   },
      home:      { h: 38, floors: 2, accent: "#d98c4a", roof: "flat",  arches: 2, merlons: true,  props: "yard"    },
      townhall:  { h: 44, floors: 2, accent: "#7f8c8d", roof: "tower", arches: 3, merlons: true,  props: "flag"    },
      library:   { h: 38, floors: 2, accent: "#16a085", roof: "flat",  arches: 3, merlons: false, props: "shelf"   },
      institute: { h: 34, floors: 2, accent: "#8e6bc9", roof: "dome",  arches: 3, merlons: false, props: null      },
    };

    // مضلّع على وجه جانبي: يتبع ميل الوجه فتبدو النافذة مغروسة فيه لا ملصقة
    function faceQuad(c, x0, y0, x1, y1, u0, u1, fill, stroke) {
      c.beginPath();
      c.moveTo(isoX(x0, y0), isoY(x0, y0) - u0);
      c.lineTo(isoX(x1, y1), isoY(x1, y1) - u0);
      c.lineTo(isoX(x1, y1), isoY(x1, y1) - u1);
      c.lineTo(isoX(x0, y0), isoY(x0, y0) - u1);
      c.closePath();
      if (fill) { c.fillStyle = fill; c.fill(); }
      if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1; c.stroke(); }
    }

    // وجه جانبي بين ركنين من قاعدة المبنى، بارتفاع h
    function isoFace(c, x1, y1, x2, y2, h, fill) {
      c.beginPath();
      c.moveTo(isoX(x1, y1), isoY(x1, y1));
      c.lineTo(isoX(x2, y2), isoY(x2, y2));
      c.lineTo(isoX(x2, y2), isoY(x2, y2) - h);
      c.lineTo(isoX(x1, y1), isoY(x1, y1) - h);
      c.closePath();
      c.fillStyle = fill; c.fill();
      c.strokeStyle = "rgba(38,28,18,0.55)"; c.lineWidth = 1; c.stroke();
    }

    function drawIsoBuilding(c, b) {
      const st = BUILDING_STYLE[b.id] || BUILDING_STYLE.home;
      let H = st.h;
      // المنزل يرتفع مع البناء بدل أن يظهر فجأة
      if (b.id === "home") {
        const hs = state.housing || INITIAL_STATE.housing;
        if (hs.stage === "renting" || hs.stage === "waiting") H = 0;
        else if (hs.stage === "land") H = 6;
        else if (hs.stage === "building") H = 6 + Math.round((st.h - 6) * Math.min(1, (hs.built || 0) / HOME_COST));
      }
      const x0 = b.x, y0 = b.y, x1 = b.x + b.w, y1 = b.y + b.h;

      // ظل مائل على الأرض في اتجاه الشمس
      c.save();
      c.beginPath();
      c.moveTo(isoX(x0, y1), isoY(x0, y1));
      c.lineTo(isoX(x1, y1), isoY(x1, y1));
      c.lineTo(isoX(x1 + H * 0.5, y1 + H * 0.5), isoY(x1 + H * 0.5, y1 + H * 0.5));
      c.lineTo(isoX(x0 + H * 0.5, y1 + H * 0.5), isoY(x0 + H * 0.5, y1 + H * 0.5));
      c.closePath();
      c.fillStyle = "rgba(0,0,0,0.22)"; c.fill();
      c.restore();

      if (H <= 0) {                       // أرض مسوّرة بلا بناء بعد
        c.beginPath();
        [[x0,y0],[x1,y0],[x1,y1],[x0,y1]].forEach(([px,py],i) => {
          i === 0 ? c.moveTo(isoX(px,py), isoY(px,py)) : c.lineTo(isoX(px,py), isoY(px,py)); });
        c.closePath();
        c.fillStyle = "rgba(180,150,100,0.18)"; c.fill();
        c.setLineDash([5, 4]); c.strokeStyle = "rgba(201,151,74,0.6)"; c.lineWidth = 1.5; c.stroke();
        c.setLineDash([]);
        return;
      }

      // الوجهان المرئيان: الأمامي الأيسر أفتح والأيمن أغمق
      isoFace(c, x0, y1, x1, y1, H, shade(CLAY, 0.86));   // الواجهة السفلى
      isoFace(c, x1, y1, x1, y0, H, shade(CLAY, 0.66));   // الجانب الأيمن

      // السطح
      c.beginPath();
      [[x0,y0],[x1,y0],[x1,y1],[x0,y1]].forEach(([px,py],i) => {
        const sx = isoX(px,py), sy = isoY(px,py) - H;
        i === 0 ? c.moveTo(sx,sy) : c.lineTo(sx,sy); });
      c.closePath();
      c.fillStyle = shade(CLAY, 1.0); c.fill();
      c.strokeStyle = "rgba(38,28,18,0.55)"; c.lineWidth = 1; c.stroke();

      // نوافذ على الوجهين: صفّ لكل طابق. الجانب الأيمن كان فارغًا تمامًا
      // فيبدو المبنى لوحًا مصمتًا من نصفه.
      const rows = st.floors, ff = (x1 - x0);
      for (let r = 0; r < rows; r++) {
        const u0 = 10 + r * ((H - 14) / rows), u1 = u0 + Math.min(11, (H - 16) / rows - 3);
        if (u1 >= H - 3) continue;
        const perRow = 3;
        for (let i = 0; i < perRow; i++) {
          const f0 = (i + 0.22) / perRow, f1 = (i + 0.78) / perRow;
          // الواجهة السفلى
          faceQuad(c, x0 + ff * f0, y1, x0 + ff * f1, y1, u0, u1,
                   "rgba(30,42,52,0.85)", "rgba(232,217,168,0.35)");
          // الجانب الأيمن
          const g0 = y1 + (y0 - y1) * f0, g1 = y1 + (y0 - y1) * f1;
          faceQuad(c, x1, g0, x1, g1, u0, u1,
                   "rgba(22,32,40,0.9)", "rgba(232,217,168,0.22)");
        }
      }

      // سياج السطح يدور على الحافّتين المرئيتين، والشرفات فوقه
      const parapet = st.merlons ? 8 : 5;
      faceQuad(c, x0, y1, x1, y1, H, H + parapet, shade(CLAY, 0.9), "rgba(38,28,18,0.5)");
      faceQuad(c, x1, y1, x1, y0, H, H + parapet, shade(CLAY, 0.72), "rgba(38,28,18,0.5)");
      if (st.merlons) {
        const n = 7;
        for (let i = 0; i < n; i++) {
          const f0 = (i + 0.12) / n, f1 = (i + 0.72) / n;
          faceQuad(c, x0 + ff * f0, y1, x0 + ff * f1, y1, H + parapet, H + parapet + 6,
                   shade(CLAY, 0.96), "rgba(38,28,18,0.45)");
          const g0 = y1 + (y0 - y1) * f0, g1 = y1 + (y0 - y1) * f1;
          faceQuad(c, x1, g0, x1, g1, H + parapet, H + parapet + 6,
                   shade(CLAY, 0.78), "rgba(38,28,18,0.45)");
        }
      }

      // إفريز بلون المبنى تحت سياج السطح
      faceQuad(c, x0, y1, x1, y1, H - 5, H - 1, st.accent, null);
      faceQuad(c, x1, y1, x1, y0, H - 5, H - 1, shade(st.accent, 0.75), null);

      // قبّة أو برج فوق السطح
      const cxw = (x0 + x1) / 2, cyw = (y0 + y1) / 2;
      const cx = isoX(cxw, cyw), cy = isoY(cxw, cyw) - H;
      if (st.roof === "dome") {
        const r = b.w * 0.16, ry2 = r * (ISO_KY / ISO_KX), drum = 7;
        c.beginPath();
        c.moveTo(cx - r, cy); c.lineTo(cx - r, cy - drum);
        c.lineTo(cx + r, cy - drum); c.lineTo(cx + r, cy);
        c.closePath(); c.fillStyle = shade(CLAY, 0.78); c.fill();
        c.beginPath(); c.ellipse(cx, cy, r, ry2, 0, 0, Math.PI * 2);
        c.fillStyle = shade(CLAY, 0.7); c.fill();
        const dg = c.createLinearGradient(cx - r, cy - drum - r, cx + r, cy - drum);
        dg.addColorStop(0, shade(st.accent, 1.15));
        dg.addColorStop(0.55, st.accent);
        dg.addColorStop(1, shade(st.accent, 0.6));
        c.beginPath(); c.ellipse(cx, cy - drum, r, r * 0.95, 0, Math.PI, 0);
        c.fillStyle = dg; c.fill();
        c.strokeStyle = "rgba(38,28,18,0.5)"; c.lineWidth = 1; c.stroke();
        c.strokeStyle = "#e8d9a8"; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(cx, cy - drum - r * 0.95); c.lineTo(cx, cy - drum - r * 0.95 - 6); c.stroke();
        c.beginPath(); c.arc(cx, cy - drum - r * 0.95 - 8, 2, 0, Math.PI * 2);
        c.fillStyle = "#e8d9a8"; c.fill();
      } else if (st.roof === "tower") {
        const tw = b.w * 0.17, th = 22;
        isoFace(c, cxw - tw, cyw + tw, cxw + tw, cyw + tw, H + th, shade(CLAY, 0.9));
        isoFace(c, cxw + tw, cyw + tw, cxw + tw, cyw - tw, H + th, shade(CLAY, 0.7));
        c.beginPath();
        [[cxw-tw,cyw-tw],[cxw+tw,cyw-tw],[cxw+tw,cyw+tw],[cxw-tw,cyw+tw]].forEach(([px,py],i) => {
          const sx2 = isoX(px,py), sy2 = isoY(px,py) - H - th;
          i === 0 ? c.moveTo(sx2,sy2) : c.lineTo(sx2,sy2); });
        c.closePath(); c.fillStyle = st.accent; c.fill();
        c.strokeStyle = "rgba(38,28,18,0.5)"; c.stroke();
      }

      // ما يميّز كل مبنى فوق سطحه
      const rx = isoX((x0 + x1) / 2, (y0 + y1) / 2), ry = isoY((x0 + x1) / 2, (y0 + y1) / 2) - H;
      if (st.props === "tanks") {
        for (let i = 0; i < 2; i++) {
          const tx = rx - 16 + i * 26, ty = ry - 4 + i * 5;
          c.fillStyle = "#8f9aa0"; c.fillRect(tx - 6, ty - 11, 12, 11);
          c.fillStyle = "#b6c0c4"; c.beginPath(); c.ellipse(tx, ty - 11, 6, 2.6, 0, 0, Math.PI * 2); c.fill();
        }
      } else if (st.props === "screen") {
        c.fillStyle = "#0d1f18"; c.fillRect(rx - 22, ry - 20, 44, 16);
        c.strokeStyle = st.accent; c.lineWidth = 1.5; c.strokeRect(rx - 22, ry - 20, 44, 16);
        c.strokeStyle = "#2ecc71"; c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(rx - 18, ry - 8); c.lineTo(rx - 8, ry - 13);
        c.lineTo(rx, ry - 10); c.lineTo(rx + 9, ry - 17); c.lineTo(rx + 18, ry - 14); c.stroke();
      } else if (st.props === "flag") {
        c.strokeStyle = "#cfd8d3"; c.lineWidth = 2;
        c.beginPath(); c.moveTo(rx + 22, ry); c.lineTo(rx + 22, ry - 28); c.stroke();
        c.fillStyle = "#c9974a";
        c.beginPath(); c.moveTo(rx + 22, ry - 28); c.lineTo(rx + 40, ry - 23); c.lineTo(rx + 22, ry - 18); c.closePath(); c.fill();
      } else if (st.props === "columns") {
        for (let i = 0; i < 4; i++) {
          const f = (i + 0.5) / 4;
          faceQuad(c, x0 + ff * f - 3, y1, x0 + ff * f + 3, y1, 6, H - 6,
                   "rgba(232,217,168,0.16)", "rgba(232,217,168,0.35)");
        }
      } else if (st.props === "shelf") {
        c.fillStyle = st.accent;
        for (let i = 0; i < 5; i++) c.fillRect(rx - 20 + i * 9, ry - 12 - (i % 3) * 2, 6, 12 + (i % 3) * 2);
      } else if (st.props === "banner") {
        c.strokeStyle = "#cfd8d3"; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(rx - 18, ry - 4); c.lineTo(rx + 18, ry - 10); c.stroke();
        for (let i = 0; i < 5; i++) {
          c.fillStyle = ["#c9974a","#2ecc71","#4a90c9","#9b59b6","#e74c3c"][i];
          c.beginPath(); c.moveTo(rx - 14 + i * 8, ry - 5.2 - i * 1.1);
          c.lineTo(rx - 9 + i * 8, ry - 6 - i * 1.1); c.lineTo(rx - 11.5 + i * 8, ry + 2 - i * 1.1);
          c.closePath(); c.fill();
        }
      } else if (st.props === "yard") {
        c.fillStyle = "rgba(46,140,90,0.5)";
        c.beginPath(); c.ellipse(rx + 14, ry + 6, 9, 5, 0, 0, Math.PI * 2); c.fill();
      }

      // الباب المنقوش عند نقطة التفاعل
      const dx = isoX(b.doorX, y1), dy = isoY(b.doorX, y1);
      c.beginPath();
      c.moveTo(dx - 7, dy); c.lineTo(dx - 7, dy - 12);
      c.quadraticCurveTo(dx, dy - 22, dx + 7, dy - 12);
      c.lineTo(dx + 7, dy);
      c.closePath();
      c.fillStyle = "#4a3520"; c.fill();
      c.strokeStyle = st.accent; c.lineWidth = 1.6; c.stroke();
      c.strokeStyle = "rgba(201,151,74,0.5)"; c.lineWidth = 1;
      c.beginPath(); c.moveTo(dx, dy); c.lineTo(dx, dy - 16); c.stroke();

    }

    // أسماء المباني في تمريرة أخيرة فوق كل شيء: لو رُسم كل اسم مع مبناه
    // لحجبه المبنى الأقرب، فيقرأ اللاعب نصف اسم.
    function drawBuildingLabels(c) {
      c.font = "11px 'Noto Kufi Arabic', sans-serif";
      c.textAlign = "center"; c.textBaseline = "middle";
      for (const b of BUILDINGS) {
        const lx = isoX(b.x + b.w / 2, b.y + b.h / 2), ly = isoY(b.x + b.w / 2, b.y + b.h) + 13;
        const tw = c.measureText(b.name).width;
        c.fillStyle = "rgba(10,20,18,0.72)";
        roundRect(c, lx - tw / 2 - 6, ly - 9, tw + 12, 18, 6); c.fill();
        c.fillStyle = "#e8dcc0";
        c.fillText(b.name, lx, ly);
      }
    }



    // ==================== الخلفية المُجهَّزة مسبقًا (لتفادي إعادة رسم التفاصيل الثابتة كل إطار) ====================
    const bgCanvas = document.createElement("canvas");
    bgCanvas.width = Math.ceil(ISO_W); bgCanvas.height = Math.ceil(ISO_H + ISO_SKY + 40);
    const bgCtx = bgCanvas.getContext("2d");

    // الخلفية المُجهَّزة مسبقًا: أرض المعيّن وممراتها وساحتها ومبانيها.
    // كل ما فيها ثابت بين الإطارات، فيُرسم مرة واحدة مهما بلغ تفصيله.
    // ==================== البحر حول الجزيرة ====================
    // الأرض كانت صفيحة معلّقة في فراغ. الجزيرة تحتاج ماءً يحيط بها وموجًا
    // يتكسّر على حافّتها — والموج وحده هو ما يُرسم كل إطار، أما البحر فتدرّج.
    const SEA_RINGS = [];
    for (let i = 0; i < 26; i++) {
      SEA_RINGS.push({ t: i / 26, sp: 0.35 + (i % 5) * 0.06, len: 0.05 + (i % 4) * 0.03 });
    }
    function seaEdgePoint(t) {
      // t من 0 إلى 1 يدور على محيط المعيّن (أربعة أضلاع)
      const c4 = [[0,0],[WORLD_W,0],[WORLD_W,WORLD_H],[0,WORLD_H]];
      const seg = Math.min(3, Math.floor(t * 4)), f = t * 4 - seg;
      const [ax, ay] = c4[seg], [bx, by] = c4[(seg + 1) % 4];
      const wx = ax + (bx - ax) * f, wy = ay + (by - ay) * f;
      return [isoX(wx, wy), isoY(wx, wy)];
    }
    function drawSea(c, now) {
      const g = c.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, "#0a1c26");
      g.addColorStop(0.45, "#123c4e");
      g.addColorStop(1, "#1b5c66");
      c.fillStyle = g; c.fillRect(0, 0, canvas.width, canvas.height);
      // بريق متحرك على سطح الماء
      c.save();
      c.globalAlpha = 0.10;
      c.strokeStyle = "#bfe6f2"; c.lineWidth = 1;
      for (let i = 0; i < 14; i++) {
        const y = 60 + i * 34 + Math.sin(now / 1400 + i) * 4;
        c.beginPath();
        for (let x = 0; x <= canvas.width; x += 14) {
          const yy = y + Math.sin((x / 46) + now / 900 + i) * 2.5;
          x === 0 ? c.moveTo(x, yy) : c.lineTo(x, yy);
        }
        c.stroke();
      }
      c.restore();
      // موج يتكسّر على حافّة الجزيرة
      c.save();
      c.strokeStyle = "rgba(226,244,250,0.55)"; c.lineCap = "round";
      for (const r of SEA_RINGS) {
        const phase = ((now / 1000) * r.sp + r.t) % 1;
        const a0 = r.t, a1 = r.t + r.len;
        const [x0, y0] = seaEdgePoint(a0 % 1), [x1, y1] = seaEdgePoint(a1 % 1);
        const push = 3 + phase * 9;
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        const cxr = mx - (isoX(WORLD_W / 2, WORLD_H / 2) - mx) * 0;
        const nx = (mx - isoX(WORLD_W / 2, WORLD_H / 2)), ny = (my - isoY(WORLD_W / 2, WORLD_H / 2));
        const nl = Math.hypot(nx, ny) || 1;
        c.globalAlpha = 0.5 * (1 - phase);
        c.lineWidth = 2 - phase;
        c.beginPath();
        c.moveTo(x0 + (nx / nl) * push, y0 + (ny / nl) * push * 0.6);
        c.lineTo(x1 + (nx / nl) * push, y1 + (ny / nl) * push * 0.6);
        c.stroke();
      }
      c.restore();
    }

    function renderBackground() {
      const season = SEASONS[seasonForMonth(state.month)];
      const c = bgCtx;
      c.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

      // لا سماء هنا: البحر يُرسم كل إطار خلف هذه الطبقة، فلو ملأناها لغطّيناه
      // سطح الأرض معيّنًا واحدًا بتدرّج، ثم بلاطاته
      const corners = [[0,0],[WORLD_W,0],[WORLD_W,WORLD_H],[0,WORLD_H]];
      c.beginPath();
      corners.forEach(([x,y],i) => { const px = isoX(x,y), py = isoY(x,y);
        i === 0 ? c.moveTo(px,py) : c.lineTo(px,py); });
      c.closePath();
      const g = c.createLinearGradient(0, ISO_OY, 0, ISO_OY + ISO_H);
      g.addColorStop(0, season.ground[0]); g.addColorStop(1, season.ground[1]);
      c.fillStyle = g; c.fill();

      // شبكة البلاط: خطوط خافتة تكشف الاتجاه الإيزومتري
      c.save(); c.clip();
      c.strokeStyle = "rgba(0,0,0,0.10)"; c.lineWidth = 1;
      for (let tx = 0; tx <= COLS; tx++) {
        c.beginPath();
        c.moveTo(isoX(tx*TILE, 0), isoY(tx*TILE, 0));
        c.lineTo(isoX(tx*TILE, WORLD_H), isoY(tx*TILE, WORLD_H));
        c.stroke();
      }
      for (let ty = 0; ty <= ROWS; ty++) {
        c.beginPath();
        c.moveTo(isoX(0, ty*TILE), isoY(0, ty*TILE));
        c.lineTo(isoX(WORLD_W, ty*TILE), isoY(WORLD_W, ty*TILE));
        c.stroke();
      }
      // حصى متناثر
      for (const d of GROUND_DOTS) {
        c.fillStyle = d.tone < 0.5 ? "rgba(0,0,0,0.16)" : season.dot;
        const px = isoX(d.x, d.y), py = isoY(d.x, d.y);
        c.beginPath(); c.ellipse(px, py, d.s * 1.1, d.s * 0.55, 0, 0, Math.PI * 2); c.fill();
      }
      c.restore();

      // حافة الجزيرة: رملٌ ثم صخر يهبط إلى الماء
      const edge = 22;
      const bottom = [[WORLD_W,0],[WORLD_W,WORLD_H],[0,WORLD_H]];
      c.beginPath();
      c.moveTo(isoX(WORLD_W,0), isoY(WORLD_W,0));
      bottom.slice(1).forEach(([x,y]) => c.lineTo(isoX(x,y), isoY(x,y)));
      c.lineTo(isoX(0,WORLD_H), isoY(0,WORLD_H) + edge);
      c.lineTo(isoX(WORLD_W,WORLD_H), isoY(WORLD_W,WORLD_H) + edge);
      c.lineTo(isoX(WORLD_W,0), isoY(WORLD_W,0) + edge);
      c.closePath();
      const eg = c.createLinearGradient(0, isoY(WORLD_W / 2, WORLD_H) - 4, 0, isoY(WORLD_W / 2, WORLD_H) + edge);
      eg.addColorStop(0, "#d8c08a");      // شريط رملي عند الحافّة
      eg.addColorStop(0.28, "#8a7048");
      eg.addColorStop(1, "#3b3020");      // صخر مظلم عند الماء
      c.fillStyle = eg; c.fill();
      c.strokeStyle = "rgba(20,14,8,0.5)"; c.lineWidth = 1; c.stroke();

      // ممرات من الساحة إلى كل باب
      c.lineCap = "round";
      for (const pass of [[13, "rgba(214,198,160,0.30)"], [8, "rgba(232,220,190,0.22)"]]) {
        c.lineWidth = pass[0]; c.strokeStyle = pass[1];
        for (const b of BUILDINGS) {
          c.beginPath();
          c.moveTo(isoX(PLAZA_X, PLAZA_Y), isoY(PLAZA_X, PLAZA_Y));
          c.lineTo(isoX(b.doorX, b.doorY), isoY(b.doorX, b.doorY));
          c.stroke();
        }
      }

      // الساحة: بلاط مشعّ حول حوض فلج مرفوع — كانت حلقة باهتة بلا حضور
      const px = isoX(PLAZA_X, PLAZA_Y), py = isoY(PLAZA_X, PLAZA_Y);
      const ky = ISO_KY / ISO_KX;
      c.beginPath(); c.ellipse(px, py, 44, 44 * ky, 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(214,198,160,0.30)"; c.fill();
      c.strokeStyle = "rgba(232,217,168,0.35)"; c.lineWidth = 1.5; c.stroke();
      // بلاط مشعّ
      c.strokeStyle = "rgba(120,100,70,0.35)"; c.lineWidth = 1;
      for (let i = 0; i < 12; i++) {
        const a2 = (i / 12) * Math.PI * 2;
        c.beginPath();
        c.moveTo(px + Math.cos(a2) * 17, py + Math.sin(a2) * 17 * ky);
        c.lineTo(px + Math.cos(a2) * 44, py + Math.sin(a2) * 44 * ky);
        c.stroke();
      }
      // جدار الحوض المرفوع
      const rimH = 7;
      c.beginPath();
      c.moveTo(px - 17, py); c.lineTo(px - 17, py - rimH);
      c.ellipse(px, py - rimH, 17, 17 * ky, 0, Math.PI, 0);
      c.lineTo(px + 17, py); c.ellipse(px, py, 17, 17 * ky, 0, 0, Math.PI);
      c.closePath();
      c.fillStyle = shade(CLAY, 0.72); c.fill();
      c.strokeStyle = "rgba(38,28,18,0.55)"; c.lineWidth = 1; c.stroke();
      // سطح الماء داخله
      c.beginPath(); c.ellipse(px, py - rimH, 15, 15 * ky, 0, 0, Math.PI * 2);
      c.fillStyle = "#2f6f8f"; c.fill();
      c.beginPath(); c.ellipse(px - 4, py - rimH - 1, 6, 6 * ky, 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(150,210,240,0.35)"; c.fill();
      // عمود النافورة
      c.fillStyle = shade(CLAY, 0.95);
      c.fillRect(px - 2.5, py - rimH - 13, 5, 13);
      c.strokeStyle = "rgba(38,28,18,0.5)"; c.strokeRect(px - 2.5, py - rimH - 13, 5, 13);
      c.beginPath(); c.arc(px, py - rimH - 15, 3.4, 0, Math.PI * 2);
      c.fillStyle = "#e8d9a8"; c.fill(); c.stroke();

      renderedSeason = seasonForMonth(state.month);
      renderedBgKey = bgKey(state);
    }

    renderBackground();

    // النخلة بدل "المصّاصة": جذع مقطّع منحنٍ وتاج من سعف مقوّس يتمايل.
    // الشكل هو الطابع العُماني نفسه — ولا شيء في الكرة المسطّحة يوحي بمكان.
    function drawTree(c, t, season, now) {
      const sway = Math.sin(now / 1000 * 0.9 + t.seed * 6.28) * 0.045;
      const H = t.r * 3.2;                       // ارتفاع الجذع
      // النخلة لافتة قائمة عند موضعها المُسقَط، كما تُرسم في الألعاب الإيزومترية
      const bx = isoX(t.x, t.y), by = isoY(t.x, t.y);
      const topX = bx + Math.sin(sway) * H * 0.42;
      const topY = by - H;

      // ظل بيضاوي على الأرض
      c.beginPath(); c.ellipse(bx + 2, by + 1, t.r * 0.85, t.r * 0.85 * (ISO_KY / ISO_KX), 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(0,0,0,0.28)"; c.fill();

      // الجذع: منحنى مخروطي بحلقات
      const bw = t.r * 0.42, tw = t.r * 0.24;
      const cx1 = bx + (topX - bx) * 0.25, cy1 = by - H * 0.45;
      c.beginPath();
      c.moveTo(bx - bw, by);
      c.quadraticCurveTo(cx1 - tw, cy1, topX - tw, topY);
      c.lineTo(topX + tw, topY);
      c.quadraticCurveTo(cx1 + tw, cy1, bx + bw, by);
      c.closePath();
      c.fillStyle = "#6b5535"; c.fill();
      c.strokeStyle = "rgba(52,40,24,0.55)"; c.lineWidth = 1;
      const rings = Math.max(4, Math.round(H / 5));
      for (let i = 1; i < rings; i++) {
        const f = i / rings;
        const rx = bx + (topX - bx) * f * f, ry = by - H * f;
        const hw = bw + (tw - bw) * f;
        c.beginPath(); c.moveTo(rx - hw * 0.9, ry); c.lineTo(rx + hw * 0.9, ry); c.stroke();
      }
      // إضاءة جانبية على الجذع
      c.globalAlpha = 0.25; c.fillStyle = "#a68a55";
      c.beginPath();
      c.moveTo(bx - bw, by);
      c.quadraticCurveTo(cx1 - tw, cy1, topX - tw, topY);
      c.lineTo(topX - tw * 0.35, topY);
      c.quadraticCurveTo(cx1 - tw * 0.35, cy1, bx - bw * 0.35, by);
      c.closePath(); c.fill();
      c.globalAlpha = 1;

      // السعف: ثمانية أوراق مقوّسة، الخلفية أغمق ثم الأمامية أفتح
      const fronds = 8, L = t.r * 2.05;
      for (let pass = 0; pass < 2; pass++) {
        c.fillStyle = pass === 0 ? season.leaf : season.leafHi;
        for (let i = 0; i < fronds; i++) {
          if ((i % 2 === 0) !== (pass === 0)) continue;
          const a = Math.PI + (i / (fronds - 1)) * Math.PI + sway * 1.6;
          const droop = 0.55 + 0.35 * Math.abs(Math.cos(a));
          const ex = topX + Math.cos(a) * L, ey = topY + Math.sin(a) * L * 0.55 + L * droop * 0.45;
          const mx = topX + Math.cos(a) * L * 0.55, my = topY + Math.sin(a) * L * 0.4 - L * 0.16;
          const wdt = t.r * 0.36 * (pass === 0 ? 1 : 0.82);
          c.beginPath();
          c.moveTo(topX, topY);
          c.quadraticCurveTo(mx, my - wdt, ex, ey);
          c.quadraticCurveTo(mx, my + wdt, topX, topY);
          c.fill();
        }
      }
      // قلب التاج
      c.beginPath(); c.arc(topX, topY, t.r * 0.28, 0, Math.PI * 2);
      c.fillStyle = season.leafHi; c.fill();

      // عذوق التمر في الصيف والخريف
      if (season.dates) {
        c.fillStyle = season.dates;
        for (let k = 0; k < 3; k++) {
          const a = -0.5 + k * 0.5;
          for (let j = 0; j < 4; j++) {
            const d = t.r * (0.35 + j * 0.16);
            c.beginPath();
            c.arc(topX + Math.cos(a) * d, topY + Math.sin(a) * d * 0.7 + j * 1.1, 1.5, 0, Math.PI * 2);
            c.fill();
          }
        }
      }
    }

    // ==================== الشخصيات ====================
    const PLAYER_PALETTE = { shirt: "#c9974a", sleeve: "#b98a44", skin: "#e8b88a", hair: "#3a2a1a" };

    // تُستدعى بإحداثيات العالم؛ الإسقاط يقع هنا فتبقى مواضع اللعب كما هي
    // الشخصية في الإيزومتري: كتلة لها حجم وظلّ يتبع ميل الأرض، بخطّ خارجي
    // داكن يفصلها عن الجدار الطيني خلفها، وبثوب عُماني وكُمّة على الرأس.
    function drawCharacter(c, wx, wy, facing, animT, moving, palette) {
      const walk = moving ? Math.sin(animT * 12) : 0;
      const legOffset = walk * 3.5, armOffset = -walk * 3;
      // سكونٌ حيّ: تنفّس بطيء بدل تجمّد تام — الوقوف بلا حركة يقتل الإحساس
      const breathe = moving ? 0 : Math.sin(animT * 2.1) * 0.55;
      const bob = moving ? Math.abs(Math.sin(animT * 12)) * 1.3 : breathe;
      // حركة ثانوية: طرف الثوب يتأخّر عن الجسم فيتمايل
      const hem = moving ? Math.sin(animT * 12 - 0.9) * 1.9 : Math.sin(animT * 2.1 - 0.7) * 0.5;
      const cx = isoX(wx, wy), cy = isoY(wx, wy);
      const away = facing === "up";                 // مُدبِر عن الناظر
      const ink = "rgba(26,20,12,0.75)";

      // ظلّ بيضاوي بنسبة الأرض الإيزومترية
      c.save();
      c.beginPath(); c.ellipse(cx + 1, cy + 13, 9, 9 * (ISO_KY / ISO_KX), 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(0,0,0,0.32)"; c.fill();

      c.translate(cx, cy - bob);
      if (facing === "left") c.scale(-1, 1);
      c.lineJoin = "round";
      c.strokeStyle = ink; c.lineWidth = 1.4;

      // الساقان
      c.fillStyle = "#2a1c0d";
      for (const [ox, off] of [[-6, legOffset], [1, -legOffset]]) {
        c.beginPath(); c.rect(ox, 4 + off, 5, 10); c.fill(); c.stroke();
      }
      // الثوب: أوسع عند الأسفل
      c.beginPath();
      c.moveTo(-7, -7); c.lineTo(7, -7); c.lineTo(9.5 + hem, 8);
      c.quadraticCurveTo(hem * 0.6, 10.5, -9.5 + hem, 8); c.closePath();
      c.fillStyle = palette.shirt; c.fill(); c.stroke();
      // ظلّ خلوي على الجانب البعيد عن الضوء
      c.save(); c.clip();
      c.fillStyle = "rgba(0,0,0,0.16)";
      c.fillRect(1.5, -8, 10, 20);
      c.restore();
      // فتحة الرقبة
      c.beginPath(); c.moveTo(-3, -7); c.lineTo(3, -7); c.lineTo(0, -3.5); c.closePath();
      c.fillStyle = "rgba(0,0,0,0.18)"; c.fill();

      // الذراعان
      c.fillStyle = palette.sleeve;
      for (const [ox, off] of [[-10.5, armOffset], [6.5, -armOffset]]) {
        c.beginPath(); c.rect(ox, -5 + off, 4, 10); c.fill(); c.stroke();
      }

      // الرأس
      c.beginPath(); c.arc(0, -12.5, 6.6, 0, Math.PI * 2);
      c.fillStyle = palette.skin; c.fill(); c.stroke();
      // كُمّة عُمانية: طاقية مطرّزة بدل شعر مرسوم
      c.beginPath(); c.arc(0, -14.5, 6.9, Math.PI * 1.02, Math.PI * 1.98);
      c.lineTo(6.7, -13.6); c.lineTo(-6.7, -13.6); c.closePath();
      c.fillStyle = palette.hair; c.fill(); c.stroke();
      c.strokeStyle = "rgba(232,217,168,0.55)"; c.lineWidth = 1;
      c.beginPath(); c.moveTo(-5.6, -15.4); c.lineTo(5.6, -15.4); c.stroke();

      if (!away) {
        c.fillStyle = "#2a1c0d";
        c.beginPath(); c.arc(-2.4, -12.2, 1.05, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(2.4, -12.2, 1.05, 0, Math.PI * 2); c.fill();
      }
      c.restore();
    }

    // ==================== مؤشرات حيّة فوق المباني تعكس وضعك المالي ====================
    // مؤشرات حالة تطفو فوق سطح كل مبنى. في المنظور العلوي كانت تُرسم على
    // واجهته؛ وفي الإيزومتري السطح هو ما يُرى، فالشارة فوقه أوضح ولا تشوّه
    // العمارة.
    function isoBadge(c, b, text, color, now, pulse) {
      const st = BUILDING_STYLE[b.id] || { h: 60 };
      let H = st.h;
      if (b.id === "home") {
        const hs = state.housing || INITIAL_STATE.housing;
        H = hs.stage === "renting" || hs.stage === "waiting" ? 0
          : hs.stage === "land" ? 6
          : hs.stage === "owned" ? st.h
          : 6 + Math.round((st.h - 6) * Math.min(1, (hs.built || 0) / HOME_COST));
      }
      const cxw = b.x + b.w / 2, cyw = b.y + b.h / 2;
      const bob = Math.sin(now / 500 + b.x) * 2;
      const extra = st.roof === "dome" ? 30 : st.roof === "tower" ? 34 : 12;
      const x = isoX(cxw, cyw), y = isoY(cxw, cyw) - H - extra - 8 + bob;
      c.font = "bold 10px 'Noto Kufi Arabic', sans-serif";
      c.textAlign = "center"; c.textBaseline = "middle";
      const w = c.measureText(text).width + 12;
      const a = pulse ? 0.75 + 0.25 * ((Math.sin(now / 280) + 1) / 2) : 1;
      c.globalAlpha = a;
      c.fillStyle = "rgba(10,22,20,0.82)";
      roundRect(c, x - w / 2, y - 9, w, 18, 9); c.fill();
      c.strokeStyle = color; c.lineWidth = 1.4; c.stroke();
      c.fillStyle = color;
      c.fillText(text, x, y);
      c.globalAlpha = 1;
    }

    function drawBuildingIndicators(now) {
      const d = derive(state);
      const find = (id) => BUILDINGS.find((b) => b.id === id);

      // البنك: نسبة امتلاء صندوق الطوارئ
      const bankB = find("bank");
      if (bankB) {
        const pct = Math.max(0, Math.min(1, state.emergency / d.emergencyTarget));
        isoBadge(ctx, bankB, `🛡 ${Math.round(pct * 100)}%`,
                 pct >= 1 ? "#2ecc71" : "#c9974a", now, pct >= 1);
      }
      // البورصة: اتجاه آخر حركة للأسهم
      const marketB = find("market");
      if (marketB && d.totalInv > 0) {
        const up = (lastStockDelta ?? 0) >= 0;
        isoBadge(ctx, marketB, `${up ? "▲" : "▼"} ${fmt(Math.round(d.totalInv))}`,
                 up ? "#2ecc71" : "#e74c3c", now, false);
      }
      // المنزل: تقدّم البناء أو الدين
      const homeB = find("home");
      if (homeB) {
        const hs = state.housing || INITIAL_STATE.housing;
        if (hs.stage === "building") {
          isoBadge(ctx, homeB, `🏗 ${Math.round((hs.built / HOME_COST) * 100)}%`, "#c9974a", now, false);
        } else if (state.debt > 0) {
          isoBadge(ctx, homeB, `💳 ${fmt(state.debt)}`, "#e74c3c", now, true);
        }
      }
      // لوحة الأهداف: أقرب هدف إلى الاكتمال
      const goalsB = find("goals");
      const openGoalsList = (state.goals || []).filter((g) => g && !g.spent && g.target > 0);
      if (goalsB && openGoalsList.length) {
        const best = Math.max(...openGoalsList.map((g) => Math.min(1, g.saved / g.target)));
        isoBadge(ctx, goalsB, `🎯 ${Math.round(best * 100)}%`, best >= 1 ? "#2ecc71" : "#9b59b6", now, best >= 1);
      }
      // العمل: راتب بانتظارك
      const workB = find("work");
      if (workB && d.surplus > 0) {
        isoBadge(ctx, workB, "💰 راتب", "#c9974a", now, true);
      }
    }

    function draw() {
      const now = performance.now();
      const seasonKey = seasonForMonth(state.month);
      if (bgKey(state) !== renderedBgKey) renderBackground();
      const season = SEASONS[seasonKey];
      const night = nightFactor(now);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      if (shake > 0.05) {
        ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
      }
      drawSea(ctx, now);
      ctx.drawImage(bgCanvas, 0, 0);

      // رذاذ النافورة
      for (const dr of DROPS) {
        const a = Math.max(0, 1 - dr.life / dr.max);
        ctx.fillStyle = `rgba(150,210,240,${a * 0.8})`;
        ctx.fillRect(isoX(dr.x, dr.y), isoY(dr.x, dr.y) - 10, 2, 2);
      }

      // غبار خطوات اللاعب
      for (const d of DUST) {
        ctx.globalAlpha = Math.max(0, 1 - d.life / d.max) * 0.35;
        ctx.fillStyle = "#cfd8d3";
        ctx.beginPath(); ctx.arc(isoX(d.x, d.y), isoY(d.x, d.y), d.r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      // ظلال السحب على الأرض. كانت تُرسم أقراصًا بيضاء صلبة *فوق* المباني
      // فتبدو صحونًا طائرة تحجب المدينة؛ والظل المتحرك على الأرض هو ما يُرى
      // فعلاً من أعلى، ولا يحجب شيئًا.
      for (const cl of CLOUDS) {
        const sx = isoX(cl.x, cl.y), sy = isoY(cl.x, cl.y);
        const g = ctx.createRadialGradient(sx, sy, cl.r * 0.15, sx, sy, cl.r * 1.6);
        g.addColorStop(0, `rgba(8,20,18,${cl.alpha * 2.4})`);
        g.addColorStop(0.6, `rgba(8,20,18,${cl.alpha * 1.1})`);
        g.addColorStop(1, "rgba(8,20,18,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(sx, sy, cl.r * 1.7, cl.r * 1.7 * (ISO_KY / ISO_KX), 0, 0, Math.PI * 2); ctx.fill();
      }

      // العمق في الإيزومتري هو (x+y): ما زاد مجموعه كان أقرب فرُسم فوق غيره
      const entities = [];
      for (const t of TREES) entities.push({ d: isoDepth(t.x, t.y), kind: "tree", ref: t });
      for (const n of NPCS) entities.push({ d: isoDepth(n.x, n.y + 14), kind: "npc", ref: n });
      for (const l of LAMPS) entities.push({ d: isoDepth(l.x, l.y), kind: "lamp", ref: l });
      // المباني في نفس قائمة العمق: كانت في الخلفية الثابتة فترسم النخلة
      // والشخصية فوقها دائمًا ولو وقفتا خلفها — وهو ما لا يُغتفر في الإيزومتري
      for (const b of BUILDINGS) entities.push({ d: isoDepth(b.x + b.w, b.y + b.h), kind: "building", ref: b });
      entities.push({ d: isoDepth(player.x + player.w / 2, player.y + player.h), kind: "player" });
      entities.sort((a, b) => a.d - b.d);
      for (const e of entities) {
        if (e.kind === "building") drawIsoBuilding(ctx, e.ref);
        else if (e.kind === "tree") drawTree(ctx, e.ref, season, now);
        else if (e.kind === "npc") drawCharacter(ctx, e.ref.x, e.ref.y, e.ref.facing, e.ref.animT, e.ref.moving, e.ref.palette);
        else if (e.kind === "lamp") {
          const lx = isoX(e.ref.x, e.ref.y), ly = isoY(e.ref.x, e.ref.y);
          ctx.fillStyle = "rgba(0,0,0,0.25)";
          ctx.beginPath(); ctx.ellipse(lx, ly, 4, 2, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#3b4a44"; ctx.fillRect(lx - 1.5, ly - 18, 3, 18);
          ctx.fillStyle = night > 0.12 ? "#f4d58d" : "#8a9a92";
          ctx.beginPath(); ctx.arc(lx, ly - 20, 3.4, 0, Math.PI * 2); ctx.fill();
        }
        else drawCharacter(ctx, player.x + player.w / 2, player.y + player.h / 2, player.facing, player.animT, pressed.size > 0, PLAYER_PALETTE);
      }

      drawBuildingLabels(ctx);
      drawBuildingIndicators(now);

      drawWeather(ctx);

      // صبغة الفصل فوق المشهد كله
      if (season.tint) {
        ctx.fillStyle = season.tint;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // ستارة الليل ثم مصادر الضوء الدافئة فوقها
      if (night > 0.02) {
        ctx.fillStyle = `rgba(12,24,48,${night})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const l of LAMPS) {
          const lx = isoX(l.x, l.y), ly = isoY(l.x, l.y) - 16;
          const g = ctx.createRadialGradient(lx, ly, 2, lx, ly, 46);
          g.addColorStop(0, `rgba(255,214,140,${0.42 * night})`);
          g.addColorStop(1, "rgba(255,214,140,0)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(lx, ly, 46, 0, Math.PI * 2); ctx.fill();
        }
        for (const b of BUILDINGS) {
          if (b.id === "goals") continue;
          const dx = isoX(b.doorX, b.doorY), dy = isoY(b.doorX, b.doorY) - 8;
          const g = ctx.createRadialGradient(dx, dy, 2, dx, dy, 34);
          g.addColorStop(0, `rgba(255,206,128,${0.34 * night})`);
          g.addColorStop(1, "rgba(255,206,128,0)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(dx, dy, 34, 0, Math.PI * 2); ctx.fill();
        }
        const pfx = isoX(PLAZA_X, PLAZA_Y), pfy = isoY(PLAZA_X, PLAZA_Y);
        const fg = ctx.createRadialGradient(pfx, pfy, 2, pfx, pfy, 40);
        fg.addColorStop(0, `rgba(150,200,255,${0.22 * night})`);
        fg.addColorStop(1, "rgba(150,200,255,0)");
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(pfx, pfy, 40, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      if (currentBuilding) {
        const glowT = (Math.sin(now / 220) + 1) / 2;
        ctx.beginPath();
        ctx.arc(isoX(currentBuilding.doorX, currentBuilding.doorY), isoY(currentBuilding.doorX, currentBuilding.doorY), 6 + glowT * 3, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(201,151,74,${0.4 + glowT * 0.4})`;
        ctx.lineWidth = 2; ctx.stroke();
      }

      // شارات الإنجاز تنزلق من أعلى المشهد
      for (let i = BADGES.length - 1; i >= 0; i--) {
        const bd = BADGES[i];
        const p = bd.life / bd.max;
        const slide = p < 0.15 ? p / 0.15 : (p > 0.85 ? (1 - p) / 0.15 : 1);
        const by = 14 + i * 34;
        ctx.globalAlpha = Math.max(0, Math.min(1, slide));
        ctx.fillStyle = "rgba(18,46,39,0.95)";
        roundRect(ctx, WORLD_W / 2 - 92, by, 184, 28, 8); ctx.fill();
        ctx.strokeStyle = "#c9974a"; ctx.lineWidth = 1.5;
        roundRect(ctx, WORLD_W / 2 - 92, by, 184, 28, 8); ctx.stroke();
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = "14px sans-serif";
        ctx.fillText(bd.icon, WORLD_W / 2 - 70, by + 14);
        ctx.font = "11px 'Noto Kufi Arabic', sans-serif";
        ctx.fillStyle = "#e0e8e4";
        ctx.fillText(bd.name, WORLD_W / 2 + 8, by + 14);
        ctx.globalAlpha = 1;
      }

      // أرقام تطفو فوق اللاعب عند تغيّر صافي الثروة
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let i = 0; i < FLOATERS.length; i++) {
        const f = FLOATERS[i];
        const p = f.life / f.max;
        const fx = player.x + player.w / 2 + f.dx;
        const fy = player.y - 8 - p * 26 - i * 13;
        ctx.globalAlpha = Math.max(0, 1 - p);
        ctx.font = "bold 13px 'IBM Plex Mono', monospace";
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(10,30,26,0.85)";
        ctx.strokeText(f.text, fx, fy);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, fx, fy);
        ctx.globalAlpha = 1;
      }

      ctx.restore();

      // وميض أحمر خافت أثناء الاهتزاز (خسارة كبيرة)
      if (shake > 0.05) {
        ctx.fillStyle = `rgba(231,76,60,${Math.min(0.16, shake * 0.022)})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // شارة الفصل والوقت
      ctx.font = "10px 'Noto Kufi Arabic', sans-serif";
      ctx.textAlign = "right"; ctx.textBaseline = "top";
      ctx.fillStyle = "rgba(224,232,228,0.55)";
      ctx.fillText(`${season.name} · ${night > 0.3 ? "ليل" : "نهار"}`, WORLD_W - 8, 8);
    }

    // ==================== الحلقة الرئيسية ====================
    let lastTs = 0;
    function loop(ts) {
      const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
      lastTs = ts;
      const active = !isModalOpen();
      if (active) {
        updatePlayer(dt);
        updateNPCs(dt);
      }
      updateClouds(dt);
      updateFountain(dt);
      updateWeather(dt, seasonForMonth(state.month));
      updateDust(dt, active && pressed.size > 0);
      updateFloaters(dt);
      for (let i = BADGES.length - 1; i >= 0; i--) {
        BADGES[i].life += dt;
        if (BADGES[i].life > BADGES[i].max) BADGES.splice(i, 1);
      }
      if (shake > 0) shake = Math.max(0, shake - dt * 9);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ==================== المدخلات ====================
    const KEY_MAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };
    // مفاتيح الحركة هي نفسها مفاتيح كتابة: w/a/s/d وأسهم الاتجاه. كان المستمع
    // يبتلعها في كل الأحوال، فكتابة "wedding sofa" في اسم هدف تُنتج "eing of"،
    // ولا يتحرك مؤشر الكتابة بالأسهم، ولا تزيد الحقول الرقمية بسهم أعلى.
    function isTypingTarget(el) {
      if (!el || !el.tagName) return false;
      const tag = el.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || el.isContentEditable === true;
    }
    window.addEventListener("keydown", (e) => {
      // Escape يبقى متاحًا حتى وأنت داخل حقل، كي تُغلق النافذة دون مغادرته
      if (e.key === "Escape" && isModalOpen() && !topModalIsMandatory()) { popModal(); return; }
      if (isTypingTarget(e.target)) return;
      const dir = KEY_MAP[e.key];
      // ولا مشي خلف نافذة مفتوحة: كان الضغط يبعدك عن المبنى الذي تقف فيه
      if (dir && !isModalOpen()) { pressed.add(dir); e.preventDefault(); }
      if ((e.key === "Enter" || e.key === " " || e.key === "e") && currentBuilding && !isModalOpen()) currentBuilding.open();
    });
    window.addEventListener("keyup", (e) => {
      const dir = KEY_MAP[e.key];
      if (dir) pressed.delete(dir);
    });

    // إن غادر التركيز النافذة أثناء ضغط مفتاح حركة فلن تصل رسالة keyup أبدًا،
    // فتظل الشخصية تمشي بلا توقف عند العودة. نُفرغ المفاتيح عند فقدان التركيز.
    const releaseAllKeys = () => pressed.clear();
    window.addEventListener("blur", releaseAllKeys);
    document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAllKeys(); });

    function bindDpad(id, dir) {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); pressed.add(dir); };
      const end = (e) => { e.preventDefault(); pressed.delete(dir); };
      el.addEventListener("pointerdown", start);
      el.addEventListener("pointerup", end);
      el.addEventListener("pointerleave", end);
      el.addEventListener("pointercancel", end);
    }
    bindDpad("btnUp", "up"); bindDpad("btnDown", "down"); bindDpad("btnLeft", "left"); bindDpad("btnRight", "right");

    document.getElementById("statsBtn").addEventListener("click", () => {
      document.getElementById("statsPanel").classList.toggle("open");
    });

    const soundBtn = document.getElementById("soundBtn");
    function refreshSoundBtn() {
      soundBtn.textContent = soundOn ? "🔊" : "🔇";
      soundBtn.style.opacity = soundOn ? "1" : "0.55";
    }
    refreshSoundBtn();
    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      lsSet("zeroSound", soundOn ? "on" : "off");
      refreshSoundBtn();
      if (soundOn) SFX.coin();
    });

    // ==================== واجهة المستخدم العلوية ====================
    // ==================== الإرشاد المتدرّج ====================
    // اللاعب الجديد يرى ثماني مبانٍ بلا ترتيب. هذه أول خطوة مفيدة في حالته
    // الراهنة، وإلى أي مبنى يذهب لأجلها. تُخفى بزر، أو تختفي وحدها حين لا
    // تبقى خطوة تأسيسية — فلا تلاحق لاعبًا يعرف ما يفعل.
    const NEXT_STEPS = [
      { id: "first_pay",
        when: (s) => (s.year - 1) * 12 + s.month === 1,
        text: () => `ابدأ من <b>💼 العمل</b>: استلم راتبك ووزّع فائضك على بنوده.` },
      { id: "emergency",
        when: (s, d) => d.coverage < 1,
        text: (s, d) => `اذهب إلى <b>🏦 البنك</b> وابنِ ${term("صندوق الطوارئ")} — يغطي ${d.coverage.toFixed(1)} شهر فقط من أصل 6.` },
      { id: "debt",
        when: (s) => s.debt > 0,
        text: (s) => `سدّد دَينك (${fmt(s.debt)}) — من شاشة الراتب أو <b>🏠 المنزل</b>؛ فائدته ${(debtMonthlyRate(s.creditScore) * 100).toFixed(2)}%/شهر.` },
      { id: "invest",
        when: (s, d) => d.totalInv === 0 && s.cash >= 300,
        text: () => `نقدك عاطل. جرّب <b>📈 البورصة</b> — أربعة أصول بعوائد ومخاطر مختلفة.` },
      { id: "land",
        when: (s) => s.housing.stage === "renting",
        text: () => `اطلب <b>${term("منحة الأرض")}</b> من <b>📰 دار البلدية</b> — التخصيص يستغرق ${LAND_WAIT_MONTHS} أشهر، فالطلب مبكرًا أفضل.` },
      { id: "educate",
        when: (s) => (s.education?.level ?? 0) === 0 && !s.education?.pending && s.cash >= 400,
        text: () => `<b>🎓 المعهد</b>: دورة ترفع دخلك مدى الحياة — أسرع طريق إلى الاستقلال.` },
      { id: "learn",
        when: (s) => (s.year - 1) * 12 + s.month <= 6,
        text: () => `لا تفهم مصطلحًا؟ <b>📖 المكتبة</b> فيها قاموس بـ24 مصطلحًا ماليًا.` },
    ];
    function currentStep() {
      if (state.tipsOff) return null;
      const d = derive(state);
      for (const st of NEXT_STEPS) {
        let ok = false;
        try { ok = st.when(state, d); } catch { ok = false; }
        if (ok) return { ...st, body: st.text(state, d) };
      }
      return null;
    }
    function refreshNextStep() {
      const el = document.getElementById("nextStep");
      if (!el) return;
      const st = currentStep();
      if (!st) { el.classList.add("hidden"); return; }
      el.classList.remove("hidden");
      document.getElementById("nextStepText").innerHTML = `🧭 ${st.body}`;
      mountCommon(el);   // المصطلحات داخل الإرشاد قابلة للنقر كغيرها
    }

    // الأرقام تعدّ بدل أن تقفز. القفزة تُخفي مقدار التغيّر؛ والعدّ يجعله
    // محسوسًا — وهو أرخص ما يشتريه المرء من إحساس الحركة الاحترافية.
    const TWEENS = new Map();
    function tweenNumber(id, target, render) {
      const el = document.getElementById(id);
      if (!el) return;
      const t = Math.round(target);
      const prev = TWEENS.get(id);
      if (prev && prev.to === t) return;
      const from = prev ? prev.cur : t;
      if (prev && prev.raf) cancelAnimationFrame(prev.raf);
      if (from === t) { TWEENS.set(id, { to: t, cur: t }); el.innerHTML = render(t); return; }
      const dur = Math.min(700, 220 + Math.abs(t - from) * 0.35);
      const t0 = performance.now();
      const rec = { to: t, cur: from, raf: 0 };
      TWEENS.set(id, rec);
      (function step(now) {
        const k = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - k, 3);          // تباطؤ في النهاية
        rec.cur = Math.round(from + (t - from) * e);
        el.innerHTML = render(rec.cur);
        if (k < 1) rec.raf = requestAnimationFrame(step);
        else { rec.cur = t; rec.raf = 0; el.innerHTML = render(t); }
      })(t0);
    }

    function refreshHud() {
      refreshNextStep();
      const d = derive(state);
      const ml = moraleLabel(state.morale ?? 70);
      const mood = document.getElementById("moodEmoji");
      mood.textContent = ml.emoji;
      mood.title = `الرضا: ${Math.round(state.morale ?? 70)} (${ml.text})`;
      document.getElementById("hudDate").textContent = `السنة ${state.year} · شهر ${state.month}`;
      tweenNumber("hudNet", d.netWorth, (v) => `${fmt(v)} <small>ريال</small>`);
      tweenNumber("statCash", state.cash, fmt);
      tweenNumber("statEmergency", state.emergency, fmt);
      tweenNumber("statInvest", d.totalInv, fmt);
      tweenNumber("statDebt", state.debt, fmt);
      const hEl = document.getElementById("statHome");
      const hs = state.housing || INITIAL_STATE.housing;
      hEl.textContent = fmt((hs.built || 0) - (hs.loan || 0));
      hEl.style.color = hs.stage === "owned" ? "#2ecc71" : "#e0e8e4";
      const mEl = document.getElementById("statMorale");
      mEl.textContent = Math.round(state.morale ?? 70);
      mEl.style.color = ml.color;
      const cEl = document.getElementById("statCredit");
      cEl.textContent = state.creditScore;
      cEl.style.color = creditLabel(state.creditScore).color;
      const r = rankInfo(state);
      document.getElementById("rankName").textContent = r.name;
      document.getElementById("rankNext").textContent = r.nextLabel;
      const fill = document.getElementById("rankFill");
      fill.style.width = `${r.pct * 100}%`;
      fill.style.background = r.pct >= 1 ? "#2ecc71" : "#c9974a";
    }
    refreshHud();

    // الشرح متاح دائمًا من المكتبة، لا في أول زيارة فقط
    function howToPlayHtml(isIntro) {
      return `
        <h2>🏙️ أهلاً بك في مدينة المال</h2>
        <p style="line-height:1.9;margin-bottom:12px">
          تبدأ براتب <b>1,000</b> ريال ومصروفات <b>600</b> (منها <b>220</b> إيجارًا)، أي فائض <b>400</b> شهريًا.
          تحرّك بالأسهم أو أزرار الاتجاه، واقترب من أي مبنى للتفاعل معه.
        </p>
        <p style="line-height:2.1;margin-bottom:12px">
          💼 العمل — استلام الراتب وتخصيص الفائض<br>
          🏦 البنك — صندوق الطوارئ والتأمين<br>
          📈 البورصة — الاستثمار في أربعة أصول<br>
          🏠 المنزل — الديون وبناء مسكنك<br>
          🎓 المعهد — دورات ترفع دخلك مدى الحياة<br>
          🎯 لوحة الأهداف &nbsp;·&nbsp; 📰 دار البلدية &nbsp;·&nbsp; 📖 المكتبة
        </p>
        <p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:10px">
          🤲 وكل عام تُعرض عليك <b>الزكاة</b> (2.5%) على ما بلغ النصاب وحال عليه الحول.
        </p>
        <div class="card" style="padding:12px;margin-bottom:6px">
          <h3 style="font-size:14px;color:#c9974a;margin-bottom:6px">🏡 طريقك إلى بيت تملكه</h3>
          <p style="line-height:1.9;font-size:13px">
            قدّم طلب <b>منحة أرض</b> من دار البلدية (التخصيص خلال 6 أشهر)، ثم ابنِ على مراحل
            بكلفة <b>50,000</b> ريال — بمدخراتك أو بـ<b>قرض إسكان</b> مدعوم. عند اكتماله يتوقف
            الإيجار نهائيًا فتنخفض مصروفاتك، ويقترب هدفك من الطرفين.
          </p>
        </div>
        <p class="muted" style="font-size:12px;line-height:1.8">
          الفوز: أن تبلغ ثروتك المُدِرّة للدخل <b>ثمانية أضعاف مصروفاتك السنوية</b>.
          بيت السكن لا يُحتسب فيها — فهو لا يموّل مصروفاتك. (اقرأ في المكتبة عن
          ${term("الاستقلال المالي")} ولماذا يحتاج الواقع أكثر من ثلاثة أضعاف ذلك.)
        </p>
        ${isIntro ? '<button class="btn" style="margin-top:16px" id="introStart" data-close-all>ابدأ</button>' : '<button class="btn" style="margin-top:16px" data-close>فهمت</button>'}
      `;
    }
    function openHowToPlay() { pushModal(howToPlayHtml(false)); }

    // اختيار البداية: يُعرض في أول زيارة وعند كل إعادة بدء، فتختلف الجولة
    // اختلافًا حقيقيًا لا تجميليًا — كل سيناريو يبدأ بدرس مختلف.
    function openScenarioPicker(onPicked) {
      const recs = loadRecords();
      const cards = SCENARIOS.map((sc) => {
        const st = scenarioState(sc.id);
        const d = derive(st);
        const r = recs[sc.id];
        const record = !r || !r.runs
          ? `<span style="display:block;font-size:11px;color:#8aa89b;margin-top:3px">لم تُجرَّب بعد</span>`
          : `<span style="display:block;font-size:11px;color:${r.wins ? "#2ecc71" : "#e67e22"};margin-top:3px">
               ${r.wins ? `أفضل نتيجة: ${r.bestMonths} شهرًا · ثروة ${fmt(r.bestNetWorth)}` : "جرّبتها ولم تفز بعد"}
               <span class="muted">(${runsText(r.runs)} · ${winsText(r.wins)})</span>
             </span>`;
        return `<button class="event-btn" data-scenario="${sc.id}" style="line-height:1.8">
          <b style="color:#c9974a">${sc.icon} ${esc(sc.name)}</b>
          <span style="display:block;font-size:12px;margin-top:4px">${esc(sc.desc)}</span>
          <span style="display:block;font-size:11px;color:#8aa89b;margin-top:6px">
            دخل ${fmt(d.effIncome)} · مصروفات ${fmt(d.effExpenses)} · فائض ${fmt(d.surplus)}${
              st.debt > 0 ? ` · دَين ${fmt(st.debt)}` : ""}
          </span>
          <span style="display:block;font-size:11px;color:#c9974a;margin-top:3px">الدرس: ${esc(sc.lesson)}</span>
          ${record}
        </button>`;
      }).join("");
      pushModal(`
        <h2>🧭 اختر بدايتك</h2>
        <p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:10px">
          كل بداية تضعك أمام تحدٍّ مختلف، وجميعها قابلة للفوز. الهدف واحد:
          أن تبلغ ثروتك المُدِرّة ثمانية أضعاف مصروفاتك السنوية.
        </p>
        ${cards}
      `, (root) => {
        root.querySelectorAll("[data-scenario]").forEach((btn) => {
          btn.addEventListener("click", once(() => {
            const id = btn.dataset.scenario;
            SFX.badge();
            resetGame(id);
            closeAllModals();
            if (onPicked) onPicked(id);
          }));
        });
      }, { mandatory: true });
    }

    document.getElementById("nextStepClose").addEventListener("click", () => {
      setState({ ...state, tipsOff: true });
      refreshNextStep();
    });

    if (isFirstVisit) {
      // نحفظ فورًا وإلا اعتُبرت أي إعادة تحميل قبل أول إجراء زيارةً أولى جديدة
      // فتتكرر بطاقة الشرح على من لم يفعل شيئًا بعد.
      saveState();
      // الشرح أولًا ثم اختيار البداية: اختيارُ بدايةٍ قبل أن تعرف معنى
      // "الفائض" أو "الثروة المُدِرّة" اختيارٌ في الظلام.
      pushModal(howToPlayHtml(true), (root) => {
        const btn = root.querySelector("#introStart");
        if (btn) btn.addEventListener("click", () => openScenarioPicker());
      });
    }
  </script>
</body>
</html>
