    function drawEndSlump(canvas) {
      const c = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      c.clearRect(0, 0, W, H);
      c.strokeStyle = "rgba(138,168,155,0.2)"; c.lineWidth = 1;
      for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(10, (H / 4) * i); c.lineTo(W - 10, (H / 4) * i); c.stroke(); }
      const data = state.history.length > 1 ? state.history.map((p) => p.netWorth) : [0, -2000, -5000, -8000, BANKRUPT_AT];
      const max = Math.max(...data, 1000), min = Math.min(...data, BANKRUPT_AT);
      const range = max - min || 1;
      c.beginPath(); c.strokeStyle = "#e74c3c"; c.lineWidth = 2.5;
      data.forEach((v, i) => {
        const x = 14 + (i / (data.length - 1 || 1)) * (W - 28);
        const y = H - 14 - ((v - min) / range) * (H - 34);
        i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      });
      c.stroke();
      c.fillStyle = "#e74c3c"; c.font = "bold 13px sans-serif";
      c.textAlign = "left"; c.textBaseline = "middle";
      c.fillText("▼", 16, 16);
    }

    function celebrateGoal(goalName) {
      pushModal(`
        <h2>🎉 تحقق الهدف!</h2>
        <canvas class="celebrate-art" id="confettiArt" width="340" height="140"></canvas>
        <p style="line-height:1.9;text-align:center;font-size:16px">أكملت هدف <b style="color:#2ecc71">${esc(goalName)}</b> بالكامل.</p>
        <button class="btn" style="margin-top:14px" id="backToGoals">عودة إلى الأهداف</button>
      `, (root) => {
        const canvas = root.querySelector("#confettiArt");
        if (canvas) animateConfetti(canvas);
        root.querySelector("#backToGoals").addEventListener("click", () => { popModal(); openGoals(); });
      });
    }

    const CONFETTI_COLORS = ["#e74c3c", "#3498db", "#f1c40f", "#9b59b6", "#2ecc71", "#c9974a"];
    function animateConfetti(canvas) {
      const c = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      const bits = [];
      for (let i = 0; i < 70; i++) {
        bits.push({
          x: Math.random() * W, y: -Math.random() * H,
          vy: 40 + Math.random() * 70, vx: (Math.random() - 0.5) * 30,
          w: 3 + Math.random() * 4, h: 5 + Math.random() * 5,
          spin: Math.random() * Math.PI, spinV: (Math.random() - 0.5) * 6,
          color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        });
      }
      let last = performance.now();
      (function frame(now) {
        if (!canvas.isConnected) return; // يتوقف تلقائيًا عند إغلاق البطاقة
        const dt = Math.min(0.05, (now - last) / 1000 || 0);
        last = now;
        c.clearRect(0, 0, W, H);
        c.fillStyle = "#2ecc71";
        c.font = "bold 26px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("★", W / 2, H / 2);
        for (const b of bits) {
          b.y += b.vy * dt; b.x += b.vx * dt; b.spin += b.spinV * dt;
          if (b.y > H + 8) { b.y = -8; b.x = Math.random() * W; }
          c.save(); c.translate(b.x, b.y); c.rotate(b.spin);
          c.fillStyle = b.color; c.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
          c.restore();
        }
        requestAnimationFrame(frame);
      })(last);
    }

    // ==================== المستشار المالي ====================
    // قواعد تقرأ حالتك الحالية وتُظهر أهم ما يستحق انتباهك الآن.
    // الترتيب بالخطورة: خطر (3) ثم تنبيه (2) ثم فرصة (1).
    const ADVICE_RULES = [
      { id: "no_emergency", sev: 3, icon: "🛡", term: "صندوق الطوارئ",
        test: (s, d) => d.coverage < 1,
        text: (s, d) => `صندوق طوارئك يغطي ${d.coverage.toFixed(1)} شهر فقط. أي طارئ سيدفعك للاقتراض — اجعله ٣ أشهر على الأقل.` },
      { id: "burnout", sev: 3, icon: "😫", term: "الاستثمار في الذات",
        test: (s) => (s.morale ?? 70) < MORALE_BURNOUT,
        text: () => `أنت في حالة إرهاق ودخلك منخفض 12%. خصّص جزءًا من فائضك للإنفاق الشخصي حتى يتعافى رضاك.` },
      { id: "debt_heavy", sev: 3, icon: "💳", term: "الدين إلى الدخل السنوي",
        test: (s) => s.monthlyIncome > 0 && s.debt / (s.monthlyIncome * 12) > 0.4,
        text: (s) => `دينك يعادل ${Math.round(s.debt / (s.monthlyIncome * 12) * 100)}% من دخلك السنوي، وفائدته ${(debtMonthlyRate(s.creditScore) * 100).toFixed(2)}%/شهر. سداده أعلى عائد مضمون متاح لك.` },
      // العجز الشهري كان يمرّ بلا أي تنبيه ما دام صندوق الطوارئ ممتلئًا،
      // مع أنه اللحظة التي يحتاج فيها اللاعب الإرشاد أكثر من أي وقت.
      { id: "deficit", sev: 3, icon: "📉", term: "صندوق الطوارئ",
        test: (s, d) => d.surplus < 0,
        text: (s, d) => {
          const months = d.effExpenses > 0 ? (s.emergency / -d.surplus) : 0;
          return `مصروفاتك تتجاوز دخلك بـ${fmt(-d.surplus)} شهريًا. بهذا المعدّل يكفي صندوق طوارئك ${months.toFixed(1)} شهرًا — قلّل المصروف أو ارفع الدخل قبل أن ينفد.`;
        } },
      { id: "zakat_due", sev: 3, icon: "🤲", term: "الزكاة",
        test: (s) => (s.zakat?.unpaid ?? 0) > 0,
        text: (s) => `عليك زكاة مؤجّلة قدرها ${fmt(s.zakat.unpaid)} ريالًا في ذمتك.` },
      { id: "morale_falling", sev: 2, icon: "😟", term: null,
        test: (s) => (s.morale ?? 70) >= MORALE_BURNOUT && (s.morale ?? 70) < 45,
        text: (s) => `رضاك ${Math.round(s.morale)} ويتآكل ٤ نقاط شهريًا. اقتربت من الإرهاق الذي يخفض دخلك.` },
      { id: "concentrated", sev: 2, icon: "🧺", term: "التنويع",
        test: (s, d) => { const held = Object.values(s.investments).filter(i => i.amount > 0); return d.totalInv > 800 && held.length === 1; },
        text: (s) => { const k = Object.entries(s.investments).find(([, i]) => i.amount > 0)?.[0]; return `كل استثمارك في ${ASSETS[k]?.label ?? "أصل واحد"}. توزيعه على أصول تتحرك مستقلة يقلّل تذبذب محفظتك دون خفض عائدك كثيرًا.`; } },
      // النقد المرصود للبناء ليس خاملاً: كانت النصيحة تطالب من يدّخر لإكمال
      // منزله باستثمار المبلغ، فتؤخّر بيته وتعرّض مال البناء لتقلّب السوق.
      { id: "build_ready", sev: 2, icon: "🧱", term: "البناء التدريجي",
        test: (s) => ["land", "building"].includes(s.housing.stage) && s.cash >= 500 && s.housing.built < HOME_COST,
        text: (s) => `لديك ${fmt(s.cash)} ريالًا ومتبقٍ ${fmt(HOME_COST - s.housing.built)} على إكمال منزلك. كل دفعة بناء تقرّب سقوط الإيجار عنك.` },
      { id: "idle_cash", sev: 2, icon: "💤", term: "تكلفة الفرصة البديلة",
        test: (s, d) => s.cash > d.effExpenses * 6 && d.totalInv < s.cash * 0.5
                        && !(["land", "building"].includes(s.housing.stage) && s.housing.built < HOME_COST),
        text: (s, d) => `لديك ${fmt(s.cash)} ريالًا نقدًا خاملاً — أكثر من ٦ أشهر مصروفات. النقد الزائد يتآكل بالتضخم بدل أن ينمو.` },
      { id: "no_insurance", sev: 2, icon: "☂", term: "التأمين",
        test: (s, d) => !s.insurance?.health && d.coverage < 4,
        text: () => `لا تأمين صحي لديك وصندوق طوارئك ضعيف. قسط ٢٥ ريالًا يخفض الطارئ الصحي من ٢٢٠ إلى ٥٥.` },
      { id: "no_land", sev: 1, icon: "🏜", term: "منحة الأرض",
        test: (s) => s.housing.stage === "renting" && s.year >= 1,
        text: (s) => `ما زلت تدفع ${fmt(s.rent)} ريالًا إيجارًا شهريًا. طلب منحة الأرض مجاني ويستغرق ٦ أشهر — كلما بكّرت بكّر توقّف الإيجار.` },
      { id: "no_education", sev: 1, icon: "🎓", term: "الاستثمار في الذات",
        test: (s) => (s.education?.level ?? 0) === 0 && !s.education?.pending && s.cash >= 400,
        text: () => `لم تلتحق بأي دورة بعد. أول دورة تكلف ٤٠٠ وترفع دخلك 8% مدى الحياة — عائدها يفوق أي أصل مالي.` },
      { id: "lifestyle", sev: 1, icon: "📈", term: "تضخّم نمط الحياة",
        test: (s) => s.monthlyExpenses > 780,
        text: (s) => `مصروفاتك ارتفعت إلى ${fmt(s.monthlyExpenses)}، وهدف استقلالك ارتفع معها إلى ${fmt(fiTarget(s))}.` },
      // من أكمل طوارئه ولم يستثمر شيئًا لم يكن ينبّهه أحد: النقد لا يتراكم
      // لديه (ينفقه) فلا تُفعَّل قاعدة النقد الخامل، ويبقى بلا نمو للأبد.
      { id: "not_investing", sev: 2, icon: "🌱", term: "الفائدة المركبة",
        test: (s, d) => d.coverage >= 3 && d.totalInv < s.monthlyIncome && d.surplus > 0
                        && !(["land", "building"].includes(s.housing.stage) && s.housing.built < HOME_COST),
        text: (s, d) => `صندوق طوارئك يكفي ${d.coverage.toFixed(1)} شهرًا، لكن استثماراتك ${fmt(d.totalInv)} فقط. ما بعد الطوارئ يُستثمر لينمو، وإلا بقيت ثروتك واقفة.` },
      { id: "no_goal", sev: 1, icon: "🎯", term: null,
        test: (s) => s.goals.length === 0 && s.year >= 1,
        text: () => `لم تحدّد أي هدف ادخاري. الأهداف تجعل الادخار ملموسًا بدل أن يكون رقمًا مجردًا.` },
    ];

    function currentAdvice(limit = 3) {
      const d = derive(state);
      const hits = [];
      for (const r of ADVICE_RULES) {
        let ok = false;
        try { ok = r.test(state, d); } catch { ok = false; }
        if (ok) hits.push({ ...r, body: r.text(state, d) });
      }
      hits.sort((a, b) => b.sev - a.sev);
      return hits.slice(0, limit);
    }

    const SEV_COLOR = { 3: "#e74c3c", 2: "#e67e22", 1: "#c9974a" };
    const SEV_LABEL = { 3: "خطر", 2: "تنبيه", 1: "فرصة" };

    function adviceHtml() {
      const list = currentAdvice();
      if (!list.length) {
        return `<div class="card" style="margin:10px 0;padding:12px;border-color:#2ecc71">
          <h3 style="font-size:14px;color:#2ecc71;margin-bottom:4px">✅ المستشار المالي</h3>
          <p class="muted" style="font-size:12px">وضعك سليم حاليًا: طوارئ كافية، دين محدود، ومحفظة متوازنة.</p>
        </div>`;
      }
      return `<div class="card" style="margin:10px 0;padding:12px">
        <h3 style="font-size:14px;color:#c9974a;margin-bottom:8px">💡 المستشار المالي</h3>
        ${list.map((a) => `
          <div style="padding:8px 0;border-bottom:1px solid rgba(29,61,53,0.6)">
            <div style="display:flex;gap:6px;align-items:baseline;margin-bottom:3px">
              <span>${a.icon}</span>
              <b style="font-size:11px;color:${SEV_COLOR[a.sev]}">${SEV_LABEL[a.sev]}</b>
              ${a.term ? `<span style="font-size:11px">${term(a.term)}</span>` : ""}
            </div>
            <p style="font-size:12px;line-height:1.8;margin:0">${a.body}</p>
          </div>`).join("")}
      </div>`;
    }

    // ==================== إحصاءات الجولة ====================
    function statsRowsHtml() {
      const d = derive(state);
      const months = (state.year - 1) * 12 + state.month;
      const hist = state.history || [];
      const peak = hist.length ? Math.max(...hist.map((p) => p.netWorth)) : d.netWorth;
      const trough = hist.length ? Math.min(...hist.map((p) => p.netWorth)) : d.netWorth;
      const growth = hist.length > 1 ? d.netWorth - hist[0].netWorth : 0;
      const invested = Object.values(state.investments).reduce((a, i) => a + i.cost, 0);
      const gains = d.totalInv - invested;
      const eduName = ["لا شيء", "دورة مهنية", "دبلوم تخصصي", "شهادة احترافية"][state.education?.level ?? 0] || "—";
      const rows = [
        ["المدة", `${months} شهرًا (${(months / 12).toFixed(1)} سنة)`],
        ["الدخل الشهري", `${fmt(state.monthlyIncome)} (بدأت بـ1,000)`],
        ["الفائض الشهري", fmt(d.surplus)],
        ["أعلى ثروة بلغتها", fmt(peak)],
        ["أدنى ثروة مررت بها", fmt(trough)],
        ["نمو الثروة منذ البداية", (growth >= 0 ? "+" : "−") + fmt(Math.abs(growth))],
        ["رأس المال المستثمر", fmt(invested)],
        ["أرباح/خسائر الاستثمار", (gains >= 0 ? "+" : "−") + fmt(Math.abs(gains))],
        ["دخل إيجاري شهري", fmt(state.investments.realEstate.rentalIncome || 0)],
        ["مستواك التعليمي", eduName],
        ["التأمين الصحي", state.insurance?.health ? "مفعّل" : "غير مفعّل"],
        ["الحالة الاجتماعية", state.married ? `متزوج · ${state.children ?? 0} أبناء` : "أعزب"],
        ["أحداث مررت بها", String((state.eventLog || []).length)],
      ];
      return rows.map(([k, v], i) => `
        <div style="display:flex;justify-content:space-between;padding:4px 0${i < rows.length - 1 ? ";border-bottom:1px solid rgba(29,61,53,0.6)" : ""}">
          <span class="muted" style="font-size:12px">${k}</span><b style="font-size:12px">${v}</b>
        </div>`).join("");
    }

    // ==================== مكتب الإسكان داخل البلدية ====================
    function housingOfficeHtml() {
      const h = state.housing;
      if (h.stage === "renting") {
        return `<div class="card" style="margin:10px 0;padding:12px">
          <h3 style="font-size:14px;color:#c9974a;margin-bottom:6px">🏜️ مكتب الإسكان</h3>
          <p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:10px">
            بصفتك مواطنًا يحق لك التقدّم بطلب ${term("منحة الأرض")}. التخصيص يستغرق نحو ${LAND_WAIT_MONTHS} أشهر،
            وبعدها تستطيع ${term("البناء التدريجي")}. تدفع حاليًا <b>${fmt(state.rent)}</b> ريالًا إيجارًا شهريًا.
          </p>
          <button class="btn btn-sm" id="applyLandBtn">تقديم طلب منحة أرض</button>
        </div>`;
      }
      if (h.stage === "waiting") {
        return `<div class="card" style="margin:10px 0;padding:12px">
          <h3 style="font-size:14px;color:#c9974a;margin-bottom:6px">🏜️ مكتب الإسكان</h3>
          <p class="muted" style="font-size:12px">طلبك قيد المعالجة — متبقٍ <b style="color:#c9974a">${h.waitMonths}</b> أشهر على التخصيص.</p>
        </div>`;
      }
      const progress = Math.min(1, h.built / HOME_COST);
      return `<div class="card" style="margin:10px 0;padding:12px">
        <h3 style="font-size:14px;color:#c9974a;margin-bottom:6px">🏜️ مكتب الإسكان</h3>
        <p class="muted" style="font-size:12px">${h.stage === "owned" ? "منزلك مكتمل ومسجّل باسمك ✅" : `أرضك مخصّصة. المرحلة: <b>${buildPhase(progress).name}</b> (${Math.round(progress * 100)}%) — أكمل البناء من نافذة المنزل.`}</p>
      </div>`;
    }

    function openTownHall() {
      // نعرض الأحدث فقط: سجلّ طويل لا يُقرأ ويثقل الصفحة بلا فائدة
      const LOG_SHOWN = 60;
      const total = state.eventLog.length;
      const shown = state.eventLog.slice(-LOG_SHOWN).reverse();
      const logHtml = total
        ? (total > LOG_SHOWN ? `<p class="muted" style="font-size:11px;margin-bottom:6px">أحدث ${LOG_SHOWN} من أصل ${total}</p>` : "")
          + shown.map((e) => `<div style="padding:6px 0;border-bottom:1px solid #1d3d35">• ${esc(e)}</div>`).join("")
        : `<p class="muted">لا توجد أحداث بعد</p>`;
      pushModal(`
        <h2>📰 دار البلدية</h2>
        <h3 style="font-size:14px;color:#c9974a;margin:6px 0">صافي الثروة عبر الزمن</h3>
        <canvas id="chartCanvas" width="320" height="160" style="width:100%;border-radius:8px;background:#0a1e1a;margin-bottom:14px"></canvas>
        <div class="card" style="margin:10px 0;padding:12px">
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">الرتبة</span><b style="color:#c9974a">${rankInfo(state).name}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">هدف الاستقلال المالي</span><b>${fmt(fiTarget(state))}</b></div>
          ${state.monthlyExpenses > 600 ? `<div style="display:flex;justify-content:space-between;padding:3px 0">
            <span class="muted">${term("تضخّم نمط الحياة")}</span>
            <b style="color:#e67e22">الهدف بدأ 57,600 · +${Math.round((fiTarget(state) / 57600 - 1) * 100)}%</b>
          </div>` : ""}
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">${term("الثروة المُدِرّة للدخل")}</span><b style="color:#c9974a">${fmt(derive(state).investableNetWorth)}</b></div>
          <p class="muted" style="font-size:11px;margin-top:4px">لا يُحتسب بيت السكن هنا — فهو لا يموّل مصروفاتك، لكنه يدخل في صافي ثروتك. اعرف أكثر: ${term("الاستقلال المالي")}</p>
        </div>
        <div class="card" style="margin:10px 0;padding:12px">
          <h3 style="font-size:14px;color:#c9974a;margin-bottom:6px">🤲 ${term("الزكاة")}</h3>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">وعاء الزكاة الحالي</span><b>${fmt(zakatableWealth(state))}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">سنوات زكّيت فيها</span><b>${state.zakat?.paidCount ?? 0}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">مجموع ما أخرجت</span><b style="color:#2ecc71">${fmt(state.zakat?.totalPaid ?? 0)}</b></div>
          ${(state.zakat?.unpaid ?? 0) > 0 ? `<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">مؤجّلة في ذمتك</span><b style="color:#e74c3c">${fmt(state.zakat.unpaid)}</b></div>` : ""}
        </div>
        <div class="card" style="margin:10px 0;padding:12px">
          <h3 style="font-size:14px;color:#c9974a;margin-bottom:8px">🏅 الإنجازات (${(state.achievements || []).length}/${ACHIEVEMENTS.length})</h3>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${ACHIEVEMENTS.map((a) => {
              const got = (state.achievements || []).includes(a.id);
              return `<div title="${a.name}" style="width:calc(25% - 5px);text-align:center;padding:6px 2px;border-radius:8px;background:${got ? "rgba(201,151,74,0.15)" : "rgba(29,61,53,0.5)"};opacity:${got ? 1 : 0.4}">
                <div style="font-size:18px">${got ? a.icon : "🔒"}</div>
                <div style="font-size:9px;margin-top:2px;color:${got ? "#c9974a" : "#8aa89b"}">${a.name}</div>
              </div>`;
            }).join("")}
          </div>
        </div>
        ${housingOfficeHtml()}
        ${adviceHtml()}
        <div class="card" style="margin:10px 0;padding:12px">
          <h3 style="font-size:14px;color:#c9974a;margin-bottom:8px">📊 إحصاءات الجولة</h3>
          ${statsRowsHtml()}
        </div>
        <h3 style="font-size:14px;color:#c9974a;margin:6px 0">سجل الأحداث</h3>
        ${logHtml}
        <button class="btn btn-outline" style="margin-top:14px" id="resetBtn">إعادة بدء اللعبة</button>
        <button class="btn btn-outline" style="margin-top:10px" data-close-all>خروج</button>
      `, (root) => {
        const applyBtn = root.querySelector("#applyLandBtn");
        if (applyBtn) {
          applyBtn.addEventListener("click", once(() => {
            setState({ ...state, housing: { ...state.housing, stage: "waiting", waitMonths: LAND_WAIT_MONTHS },
              eventLog: [...state.eventLog, "📝 قدّمت طلب منحة أرض سكنية"] });
            popModal(); openTownHall();
          }));
        }
        root.querySelector("#resetBtn").addEventListener("click", () => {
          pushModal(`
            <h2>إعادة بدء اللعبة</h2>
            <p style="line-height:1.9">سيُمحى تقدّمك بالكامل ويعود كل شيء إلى البداية. هل أنت متأكد؟</p>
            <button class="btn" style="margin-top:14px" id="confirmReset">نعم، ابدأ من جديد</button>
            <button class="btn btn-outline" style="margin-top:10px" data-close>تراجع</button>
          `, (r2) => { r2.querySelector("#confirmReset").addEventListener("click", once(resetGame)); });
        });
        const canvas = root.querySelector("#chartCanvas");
        const ctx = canvas.getContext("2d");
        const data = state.history;
        if (data.length > 0) {
          const w = canvas.width, h = canvas.height;
          const maxVal = Math.max(...data.map((p) => p.netWorth), 10000);
          const minVal = Math.min(...data.map((p) => p.netWorth), 0);
          const range = maxVal - minVal || 1;
          const stepX = w / (data.length - 1 || 1);
          ctx.beginPath();
          ctx.strokeStyle = "#c9974a";
          ctx.lineWidth = 2;
          data.forEach((pt, i) => {
            const x = i * stepX;
            const y = h - ((pt.netWorth - minVal) / range) * (h - 20) - 10;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          });
          ctx.stroke();
          ctx.fillStyle = "#8aa89b";
          ctx.font = "10px sans-serif";
          ctx.fillText(fmt(minVal), 5, h - 5);
          ctx.fillText(fmt(maxVal), 5, 15);
        } else {
          // بلا هذه الرسالة يظهر مربع أسود فارغ للاعب الجديد بلا تفسير
          ctx.fillStyle = "#8aa89b";
          ctx.font = "12px 'Noto Kufi Arabic', sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("لا توجد بيانات بعد", canvas.width / 2, canvas.height / 2 - 8);
          ctx.font = "10px 'Noto Kufi Arabic', sans-serif";
          ctx.fillStyle = "rgba(138,168,155,0.7)";
          ctx.fillText("يُرسم المنحنى بعد أول شهر من اللعب", canvas.width / 2, canvas.height / 2 + 12);
        }
      });
    }

    // ==================== المعهد: الاستثمار في الذات ====================
    function openInstitute() {
      const edu = state.education || { level: 0, pending: null };
      const nc = nextCourse(state);
      let body;
      if (edu.pending) {
        const c = edu.pending;
        const done = c.months - c.monthsLeft;
        body = `<div class="card" style="padding:12px">
            <h3 style="font-size:14px;color:#c9974a;margin-bottom:6px">📚 ${c.name}</h3>
            <div style="display:flex;justify-content:space-between;font-size:12px"><span class="muted">التقدّم</span><b>${done} / ${c.months} أشهر</b></div>
            <div class="progress"><div class="progress-fill" style="width:${(done / c.months) * 100}%;background:#8e6bc9"></div></div>
            <p class="muted" style="font-size:11px;margin-top:8px">الزيادة (${Math.round(c.raise * 100)}%) تُصرف عند التخرّج.</p>
          </div>`;
      } else if (nc) {
        const affordable = state.cash >= nc.cost;
        body = `<div class="card" style="padding:12px">
            <h3 style="font-size:14px;color:#c9974a;margin-bottom:4px">${nc.name}</h3>
            <p class="muted" style="font-size:12px;line-height:1.8">${nc.desc} مدة الدراسة ${nc.months} أشهر، والتكلفة <b>${fmt(nc.cost)}</b> ريالًا تُدفع الآن.</p>
            <div class="inline-error" id="eduErr"></div>
            <button class="btn btn-sm" id="enrollBtn" ${affordable ? "" : "disabled"}>${affordable ? "التحق بالدورة" : "النقد لا يكفي"}</button>
          </div>`;
      } else {
        body = `<p class="muted" style="margin-bottom:10px">أتممت جميع المسارات التعليمية المتاحة 🎓</p>`;
      }
      pushModal(`
        <h2>🎓 المعهد</h2>
        <p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:10px">
          ${term("الاستثمار في الذات")} عائده يلازم دخلك مدى الحياة، لكنه يستهلك نقدًا وصبرًا الآن —
          وهذه ${term("تكلفة الفرصة البديلة")}.
        </p>
        <p class="muted" style="font-size:12px;margin-bottom:10px">مستواك: <b style="color:#c9974a">${["لا شيء","دورة مهنية","دبلوم تخصصي","شهادة احترافية"][edu.level] || "—"}</b> · دخلك ${fmt(state.monthlyIncome)}</p>
        ${body}
        <button class="btn btn-outline" style="margin-top:12px" data-close-all>خروج</button>
      `, (root) => {
        const btn = root.querySelector("#enrollBtn");
        if (btn) {
          btn.addEventListener("click", once(() => {
            if (state.cash < nc.cost) { root.querySelector("#eduErr").textContent = "النقد لا يكفي."; return; }
            SFX.build();
            setState({ ...state, cash: state.cash - nc.cost,
              education: { ...edu, pending: { ...nc, monthsLeft: nc.months } },
              eventLog: [...state.eventLog, `📚 التحقت بـ${nc.name}`] });
            popModal(); openInstitute();
          }));
        }
      });
    }

    function openLibrary() {
      const rows = Object.keys(DICTIONARY).map((t) => `<div class="term-row" data-term="${t}">${t}</div>`).join("");
      pushModal(`<h2>📖 المكتبة</h2>
        <button class="btn btn-outline" style="margin-bottom:12px" id="howToBtn">🏙️ كيف تلعب — شرح اللعبة</button>
        ${rows}
        <button class="btn btn-outline" style="margin-top:14px" data-close-all>خروج</button>`, (root) => {
        root.querySelector("#howToBtn").addEventListener("click", () => openHowToPlay());
        root.querySelectorAll(".term-row").forEach((el) => {
          el.addEventListener("click", () => {
            const t = el.dataset.term;
            pushModal(`<h2>${t}</h2><p style="line-height:2">${DICTIONARY[t]}</p><button class="btn" data-close>فهمت</button>`);
          });
        });
      });
    }

    // ==================== المدينة (الخريطة والمباني) ====================
    const TILE = 32, COLS = 16, ROWS = 20;
    const WORLD_W = COLS * TILE, WORLD_H = ROWS * TILE;

    function rect(tx, ty, tw, th) { return { x: tx * TILE, y: ty * TILE, w: tw * TILE, h: th * TILE }; }

    const BUILDINGS = [
      { id: "bank", name: "البنك", emoji: "🏦", color: "#c9974a", open: openBank, ...rect(1, 1, 4, 4) },
      { id: "market", name: "البورصة", emoji: "📈", color: "#2ecc71", open: openMarket, ...rect(11, 1, 4, 4) },
      { id: "goals", name: "لوحة الأهداف", emoji: "🎯", color: "#9b59b6", open: openGoals, ...rect(6, 4, 4, 3) },
      { id: "work", name: "العمل", emoji: "💼", color: "#4a90c9", open: openWork, ...rect(1, 8, 4, 4) },
      { id: "home", name: "المنزل", emoji: "🏠", color: "#d98c4a", open: openHome, ...rect(11, 8, 4, 4) },
      { id: "townhall", name: "دار البلدية", emoji: "📰", color: "#7f8c8d", open: openTownHall, ...rect(1, 15, 4, 4) },
      { id: "library", name: "المكتبة", emoji: "📖", color: "#16a085", open: openLibrary, ...rect(11, 15, 4, 4) },
      { id: "institute", name: "المعهد", emoji: "🎓", color: "#8e6bc9", open: openInstitute, ...rect(6, 15, 4, 3) },
    ];

    BUILDINGS.forEach((b) => { b.doorX = b.x + b.w / 2; b.doorY = b.y + b.h + 10; });

    const PLAZA_X = WORLD_W / 2, PLAZA_Y = 11 * TILE;
    const player = { x: 224, y: 352, w: 22, h: 26, speed: 170, facing: "down", animT: 0 };
    let currentBuilding = null;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function collides(px, py) {
      return BUILDINGS.some((b) => rectsOverlap(px, py, player.w, player.h, b.x, b.y, b.w, b.h));
    }

    const pressed = new Set();

    function updatePlayer(dt) {
      player.animT += dt;
      let dx = 0, dy = 0;
      if (pressed.has("up")) dy -= 1;
      if (pressed.has("down")) dy += 1;
      if (pressed.has("left")) dx -= 1;
      if (pressed.has("right")) dx += 1;
      if (dx !== 0 || dy !== 0) {
        if (dy < 0) player.facing = "up";
        else if (dy > 0) player.facing = "down";
        else if (dx < 0) player.facing = "left";
        else if (dx > 0) player.facing = "right";
      }
      if (dx !== 0 && dy !== 0) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
      const step = player.speed * dt;

      let nx = clamp(player.x + dx * step, 0, WORLD_W - player.w);
      if (!collides(nx, player.y)) player.x = nx;
      let ny = clamp(player.y + dy * step, 0, WORLD_H - player.h);
      if (!collides(player.x, ny)) player.y = ny;

      const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
      let nearest = null, nearestDist = 36;
      for (const b of BUILDINGS) {
        const d = Math.hypot(cx - b.doorX, cy - b.doorY);
        if (d < nearestDist) { nearest = b; nearestDist = d; }
      }
      currentBuilding = nearest;
      updateInteractBtn();
    }

    const interactBtn = document.getElementById("interactBtn");
    function updateInteractBtn() {
      if (currentBuilding) {
        interactBtn.textContent = `${currentBuilding.emoji} ادخل ${currentBuilding.name}`;
        interactBtn.classList.remove("hidden");
      } else {
        interactBtn.classList.add("hidden");
      }
    }
    interactBtn.addEventListener("click", () => { if (currentBuilding) currentBuilding.open(); });

    // ==================== الرسم ====================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
      r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
      return `rgb(${r},${g},${b})`;
    }

    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function nearAnyBuilding(x, y, margin) {
      return BUILDINGS.some((b) => x > b.x - margin && x < b.x + b.w + margin && y > b.y - margin && y < b.y + b.h + margin);
    }

    // ==================== زخارف ثابتة (مولّدة ببذرة ثابتة كي لا تتغير كل تحديث) ====================
    const rng = mulberry32(2024);
    const TREES = [];
    {
      let attempts = 0;
      while (TREES.length < 12 && attempts < 500) {
        attempts++;
        const tx = 14 + rng() * (WORLD_W - 28);
        const ty = 14 + rng() * (WORLD_H - 28);
        if (nearAnyBuilding(tx, ty, 24)) continue;
        if (Math.hypot(tx - PLAZA_X, ty - PLAZA_Y) < 44) continue;
        TREES.push({ x: tx, y: ty, r: 9 + rng() * 5 });
      }
    }
    const GROUND_DOTS = [];
    {
      let attempts = 0;
      while (GROUND_DOTS.length < 170 && attempts < 3000) {
        attempts++;
        const gx = rng() * WORLD_W, gy = rng() * WORLD_H;
        if (nearAnyBuilding(gx, gy, 6)) continue;
        GROUND_DOTS.push({ x: gx, y: gy, s: rng() < 0.5 ? 2 : 3, tone: rng() });
      }
    }

    // ==================== الفصول (تتبع الشهر داخل اللعبة) ====================
    const SEASONS = {
      winter: { name: "شتاء", leaf: "#4a7a68", leafHi: "#5f9180", ground: ["#12302c", "#0b2220"], dot: "rgba(120,160,170,0.30)", tint: "rgba(120,170,200,0.07)", blossom: null },
      spring: { name: "ربيع", leaf: "#2f8a52", leafHi: "#46a86a", ground: ["#12332a", "#0a201c"], dot: "rgba(80,150,110,0.35)", tint: "rgba(140,220,160,0.05)", blossom: "#f2a7c3" },
      summer: { name: "صيف", leaf: "#1f5c3f", leafHi: "#2f7a52", ground: ["#0f2b24", "#0a1e1a"], dot: "rgba(60,110,90,0.35)", tint: null, blossom: null },
      autumn: { name: "خريف", leaf: "#b5761f", leafHi: "#d29434", ground: ["#2b2418", "#1c1710"], dot: "rgba(170,130,60,0.30)", tint: "rgba(220,160,70,0.06)", blossom: null },
    };
    function seasonForMonth(m) {
      if (m === 12 || m === 1 || m === 2) return "winter";
      if (m <= 5) return "spring";
      if (m <= 8) return "summer";
      return "autumn";
    }
    let renderedSeason = null;
    // بصمة كل ما تعتمد عليه الخلفية المُجهَّزة مسبقًا. الاكتفاء بالفصل كان
    // يترك المنزل على حاله في الخريطة رغم تخصيص الأرض والبناء وحتى التملك،
    // فلا يرى اللاعب بيته يُبنى إلا صدفةً عند تبدّل الفصل.
    let renderedBgKey = null;
    function bgKey(s) {
      const h = s.housing || INITIAL_STATE.housing;
      const step = Math.floor(Math.min(1, (h.built || 0) / HOME_COST) * 20);
      return `${seasonForMonth(s.month)}|${h.stage}|${step}`;
    }

    // ==================== سكان المدينة (شخصيات غير قابلة للعب) ====================
    const NPC_PALETTES = [
      { shirt: "#4a90c9", sleeve: "#3d79a8", skin: "#e8b88a", hair: "#2a1c0d" },
      { shirt: "#9b59b6", sleeve: "#82489a", skin: "#d9a072", hair: "#4a3520" },
      { shirt: "#2ecc71", sleeve: "#26a75d", skin: "#f0c9a0", hair: "#1a1208" },
      { shirt: "#e74c3c", sleeve: "#c2402f", skin: "#c98c5e", hair: "#33220f" },
      { shirt: "#16a085", sleeve: "#128271", skin: "#e8b88a", hair: "#5a3d1f" },
    ];
    const NPCS = [];
    function randomWalkableSpot(rand) {
      for (let i = 0; i < 200; i++) {
        const x = 16 + rand() * (WORLD_W - 32);
        const y = 16 + rand() * (WORLD_H - 32);
        if (!nearAnyBuilding(x, y, 14)) return { x, y };
      }
      return { x: PLAZA_X, y: PLAZA_Y };
    }
    for (let i = 0; i < 5; i++) {
      const spot = randomWalkableSpot(rng);
      NPCS.push({
        x: spot.x, y: spot.y, target: randomWalkableSpot(rng),
        speed: 26 + rng() * 20, animT: rng() * 10, facing: "down", moving: true,
        pauseT: 0, palette: NPC_PALETTES[i % NPC_PALETTES.length],
      });
    }

    function updateNPCs(dt) {
      for (const n of NPCS) {
        n.animT += dt;
        if (n.pauseT > 0) { n.pauseT -= dt; n.moving = false; continue; }
        const dx = n.target.x - n.x, dy = n.target.y - n.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 4) {
          n.target = randomWalkableSpot(Math.random);
          n.pauseT = 0.6 + Math.random() * 2.2;
          n.moving = false;
          continue;
        }
        n.moving = true;
        const step = Math.min(dist, n.speed * dt);
        const nx = n.x + (dx / dist) * step, ny = n.y + (dy / dist) * step;
        if (nearAnyBuilding(nx, ny, 8)) {
          n.target = randomWalkableSpot(Math.random);
          continue;
        }
        n.x = nx; n.y = ny;
        if (Math.abs(dx) > Math.abs(dy)) n.facing = dx < 0 ? "left" : "right";
        else n.facing = dy < 0 ? "up" : "down";
      }
    }

    // ==================== سحب متحركة ====================
    const CLOUDS = [];
    for (let i = 0; i < 4; i++) {
      CLOUDS.push({ x: rng() * WORLD_W, y: 20 + rng() * (WORLD_H - 60), r: 22 + rng() * 20, speed: 5 + rng() * 7, alpha: 0.05 + rng() * 0.05 });
    }
    function updateClouds(dt) {
      for (const cl of CLOUDS) {
        cl.x += cl.speed * dt;
        if (cl.x - cl.r * 2 > WORLD_W) { cl.x = -cl.r * 2; cl.y = 20 + Math.random() * (WORLD_H - 60); }
      }
    }

    // ==================== أعمدة الإنارة ====================
    const LAMPS = [];
    for (const b of BUILDINGS) {
      const dx = b.doorX - PLAZA_X, dy = b.doorY - PLAZA_Y;
      const len = Math.hypot(dx, dy);
      const t = 0.55;
      const lx = PLAZA_X + dx * t - (dy / len) * 15;
      const ly = PLAZA_Y + dy * t + (dx / len) * 15;
      if (!nearAnyBuilding(lx, ly, 10)) LAMPS.push({ x: lx, y: ly });
    }

    // ==================== دورة الليل والنهار ====================
    const DAY_MS = 150000; // دورة كاملة كل دقيقتين ونصف تقريبًا
    function nightFactor(now) {
      const phase = (now % DAY_MS) / DAY_MS;      // 0..1
      const raw = (Math.cos(phase * Math.PI * 2) + 1) / 2; // 1 ليلاً، 0 نهارًا
      return raw * raw * 0.62;                    // نُبقي الليل مقروءًا
    }

    // ==================== طقس حسب الفصل ====================
    const WEATHER = [];
    function weatherKindFor(seasonKey) {
      if (seasonKey === "winter") return "snow";
      if (seasonKey === "autumn") return "leaf";
      if (seasonKey === "spring") return "petal";
      return null;
    }
    function updateWeather(dt, seasonKey) {
      const kind = weatherKindFor(seasonKey);
      if (!kind) { WEATHER.length = 0; return; }
      if (WEATHER.length && WEATHER[0].kind !== kind) WEATHER.length = 0;
      const cap = kind === "snow" ? 46 : 26;
      if (WEATHER.length < cap && Math.random() < 0.6) {
        WEATHER.push({
          kind, x: Math.random() * WORLD_W, y: -6,
          vy: kind === "snow" ? 14 + Math.random() * 16 : 22 + Math.random() * 22,
          sway: Math.random() * Math.PI * 2,
          swaySpeed: 0.8 + Math.random() * 1.4,
          size: kind === "snow" ? 1.4 + Math.random() * 1.6 : 2.2 + Math.random() * 2,
          spin: Math.random() * Math.PI,
        });
      }
      for (let i = WEATHER.length - 1; i >= 0; i--) {
        const p = WEATHER[i];
        p.sway += p.swaySpeed * dt;
        p.y += p.vy * dt;
        p.x += Math.sin(p.sway) * 10 * dt;
        p.spin += dt * 1.6;
        if (p.y > WORLD_H + 6) WEATHER.splice(i, 1);
      }
    }
    const LEAF_COLORS = ["#c9772a", "#b5761f", "#d29434", "#a35a1c"];
    function drawWeather(c) {
      for (const p of WEATHER) {
        if (p.kind === "snow") {
          c.fillStyle = "rgba(226,240,245,0.75)";
          c.beginPath(); c.arc(p.x, p.y, p.size, 0, Math.PI * 2); c.fill();
        } else if (p.kind === "leaf") {
          c.save(); c.translate(p.x, p.y); c.rotate(p.spin);
          c.fillStyle = LEAF_COLORS[Math.floor(p.size) % LEAF_COLORS.length];
          c.beginPath(); c.ellipse(0, 0, p.size * 1.5, p.size * 0.7, 0, 0, Math.PI * 2); c.fill();
          c.restore();
        } else {
          c.save(); c.translate(p.x, p.y); c.rotate(p.spin);
          c.fillStyle = "rgba(242,167,195,0.85)";
          c.beginPath(); c.ellipse(0, 0, p.size * 1.2, p.size * 0.6, 0, 0, Math.PI * 2); c.fill();
          c.restore();
        }
      }
    }

    // ==================== غبار الخطوات ====================
    const DUST = [];
    function updateDust(dt, moving) {
      if (moving && Math.random() < 0.35) {
        DUST.push({ x: player.x + player.w / 2 + (Math.random() - 0.5) * 6, y: player.y + player.h - 2, life: 0, max: 0.45, r: 1.5 + Math.random() * 1.5 });
      }
      for (let i = DUST.length - 1; i >= 0; i--) {
        const d = DUST[i];
        d.life += dt; d.r += dt * 3;
        if (d.life > d.max) DUST.splice(i, 1);
      }
    }

    // ==================== الأرقام الطائرة ====================
    function updateFloaters(dt) {
      for (let i = FLOATERS.length - 1; i >= 0; i--) {
        const f = FLOATERS[i];
        f.life += dt;
        if (f.life > f.max) FLOATERS.splice(i, 1);
      }
    }

    // ==================== رذاذ النافورة ====================
    const DROPS = [];
    function updateFountain(dt) {
      if (DROPS.length < 26 && Math.random() < 0.5) {
        const a = Math.random() * Math.PI * 2;
        DROPS.push({ x: PLAZA_X, y: PLAZA_Y, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12 - 22, life: 0, max: 0.9 + Math.random() * 0.4 });
      }
      for (let i = DROPS.length - 1; i >= 0; i--) {
        const d = DROPS[i];
        d.life += dt;
        d.vy += 46 * dt;
        d.x += d.vx * dt; d.y += d.vy * dt;
        if (d.life > d.max) DROPS.splice(i, 1);
      }
    }

    // ==================== رسم المباني (تفصيلية حسب النوع) ====================
    function drawBank(c, b) {
      const { x, y, w, h, color } = b;
      const roofH = 16;
      c.fillStyle = shade(color, -40);
      c.beginPath(); c.moveTo(x - 6, y + roofH); c.lineTo(x + w / 2, y - 10); c.lineTo(x + w + 6, y + roofH); c.closePath(); c.fill();
      c.fillStyle = shade(color, -15);
      c.fillRect(x, y + roofH, w, h - roofH);
      c.fillStyle = shade(color, 25);
      const cols = 4, colW = 6, gap = (w - cols * colW) / (cols + 1);
      for (let i = 0; i < cols; i++) c.fillRect(x + gap + i * (colW + gap), y + roofH + 6, colW, h - roofH - 16);
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
      c.fillStyle = shade(color, 45);
      c.beginPath(); c.arc(x + w / 2, y + roofH - 4, 4, 0, Math.PI * 2); c.fill();
    }

    function drawMarket(c, b) {
      const { x, y, w, h, color } = b;
      c.fillStyle = shade(color, -20);
      c.fillRect(x, y, w, h);
      c.fillStyle = shade(color, 15);
      c.fillRect(x, y - 8, w, 8);
      c.fillStyle = "#0a1e1a";
      c.fillRect(x + 8, y + 10, w - 16, 26);
      c.strokeStyle = shade(color, 30); c.lineWidth = 2;
      c.strokeRect(x + 8, y + 10, w - 16, 26);
      c.fillStyle = shade(color, 10);
      for (let r = 0; r < 2; r++) for (let col = 0; col < 3; col++) c.fillRect(x + 10 + col * ((w - 20) / 3), y + 46 + r * 16, 12, 10);
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
      c.strokeStyle = shade(color, 20); c.lineWidth = 2;
      c.beginPath(); c.moveTo(x + w - 12, y - 8); c.lineTo(x + w - 12, y - 18); c.stroke();
    }

    function drawGoals(c, b) {
      const { x, y, w, h, color } = b;
      c.strokeStyle = shade(color, -20); c.lineWidth = 5;
      c.beginPath(); c.moveTo(x + w / 2, y + h); c.lineTo(x + w / 2, y + 10); c.stroke();
      c.fillStyle = shade(color, -15);
      roundRect(c, x, y, w, h * 0.65, 6); c.fill();
      c.strokeStyle = shade(color, 30); c.lineWidth = 2;
      roundRect(c, x, y, w, h * 0.65, 6); c.stroke();
      c.strokeStyle = shade(color, 45); c.lineWidth = 2;
      c.beginPath(); c.arc(x + w / 2, y + h * 0.32, 10, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.arc(x + w / 2, y + h * 0.32, 5, 0, Math.PI * 2); c.stroke();
      c.fillStyle = shade(color, 45);
      c.beginPath(); c.arc(x + w / 2, y + h * 0.32, 1.6, 0, Math.PI * 2); c.fill();
    }

    function drawWork(c, b) {
      const { x, y, w, h, color } = b;
      c.fillStyle = shade(color, -20);
      c.fillRect(x, y, w, h);
      c.fillStyle = shade(color, 10);
      c.fillRect(x, y, w, 6);
      const rows = 3, cols = 3;
      for (let r = 0; r < rows; r++) for (let col = 0; col < cols; col++) {
        const lit = (r * cols + col) % 3 !== 1;
        c.fillStyle = lit ? "#f4d58d" : "#0a1e1a";
        c.fillRect(x + 10 + col * ((w - 20) / cols), y + 12 + r * ((h - 40) / rows), (w - 20) / cols - 6, (h - 40) / rows - 6);
      }
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
    }

    function drawHome(c, b) {
      const hs = state.housing || INITIAL_STATE.housing;
      // ما دمت مستأجرًا نرسم بيت الإيجار؛ وبعد منحة الأرض نرسم الأرض ثم البناء وهو يرتفع
      if (hs.stage === "land" || hs.stage === "building") return drawHomeUnderConstruction(c, b, Math.min(1, hs.built / HOME_COST));
      const { x, y, w, h, color } = b;
      const roofH = 20;
      c.fillStyle = shade(color, -35);
      c.beginPath(); c.moveTo(x - 8, y + roofH); c.lineTo(x + w / 2, y - 14); c.lineTo(x + w + 8, y + roofH); c.closePath(); c.fill();
      c.fillStyle = shade(color, -10);
      c.fillRect(x, y + roofH, w, h - roofH);
      c.fillStyle = shade(color, -40);
      c.fillRect(x + w - 22, y - 6, 10, 18);
      c.fillStyle = "#f4d58d";
      c.fillRect(x + 10, y + roofH + 10, 16, 16);
      c.fillRect(x + w - 26, y + roofH + 10, 16, 16);
      c.strokeStyle = shade(color, -30); c.lineWidth = 1.5;
      c.strokeRect(x + 10, y + roofH + 10, 16, 16);
      c.strokeRect(x + w - 26, y + roofH + 10, 16, 16);
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
      // بعد التملك: سور ونخلة وعلامة ملكية
      if (hs.stage === "owned") {
        c.strokeStyle = "#c9974a"; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(x - 6, y + h + 2); c.lineTo(x + w + 6, y + h + 2); c.stroke();
        for (let i = 0; i <= 6; i++) {
          const px = x - 6 + i * ((w + 12) / 6);
          c.beginPath(); c.moveTo(px, y + h + 2); c.lineTo(px, y + h - 4); c.stroke();
        }
        c.fillStyle = "#3a2a1a";
        c.fillRect(x - 16, y + h - 18, 3, 18);
        c.fillStyle = "#2f7a52";
        for (let i = 0; i < 5; i++) {
          const a = Math.PI + (i / 4) * Math.PI;
          c.beginPath();
          c.ellipse(x - 14.5 + Math.cos(a) * 7, y + h - 20 + Math.sin(a) * 4, 7, 2.6, a, 0, Math.PI * 2);
          c.fill();
        }
        c.fillStyle = "#2ecc71";
        c.beginPath(); c.arc(x + w - 6, y + roofH - 6, 4, 0, Math.PI * 2); c.fill();
      }
    }

    // الأرض ثم المبنى وهو يرتفع مرحلة بعد مرحلة
    function drawHomeUnderConstruction(c, b, progress) {
      const { x, y, w, h } = b;
      // أرض المنحة: تراب وحدود قطعة الأرض
      c.fillStyle = "#3a3226";
      c.fillRect(x, y + h * 0.35, w, h * 0.65);
      c.strokeStyle = "rgba(201,151,74,0.7)"; c.lineWidth = 2;
      c.setLineDash([5, 4]);
      c.strokeRect(x + 1, y + h * 0.35, w - 2, h * 0.65 - 1);
      c.setLineDash([]);

      if (progress > 0) {
        // الجدران ترتفع مع التقدّم
        const maxH = h * 0.62;
        const wallH = Math.max(4, maxH * Math.min(1, progress / 0.9));
        const wy = y + h - wallH;
        c.fillStyle = progress >= 0.9 ? "#d98c4a" : "#8a7a63";
        c.fillRect(x + 6, wy, w - 12, wallH);
        // أعمدة خرسانية
        c.fillStyle = "#6e6252";
        for (let i = 0; i < 3; i++) c.fillRect(x + 8 + i * ((w - 20) / 2), wy, 4, wallH);
        // السقف يظهر بعد 70%
        if (progress >= 0.7) {
          c.fillStyle = "#a86a33";
          c.beginPath(); c.moveTo(x + 2, wy); c.lineTo(x + w / 2, wy - 14); c.lineTo(x + w - 2, wy); c.closePath(); c.fill();
        }
        // النوافذ والباب في التشطيب
        if (progress >= 0.9) {
          c.fillStyle = "#f4d58d";
          c.fillRect(x + 12, wy + 8, 12, 12);
          c.fillRect(x + w - 24, wy + 8, 12, 12);
          c.fillStyle = "#2a1c0d";
          c.fillRect(x + w / 2 - 8, y + h - 16, 16, 16);
        }
      }
      // سقالة ورافعة ما دام البناء جاريًا
      if (progress < 1) {
        c.strokeStyle = "#c9974a"; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(x + w - 6, y + h); c.lineTo(x + w - 6, y + 4); c.lineTo(x + w - 22, y + 4); c.stroke();
        c.beginPath(); c.moveTo(x + w - 22, y + 4); c.lineTo(x + w - 22, y + 12); c.stroke();
        c.fillStyle = "#c9974a"; c.fillRect(x + w - 26, y + 12, 8, 5);
      }
    }

    function drawTownHall(c, b) {
      const { x, y, w, h, color } = b;
      const roofH = 14;
      c.fillStyle = shade(color, -30);
      c.beginPath(); c.moveTo(x - 4, y + roofH); c.lineTo(x + w / 2, y - 8); c.lineTo(x + w + 4, y + roofH); c.closePath(); c.fill();
      c.fillStyle = shade(color, -10);
      c.fillRect(x, y + roofH, w, h - roofH);
      c.fillStyle = shade(color, -20);
      c.beginPath(); c.arc(x + w / 2, y - 8, 9, Math.PI, 0); c.fill();
      c.strokeStyle = shade(color, 15); c.lineWidth = 2;
      c.beginPath(); c.moveTo(x + w / 2, y - 17); c.lineTo(x + w / 2, y - 30); c.stroke();
      c.fillStyle = "#c9974a";
      c.fillRect(x + w / 2, y - 30, 10, 7);
      c.fillStyle = "#2a1c0d";
      c.beginPath(); c.arc(x + w / 2, y + h - 18, 9, Math.PI, 0); c.fill();
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
    }

    function drawLibrary(c, b) {
      const { x, y, w, h, color } = b;
      c.fillStyle = shade(color, -20);
      c.fillRect(x, y, w, h);
      c.fillStyle = shade(color, 15);
      c.fillRect(x, y, w, 8);
      const spineColors = ["#e74c3c", "#3498db", "#f1c40f", "#9b59b6", "#2ecc71", "#e67e22"];
      for (let r = 0; r < 2; r++) for (let i = 0; i < 8; i++) {
        c.fillStyle = spineColors[(i + r * 3) % spineColors.length];
        c.fillRect(x + 8 + i * ((w - 16) / 8), y + 14 + r * 18, (w - 16) / 8 - 2, 14);
      }
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
    }

    function drawInstitute(c, b) {
      const { x, y, w, h, color } = b;
      c.fillStyle = shade(color, -20);
      c.fillRect(x, y + 10, w, h - 10);
      // سقف مسطّح وشرفة
      c.fillStyle = shade(color, 10);
      c.fillRect(x - 3, y + 4, w + 6, 8);
      // نوافذ صف واحد
      c.fillStyle = "#f4d58d";
      for (let i = 0; i < 4; i++) c.fillRect(x + 8 + i * ((w - 16) / 4), y + 20, (w - 16) / 4 - 5, 12);
      // قبعة التخرّج فوق المدخل
      c.fillStyle = "#1d1430";
      c.beginPath();
      c.moveTo(x + w / 2, y + h - 30); c.lineTo(x + w / 2 + 13, y + h - 24);
      c.lineTo(x + w / 2, y + h - 18); c.lineTo(x + w / 2 - 13, y + h - 24);
      c.closePath(); c.fill();
      c.strokeStyle = "#c9974a"; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(x + w / 2 + 11, y + h - 25); c.lineTo(x + w / 2 + 11, y + h - 17); c.stroke();
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 8, y + h - 16, 16, 16);
    }

    const BUILDING_DRAW = { bank: drawBank, market: drawMarket, goals: drawGoals, work: drawWork, home: drawHome, townhall: drawTownHall, library: drawLibrary, institute: drawInstitute };

    // ==================== الخلفية المُجهَّزة مسبقًا (لتفادي إعادة رسم التفاصيل الثابتة كل إطار) ====================
    const bgCanvas = document.createElement("canvas");
    bgCanvas.width = WORLD_W; bgCanvas.height = WORLD_H;
    const bgCtx = bgCanvas.getContext("2d");

    function renderBackground() {
      const season = SEASONS[seasonForMonth(state.month)];
      const c = bgCtx;
      c.clearRect(0, 0, WORLD_W, WORLD_H);
      const grad = c.createLinearGradient(0, 0, 0, WORLD_H);
      grad.addColorStop(0, season.ground[0]); grad.addColorStop(1, season.ground[1]);
      c.fillStyle = grad; c.fillRect(0, 0, WORLD_W, WORLD_H);

      for (const d of GROUND_DOTS) {
        c.fillStyle = d.tone < 0.5 ? "rgba(29,61,53,0.6)" : season.dot;
        c.fillRect(d.x, d.y, d.s, d.s);
      }

      // ممرات مرصوفة من الساحة إلى كل باب
      c.lineCap = "round";
      c.strokeStyle = "rgba(160,190,175,0.18)"; c.lineWidth = 16;
      for (const b of BUILDINGS) {
        c.beginPath(); c.moveTo(PLAZA_X, PLAZA_Y); c.lineTo(b.doorX, b.doorY); c.stroke();
      }
      c.strokeStyle = "rgba(200,225,210,0.10)"; c.lineWidth = 12;
      for (const b of BUILDINGS) {
        c.beginPath(); c.moveTo(PLAZA_X, PLAZA_Y); c.lineTo(b.doorX, b.doorY); c.stroke();
      }
      // خطوط بلاط عرضية على الممرات
      c.strokeStyle = "rgba(10,30,26,0.25)"; c.lineWidth = 1.5; c.lineCap = "butt";
      for (const b of BUILDINGS) {
        const dx = b.doorX - PLAZA_X, dy = b.doorY - PLAZA_Y;
        const len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
        for (let d = 14; d < len - 8; d += 13) {
          const px = PLAZA_X + ux * d, py = PLAZA_Y + uy * d;
          c.beginPath(); c.moveTo(px - uy * 6, py + ux * 6); c.lineTo(px + uy * 6, py - ux * 6); c.stroke();
        }
      }

      // حوض النافورة في الساحة
      c.beginPath(); c.arc(PLAZA_X, PLAZA_Y, 27, 0, Math.PI * 2);
      c.fillStyle = "rgba(160,190,175,0.18)"; c.fill();
      c.strokeStyle = "rgba(201,151,74,0.55)"; c.lineWidth = 3; c.stroke();
      c.beginPath(); c.arc(PLAZA_X, PLAZA_Y, 15, 0, Math.PI * 2);
      c.fillStyle = "rgba(74,144,201,0.40)"; c.fill();
      c.strokeStyle = "rgba(140,200,230,0.35)"; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = "rgba(201,151,74,0.75)";
      c.fillRect(PLAZA_X - 2.5, PLAZA_Y - 12, 5, 12);
      c.beginPath(); c.arc(PLAZA_X, PLAZA_Y - 13, 4, 0, Math.PI * 2); c.fill();

      for (const b of BUILDINGS) {
        c.beginPath(); c.ellipse(b.x + b.w / 2, b.y + b.h + 4, b.w * 0.45, 6, 0, 0, Math.PI * 2);
        c.fillStyle = "rgba(0,0,0,0.3)"; c.fill();
        (BUILDING_DRAW[b.id] || (() => {}))(c, b);
        c.font = "11px 'Noto Kufi Arabic', sans-serif";
        c.textAlign = "center"; c.textBaseline = "middle";
        c.fillStyle = "#e0e8e4";
        c.fillText(b.name, b.x + b.w / 2, b.y + b.h + 16);
      }

      renderedSeason = seasonForMonth(state.month);
      renderedBgKey = bgKey(state);
    }
    renderBackground();

    function drawTree(c, t, season) {
      c.beginPath(); c.ellipse(t.x, t.y + 2, t.r * 0.5, t.r * 0.25, 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(0,0,0,0.25)"; c.fill();
      c.fillStyle = "#3a2a1a";
      c.fillRect(t.x - 2, t.y - t.r * 0.3, 4, t.r * 0.6);
      c.beginPath(); c.arc(t.x, t.y - t.r * 0.5, t.r, 0, Math.PI * 2);
      c.fillStyle = season.leaf; c.fill();
      c.beginPath(); c.arc(t.x - t.r * 0.3, t.y - t.r * 0.7, t.r * 0.6, 0, Math.PI * 2);
      c.fillStyle = season.leafHi; c.fill();
      if (season.blossom) {
        c.fillStyle = season.blossom;
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * Math.PI * 2 + t.r;
          c.beginPath(); c.arc(t.x + Math.cos(a) * t.r * 0.55, t.y - t.r * 0.5 + Math.sin(a) * t.r * 0.55, 1.6, 0, Math.PI * 2); c.fill();
        }
      }
    }

    // ==================== الشخصيات ====================
    const PLAYER_PALETTE = { shirt: "#c9974a", sleeve: "#b98a44", skin: "#e8b88a", hair: "#3a2a1a" };

    function drawCharacter(c, cx, cy, facing, animT, moving, palette) {
      const walk = moving ? Math.sin(animT * 12) : 0;
      const legOffset = walk * 4, armOffset = -walk * 3;
      const bob = moving ? Math.abs(Math.sin(animT * 12)) * 1.2 : 0;
      c.save();
      c.translate(cx, cy - bob);
      c.beginPath(); c.ellipse(0, 13 + bob, 9, 3, 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(0,0,0,0.35)"; c.fill();
      if (facing === "left") c.scale(-1, 1);
      c.fillStyle = "#2a1c0d";
      c.fillRect(-6, 4 + legOffset, 5, 10);
      c.fillRect(1, 4 - legOffset, 5, 10);
      c.fillStyle = palette.shirt;
      roundRect(c, -8, -6, 16, 14, 4); c.fill();
      c.fillStyle = palette.sleeve;
      c.fillRect(-10, -4 + armOffset, 4, 9);
      c.fillRect(6, -4 - armOffset, 4, 9);
      c.beginPath(); c.arc(0, -12, 7, 0, Math.PI * 2);
      c.fillStyle = palette.skin; c.fill();
      c.beginPath(); c.arc(0, -15, 7.2, Math.PI, Math.PI * 2);
      c.fillStyle = palette.hair; c.fill();
      if (facing !== "up") {
        c.fillStyle = "#2a1c0d";
        c.beginPath(); c.arc(-2.5, -12, 1, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(2.5, -12, 1, 0, Math.PI * 2); c.fill();
      }
      c.restore();
    }

    // ==================== مؤشرات حيّة فوق المباني تعكس وضعك المالي ====================
    function drawBuildingIndicators(now) {
      const d = derive(state);

      const bankB = BUILDINGS.find((b) => b.id === "bank");
      if (bankB) {
        const pct = Math.max(0, Math.min(1, state.emergency / d.emergencyTarget));
        const bw = bankB.w - 20, bx = bankB.x + 10, by = bankB.y + bankB.h - 26;
        ctx.fillStyle = "rgba(10,30,26,0.75)"; ctx.fillRect(bx, by, bw, 5);
        ctx.fillStyle = pct >= 1 ? "#2ecc71" : "#c9974a"; ctx.fillRect(bx, by, bw * pct, 5);
        if (pct >= 1) {
          const g = (Math.sin(now / 300) + 1) / 2;
          ctx.strokeStyle = `rgba(46,204,113,${0.3 + g * 0.4})`; ctx.lineWidth = 1.5;
          ctx.strokeRect(bx - 1.5, by - 1.5, bw + 3, 8);
        }
      }

      const marketB = BUILDINGS.find((b) => b.id === "market");
      if (marketB) {
        for (let i = 0; i < 3; i++) {
          const on = Math.sin(now / 400 + i) > 0;
          ctx.fillStyle = on ? "#2ecc71" : "#123b2a";
          ctx.fillRect(marketB.x + 12 + i * 10, marketB.y + 16, 6, 6);
        }
        const up = lastStockDelta >= 0;
        const ax = marketB.x + marketB.w - 20, ay = marketB.y + 23;
        ctx.fillStyle = up ? "#2ecc71" : "#e74c3c";
        ctx.beginPath();
        if (up) { ctx.moveTo(ax, ay - 6); ctx.lineTo(ax + 6, ay + 4); ctx.lineTo(ax - 6, ay + 4); }
        else { ctx.moveTo(ax, ay + 6); ctx.lineTo(ax + 6, ay - 4); ctx.lineTo(ax - 6, ay - 4); }
        ctx.closePath(); ctx.fill();
      }

      const homeB = BUILDINGS.find((b) => b.id === "home");
      if (homeB) {
        const t = (now / 1000) % 2;
        ctx.globalAlpha = Math.max(0, 1 - t / 2) * 0.4;
        ctx.beginPath(); ctx.arc(homeB.x + homeB.w - 17, homeB.y - 10 - t * 14, 3 + t * 3, 0, Math.PI * 2);
        ctx.fillStyle = "#cfd8d3"; ctx.fill();
        ctx.globalAlpha = 1;
        if (state.debt > 0) {
          ctx.fillStyle = "rgba(231,76,60,0.85)";
          roundRect(ctx, homeB.x + 4, homeB.y + 24, 20, 11, 3); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.font = "9px sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("دين", homeB.x + 14, homeB.y + 30);
        }
      }

      const goalsB = BUILDINGS.find((b) => b.id === "goals");
      if (goalsB && state.goals.length) {
        const best = Math.max(...state.goals.map((g) => Math.min(1, g.saved / g.target)));
        const gx = goalsB.x + goalsB.w / 2, gy = goalsB.y + goalsB.h * 0.32;
        ctx.beginPath(); ctx.arc(gx, gy, 10, -Math.PI / 2, -Math.PI / 2 + best * Math.PI * 2);
        ctx.strokeStyle = "#2ecc71"; ctx.lineWidth = 3; ctx.stroke();
      }

      const workB = BUILDINGS.find((b) => b.id === "work");
      if (workB && d.surplus > 0) {
        const g = (Math.sin(now / 320) + 1) / 2;
        ctx.fillStyle = `rgba(201,151,74,${0.55 + g * 0.45})`;
        ctx.font = "13px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("💰", workB.x + workB.w / 2, workB.y - 12 - g * 3);
      }
    }

    function draw() {
      const now = performance.now();
      const seasonKey = seasonForMonth(state.month);
      if (bgKey(state) !== renderedBgKey) renderBackground();
      const season = SEASONS[seasonKey];
      const night = nightFactor(now);

      ctx.clearRect(0, 0, WORLD_W, WORLD_H);
      ctx.save();
      if (shake > 0.05) {
        ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
      }
      ctx.drawImage(bgCanvas, 0, 0);

      // رذاذ النافورة
      for (const dr of DROPS) {
        const a = Math.max(0, 1 - dr.life / dr.max);
        ctx.fillStyle = `rgba(150,210,240,${a * 0.8})`;
        ctx.fillRect(dr.x, dr.y, 2, 2);
      }

      // غبار خطوات اللاعب
      for (const d of DUST) {
        ctx.globalAlpha = Math.max(0, 1 - d.life / d.max) * 0.35;
        ctx.fillStyle = "#cfd8d3";
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      drawBuildingIndicators(now);

      // ترتيب حسب العمق: الأشجار والشخصيات تُرسم بترتيب موضعها الرأسي
      const entities = [];
      for (const t of TREES) entities.push({ footY: t.y, kind: "tree", ref: t });
      for (const n of NPCS) entities.push({ footY: n.y + 14, kind: "npc", ref: n });
      entities.push({ footY: player.y + player.h, kind: "player" });
      entities.sort((a, b) => a.footY - b.footY);
      for (const e of entities) {
        if (e.kind === "tree") drawTree(ctx, e.ref, season);
        else if (e.kind === "npc") drawCharacter(ctx, e.ref.x, e.ref.y, e.ref.facing, e.ref.animT, e.ref.moving, e.ref.palette);
        else drawCharacter(ctx, player.x + player.w / 2, player.y + player.h / 2, player.facing, player.animT, pressed.size > 0, PLAYER_PALETTE);
      }

      // أعمدة الإنارة (العمود نفسه فوق المشهد، وهالته تُضاف بعد ستارة الليل)
      for (const l of LAMPS) {
        ctx.fillStyle = "#3b4a44";
        ctx.fillRect(l.x - 1.5, l.y - 16, 3, 16);
        ctx.fillStyle = night > 0.12 ? "#f4d58d" : "#6b7a72";
        ctx.beginPath(); ctx.arc(l.x, l.y - 18, 3.4, 0, Math.PI * 2); ctx.fill();
      }

      // سحب تمر فوق المدينة
      for (const cl of CLOUDS) {
        ctx.fillStyle = `rgba(220,235,230,${cl.alpha})`;
        ctx.beginPath(); ctx.arc(cl.x, cl.y, cl.r, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cl.x + cl.r * 0.8, cl.y + 4, cl.r * 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cl.x - cl.r * 0.7, cl.y + 5, cl.r * 0.6, 0, Math.PI * 2); ctx.fill();
      }

      drawWeather(ctx);

      // صبغة الفصل فوق المشهد كله
      if (season.tint) {
        ctx.fillStyle = season.tint;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      }

      // ستارة الليل ثم مصادر الضوء الدافئة فوقها
      if (night > 0.02) {
        ctx.fillStyle = `rgba(12,24,48,${night})`;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const l of LAMPS) {
          const g = ctx.createRadialGradient(l.x, l.y - 16, 2, l.x, l.y - 16, 46);
          g.addColorStop(0, `rgba(255,214,140,${0.42 * night})`);
          g.addColorStop(1, "rgba(255,214,140,0)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(l.x, l.y - 16, 46, 0, Math.PI * 2); ctx.fill();
        }
        for (const b of BUILDINGS) {
          if (b.id === "goals") continue;
          const g = ctx.createRadialGradient(b.doorX, b.doorY - 8, 2, b.doorX, b.doorY - 8, 34);
          g.addColorStop(0, `rgba(255,206,128,${0.34 * night})`);
          g.addColorStop(1, "rgba(255,206,128,0)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(b.doorX, b.doorY - 8, 34, 0, Math.PI * 2); ctx.fill();
        }
        const fg = ctx.createRadialGradient(PLAZA_X, PLAZA_Y, 2, PLAZA_X, PLAZA_Y, 40);
        fg.addColorStop(0, `rgba(150,200,255,${0.22 * night})`);
        fg.addColorStop(1, "rgba(150,200,255,0)");
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(PLAZA_X, PLAZA_Y, 40, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      if (currentBuilding) {
        const glowT = (Math.sin(now / 220) + 1) / 2;
        ctx.beginPath();
        ctx.arc(currentBuilding.doorX, currentBuilding.doorY, 6 + glowT * 3, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(201,151,74,${0.4 + glowT * 0.4})`;
        ctx.lineWidth = 2; ctx.stroke();
      }

      // شارات الإنجاز تنزلق من أعلى المشهد
      for (let i = BADGES.length - 1; i >= 0; i--) {
        const bd = BADGES[i];
        const p = bd.life / bd.max;
        const slide = p < 0.15 ? p / 0.15 : (p > 0.85 ? (1 - p) / 0.15 : 1);
        const by = 14 + i * 34;
        ctx.globalAlpha = Math.max(0, Math.min(1, slide));
        ctx.fillStyle = "rgba(18,46,39,0.95)";
        roundRect(ctx, WORLD_W / 2 - 92, by, 184, 28, 8); ctx.fill();
        ctx.strokeStyle = "#c9974a"; ctx.lineWidth = 1.5;
        roundRect(ctx, WORLD_W / 2 - 92, by, 184, 28, 8); ctx.stroke();
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = "14px sans-serif";
        ctx.fillText(bd.icon, WORLD_W / 2 - 70, by + 14);
        ctx.font = "11px 'Noto Kufi Arabic', sans-serif";
        ctx.fillStyle = "#e0e8e4";
        ctx.fillText(bd.name, WORLD_W / 2 + 8, by + 14);
        ctx.globalAlpha = 1;
      }

      // أرقام تطفو فوق اللاعب عند تغيّر صافي الثروة
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let i = 0; i < FLOATERS.length; i++) {
        const f = FLOATERS[i];
        const p = f.life / f.max;
        const fx = player.x + player.w / 2 + f.dx;
        const fy = player.y - 8 - p * 26 - i * 13;
        ctx.globalAlpha = Math.max(0, 1 - p);
        ctx.font = "bold 13px 'IBM Plex Mono', monospace";
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(10,30,26,0.85)";
        ctx.strokeText(f.text, fx, fy);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, fx, fy);
        ctx.globalAlpha = 1;
      }

      ctx.restore();

      // وميض أحمر خافت أثناء الاهتزاز (خسارة كبيرة)
      if (shake > 0.05) {
        ctx.fillStyle = `rgba(231,76,60,${Math.min(0.16, shake * 0.022)})`;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      }

      // شارة الفصل والوقت
      ctx.font = "10px 'Noto Kufi Arabic', sans-serif";
      ctx.textAlign = "right"; ctx.textBaseline = "top";
      ctx.fillStyle = "rgba(224,232,228,0.55)";
      ctx.fillText(`${season.name} · ${night > 0.3 ? "ليل" : "نهار"}`, WORLD_W - 8, 8);
    }

    // ==================== الحلقة الرئيسية ====================
    let lastTs = 0;
    function loop(ts) {
      const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
      lastTs = ts;
      const active = !isModalOpen();
      if (active) {
        updatePlayer(dt);
        updateNPCs(dt);
      }
      updateClouds(dt);
      updateFountain(dt);
      updateWeather(dt, seasonForMonth(state.month));
      updateDust(dt, active && pressed.size > 0);
      updateFloaters(dt);
      for (let i = BADGES.length - 1; i >= 0; i--) {
        BADGES[i].life += dt;
        if (BADGES[i].life > BADGES[i].max) BADGES.splice(i, 1);
      }
      if (shake > 0) shake = Math.max(0, shake - dt * 9);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ==================== المدخلات ====================
    const KEY_MAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };
    window.addEventListener("keydown", (e) => {
      const dir = KEY_MAP[e.key];
      if (dir) { pressed.add(dir); e.preventDefault(); }
      if ((e.key === "Enter" || e.key === " " || e.key === "e") && currentBuilding && !isModalOpen()) currentBuilding.open();
      if (e.key === "Escape" && isModalOpen() && !topModalIsMandatory()) popModal();
    });
    window.addEventListener("keyup", (e) => {
      const dir = KEY_MAP[e.key];
      if (dir) pressed.delete(dir);
    });

    // إن غادر التركيز النافذة أثناء ضغط مفتاح حركة فلن تصل رسالة keyup أبدًا،
    // فتظل الشخصية تمشي بلا توقف عند العودة. نُفرغ المفاتيح عند فقدان التركيز.
    const releaseAllKeys = () => pressed.clear();
    window.addEventListener("blur", releaseAllKeys);
    document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAllKeys(); });

    function bindDpad(id, dir) {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); pressed.add(dir); };
      const end = (e) => { e.preventDefault(); pressed.delete(dir); };
      el.addEventListener("pointerdown", start);
      el.addEventListener("pointerup", end);
      el.addEventListener("pointerleave", end);
      el.addEventListener("pointercancel", end);
    }
    bindDpad("btnUp", "up"); bindDpad("btnDown", "down"); bindDpad("btnLeft", "left"); bindDpad("btnRight", "right");

    document.getElementById("statsBtn").addEventListener("click", () => {
      document.getElementById("statsPanel").classList.toggle("open");
    });

    const soundBtn = document.getElementById("soundBtn");
    function refreshSoundBtn() {
      soundBtn.textContent = soundOn ? "🔊" : "🔇";
      soundBtn.style.opacity = soundOn ? "1" : "0.55";
    }
    refreshSoundBtn();
    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      lsSet("zeroSound", soundOn ? "on" : "off");
      refreshSoundBtn();
      if (soundOn) SFX.coin();
    });

    // ==================== واجهة المستخدم العلوية ====================
    function refreshHud() {
      const d = derive(state);
      const ml = moraleLabel(state.morale ?? 70);
      const mood = document.getElementById("moodEmoji");
      mood.textContent = ml.emoji;
      mood.title = `الرضا: ${Math.round(state.morale ?? 70)} (${ml.text})`;
      document.getElementById("hudDate").textContent = `السنة ${state.year} · شهر ${state.month}`;
      document.getElementById("hudNet").innerHTML = `${fmt(d.netWorth)} <small>ريال</small>`;
      document.getElementById("statCash").textContent = fmt(state.cash);
      document.getElementById("statEmergency").textContent = fmt(state.emergency);
      document.getElementById("statInvest").textContent = fmt(d.totalInv);
      document.getElementById("statDebt").textContent = fmt(state.debt);
      const hEl = document.getElementById("statHome");
      const hs = state.housing || INITIAL_STATE.housing;
      hEl.textContent = fmt((hs.built || 0) - (hs.loan || 0));
      hEl.style.color = hs.stage === "owned" ? "#2ecc71" : "#e0e8e4";
      const mEl = document.getElementById("statMorale");
      mEl.textContent = Math.round(state.morale ?? 70);
      mEl.style.color = ml.color;
      const cEl = document.getElementById("statCredit");
      cEl.textContent = state.creditScore;
      cEl.style.color = creditLabel(state.creditScore).color;
      const r = rankInfo(state);
      document.getElementById("rankName").textContent = r.name;
      document.getElementById("rankNext").textContent = r.nextLabel;
      const fill = document.getElementById("rankFill");
      fill.style.width = `${r.pct * 100}%`;
      fill.style.background = r.pct >= 1 ? "#2ecc71" : "#c9974a";
    }
    refreshHud();

    // الشرح متاح دائمًا من المكتبة، لا في أول زيارة فقط
    function howToPlayHtml(isIntro) {
      return `
        <h2>🏙️ أهلاً بك في مدينة المال</h2>
        <p style="line-height:1.9;margin-bottom:12px">
          تبدأ براتب <b>1,000</b> ريال ومصروفات <b>600</b> (منها <b>220</b> إيجارًا)، أي فائض <b>400</b> شهريًا.
          تحرّك بالأسهم أو أزرار الاتجاه، واقترب من أي مبنى للتفاعل معه.
        </p>
        <p style="line-height:2.1;margin-bottom:12px">
          💼 العمل — استلام الراتب وتخصيص الفائض<br>
          🏦 البنك — صندوق الطوارئ والتأمين<br>
          📈 البورصة — الاستثمار في أربعة أصول<br>
          🏠 المنزل — الديون وبناء مسكنك<br>
          🎓 المعهد — دورات ترفع دخلك مدى الحياة<br>
          🎯 لوحة الأهداف &nbsp;·&nbsp; 📰 دار البلدية &nbsp;·&nbsp; 📖 المكتبة
        </p>
        <p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:10px">
          🤲 وكل عام تُعرض عليك <b>الزكاة</b> (2.5%) على ما بلغ النصاب وحال عليه الحول.
        </p>
        <div class="card" style="padding:12px;margin-bottom:6px">
          <h3 style="font-size:14px;color:#c9974a;margin-bottom:6px">🏡 طريقك إلى بيت تملكه</h3>
          <p style="line-height:1.9;font-size:13px">
            قدّم طلب <b>منحة أرض</b> من دار البلدية (التخصيص خلال 6 أشهر)، ثم ابنِ على مراحل
            بكلفة <b>50,000</b> ريال — بمدخراتك أو بـ<b>قرض إسكان</b> مدعوم. عند اكتماله يتوقف
            الإيجار نهائيًا فتنخفض مصروفاتك، ويقترب هدفك من الطرفين.
          </p>
        </div>
        <p class="muted" style="font-size:12px;line-height:1.8">
          الفوز: أن تبلغ ثروتك المُدِرّة للدخل ما يكفي لتغطية مصروفاتك دون راتب.
          بيت السكن لا يُحتسب فيها — فهو لا يموّل مصروفاتك.
        </p>
        ${isIntro ? '<button class="btn" style="margin-top:16px" data-close-all>ابدأ</button>' : '<button class="btn" style="margin-top:16px" data-close>فهمت</button>'}
      `;
    }
    function openHowToPlay() { pushModal(howToPlayHtml(false)); }

    if (isFirstVisit) {
      // نحفظ فورًا وإلا اعتُبرت أي إعادة تحميل قبل أول إجراء زيارةً أولى جديدة
      // فتتكرر بطاقة الشرح على من لم يفعل شيئًا بعد.
      saveState();
      pushModal(howToPlayHtml(true));
    }
  </script>
</body>
</html>
