<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ZERO+ · مدينة المال</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Kufi Arabic', sans-serif; background: #0a1e1a; color: #e0e8e4; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    .app { max-width: 520px; margin: 0 auto; min-height: 100vh; background: #0d2621; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.5); }

    .hud { padding: 14px 16px; background: #0a1e1a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1d3d35; }
    .hud-mid { text-align: center; }
    .hud-date { font-size: 12px; color: #8aa89b; }
    .hud-net { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: #c9974a; }
    .hud-net small { font-size: 13px; font-weight: 400; opacity: 0.7; }
    #moodEmoji { font-size: 28px; }

    .rank-bar { margin: 10px 14px 0; }
    .rank-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; font-size: 12px; }
    .rank-head span:first-child { color: #c9974a; font-weight: 700; }
    .rank-head .muted { font-size: 10px; }
    .stats-panel { display: none; margin: 10px 12px; }
    .stats-panel.open { display: flex; gap: 8px; }
    .stat-box { flex: 1; background: #122e27; border-radius: 12px; padding: 10px 6px; text-align: center; border: 1px solid #1d3d35; }
    .stat-box .label { font-size: 10px; color: #8aa89b; margin-bottom: 4px; }
    .stat-box .value { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; }

    .stage { position: relative; margin: 10px 12px; border-radius: 14px; overflow: hidden; border: 1px solid #1d3d35; }
    .stage canvas { display: block; width: 100%; height: auto; background: #0a1e1a; }
    .interact-btn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: #c9974a; color: #0a1e1a; border: none; padding: 10px 20px; border-radius: 22px; font-weight: 700; font-family: inherit; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.45); cursor: pointer; }
    .interact-btn.hidden { display: none; }

    .controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 24px; }
    .dpad { direction: ltr; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .dpad-row { display: flex; gap: 6px; }
    .dpad-btn { width: 50px; height: 50px; border-radius: 10px; background: #122e27; border: 1px solid #1d3d35; color: #c9974a; font-size: 18px; cursor: pointer; touch-action: none; }
    .dpad-btn:active { background: #1d3d35; }
    .dpad-spacer { width: 50px; height: 50px; }

    .card { background: #122e27; border-radius: 14px; padding: 16px; margin: 12px; border: 1px solid #1d3d35; }
    .card h3 { font-size: 16px; color: #c9974a; margin-bottom: 12px; }
    .progress { height: 10px; background: #1d3d35; border-radius: 5px; overflow: hidden; margin: 6px 0; }
    .progress-fill { height: 100%; border-radius: 5px; transition: width 0.3s ease; }
    .btn { background: #c9974a; color: #0a1e1a; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; font-size: 15px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .btn-sm { padding: 8px 16px; width: auto; font-size: 13px; }
    .btn-outline { background: transparent; border: 1px solid #c9974a; color: #c9974a; }
    .term { color: #c9974a; text-decoration: underline dotted; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .modal { background: #122e27; border-radius: 18px; padding: 24px; max-width: 400px; width: 100%; border: 1px solid #c9974a; max-height: 80vh; overflow-y: auto; }
    .modal h2 { color: #c9974a; margin-bottom: 16px; font-size: 20px; }
    input { width: 100%; padding: 10px; background: #0a1e1a; border: 1px solid #1d3d35; color: #e0e8e4; border-radius: 8px; font-family: inherit; margin: 6px 0 14px; font-size: 15px; }
    input[type=range] { accent-color: #c9974a; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .slider-row span { font-size: 13px; }
    .slider-row .val { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #c9974a; }
    .row-actions { display: flex; gap: 8px; align-items: center; }
    .row-actions input { margin: 0; }
    .event-art { width: 100%; height: auto; display: block; background: #0a1e1a; border: 1px solid #1d3d35; border-radius: 10px; margin-bottom: 4px; }
    .celebrate-art { width: 100%; height: auto; display: block; background: #0a1e1a; border-radius: 10px; margin-bottom: 12px; }
    .event-btn { background: #1d3d35; border: 1px solid #2a5043; color: #e0e8e4; padding: 12px; border-radius: 8px; width: 100%; margin: 6px 0; cursor: pointer; font-family: inherit; font-size: 14px; text-align: right; transition: background 0.2s; }
    .event-btn:hover { background: #2a5043; }
    .inline-error { color: #e74c3c; font-size: 13px; margin: -8px 0 12px; min-height: 16px; }
    .muted { color: #8aa89b; }
    .term-row { padding: 10px 0; border-bottom: 1px solid #1d3d35; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud">
      <span id="moodEmoji">🙂</span>
      <div class="hud-mid">
        <div class="hud-date" id="hudDate">السنة 1 · شهر 1</div>
        <div class="hud-net" id="hudNet">0 <small>ريال</small></div>
      </div>
      <button class="btn btn-sm" id="statsBtn">📊</button>
    </div>

    <div class="rank-bar">
      <div class="rank-head">
        <span id="rankName">مبتدئ</span>
        <span class="muted" id="rankNext"></span>
      </div>
      <div class="progress" style="height:6px;margin:0"><div class="progress-fill" id="rankFill" style="width:0%;background:#c9974a"></div></div>
    </div>

    <div class="stats-panel" id="statsPanel">
      <div class="stat-box"><div class="label">💰 الجاري</div><div class="value" id="statCash">0</div></div>
      <div class="stat-box"><div class="label">🛡 الطوارئ</div><div class="value" id="statEmergency">0</div></div>
      <div class="stat-box"><div class="label">📈 استثمارات</div><div class="value" id="statInvest">0</div></div>
      <div class="stat-box"><div class="label">💳 ديون</div><div class="value" id="statDebt">0</div></div>
    </div>

    <div class="stage">
      <canvas id="game" width="512" height="640"></canvas>
      <button class="interact-btn hidden" id="interactBtn"></button>
    </div>

    <div class="controls">
      <div class="dpad-spacer"></div>
      <div class="dpad">
        <button class="dpad-btn" id="btnUp">▲</button>
        <div class="dpad-row">
          <button class="dpad-btn" id="btnLeft">◀</button>
          <button class="dpad-btn" id="btnDown">▼</button>
          <button class="dpad-btn" id="btnRight">▶</button>
        </div>
      </div>
      <div class="dpad-spacer"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script>
    const fmt = (n) => Math.round(n).toLocaleString("en-US");

    // ==================== القاموس المالي ====================
    const DICTIONARY = {
      "الفائدة المركبة": "الفائدة التي تُحسب على أصل المبلغ + الفوائد السابقة. قوتها تظهر مع الزمن.",
      "التضخم": "ارتفاع عام في الأسعار يقلل من القوة الشرائية للنقود مع الوقت.",
      "التنويع": "توزيع الاستثمارات على أصول مختلفة لتقليل المخاطر.",
      "نسبة الدين إلى الدخل": "إجمالي الأقساط الشهرية ÷ الدخل الشهري. يجب ألا تتجاوز 35%.",
      "صندوق الطوارئ": "مبلغ يعادل 3-6 أشهر من المصروفات، يستخدم فقط في الحالات الطارئة.",
      "العائد على الاستثمار": "الربح أو الخسارة من الاستثمار مقارنة بتكلفته الأصلية.",
      "السيولة": "سرعة تحويل الأصل إلى نقد بدون خسارة كبيرة في القيمة.",
      "المخاطر": "احتمال خسارة جزء من رأس المال المستثمر.",
      "الرافعة المالية": "استخدام الديون لزيادة حجم الاستثمارات، مما يضخم الأرباح والخسائر."
    };

    // ==================== الحالة الأولية ====================
    const INITIAL_STATE = {
      cash: 3000,
      emergency: 2000,
      emergencyTarget: 18000,
      investments: {
        stocks: { amount: 0, cost: 0 },
        bonds: { amount: 0, cost: 0 },
        realEstate: { amount: 0, cost: 0, rentalIncome: 0 },
        crypto: { amount: 0, cost: 0 },
      },
      debt: 0,
      monthlyIncome: 5000,
      monthlyExpenses: 3000,
      creditScore: 700,
      month: 1,
      year: 1,
      goals: [],
      history: [],
      eventLog: [],
      tempEffects: [],
    };

    // ==================== الأحداث المالية ====================
    const EVENTS = [
      { id: "job_loss", title: "فقدان الوظيفة", desc: "تم تسريحك! دخلك ينخفض 60% لمدة 3 أشهر.", choices: [
        { label: "استخدم صندوق الطوارئ", effect: (s) => ({ ...s, emergency: s.emergency - 1000, tempEffects: [...s.tempEffects, { type: "income", amount: -Math.round(s.monthlyIncome * 0.6), monthsLeft: 3 }], eventLog: [...s.eventLog, "فقدان وظيفة - استخدم الطوارئ"] }) },
        { label: "اقترض لتغطية المصروفات", effect: (s) => ({ ...s, debt: s.debt + 3000, cash: s.cash + 3000, tempEffects: [...s.tempEffects, { type: "income", amount: -Math.round(s.monthlyIncome * 0.6), monthsLeft: 3 }], eventLog: [...s.eventLog, "فقدان وظيفة - اقترض"] }) }
      ]},
      { id: "market_crash", title: "انهيار سوق الأسهم", desc: "الأسهم تنخفض 25%! هل تبيع أم تشتري المزيد؟", choices: [
        { label: "أبيع وأحمي رأس المال", effect: (s) => ({ ...s, cash: s.cash + s.investments.stocks.amount, investments: { ...s.investments, stocks: { amount: 0, cost: 0 } }, eventLog: [...s.eventLog, "انهيار أسهم - باع"] }) },
        { label: "أشتري المزيد (انخفاض مؤقت)", effect: (s) => ({ ...s, cash: s.cash - 500, investments: { ...s.investments, stocks: { amount: s.investments.stocks.amount + 500, cost: s.investments.stocks.cost + 500 } }, eventLog: [...s.eventLog, "انهيار أسهم - اشترى"] }) }
      ]},
      { id: "bonus", title: "مكافأة عمل", desc: "حصلت على 800 ريال مكافأة.", choices: [
        { label: "أضف للاستثمار", effect: (s) => ({ ...s, investments: { ...s.investments, stocks: { amount: s.investments.stocks.amount + 800, cost: s.investments.stocks.cost + 800 } }, eventLog: [...s.eventLog, "مكافأة - استثمر"] }) },
        { label: "أضف للطوارئ", effect: (s) => ({ ...s, emergency: s.emergency + 800, eventLog: [...s.eventLog, "مكافأة - طوارئ"] }) }
      ]},
      { id: "rent_increase", title: "رفع الإيجار", desc: "المالك يرفع الإيجار 5% بشكل دائم.", choices: [
        { label: "أقبل الزيادة", effect: (s) => ({ ...s, monthlyExpenses: Math.round(s.monthlyExpenses * 1.05), eventLog: [...s.eventLog, "رفع إيجار - قبل"] }) },
        { label: "أنتقل لسكن أرخص (تكلفة 600)", effect: (s) => ({ ...s, cash: s.cash - 600, monthlyExpenses: Math.round(s.monthlyExpenses * 0.95), eventLog: [...s.eventLog, "رفع إيجار - انتقل"] }) }
      ]},
      { id: "medical", title: "طارئ صحي", desc: "عملية غير مغطاة تكلف 900 ريال.", choices: [
        { label: "ادفع من الطوارئ", effect: (s) => ({ ...s, emergency: s.emergency - 900, eventLog: [...s.eventLog, "طارئ صحي - طوارئ"] }) },
        { label: "تقسيط على 6 أشهر", effect: (s) => ({ ...s, debt: s.debt + 900, tempEffects: [...s.tempEffects, { type: "expense", amount: 150, monthsLeft: 6 }], eventLog: [...s.eventLog, "طارئ صحي - تقسيط"] }) }
      ]},
      { id: "promotion", title: "ترقية وزيادة", desc: "تمت ترقيتك! دخلك يرتفع 15%.", choices: [
        { label: "احتفظ بنفس نمط الحياة", effect: (s) => ({ ...s, monthlyIncome: Math.round(s.monthlyIncome * 1.15), eventLog: [...s.eventLog, "ترقية - وفر الزيادة"] }) },
        { label: "ارفع مستوى المعيشة قليلاً", effect: (s) => ({ ...s, monthlyIncome: Math.round(s.monthlyIncome * 1.15), monthlyExpenses: Math.round(s.monthlyExpenses * 1.08), eventLog: [...s.eventLog, "ترقية - رفع معيشة"] }) }
      ]},
    ];

    // ==================== الدوال المساعدة ====================
    function derive(state) {
      const tempEffects = state.tempEffects || [];
      const incomeAdj = tempEffects.filter((e) => e.type === "income").reduce((a, e) => a + e.amount, 0);
      const expenseAdj = tempEffects.filter((e) => e.type === "expense").reduce((a, e) => a + e.amount, 0);
      const effIncome = state.monthlyIncome + incomeAdj;
      const effExpenses = state.monthlyExpenses + expenseAdj;
      const surplus = effIncome - effExpenses;
      const totalInv = Object.values(state.investments).reduce((sum, inv) => sum + inv.amount, 0);
      const netWorth = state.cash + state.emergency + totalInv - state.debt;
      const coverage = effExpenses > 0 ? state.emergency / effExpenses : 0;
      return { surplus, netWorth, totalInv, coverage, effIncome, effExpenses };
    }

    // ==================== الرتب ونهاية اللعبة ====================
    // هدف الاستقلال المالي: ثروة تعادل 12 ضعف المصروفات السنوية.
    function fiTarget(s) { return s.monthlyExpenses * 12 * 12; }
    const BANKRUPT_AT = -10000;

    const RANKS = [
      { min: -Infinity, name: "متعثّر" },
      { min: 0, name: "مبتدئ" },
      { min: 10000, name: "مدّخر" },
      { min: 50000, name: "مستثمر" },
      { min: 150000, name: "مستثمر متمرّس" },
      { min: 400000, name: "قريب من الاستقلال" },
    ];

    function rankInfo(s) {
      const nw = derive(s).netWorth;
      const fi = fiTarget(s);
      if (nw >= fi) return { name: "مستقل ماليًا 🏆", pct: 1, nextLabel: "اكتمل" };
      let idx = 0;
      for (let i = 0; i < RANKS.length; i++) if (nw >= RANKS[i].min) idx = i;
      const cur = RANKS[idx];
      const nextMin = idx + 1 < RANKS.length ? RANKS[idx + 1].min : fi;
      const base = cur.min === -Infinity ? BANKRUPT_AT : cur.min;
      const pct = Math.max(0, Math.min(1, (nw - base) / (nextMin - base)));
      return { name: cur.name, pct, nextLabel: `التالي عند ${fmt(nextMin)}` };
    }

    function cloneInvestments(inv) {
      return {
        stocks: { ...inv.stocks },
        bonds: { ...inv.bonds },
        realEstate: { ...inv.realEstate },
        crypto: { ...inv.crypto },
      };
    }

    // ==================== الحالة والحفظ ====================
    const SAVE_KEY = "zeroGameStateV1";
    let isFirstVisit = false;
    let lastStockDelta = 0; // آخر تغيّر في الأسهم، يُستخدم لسهم المؤشر فوق البورصة
    const FLOATERS = [];    // أرقام تطفو عند تغيّر صافي الثروة
    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(SAVE_KEY);
        if (!saved) { isFirstVisit = true; return structuredClone(INITIAL_STATE); }
        return { ...structuredClone(INITIAL_STATE), ...JSON.parse(saved) };
      } catch {
        isFirstVisit = true;
        return structuredClone(INITIAL_STATE);
      }
    }

    function setState(next) {
      const prevNetWorth = derive(state).netWorth;
      state = next;
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      const delta = derive(state).netWorth - prevNetWorth;
      if (Math.abs(delta) >= 1) spawnFloater(delta);
      refreshHud();
      checkEnding();
    }

    // تُستدعى بعد كل تغيير؛ تعرض شاشة النهاية مرة واحدة فقط
    function checkEnding() {
      if (state.finished) return;
      const nw = derive(state).netWorth;
      if (nw >= fiTarget(state)) {
        state.finished = "win";
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        showEnding("win");
      } else if (nw <= BANKRUPT_AT) {
        state.finished = "lose";
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        showEnding("lose");
      }
    }

    function resetGame() {
      localStorage.removeItem(SAVE_KEY);
      state = structuredClone(INITIAL_STATE);
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      closeAllModals();
      refreshHud();
    }

    // معرّفة كتصريحات دوال (مرفوعة) كي يمكن استدعاؤها من setState قبل قسم الرسوميات
    let shake = 0; // شدة اهتزاز الشاشة الحالية

    function spawnFloater(delta) {
      FLOATERS.push({
        text: `${delta > 0 ? "+" : "−"}${fmt(Math.abs(delta))}`,
        color: delta > 0 ? "#2ecc71" : "#e74c3c",
        life: 0, max: 1.6, dx: (Math.random() - 0.5) * 10,
      });
      // الخسائر الكبيرة فقط تهزّ الشاشة، حتى لا يهتزّ كل راتب شهري
      if (delta <= -300) shake = Math.min(7, 2 + Math.abs(delta) / 700);
    }

    // ==================== منطق الشهر والأحداث ====================
    function advanceMonth(baseState) {
      const source = baseState || state;
      let s = {
        ...source,
        investments: cloneInvestments(source.investments),
        tempEffects: (source.tempEffects || []).map((e) => ({ ...e })),
      };
      if (s.month % 12 === 0) {
        s.monthlyIncome = Math.round(s.monthlyIncome * 1.02);
        s.monthlyExpenses = Math.round(s.monthlyExpenses * 1.015);
      }
      const stockR = (Math.random() * 0.24) - 0.10;
      lastStockDelta = stockR;
      s.investments.stocks.amount = Math.round(s.investments.stocks.amount * (1 + stockR));
      s.investments.bonds.amount = Math.round(s.investments.bonds.amount * 1.003);
      if (s.investments.realEstate.amount > 0) {
        s.investments.realEstate.rentalIncome = Math.round(s.investments.realEstate.amount * 0.004);
        s.cash += s.investments.realEstate.rentalIncome;
      }
      s.investments.crypto.amount = Math.round(s.investments.crypto.amount * (1 + (Math.random() * 0.6 - 0.25)));
      if (s.debt > 0) s.debt = Math.round(s.debt * 1.01);

      const { surplus } = derive(s);
      s.cash += surplus;
      s.tempEffects = s.tempEffects.map((e) => ({ ...e, monthsLeft: e.monthsLeft - 1 })).filter((e) => e.monthsLeft > 0);
      s.month += 1;
      if (s.month > 12) { s.month = 1; s.year += 1; }

      const totalInv = Object.values(s.investments).reduce((a, i) => a + i.amount, 0);
      const nw = s.cash + s.emergency + totalInv - s.debt;
      s.history = [...s.history, { month: s.month + (s.year - 1) * 12, netWorth: nw }];

      setState(s);

      if (Math.random() < 0.5) {
        const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
        openEvent(ev);
      }
    }

    function openEvent(ev) {
      pushModal(`
        <h2>${ev.title}</h2>
        <canvas class="event-art" id="eventArt" width="340" height="120"></canvas>
        <p style="margin:12px 0;line-height:1.8">${ev.desc}</p>
        ${ev.choices.map((c, i) => `<button class="event-btn" data-choice="${i}">${c.label}</button>`).join("")}
      `, (root) => {
        const artCanvas = root.querySelector("#eventArt");
        if (artCanvas) animateEventArt(artCanvas, ev.id);
        root.querySelectorAll("[data-choice]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const choice = ev.choices[Number(btn.dataset.choice)];
            setState(choice.effect(state));
            closeAllModals();
          });
        });
      });
    }

    // ==================== رسوم توضيحية متحركة لبطاقات الأحداث ====================
    const EVENT_ART = {
      job_loss(c, w, h, t) {
        c.fillStyle = "#1d3d35"; c.fillRect(w / 2 - 34, h - 74, 68, 74);
        c.fillStyle = "#0a1e1a"; c.fillRect(w / 2 - 16, h - 52, 32, 52);
        c.fillStyle = "#c9974a"; c.beginPath(); c.arc(w / 2 + 10, h - 26, 2.5, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#e74c3c";
        c.save(); c.translate(w / 2, h - 88); c.rotate(Math.sin(t * 2) * 0.12);
        c.fillRect(-26, -9, 52, 18);
        c.fillStyle = "#fff"; c.font = "bold 11px sans-serif";
        c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("مغلق", 0, 0);
        c.restore();
        const px = w / 2 + 62 + Math.sin(t * 1.4) * 5;
        drawMiniPerson(c, px, h - 22, "#4a90c9", 0.4);
      },
      market_crash(c, w, h, t) {
        c.strokeStyle = "rgba(138,168,155,0.25)"; c.lineWidth = 1;
        for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(10, (h / 4) * i); c.lineTo(w - 10, (h / 4) * i); c.stroke(); }
        const pts = [0.25, 0.18, 0.34, 0.28, 0.5, 0.62, 0.58, 0.8, 0.92];
        const prog = Math.min(1, t / 1.2);
        c.beginPath(); c.strokeStyle = "#e74c3c"; c.lineWidth = 2.5;
        const n = Math.max(2, Math.floor(pts.length * prog));
        for (let i = 0; i < n; i++) {
          const x = 14 + (i / (pts.length - 1)) * (w - 28), y = 10 + pts[i] * (h - 26);
          i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.stroke();
        const lx = 14 + ((n - 1) / (pts.length - 1)) * (w - 28), ly = 10 + pts[n - 1] * (h - 26);
        c.fillStyle = "#e74c3c"; c.beginPath(); c.arc(lx, ly, 4, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#e74c3c"; c.font = "bold 15px sans-serif"; c.textAlign = "left"; c.textBaseline = "middle";
        c.fillText("▼ 25%", 16, h - 16);
      },
      bonus(c, w, h, t) {
        for (let i = 0; i < 5; i++) {
          const y = h - 12 - i * 9, rw = 34 - i * 2;
          c.fillStyle = i % 2 ? "#b5821f" : "#c9974a";
          c.beginPath(); c.ellipse(w / 2, y, rw, 7, 0, 0, Math.PI * 2); c.fill();
        }
        for (let i = 0; i < 6; i++) {
          const a = t * 1.6 + i;
          const sx = w / 2 + Math.cos(a) * (40 + i * 5), sy = h - 46 + Math.sin(a * 1.3) * 20;
          c.globalAlpha = 0.4 + 0.6 * ((Math.sin(t * 3 + i) + 1) / 2);
          c.fillStyle = "#f4d58d";
          c.beginPath(); c.arc(sx, sy, 2, 0, Math.PI * 2); c.fill();
          c.globalAlpha = 1;
        }
      },
      rent_increase(c, w, h, t) {
        const bob = Math.sin(t * 2) * 3;
        c.fillStyle = "#d98c4a"; c.fillRect(w / 2 - 34, h - 52, 68, 52);
        c.fillStyle = "#a86a33";
        c.beginPath(); c.moveTo(w / 2 - 42, h - 52); c.lineTo(w / 2, h - 82); c.lineTo(w / 2 + 42, h - 52); c.closePath(); c.fill();
        c.fillStyle = "#2a1c0d"; c.fillRect(w / 2 - 9, h - 26, 18, 26);
        c.fillStyle = "#f4d58d"; c.fillRect(w / 2 - 28, h - 44, 14, 14); c.fillRect(w / 2 + 14, h - 44, 14, 14);
        c.fillStyle = "#e74c3c";
        c.save(); c.translate(w / 2 + 70, h - 46 - bob);
        c.beginPath(); c.moveTo(0, -14); c.lineTo(11, 4); c.lineTo(-11, 4); c.closePath(); c.fill();
        c.fillRect(-5, 4, 10, 16);
        c.restore();
        c.fillStyle = "#e74c3c"; c.font = "bold 13px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("+5%", w / 2 + 70, h - 8);
      },
      medical(c, w, h, t) {
        const pulse = 1 + Math.sin(t * 3) * 0.06;
        c.save(); c.translate(w / 2, h / 2); c.scale(pulse, pulse);
        c.fillStyle = "#fff"; roundRect(c, -30, -30, 60, 60, 10); c.fill();
        c.fillStyle = "#e74c3c";
        c.fillRect(-6, -20, 12, 40); c.fillRect(-20, -6, 40, 12);
        c.restore();
        c.strokeStyle = "#e74c3c"; c.lineWidth = 2; c.beginPath();
        const baseY = h - 16;
        for (let x = 8; x < w - 8; x += 2) {
          const k = (x + t * 60) % 90;
          const spike = k < 10 ? (k < 5 ? -k * 2.4 : (k - 10) * 2.4) : 0;
          x === 8 ? c.moveTo(x, baseY + spike) : c.lineTo(x, baseY + spike);
        }
        c.stroke();
      },
      promotion(c, w, h, t) {
        const prog = Math.min(1, t / 1.2);
        c.beginPath(); c.strokeStyle = "#2ecc71"; c.lineWidth = 2.5;
        const pts = [0.85, 0.78, 0.66, 0.58, 0.42, 0.3, 0.2];
        const n = Math.max(2, Math.floor(pts.length * prog));
        for (let i = 0; i < n; i++) {
          const x = 14 + (i / (pts.length - 1)) * (w - 28), y = 10 + pts[i] * (h - 30);
          i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.stroke();
        const lx = 14 + ((n - 1) / (pts.length - 1)) * (w - 28), ly = 10 + pts[n - 1] * (h - 30);
        c.fillStyle = "#f4d58d";
        c.save(); c.translate(lx, ly); c.rotate(t * 1.5);
        c.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 ? 3.5 : 8, a = (i / 10) * Math.PI * 2;
          i === 0 ? c.moveTo(Math.cos(a) * r, Math.sin(a) * r) : c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        c.closePath(); c.fill(); c.restore();
        c.fillStyle = "#2ecc71"; c.font = "bold 15px sans-serif"; c.textAlign = "left"; c.textBaseline = "middle";
        c.fillText("▲ 15%", 16, h - 14);
      },
    };

    function drawMiniPerson(c, x, y, shirt, scale) {
      c.save(); c.translate(x, y); c.scale(scale * 2, scale * 2);
      c.fillStyle = "#2a1c0d"; c.fillRect(-6, 4, 5, 10); c.fillRect(1, 4, 5, 10);
      c.fillStyle = shirt; roundRect(c, -8, -6, 16, 14, 4); c.fill();
      c.fillStyle = "#e8b88a"; c.beginPath(); c.arc(0, -12, 7, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#3a2a1a"; c.beginPath(); c.arc(0, -15, 7.2, Math.PI, Math.PI * 2); c.fill();
      c.restore();
    }

    function animateEventArt(canvas, eventId) {
      const art = EVENT_ART[eventId];
      if (!art) return;
      const c = canvas.getContext("2d");
      const t0 = performance.now();
      (function frame() {
        if (!canvas.isConnected) return; // يتوقف تلقائيًا عند إغلاق البطاقة
        const t = (performance.now() - t0) / 1000;
        c.clearRect(0, 0, canvas.width, canvas.height);
        c.save();
        art(c, canvas.width, canvas.height, t);
        c.restore();
        requestAnimationFrame(frame);
      })();
    }

    // ==================== نظام الوحدات المنبثقة (Modals) ====================
    let modalStack = [];
    function isModalOpen() { return modalStack.length > 0; }

    function mountCommon(root) {
      root.querySelectorAll(".term").forEach((el) => {
        el.addEventListener("click", () => {
          const term = el.dataset.term;
          pushModal(`<h2>${term}</h2><p style="line-height:2">${DICTIONARY[term]}</p><button class="btn" data-close>فهمت</button>`);
        });
      });
      root.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", () => popModal()));
      root.querySelectorAll("[data-close-all]").forEach((el) => el.addEventListener("click", () => closeAllModals()));
    }

    function pushModal(html, onMount) {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `<div class="modal">${html}</div>`;
      overlay.addEventListener("click", (e) => { if (e.target === overlay) popModal(); });
      document.getElementById("modalRoot").appendChild(overlay);
      modalStack.push(overlay);
      mountCommon(overlay);
      if (onMount) onMount(overlay);
    }

    function popModal() {
      const overlay = modalStack.pop();
      if (overlay) overlay.remove();
      refreshHud();
    }

    function closeAllModals() {
      modalStack.forEach((o) => o.remove());
      modalStack = [];
      refreshHud();
    }

    function term(t) { return `<span class="term" data-term="${t}">${t}</span>`; }

    // ==================== مباني المدينة ====================
    function openBank() {
      const d = derive(state);
      const pct = Math.min(100, (state.emergency / state.emergencyTarget) * 100);
      pushModal(`
        <h2>🏦 البنك</h2>

        <div class="progress"><div class="progress-fill" style="width:${pct}%;background:#c9974a"></div></div>
        <p class="muted" style="margin:10px 0 16px">${d.coverage.toFixed(1)} شهر من أصل 6 · النقد المتاح: ${fmt(state.cash)} ريال</p>
        <div class="slider-row"><span>إيداع من الجاري</span></div>
        <div class="row-actions">
          <input type="number" id="depositAmt" min="0" max="${Math.max(0, state.cash)}" value="0" />
          <button class="btn btn-sm" id="depositBtn">إيداع</button>
        </div>
        <div class="slider-row" style="margin-top:8px"><span>سحب للجاري</span></div>
        <div class="row-actions">
          <input type="number" id="withdrawAmt" min="0" max="${Math.max(0, state.emergency)}" value="0" />
          <button class="btn btn-sm btn-outline" id="withdrawBtn">سحب</button>

        <div class="inline-error" id="bankErr"></div>
        <button class="btn btn-outline" style="margin-top:10px" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#bankErr");
        root.querySelector("#depositBtn").addEventListener("click", () => {
          const amt = Math.floor(Number(root.querySelector("#depositAmt").value));
          if (!amt || amt <= 0 || amt > state.cash) { err.textContent = "مبلغ غير صالح."; return; }
          setState({ ...state, cash: state.cash - amt, emergency: state.emergency + amt });
          popModal(); openBank();
        });
        root.querySelector("#withdrawBtn").addEventListener("click", () => {
          const amt = Math.floor(Number(root.querySelector("#withdrawAmt").value));
          if (!amt || amt <= 0 || amt > state.emergency) { err.textContent = "مبلغ غير صالح."; return; }
          setState({ ...state, cash: state.cash + amt, emergency: state.emergency - amt });
          popModal(); openBank();
        });
      });

    const ASSET_LABELS = { stocks: "أسهم", bonds: "سندات", realEstate: "عقار", crypto: "عملات رقمية" };

    function openMarket() {
      const rows = Object.entries(state.investments).map(([key, inv]) => `
        <div class="card" style="margin:8px 0;padding:12px">
          <div style="display:flex;justify-content:space-between"><span>${ASSET_LABELS[key]}</span><span style="color:${inv.amount > inv.cost ? '#2ecc71' : inv.amount < inv.cost ? '#e74c3c' : '#8aa89b'}">${fmt(inv.amount)} <span class="muted" style="font-size:11px">(تكلفة ${fmt(inv.cost)})</span></span></div>
          <div class="row-actions" style="margin-top:8px">
            <input type="number" min="0" id="amt_${key}" placeholder="مبلغ" />
            <button class="btn btn-sm" data-buy="${key}">شراء</button>
            <button class="btn btn-sm btn-outline" data-sell="${key}">بيع الكل</button>
          </div>
        </div>
      `).join("");
      pushModal(`
        <h2>📈 البورصة</h2>
        <p class="muted" style="margin-bottom:10px">النقد المتاح: ${fmt(state.cash)} ريال</p>
        ${rows}
        <p style="margin:10px 0;font-size:13px">${term("التنويع")} يقلل ${term("المخاطر")}. انتبه إلى ${term("السيولة")}.</p>
        <div class="inline-error" id="marketErr"></div>
        <button class="btn btn-outline" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#marketErr");
        root.querySelectorAll("[data-buy]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const key = btn.dataset.buy;
            const amt = Math.floor(Number(root.querySelector(`#amt_${key}`).value));
            if (!amt || amt <= 0 || amt > state.cash) { err.textContent = "مبلغ غير صالح."; return; }
            const inv = { ...state.investments[key], amount: state.investments[key].amount + amt, cost: state.investments[key].cost + amt };
            setState({ ...state, cash: state.cash - amt, investments: { ...state.investments, [key]: inv } });
            popModal(); openMarket();
          });
        });
        root.querySelectorAll("[data-sell]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const key = btn.dataset.sell;
            const amount = state.investments[key].amount;
            if (amount <= 0) { err.textContent = "لا يوجد رصيد لبيعه."; return; }
            setState({ ...state, cash: state.cash + amount, investments: { ...state.investments, [key]: { ...state.investments[key], amount: 0, cost: 0 } } });
            popModal(); openMarket();
          });
        });
      });
    }

    function openWork() {
      const d = derive(state);
      if (d.surplus > 0) {
        openAllocation(d.surplus);
      } else {
        pushModal(`
          <h2>💼 العمل</h2>
          <p style="margin:12px 0;line-height:1.8">الدخل الشهري (${fmt(d.effIncome)}) لا يغطي المصروفات (${fmt(d.effExpenses)}) هذا الشهر. سينتقل الراتب مباشرة دون تخصيص فائض.</p>
          <button class="btn" id="proceedBtn">بدء الشهر التالي</button>
        `, (root) => {
          root.querySelector("#proceedBtn").addEventListener("click", () => {
            closeAllModals();
            advanceMonth();
          });
        });
      }
    }

    const ALLOC_FIELDS = [
      ["emergency", "🛡 صندوق الطوارئ"], ["savings", "💰 ادخار عام"], ["investStocks", "📈 أسهم"],
      ["investBonds", "📋 سندات"], ["investReal", "🏠 عقار"], ["investCrypto", "₿ عملات رقمية"], ["leisure", "🎉 إنفاق شخصي"]
    ];

    function openAllocation(surplus) {
      const rows = ALLOC_FIELDS.map(([key, label]) => `
        <div style="margin-bottom:12px">
          <div class="slider-row"><span>${label}</span><span class="val" id="val_${key}">0</span></div>
          <input type="range" min="0" max="${surplus}" value="0" id="range_${key}" />
        </div>
      `).join("");
      pushModal(`
        <h2>💼 يوم الراتب — تخصيص الفائض</h2>
        <p class="muted" style="margin-bottom:10px">الفائض هذا الشهر: <b id="surplusLabel">${fmt(surplus)}</b> ريال · الموزّع: <span id="totalLabel">0</span></p>
        ${rows}
        <div class="inline-error" id="allocErr"></div>
        <button class="btn" id="confirmAlloc">تأكيد التخصيص</button>
      `, (root) => {
        const alloc = Object.fromEntries(ALLOC_FIELDS.map(([k]) => [k, 0]));
        const totalLabel = root.querySelector("#totalLabel");
        const err = root.querySelector("#allocErr");
        ALLOC_FIELDS.forEach(([key]) => {
          root.querySelector(`#range_${key}`).addEventListener("input", (e) => {
            alloc[key] = Number(e.target.value);
            root.querySelector(`#val_${key}`).textContent = fmt(alloc[key]);
            totalLabel.textContent = fmt(Object.values(alloc).reduce((a, b) => a + b, 0));
          });
        });
        root.querySelector("#confirmAlloc").addEventListener("click", () => {
          const total = Object.values(alloc).reduce((a, b) => a + b, 0);
          if (total !== surplus) { err.textContent = `يجب أن يساوي التخصيص الفائض بالكامل (${fmt(surplus)}).`; return; }
          let s = { ...state, investments: cloneInvestments(state.investments) };
          s.emergency += alloc.emergency;
          s.cash += alloc.savings + alloc.leisure;
          s.investments.stocks.amount += alloc.investStocks; s.investments.stocks.cost += alloc.investStocks;
          s.investments.bonds.amount += alloc.investBonds; s.investments.bonds.cost += alloc.investBonds;
          s.investments.realEstate.amount += alloc.investReal; s.investments.realEstate.cost += alloc.investReal;
          s.investments.crypto.amount += alloc.investCrypto; s.investments.crypto.cost += alloc.investCrypto;
          s.cash -= total;
          closeAllModals();
          advanceMonth(s);
        });
      });
    }

    function openHome() {

        <button class="btn btn-outline" style="margin-top:10px" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#homeErr");
        root.querySelector("#payBtn").addEventListener("click", () => {
          const amt = Math.floor(Number(root.querySelector("#payAmt").value));
          if (!amt || amt <= 0 || amt > state.cash || amt > state.debt) { err.textContent = "مبلغ غير صالح."; return; }
          setState({ ...state, cash: state.cash - amt, debt: state.debt - amt });

        root.querySelector("#downsizeBtn").addEventListener("click", () => {

    function openGoals() {
      const goalsHtml = state.goals.length ? state.goals.map((g) => `
        <div class="card" style="margin:8px 0;padding:12px${g.done ? ";border-color:#2ecc71" : ""}">
          <div style="display:flex;justify-content:space-between"><span>${g.done ? "✅ " : ""}${g.name}</span><span>${fmt(g.saved)} / ${fmt(g.target)}</span></div>
          <div class="progress"><div class="progress-fill" style="width:${Math.min(100, (g.saved / g.target) * 100)}%;background:#2ecc71"></div></div>
          ${g.done
            ? `<p class="muted" style="margin-top:8px;font-size:13px;color:#2ecc71">مكتمل 🎉</p>`
            : `<div class="row-actions" style="margin-top:8px">
                 <input type="number" min="0" id="contrib_${g.id}" placeholder="مبلغ المساهمة" />
                 <button class="btn btn-sm" data-contrib="${g.id}">ساهم</button>
               </div>`}
        </div>
      `).join("") : `<p class="muted" style="margin-bottom:12px">لا توجد أهداف بعد.</p>`;
      pushModal(`
        <h2>🎯 لوحة الأهداف</h2>
        ${goalsHtml}
        <div class="inline-error" id="goalsErr"></div>
        <div style="margin-top:8px">
          <input id="newGoalName" placeholder="اسم الهدف" />
          <input id="newGoalTarget" type="number" min="1" placeholder="المبلغ المستهدف" />
          <button class="btn btn-sm btn-outline" id="addGoalBtn">+ إضافة هدف</button>
        </div>
        <button class="btn btn-outline" style="margin-top:14px" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#goalsErr");
        root.querySelectorAll("[data-contrib]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = Number(btn.dataset.contrib);
            const goal = state.goals.find((g) => g.id === id);
            const amt = Math.floor(Number(root.querySelector(`#contrib_${id}`).value));
            const room = goal.target - goal.saved;
            if (!amt || amt <= 0 || amt > state.cash || amt > room) { err.textContent = "مبلغ غير صالح."; return; }
            const justCompleted = !goal.done && goal.saved + amt >= goal.target;
            const goals = state.goals.map((g) => g.id === id
              ? { ...g, saved: g.saved + amt, done: g.done || g.saved + amt >= g.target }
              : g);
            const log = justCompleted ? [...state.eventLog, `🎯 تحقق الهدف: ${goal.name}`] : state.eventLog;
            setState({ ...state, cash: state.cash - amt, goals, eventLog: log });
            popModal();
            if (justCompleted) celebrateGoal(goal.name); else openGoals();
          });
        });
        root.querySelector("#addGoalBtn").addEventListener("click", () => {
          const name = root.querySelector("#newGoalName").value.trim();
          const target = Math.floor(Number(root.querySelector("#newGoalTarget").value));
          if (!name || !target || target <= 0) { err.textContent = "أدخل اسمًا ومبلغًا صحيحين."; return; }
          setState({ ...state, goals: [...state.goals, { id: Date.now(), name, target, saved: 0 }] });
          popModal(); openGoals();
        });
      });
    }

        </div>
        <button class="btn" id="restartBtn">ابدأ من جديد</button>

      `, (root) => {

        if (cv) win ? animateConfetti(cv) : drawEndSlump(cv);
        root.querySelector("#restartBtn").addEventListener("click", resetGame);
      });
    }

    function drawEndSlump(canvas) {
      const c = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      c.clearRect(0, 0, W, H);
      c.strokeStyle = "rgba(138,168,155,0.2)"; c.lineWidth = 1;
      for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(10, (H / 4) * i); c.lineTo(W - 10, (H / 4) * i); c.stroke(); }
      const data = state.history.length > 1 ? state.history.map((p) => p.netWorth) : [0, -2000, -5000, -8000, BANKRUPT_AT];
      const max = Math.max(...data, 1000), min = Math.min(...data, BANKRUPT_AT);
      const range = max - min || 1;
      c.beginPath(); c.strokeStyle = "#e74c3c"; c.lineWidth = 2.5;
      data.forEach((v, i) => {
        const x = 14 + (i / (data.length - 1 || 1)) * (W - 28);
        const y = H - 14 - ((v - min) / range) * (H - 34);
        i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      });
      c.stroke();
      c.fillStyle = "#e74c3c"; c.font = "bold 13px sans-serif";
      c.textAlign = "left"; c.textBaseline = "middle";
      c.fillText("▼", 16, 16);
    }

    function celebrateGoal(goalName) {

    const CONFETTI_COLORS = ["#e74c3c", "#3498db", "#f1c40f", "#9b59b6", "#2ecc71", "#c9974a"];
    function animateConfetti(canvas) {
      const c = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      const bits = [];
      for (let i = 0; i < 70; i++) {
        bits.push({
          x: Math.random() * W, y: -Math.random() * H,
          vy: 40 + Math.random() * 70, vx: (Math.random() - 0.5) * 30,
          w: 3 + Math.random() * 4, h: 5 + Math.random() * 5,
          spin: Math.random() * Math.PI, spinV: (Math.random() - 0.5) * 6,
          color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        });
      }
      let last = performance.now();
      (function frame(now) {
        if (!canvas.isConnected) return; // يتوقف تلقائيًا عند إغلاق البطاقة
        const dt = Math.min(0.05, (now - last) / 1000 || 0);
        last = now;
        c.clearRect(0, 0, W, H);
        c.fillStyle = "#2ecc71";
        c.font = "bold 26px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("★", W / 2, H / 2);
        for (const b of bits) {
          b.y += b.vy * dt; b.x += b.vx * dt; b.spin += b.spinV * dt;
          if (b.y > H + 8) { b.y = -8; b.x = Math.random() * W; }
          c.save(); c.translate(b.x, b.y); c.rotate(b.spin);
          c.fillStyle = b.color; c.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
          c.restore();
        }
        requestAnimationFrame(frame);
      })(last);
    }

        ${logHtml}
        <button class="btn btn-outline" style="margin-top:14px" id="resetBtn">إعادة بدء اللعبة</button>
        <button class="btn btn-outline" style="margin-top:10px" data-close-all>خروج</button>
      `, (root) => {
        root.querySelector("#resetBtn").addEventListener("click", () => {
          pushModal(`
            <h2>إعادة بدء اللعبة</h2>
            <p style="line-height:1.9">سيُمحى تقدّمك بالكامل ويعود كل شيء إلى البداية. هل أنت متأكد؟</p>
            <button class="btn" style="margin-top:14px" id="confirmReset">نعم، ابدأ من جديد</button>
            <button class="btn btn-outline" style="margin-top:10px" data-close>تراجع</button>
          `, (r2) => { r2.querySelector("#confirmReset").addEventListener("click", resetGame); });
        });
        const canvas = root.querySelector("#chartCanvas");

          const range = maxVal - minVal || 1;
          const stepX = w / (data.length - 1 || 1);
          ctx.beginPath();
          ctx.strokeStyle = "#c9974a";
          ctx.lineWidth = 2;
          data.forEach((pt, i) => {
            const x = i * stepX;
            const y = h - ((pt.netWorth - minVal) / range) * (h - 20) - 10;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          });
          ctx.stroke();
          ctx.fillStyle = "#8aa89b";
          ctx.font = "10px sans-serif";

    function openLibrary() {
      const rows = Object.keys(DICTIONARY).map((t) => `<div class="term-row" data-term="${t}">${t}</div>`).join("");
      pushModal(`<h2>📖 المكتبة</h2>${rows}<button class="btn btn-outline" style="margin-top:14px" data-close-all>خروج</button>`, (root) => {
        root.querySelectorAll(".term-row").forEach((el) => {
          el.addEventListener("click", () => {
            const t = el.dataset.term;
            pushModal(`<h2>${t}</h2><p style="line-height:2">${DICTIONARY[t]}</p><button class="btn" data-close>فهمت</button>`);
          });
        });
      });
    }

    // ==================== المدينة (الخريطة والمباني) ====================
    const TILE = 32, COLS = 16, ROWS = 20;
    const WORLD_W = COLS * TILE, WORLD_H = ROWS * TILE;

    function rect(tx, ty, tw, th) { return { x: tx * TILE, y: ty * TILE, w: tw * TILE, h: th * TILE }; }

    const BUILDINGS = [
      { id: "bank", name: "البنك", emoji: "🏦", color: "#c9974a", open: openBank, ...rect(1, 1, 4, 4) },
      { id: "market", name: "البورصة", emoji: "📈", color: "#2ecc71", open: openMarket, ...rect(11, 1, 4, 4) },
      { id: "goals", name: "لوحة الأهداف", emoji: "🎯", color: "#9b59b6", open: openGoals, ...rect(6, 4, 4, 3) },
      { id: "work", name: "العمل", emoji: "💼", color: "#4a90c9", open: openWork, ...rect(1, 8, 4, 4) },
      { id: "home", name: "المنزل", emoji: "🏠", color: "#d98c4a", open: openHome, ...rect(11, 8, 4, 4) },
      { id: "townhall", name: "دار البلدية", emoji: "📰", color: "#7f8c8d", open: openTownHall, ...rect(1, 15, 4, 4) },
      { id: "library", name: "المكتبة", emoji: "📖", color: "#16a085", open: openLibrary, ...rect(11, 15, 4, 4) },
    ];

    BUILDINGS.forEach((b) => { b.doorX = b.x + b.w / 2; b.doorY = b.y + b.h + 10; });

    const PLAZA_X = WORLD_W / 2, PLAZA_Y = 11 * TILE;
    const player = { x: 224, y: 352, w: 22, h: 26, speed: 170, facing: "down", animT: 0 };
    let currentBuilding = null;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function collides(px, py) {
      return BUILDINGS.some((b) => rectsOverlap(px, py, player.w, player.h, b.x, b.y, b.w, b.h));
    }

    const pressed = new Set();
    function isMovingKeyActive() { return pressed.size > 0; }

    function updatePlayer(dt) {
      player.animT += dt;
      let dx = 0, dy = 0;
      if (pressed.has("up")) dy -= 1;
      if (pressed.has("down")) dy += 1;
      if (pressed.has("left")) dx -= 1;
      if (pressed.has("right")) dx += 1;
      if (dx !== 0 || dy !== 0) {
        if (dy < 0) player.facing = "up";
        else if (dy > 0) player.facing = "down";
        else if (dx < 0) player.facing = "left";
        else if (dx > 0) player.facing = "right";
      }
      if (dx !== 0 && dy !== 0) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
      const step = player.speed * dt;

      let nx = clamp(player.x + dx * step, 0, WORLD_W - player.w);
      if (!collides(nx, player.y)) player.x = nx;
      let ny = clamp(player.y + dy * step, 0, WORLD_H - player.h);
      if (!collides(player.x, ny)) player.y = ny;

      const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
      let nearest = null, nearestDist = 36;
      for (const b of BUILDINGS) {
        const d = Math.hypot(cx - b.doorX, cy - b.doorY);
        if (d < nearestDist) { nearest = b; nearestDist = d; }
      }
      currentBuilding = nearest;
      updateInteractBtn();
    }

    const interactBtn = document.getElementById("interactBtn");
    function updateInteractBtn() {
      if (currentBuilding) {
        interactBtn.textContent = `${currentBuilding.emoji} ادخل ${currentBuilding.name}`;
        interactBtn.classList.remove("hidden");
      } else {
        interactBtn.classList.add("hidden");
      }
    }
    interactBtn.addEventListener("click", () => { if (currentBuilding) currentBuilding.open(); });

    // ==================== الرسم ====================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
      r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
      return `rgb(${r},${g},${b})`;
    }

    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function nearAnyBuilding(x, y, margin) {
      return BUILDINGS.some((b) => x > b.x - margin && x < b.x + b.w + margin && y > b.y - margin && y < b.y + b.h + margin);
    }

    // ==================== زخارف ثابتة (مولّدة ببذرة ثابتة كي لا تتغير كل تحديث) ====================
    const rng = mulberry32(2024);
    const TREES = [];
    {
      let attempts = 0;
      while (TREES.length < 12 && attempts < 500) {
        attempts++;
        const tx = 14 + rng() * (WORLD_W - 28);
        const ty = 14 + rng() * (WORLD_H - 28);
        if (nearAnyBuilding(tx, ty, 24)) continue;
        if (Math.hypot(tx - PLAZA_X, ty - PLAZA_Y) < 44) continue;
        TREES.push({ x: tx, y: ty, r: 9 + rng() * 5 });
      }
    }
    const GROUND_DOTS = [];
    {
      let attempts = 0;
      while (GROUND_DOTS.length < 170 && attempts < 3000) {
        attempts++;
        const gx = rng() * WORLD_W, gy = rng() * WORLD_H;
        if (nearAnyBuilding(gx, gy, 6)) continue;
        GROUND_DOTS.push({ x: gx, y: gy, s: rng() < 0.5 ? 2 : 3, tone: rng() });
      }
    }

    // ==================== الفصول (تتبع الشهر داخل اللعبة) ====================
    const SEASONS = {
      winter: { name: "شتاء", leaf: "#4a7a68", leafHi: "#5f9180", ground: ["#12302c", "#0b2220"], dot: "rgba(120,160,170,0.30)", tint: "rgba(120,170,200,0.07)", blossom: null },
      spring: { name: "ربيع", leaf: "#2f8a52", leafHi: "#46a86a", ground: ["#12332a", "#0a201c"], dot: "rgba(80,150,110,0.35)", tint: "rgba(140,220,160,0.05)", blossom: "#f2a7c3" },
      summer: { name: "صيف", leaf: "#1f5c3f", leafHi: "#2f7a52", ground: ["#0f2b24", "#0a1e1a"], dot: "rgba(60,110,90,0.35)", tint: null, blossom: null },
      autumn: { name: "خريف", leaf: "#b5761f", leafHi: "#d29434", ground: ["#2b2418", "#1c1710"], dot: "rgba(170,130,60,0.30)", tint: "rgba(220,160,70,0.06)", blossom: null },
    };
    function seasonForMonth(m) {
      if (m === 12 || m === 1 || m === 2) return "winter";
      if (m <= 5) return "spring";
      if (m <= 8) return "summer";
      return "autumn";
    }
    let renderedSeason = null;

    // ==================== سكان المدينة (شخصيات غير قابلة للعب) ====================
    const NPC_PALETTES = [
      { shirt: "#4a90c9", sleeve: "#3d79a8", skin: "#e8b88a", hair: "#2a1c0d" },
      { shirt: "#9b59b6", sleeve: "#82489a", skin: "#d9a072", hair: "#4a3520" },
      { shirt: "#2ecc71", sleeve: "#26a75d", skin: "#f0c9a0", hair: "#1a1208" },
      { shirt: "#e74c3c", sleeve: "#c2402f", skin: "#c98c5e", hair: "#33220f" },
      { shirt: "#16a085", sleeve: "#128271", skin: "#e8b88a", hair: "#5a3d1f" },
    ];
    const NPCS = [];
    function randomWalkableSpot(rand) {
      for (let i = 0; i < 200; i++) {
        const x = 16 + rand() * (WORLD_W - 32);
        const y = 16 + rand() * (WORLD_H - 32);
        if (!nearAnyBuilding(x, y, 14)) return { x, y };
      }
      return { x: PLAZA_X, y: PLAZA_Y };
    }
    for (let i = 0; i < 5; i++) {
      const spot = randomWalkableSpot(rng);
      NPCS.push({
        x: spot.x, y: spot.y, target: randomWalkableSpot(rng),
        speed: 26 + rng() * 20, animT: rng() * 10, facing: "down", moving: true,
        pauseT: 0, palette: NPC_PALETTES[i % NPC_PALETTES.length],
      });
    }

    function updateNPCs(dt) {
      for (const n of NPCS) {
        n.animT += dt;
        if (n.pauseT > 0) { n.pauseT -= dt; n.moving = false; continue; }
        const dx = n.target.x - n.x, dy = n.target.y - n.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 4) {
          n.target = randomWalkableSpot(Math.random);
          n.pauseT = 0.6 + Math.random() * 2.2;
          n.moving = false;
          continue;
        }
        n.moving = true;
        const step = Math.min(dist, n.speed * dt);
        const nx = n.x + (dx / dist) * step, ny = n.y + (dy / dist) * step;
        if (nearAnyBuilding(nx, ny, 8)) {
          n.target = randomWalkableSpot(Math.random);
          continue;
        }
        n.x = nx; n.y = ny;
        if (Math.abs(dx) > Math.abs(dy)) n.facing = dx < 0 ? "left" : "right";
        else n.facing = dy < 0 ? "up" : "down";
      }
    }

    // ==================== سحب متحركة ====================
    const CLOUDS = [];
    for (let i = 0; i < 4; i++) {
      CLOUDS.push({ x: rng() * WORLD_W, y: 20 + rng() * (WORLD_H - 60), r: 22 + rng() * 20, speed: 5 + rng() * 7, alpha: 0.05 + rng() * 0.05 });
    }
    function updateClouds(dt) {
      for (const cl of CLOUDS) {
        cl.x += cl.speed * dt;
        if (cl.x - cl.r * 2 > WORLD_W) { cl.x = -cl.r * 2; cl.y = 20 + Math.random() * (WORLD_H - 60); }
      }
    }

    // ==================== أعمدة الإنارة ====================
    const LAMPS = [];
    for (const b of BUILDINGS) {
      const dx = b.doorX - PLAZA_X, dy = b.doorY - PLAZA_Y;
      const len = Math.hypot(dx, dy);
      const t = 0.55;
      const lx = PLAZA_X + dx * t - (dy / len) * 15;
      const ly = PLAZA_Y + dy * t + (dx / len) * 15;
      if (!nearAnyBuilding(lx, ly, 10)) LAMPS.push({ x: lx, y: ly });
    }

    // ==================== دورة الليل والنهار ====================
    const DAY_MS = 150000; // دورة كاملة كل دقيقتين ونصف تقريبًا
    function nightFactor(now) {
      const phase = (now % DAY_MS) / DAY_MS;      // 0..1
      const raw = (Math.cos(phase * Math.PI * 2) + 1) / 2; // 1 ليلاً، 0 نهارًا
      return raw * raw * 0.62;                    // نُبقي الليل مقروءًا
    }

    // ==================== طقس حسب الفصل ====================
    const WEATHER = [];
    function weatherKindFor(seasonKey) {
      if (seasonKey === "winter") return "snow";
      if (seasonKey === "autumn") return "leaf";
      if (seasonKey === "spring") return "petal";
      return null;
    }
    function updateWeather(dt, seasonKey) {
      const kind = weatherKindFor(seasonKey);
      if (!kind) { WEATHER.length = 0; return; }
      if (WEATHER.length && WEATHER[0].kind !== kind) WEATHER.length = 0;
      const cap = kind === "snow" ? 46 : 26;
      if (WEATHER.length < cap && Math.random() < 0.6) {
        WEATHER.push({
          kind, x: Math.random() * WORLD_W, y: -6,
          vy: kind === "snow" ? 14 + Math.random() * 16 : 22 + Math.random() * 22,
          sway: Math.random() * Math.PI * 2,
          swaySpeed: 0.8 + Math.random() * 1.4,
          size: kind === "snow" ? 1.4 + Math.random() * 1.6 : 2.2 + Math.random() * 2,
          spin: Math.random() * Math.PI,
        });
      }
      for (let i = WEATHER.length - 1; i >= 0; i--) {
        const p = WEATHER[i];
        p.sway += p.swaySpeed * dt;
        p.y += p.vy * dt;
        p.x += Math.sin(p.sway) * 10 * dt;
        p.spin += dt * 1.6;
        if (p.y > WORLD_H + 6) WEATHER.splice(i, 1);
      }
    }
    const LEAF_COLORS = ["#c9772a", "#b5761f", "#d29434", "#a35a1c"];
    function drawWeather(c) {
      for (const p of WEATHER) {
        if (p.kind === "snow") {
          c.fillStyle = "rgba(226,240,245,0.75)";
          c.beginPath(); c.arc(p.x, p.y, p.size, 0, Math.PI * 2); c.fill();
        } else if (p.kind === "leaf") {
          c.save(); c.translate(p.x, p.y); c.rotate(p.spin);
          c.fillStyle = LEAF_COLORS[Math.floor(p.size) % LEAF_COLORS.length];
          c.beginPath(); c.ellipse(0, 0, p.size * 1.5, p.size * 0.7, 0, 0, Math.PI * 2); c.fill();
          c.restore();
        } else {
          c.save(); c.translate(p.x, p.y); c.rotate(p.spin);
          c.fillStyle = "rgba(242,167,195,0.85)";
          c.beginPath(); c.ellipse(0, 0, p.size * 1.2, p.size * 0.6, 0, 0, Math.PI * 2); c.fill();
          c.restore();
        }
      }
    }

    // ==================== غبار الخطوات ====================
    const DUST = [];
    function updateDust(dt, moving) {
      if (moving && Math.random() < 0.35) {
        DUST.push({ x: player.x + player.w / 2 + (Math.random() - 0.5) * 6, y: player.y + player.h - 2, life: 0, max: 0.45, r: 1.5 + Math.random() * 1.5 });
      }
      for (let i = DUST.length - 1; i >= 0; i--) {
        const d = DUST[i];
        d.life += dt; d.r += dt * 3;
        if (d.life > d.max) DUST.splice(i, 1);
      }
    }

    // ==================== الأرقام الطائرة ====================
    function updateFloaters(dt) {
      for (let i = FLOATERS.length - 1; i >= 0; i--) {
        const f = FLOATERS[i];
        f.life += dt;
        if (f.life > f.max) FLOATERS.splice(i, 1);
      }
    }

    // ==================== رذاذ النافورة ====================
    const DROPS = [];
    function updateFountain(dt) {
      if (DROPS.length < 26 && Math.random() < 0.5) {
        const a = Math.random() * Math.PI * 2;
        DROPS.push({ x: PLAZA_X, y: PLAZA_Y, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12 - 22, life: 0, max: 0.9 + Math.random() * 0.4 });
      }
      for (let i = DROPS.length - 1; i >= 0; i--) {
        const d = DROPS[i];
        d.life += dt;
        d.vy += 46 * dt;
        d.x += d.vx * dt; d.y += d.vy * dt;
        if (d.life > d.max) DROPS.splice(i, 1);
      }
    }

    // ==================== رسم المباني (تفصيلية حسب النوع) ====================
    function drawBank(c, b) {
      const { x, y, w, h, color } = b;
      const roofH = 16;
      c.fillStyle = shade(color, -40);
      c.beginPath(); c.moveTo(x - 6, y + roofH); c.lineTo(x + w / 2, y - 10); c.lineTo(x + w + 6, y + roofH); c.closePath(); c.fill();
      c.fillStyle = shade(color, -15);
      c.fillRect(x, y + roofH, w, h - roofH);
      c.fillStyle = shade(color, 25);
      const cols = 4, colW = 6, gap = (w - cols * colW) / (cols + 1);
      for (let i = 0; i < cols; i++) c.fillRect(x + gap + i * (colW + gap), y + roofH + 6, colW, h - roofH - 16);
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
      c.fillStyle = shade(color, 45);
      c.beginPath(); c.arc(x + w / 2, y + roofH - 4, 4, 0, Math.PI * 2); c.fill();
    }

    function drawMarket(c, b) {
      const { x, y, w, h, color } = b;
      c.fillStyle = shade(color, -20);
      c.fillRect(x, y, w, h);
      c.fillStyle = shade(color, 15);
      c.fillRect(x, y - 8, w, 8);
      c.fillStyle = "#0a1e1a";
      c.fillRect(x + 8, y + 10, w - 16, 26);
      c.strokeStyle = shade(color, 30); c.lineWidth = 2;
      c.strokeRect(x + 8, y + 10, w - 16, 26);
      c.fillStyle = shade(color, 10);
      for (let r = 0; r < 2; r++) for (let col = 0; col < 3; col++) c.fillRect(x + 10 + col * ((w - 20) / 3), y + 46 + r * 16, 12, 10);
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
      c.strokeStyle = shade(color, 20); c.lineWidth = 2;
      c.beginPath(); c.moveTo(x + w - 12, y - 8); c.lineTo(x + w - 12, y - 18); c.stroke();
    }

    function drawGoals(c, b) {
      const { x, y, w, h, color } = b;
      c.strokeStyle = shade(color, -20); c.lineWidth = 5;
      c.beginPath(); c.moveTo(x + w / 2, y + h); c.lineTo(x + w / 2, y + 10); c.stroke();
      c.fillStyle = shade(color, -15);
      roundRect(c, x, y, w, h * 0.65, 6); c.fill();
      c.strokeStyle = shade(color, 30); c.lineWidth = 2;
      roundRect(c, x, y, w, h * 0.65, 6); c.stroke();
      c.strokeStyle = shade(color, 45); c.lineWidth = 2;
      c.beginPath(); c.arc(x + w / 2, y + h * 0.32, 10, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.arc(x + w / 2, y + h * 0.32, 5, 0, Math.PI * 2); c.stroke();
      c.fillStyle = shade(color, 45);
      c.beginPath(); c.arc(x + w / 2, y + h * 0.32, 1.6, 0, Math.PI * 2); c.fill();
    }

    function drawWork(c, b) {
      const { x, y, w, h, color } = b;
      c.fillStyle = shade(color, -20);
      c.fillRect(x, y, w, h);
      c.fillStyle = shade(color, 10);
      c.fillRect(x, y, w, 6);
      const rows = 3, cols = 3;
      for (let r = 0; r < rows; r++) for (let col = 0; col < cols; col++) {
        const lit = (r * cols + col) % 3 !== 1;
        c.fillStyle = lit ? "#f4d58d" : "#0a1e1a";
        c.fillRect(x + 10 + col * ((w - 20) / cols), y + 12 + r * ((h - 40) / rows), (w - 20) / cols - 6, (h - 40) / rows - 6);
      }
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
    }

    function drawHome(c, b) {
      const { x, y, w, h, color } = b;
      const roofH = 20;
      c.fillStyle = shade(color, -35);
      c.beginPath(); c.moveTo(x - 8, y + roofH); c.lineTo(x + w / 2, y - 14); c.lineTo(x + w + 8, y + roofH); c.closePath(); c.fill();
      c.fillStyle = shade(color, -10);
      c.fillRect(x, y + roofH, w, h - roofH);
      c.fillStyle = shade(color, -40);
      c.fillRect(x + w - 22, y - 6, 10, 18);
      c.fillStyle = "#f4d58d";
      c.fillRect(x + 10, y + roofH + 10, 16, 16);
      c.fillRect(x + w - 26, y + roofH + 10, 16, 16);
      c.strokeStyle = shade(color, -30); c.lineWidth = 1.5;
      c.strokeRect(x + 10, y + roofH + 10, 16, 16);
      c.strokeRect(x + w - 26, y + roofH + 10, 16, 16);
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
    }

    function drawTownHall(c, b) {
      const { x, y, w, h, color } = b;
      const roofH = 14;
      c.fillStyle = shade(color, -30);
      c.beginPath(); c.moveTo(x - 4, y + roofH); c.lineTo(x + w / 2, y - 8); c.lineTo(x + w + 4, y + roofH); c.closePath(); c.fill();
      c.fillStyle = shade(color, -10);
      c.fillRect(x, y + roofH, w, h - roofH);
      c.fillStyle = shade(color, -20);
      c.beginPath(); c.arc(x + w / 2, y - 8, 9, Math.PI, 0); c.fill();
      c.strokeStyle = shade(color, 15); c.lineWidth = 2;
      c.beginPath(); c.moveTo(x + w / 2, y - 17); c.lineTo(x + w / 2, y - 30); c.stroke();
      c.fillStyle = "#c9974a";
      c.fillRect(x + w / 2, y - 30, 10, 7);
      c.fillStyle = "#2a1c0d";
      c.beginPath(); c.arc(x + w / 2, y + h - 18, 9, Math.PI, 0); c.fill();
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
    }

    function drawLibrary(c, b) {
      const { x, y, w, h, color } = b;
      c.fillStyle = shade(color, -20);
      c.fillRect(x, y, w, h);
      c.fillStyle = shade(color, 15);
      c.fillRect(x, y, w, 8);
      const spineColors = ["#e74c3c", "#3498db", "#f1c40f", "#9b59b6", "#2ecc71", "#e67e22"];
      for (let r = 0; r < 2; r++) for (let i = 0; i < 8; i++) {
        c.fillStyle = spineColors[(i + r * 3) % spineColors.length];
        c.fillRect(x + 8 + i * ((w - 16) / 8), y + 14 + r * 18, (w - 16) / 8 - 2, 14);
      }
      c.fillStyle = "#2a1c0d";
      c.fillRect(x + w / 2 - 9, y + h - 18, 18, 18);
    }

    const BUILDING_DRAW = { bank: drawBank, market: drawMarket, goals: drawGoals, work: drawWork, home: drawHome, townhall: drawTownHall, library: drawLibrary };

    // ==================== الخلفية المُجهَّزة مسبقًا (لتفادي إعادة رسم التفاصيل الثابتة كل إطار) ====================
    const bgCanvas = document.createElement("canvas");
    bgCanvas.width = WORLD_W; bgCanvas.height = WORLD_H;
    const bgCtx = bgCanvas.getContext("2d");

    function renderBackground() {
      const season = SEASONS[seasonForMonth(state.month)];
      const c = bgCtx;
      c.clearRect(0, 0, WORLD_W, WORLD_H);
      const grad = c.createLinearGradient(0, 0, 0, WORLD_H);
      grad.addColorStop(0, season.ground[0]); grad.addColorStop(1, season.ground[1]);
      c.fillStyle = grad; c.fillRect(0, 0, WORLD_W, WORLD_H);

      for (const d of GROUND_DOTS) {
        c.fillStyle = d.tone < 0.5 ? "rgba(29,61,53,0.6)" : season.dot;
        c.fillRect(d.x, d.y, d.s, d.s);
      }

      // ممرات مرصوفة من الساحة إلى كل باب
      c.lineCap = "round";
      c.strokeStyle = "rgba(160,190,175,0.18)"; c.lineWidth = 16;
      for (const b of BUILDINGS) {
        c.beginPath(); c.moveTo(PLAZA_X, PLAZA_Y); c.lineTo(b.doorX, b.doorY); c.stroke();
      }
      c.strokeStyle = "rgba(200,225,210,0.10)"; c.lineWidth = 12;
      for (const b of BUILDINGS) {
        c.beginPath(); c.moveTo(PLAZA_X, PLAZA_Y); c.lineTo(b.doorX, b.doorY); c.stroke();
      }
      // خطوط بلاط عرضية على الممرات
      c.strokeStyle = "rgba(10,30,26,0.25)"; c.lineWidth = 1.5; c.lineCap = "butt";
      for (const b of BUILDINGS) {
        const dx = b.doorX - PLAZA_X, dy = b.doorY - PLAZA_Y;
        const len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
        for (let d = 14; d < len - 8; d += 13) {
          const px = PLAZA_X + ux * d, py = PLAZA_Y + uy * d;
          c.beginPath(); c.moveTo(px - uy * 6, py + ux * 6); c.lineTo(px + uy * 6, py - ux * 6); c.stroke();
        }
      }

      // حوض النافورة في الساحة
      c.beginPath(); c.arc(PLAZA_X, PLAZA_Y, 27, 0, Math.PI * 2);
      c.fillStyle = "rgba(160,190,175,0.18)"; c.fill();
      c.strokeStyle = "rgba(201,151,74,0.55)"; c.lineWidth = 3; c.stroke();
      c.beginPath(); c.arc(PLAZA_X, PLAZA_Y, 15, 0, Math.PI * 2);
      c.fillStyle = "rgba(74,144,201,0.40)"; c.fill();
      c.strokeStyle = "rgba(140,200,230,0.35)"; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = "rgba(201,151,74,0.75)";
      c.fillRect(PLAZA_X - 2.5, PLAZA_Y - 12, 5, 12);
      c.beginPath(); c.arc(PLAZA_X, PLAZA_Y - 13, 4, 0, Math.PI * 2); c.fill();

      for (const b of BUILDINGS) {
        c.beginPath(); c.ellipse(b.x + b.w / 2, b.y + b.h + 4, b.w * 0.45, 6, 0, 0, Math.PI * 2);
        c.fillStyle = "rgba(0,0,0,0.3)"; c.fill();
        (BUILDING_DRAW[b.id] || (() => {}))(c, b);
        c.font = "11px 'Noto Kufi Arabic', sans-serif";
        c.textAlign = "center"; c.textBaseline = "middle";
        c.fillStyle = "#e0e8e4";
        c.fillText(b.name, b.x + b.w / 2, b.y + b.h + 16);
      }

      renderedSeason = seasonForMonth(state.month);
    }
    renderBackground();

    function drawTree(c, t, season) {
      c.beginPath(); c.ellipse(t.x, t.y + 2, t.r * 0.5, t.r * 0.25, 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(0,0,0,0.25)"; c.fill();
      c.fillStyle = "#3a2a1a";
      c.fillRect(t.x - 2, t.y - t.r * 0.3, 4, t.r * 0.6);
      c.beginPath(); c.arc(t.x, t.y - t.r * 0.5, t.r, 0, Math.PI * 2);
      c.fillStyle = season.leaf; c.fill();
      c.beginPath(); c.arc(t.x - t.r * 0.3, t.y - t.r * 0.7, t.r * 0.6, 0, Math.PI * 2);
      c.fillStyle = season.leafHi; c.fill();
      if (season.blossom) {
        c.fillStyle = season.blossom;
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * Math.PI * 2 + t.r;
          c.beginPath(); c.arc(t.x + Math.cos(a) * t.r * 0.55, t.y - t.r * 0.5 + Math.sin(a) * t.r * 0.55, 1.6, 0, Math.PI * 2); c.fill();
        }
      }
    }

    // ==================== الشخصيات ====================
    const PLAYER_PALETTE = { shirt: "#c9974a", sleeve: "#b98a44", skin: "#e8b88a", hair: "#3a2a1a" };

    function drawCharacter(c, cx, cy, facing, animT, moving, palette) {
      const walk = moving ? Math.sin(animT * 12) : 0;
      const legOffset = walk * 4, armOffset = -walk * 3;
      const bob = moving ? Math.abs(Math.sin(animT * 12)) * 1.2 : 0;
      c.save();
      c.translate(cx, cy - bob);
      c.beginPath(); c.ellipse(0, 13 + bob, 9, 3, 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(0,0,0,0.35)"; c.fill();
      if (facing === "left") c.scale(-1, 1);
      c.fillStyle = "#2a1c0d";
      c.fillRect(-6, 4 + legOffset, 5, 10);
      c.fillRect(1, 4 - legOffset, 5, 10);
      c.fillStyle = palette.shirt;
      roundRect(c, -8, -6, 16, 14, 4); c.fill();
      c.fillStyle = palette.sleeve;
      c.fillRect(-10, -4 + armOffset, 4, 9);
      c.fillRect(6, -4 - armOffset, 4, 9);
      c.beginPath(); c.arc(0, -12, 7, 0, Math.PI * 2);
      c.fillStyle = palette.skin; c.fill();
      c.beginPath(); c.arc(0, -15, 7.2, Math.PI, Math.PI * 2);
      c.fillStyle = palette.hair; c.fill();
      if (facing !== "up") {
        c.fillStyle = "#2a1c0d";
        c.beginPath(); c.arc(-2.5, -12, 1, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(2.5, -12, 1, 0, Math.PI * 2); c.fill();
      }
      c.restore();
    }

    // ==================== مؤشرات حيّة فوق المباني تعكس وضعك المالي ====================
    function drawBuildingIndicators(now) {
      const d = derive(state);

      const bankB = BUILDINGS.find((b) => b.id === "bank");
      if (bankB) {
        const pct = Math.max(0, Math.min(1, state.emergency / state.emergencyTarget));
        const bw = bankB.w - 20, bx = bankB.x + 10, by = bankB.y + bankB.h - 26;
        ctx.fillStyle = "rgba(10,30,26,0.75)"; ctx.fillRect(bx, by, bw, 5);
        ctx.fillStyle = pct >= 1 ? "#2ecc71" : "#c9974a"; ctx.fillRect(bx, by, bw * pct, 5);
        if (pct >= 1) {
          const g = (Math.sin(now / 300) + 1) / 2;
          ctx.strokeStyle = `rgba(46,204,113,${0.3 + g * 0.4})`; ctx.lineWidth = 1.5;
          ctx.strokeRect(bx - 1.5, by - 1.5, bw + 3, 8);
        }
      }

      const marketB = BUILDINGS.find((b) => b.id === "market");
      if (marketB) {
        for (let i = 0; i < 3; i++) {
          const on = Math.sin(now / 400 + i) > 0;
          ctx.fillStyle = on ? "#2ecc71" : "#123b2a";
          ctx.fillRect(marketB.x + 12 + i * 10, marketB.y + 16, 6, 6);
        }
        const up = lastStockDelta >= 0;
        const ax = marketB.x + marketB.w - 20, ay = marketB.y + 23;
        ctx.fillStyle = up ? "#2ecc71" : "#e74c3c";
        ctx.beginPath();
        if (up) { ctx.moveTo(ax, ay - 6); ctx.lineTo(ax + 6, ay + 4); ctx.lineTo(ax - 6, ay + 4); }
        else { ctx.moveTo(ax, ay + 6); ctx.lineTo(ax + 6, ay - 4); ctx.lineTo(ax - 6, ay - 4); }
        ctx.closePath(); ctx.fill();
      }

      const homeB = BUILDINGS.find((b) => b.id === "home");
      if (homeB) {
        const t = (now / 1000) % 2;
        ctx.globalAlpha = Math.max(0, 1 - t / 2) * 0.4;
        ctx.beginPath(); ctx.arc(homeB.x + homeB.w - 17, homeB.y - 10 - t * 14, 3 + t * 3, 0, Math.PI * 2);
        ctx.fillStyle = "#cfd8d3"; ctx.fill();
        ctx.globalAlpha = 1;
        if (state.debt > 0) {
          ctx.fillStyle = "rgba(231,76,60,0.85)";
          roundRect(ctx, homeB.x + 4, homeB.y + 24, 20, 11, 3); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.font = "9px sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("دين", homeB.x + 14, homeB.y + 30);
        }
      }

      const goalsB = BUILDINGS.find((b) => b.id === "goals");
      if (goalsB && state.goals.length) {
        const best = Math.max(...state.goals.map((g) => Math.min(1, g.saved / g.target)));
        const gx = goalsB.x + goalsB.w / 2, gy = goalsB.y + goalsB.h * 0.32;
        ctx.beginPath(); ctx.arc(gx, gy, 10, -Math.PI / 2, -Math.PI / 2 + best * Math.PI * 2);
        ctx.strokeStyle = "#2ecc71"; ctx.lineWidth = 3; ctx.stroke();
      }

      const workB = BUILDINGS.find((b) => b.id === "work");
      if (workB && d.surplus > 0) {
        const g = (Math.sin(now / 320) + 1) / 2;
        ctx.fillStyle = `rgba(201,151,74,${0.55 + g * 0.45})`;
        ctx.font = "13px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("💰", workB.x + workB.w / 2, workB.y - 12 - g * 3);
      }
    }

    function draw() {
      const now = performance.now();
      const seasonKey = seasonForMonth(state.month);
      if (seasonKey !== renderedSeason) renderBackground();
      const season = SEASONS[seasonKey];
      const night = nightFactor(now);

      ctx.clearRect(0, 0, WORLD_W, WORLD_H);
      ctx.save();
      if (shake > 0.05) {
        ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
      }
      ctx.drawImage(bgCanvas, 0, 0);

      // رذاذ النافورة
      for (const dr of DROPS) {
        const a = Math.max(0, 1 - dr.life / dr.max);
        ctx.fillStyle = `rgba(150,210,240,${a * 0.8})`;
        ctx.fillRect(dr.x, dr.y, 2, 2);
      }

      // غبار خطوات اللاعب
      for (const d of DUST) {
        ctx.globalAlpha = Math.max(0, 1 - d.life / d.max) * 0.35;
        ctx.fillStyle = "#cfd8d3";
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      drawBuildingIndicators(now);

      // ترتيب حسب العمق: الأشجار والشخصيات تُرسم بترتيب موضعها الرأسي
      const entities = [];
      for (const t of TREES) entities.push({ footY: t.y, kind: "tree", ref: t });
      for (const n of NPCS) entities.push({ footY: n.y + 14, kind: "npc", ref: n });
      entities.push({ footY: player.y + player.h, kind: "player" });
      entities.sort((a, b) => a.footY - b.footY);
      for (const e of entities) {
        if (e.kind === "tree") drawTree(ctx, e.ref, season);
        else if (e.kind === "npc") drawCharacter(ctx, e.ref.x, e.ref.y, e.ref.facing, e.ref.animT, e.ref.moving, e.ref.palette);
        else drawCharacter(ctx, player.x + player.w / 2, player.y + player.h / 2, player.facing, player.animT, pressed.size > 0, PLAYER_PALETTE);
      }

      // أعمدة الإنارة (العمود نفسه فوق المشهد، وهالته تُضاف بعد ستارة الليل)
      for (const l of LAMPS) {
        ctx.fillStyle = "#3b4a44";
        ctx.fillRect(l.x - 1.5, l.y - 16, 3, 16);
        ctx.fillStyle = night > 0.12 ? "#f4d58d" : "#6b7a72";
        ctx.beginPath(); ctx.arc(l.x, l.y - 18, 3.4, 0, Math.PI * 2); ctx.fill();
      }

      // سحب تمر فوق المدينة
      for (const cl of CLOUDS) {
        ctx.fillStyle = `rgba(220,235,230,${cl.alpha})`;
        ctx.beginPath(); ctx.arc(cl.x, cl.y, cl.r, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cl.x + cl.r * 0.8, cl.y + 4, cl.r * 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cl.x - cl.r * 0.7, cl.y + 5, cl.r * 0.6, 0, Math.PI * 2); ctx.fill();
      }

      drawWeather(ctx);

      // صبغة الفصل فوق المشهد كله
      if (season.tint) {
        ctx.fillStyle = season.tint;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      }

      // ستارة الليل ثم مصادر الضوء الدافئة فوقها
      if (night > 0.02) {
        ctx.fillStyle = `rgba(12,24,48,${night})`;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const l of LAMPS) {
          const g = ctx.createRadialGradient(l.x, l.y - 16, 2, l.x, l.y - 16, 46);
          g.addColorStop(0, `rgba(255,214,140,${0.42 * night})`);
          g.addColorStop(1, "rgba(255,214,140,0)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(l.x, l.y - 16, 46, 0, Math.PI * 2); ctx.fill();
        }
        for (const b of BUILDINGS) {
          if (b.id === "goals") continue;
          const g = ctx.createRadialGradient(b.doorX, b.doorY - 8, 2, b.doorX, b.doorY - 8, 34);
          g.addColorStop(0, `rgba(255,206,128,${0.34 * night})`);
          g.addColorStop(1, "rgba(255,206,128,0)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(b.doorX, b.doorY - 8, 34, 0, Math.PI * 2); ctx.fill();
        }
        const fg = ctx.createRadialGradient(PLAZA_X, PLAZA_Y, 2, PLAZA_X, PLAZA_Y, 40);
        fg.addColorStop(0, `rgba(150,200,255,${0.22 * night})`);
        fg.addColorStop(1, "rgba(150,200,255,0)");
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(PLAZA_X, PLAZA_Y, 40, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      if (currentBuilding) {
        const glowT = (Math.sin(now / 220) + 1) / 2;
        ctx.beginPath();
        ctx.arc(currentBuilding.doorX, currentBuilding.doorY, 6 + glowT * 3, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(201,151,74,${0.4 + glowT * 0.4})`;
        ctx.lineWidth = 2; ctx.stroke();
      }

      // أرقام تطفو فوق اللاعب عند تغيّر صافي الثروة
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let i = 0; i < FLOATERS.length; i++) {
        const f = FLOATERS[i];
        const p = f.life / f.max;
        const fx = player.x + player.w / 2 + f.dx;
        const fy = player.y - 8 - p * 26 - i * 13;
        ctx.globalAlpha = Math.max(0, 1 - p);
        ctx.font = "bold 13px 'IBM Plex Mono', monospace";
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(10,30,26,0.85)";
        ctx.strokeText(f.text, fx, fy);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, fx, fy);
        ctx.globalAlpha = 1;
      }

      ctx.restore();

      // وميض أحمر خافت أثناء الاهتزاز (خسارة كبيرة)
      if (shake > 0.05) {
        ctx.fillStyle = `rgba(231,76,60,${Math.min(0.16, shake * 0.022)})`;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      }

      // شارة الفصل والوقت
      ctx.font = "10px 'Noto Kufi Arabic', sans-serif";
      ctx.textAlign = "right"; ctx.textBaseline = "top";
      ctx.fillStyle = "rgba(224,232,228,0.55)";
      ctx.fillText(`${season.name} · ${night > 0.3 ? "ليل" : "نهار"}`, WORLD_W - 8, 8);
    }

    // ==================== الحلقة الرئيسية ====================
    let lastTs = 0;
    function loop(ts) {
      const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
      lastTs = ts;
      const active = !isModalOpen();
      if (active) {
        updatePlayer(dt);
        updateNPCs(dt);
      }
      updateClouds(dt);
      updateFountain(dt);
      updateWeather(dt, seasonForMonth(state.month));
      updateDust(dt, active && pressed.size > 0);
      updateFloaters(dt);
      if (shake > 0) shake = Math.max(0, shake - dt * 9);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ==================== المدخلات ====================
    const KEY_MAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };
    window.addEventListener("keydown", (e) => {
      const dir = KEY_MAP[e.key];
      if (dir) { pressed.add(dir); e.preventDefault(); }
      if ((e.key === "Enter" || e.key === " " || e.key === "e") && currentBuilding && !isModalOpen()) currentBuilding.open();
      if (e.key === "Escape" && isModalOpen()) popModal();
    });
    window.addEventListener("keyup", (e) => {
      const dir = KEY_MAP[e.key];
      if (dir) pressed.delete(dir);
    });

    function bindDpad(id, dir) {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); pressed.add(dir); };
      const end = (e) => { e.preventDefault(); pressed.delete(dir); };
      el.addEventListener("pointerdown", start);
      el.addEventListener("pointerup", end);
      el.addEventListener("pointerleave", end);
      el.addEventListener("pointercancel", end);
    }
    bindDpad("btnUp", "up"); bindDpad("btnDown", "down"); bindDpad("btnLeft", "left"); bindDpad("btnRight", "right");

    document.getElementById("statsBtn").addEventListener("click", () => {
      document.getElementById("statsPanel").classList.toggle("open");
    });

    // ==================== واجهة المستخدم العلوية ====================
    function refreshHud() {
      const d = derive(state);
      document.getElementById("moodEmoji").textContent = state.emergency > 5000 ? "😊" : state.debt > 2000 ? "😰" : "🙂";
      document.getElementById("hudDate").textContent = `السنة ${state.year} · شهر ${state.month}`;
      document.getElementById("hudNet").innerHTML = `${fmt(d.netWorth)} <small>ريال</small>`;
      document.getElementById("statCash").textContent = fmt(state.cash);
      document.getElementById("statEmergency").textContent = fmt(state.emergency);
      document.getElementById("statInvest").textContent = fmt(d.totalInv);
      document.getElementById("statDebt").textContent = fmt(state.debt);
      const r = rankInfo(state);
      document.getElementById("rankName").textContent = r.name;
      document.getElementById("rankNext").textContent = r.nextLabel;
      const fill = document.getElementById("rankFill");
      fill.style.width = `${r.pct * 100}%`;
      fill.style.background = r.pct >= 1 ? "#2ecc71" : "#c9974a";
    }
    refreshHud();

    if (isFirstVisit) {
      pushModal(`
        <h2>🏙️ أهلاً بك في مدينة المال</h2>
        <p style="line-height:1.9;margin-bottom:14px">تحرّك بالأسهم أو أزرار الاتجاه، واقترب من أي مبنى للتفاعل معه:</p>
        <p style="line-height:2.1">🏦 البنك — صندوق الطوارئ<br>📈 البورصة — الاستثمار<br>💼 العمل — استلام الراتب وتخصيصه<br>🏠 المنزل — المصروفات والديون<br>🎯 لوحة الأهداف<br>📰 دار البلدية — التقارير<br>📖 المكتبة — المصطلحات المالية</p>
        <button class="btn" style="margin-top:16px" data-close-all>ابدأ</button>
      `);
    }
  </script>
</body>
</html>
