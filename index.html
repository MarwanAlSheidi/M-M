<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ZERO+ · مدينة المال</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Kufi Arabic', sans-serif; background: #0a1e1a; color: #e0e8e4; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    /* عمود مرن بارتفاع الشاشة: لولاه كانت لوحة الاتجاه تنزل تحت الطيّة
       في كل هاتف شائع، فيضطر اللاعب للتمرير للوصول إلى أزرار الحركة. */
    .app { max-width: 520px; margin: 0 auto; height: 100vh; height: 100dvh; background: #0d2621; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
    .hud, .rank-bar, .stats-panel, .controls { flex: 0 0 auto; }

    .hud { padding: 14px 16px; background: #0a1e1a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1d3d35; }
    .hud-mid { text-align: center; }
    .hud-date { font-size: 12px; color: #8aa89b; }
    .hud-net { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: #c9974a; }
    .hud-net small { font-size: 13px; font-weight: 400; opacity: 0.7; }
    #moodEmoji { font-size: 28px; }

    .rank-bar { margin: 10px 14px 0; }
    .rank-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; font-size: 12px; }
    .rank-head span:first-child { color: #c9974a; font-weight: 700; }
    .rank-head .muted { font-size: 10px; }
    .stats-panel { display: none; margin: 10px 12px; }
    /* شبكة تلتفّ بدل صفّ واحد — سبعة صناديق لا تتّسع في عرض الهاتف */
    .stats-panel.open { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat-box { background: #122e27; border-radius: 12px; padding: 8px 4px; text-align: center; border: 1px solid #1d3d35; min-width: 0; }
    .stat-box .label { font-size: 9px; color: #8aa89b; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-box .value { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }

    /* الرقعة تتقلّص لتملأ ما تبقّى، واللوحة تحافظ على نسبتها 512:640 */
    .stage { position: relative; margin: 10px 12px; border-radius: 14px; overflow: hidden; border: 1px solid #1d3d35;
             flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .stage canvas { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; background: #0a1e1a; }
    .interact-btn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: #c9974a; color: #0a1e1a; border: none; padding: 10px 20px; border-radius: 22px; font-weight: 700; font-family: inherit; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.45); cursor: pointer; }
    .interact-btn.hidden { display: none; }

    .controls { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px max(14px, env(safe-area-inset-bottom)); }
    .dpad { direction: ltr; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .dpad-row { display: flex; gap: 6px; }
    .dpad-btn { width: 50px; height: 50px; border-radius: 10px; background: #122e27; border: 1px solid #1d3d35; color: #c9974a; font-size: 18px; cursor: pointer; touch-action: none; }
    .dpad-btn:active { background: #1d3d35; }
    .dpad-spacer { width: 50px; height: 50px; }

    .card { background: #122e27; border-radius: 14px; padding: 16px; margin: 12px; border: 1px solid #1d3d35; }
    .card h3 { font-size: 16px; color: #c9974a; margin-bottom: 12px; }
    .progress { height: 10px; background: #1d3d35; border-radius: 5px; overflow: hidden; margin: 6px 0; }
    .progress-fill { height: 100%; border-radius: 5px; transition: width 0.3s ease; }
    .btn { background: #c9974a; color: #0a1e1a; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; font-size: 15px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .btn-sm { padding: 8px 16px; width: auto; font-size: 13px; }
    .btn-outline { background: transparent; border: 1px solid #c9974a; color: #c9974a; }
    .term { color: #c9974a; text-decoration: underline dotted; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .modal { background: #122e27; border-radius: 18px; padding: 24px; max-width: 400px; width: 100%; border: 1px solid #c9974a; max-height: 80vh; overflow-y: auto; }
    .modal h2 { color: #c9974a; margin-bottom: 16px; font-size: 20px; }
    input { width: 100%; padding: 10px; background: #0a1e1a; border: 1px solid #1d3d35; color: #e0e8e4; border-radius: 8px; font-family: inherit; margin: 6px 0 14px; font-size: 15px; }
    input[type=range] { accent-color: #c9974a; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .slider-row span { font-size: 13px; }
    .slider-row .val { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #c9974a; }
    .row-actions { display: flex; gap: 8px; align-items: center; }
    .row-actions input { margin: 0; }
    .event-art { width: 100%; height: auto; display: block; background: #0a1e1a; border: 1px solid #1d3d35; border-radius: 10px; margin-bottom: 4px; }
    .celebrate-art { width: 100%; height: auto; display: block; background: #0a1e1a; border-radius: 10px; margin-bottom: 12px; }
    .event-btn { background: #1d3d35; border: 1px solid #2a5043; color: #e0e8e4; padding: 12px; border-radius: 8px; width: 100%; margin: 6px 0; cursor: pointer; font-family: inherit; font-size: 14px; text-align: right; transition: background 0.2s; }
    .event-btn:hover { background: #2a5043; }
    .inline-error { color: #e74c3c; font-size: 13px; margin: -8px 0 12px; min-height: 16px; }
    .muted { color: #8aa89b; }
    .term-row { padding: 10px 0; border-bottom: 1px solid #1d3d35; cursor: pointer; }
    @media (max-width: 380px) { .stats-panel.open { grid-template-columns: repeat(3, 1fr); } }
    /* شاشات قصيرة: نقلّص الهوامش والأزرار كي تبقى الرقعة مفيدة الحجم */
    @media (max-height: 700px) {
      .hud { padding: 8px 14px; }
      .hud-net { font-size: 19px; }
      #moodEmoji { font-size: 23px; }
      .rank-bar { margin: 6px 14px 0; }
      .stage { margin: 6px 10px; }
      .dpad-btn { width: 44px; height: 44px; font-size: 16px; }
      .dpad { gap: 4px; }
      .dpad-row { gap: 4px; }
      .controls { padding: 6px 16px max(10px, env(safe-area-inset-bottom)); }
    }
    @media (max-height: 580px) {
      .dpad-btn { width: 38px; height: 38px; font-size: 14px; }
      .rank-bar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud">
      <span id="moodEmoji">🙂</span>
      <div class="hud-mid">
        <div class="hud-date" id="hudDate">السنة 1 · شهر 1</div>
        <div class="hud-net" id="hudNet">0 <small>ريال</small></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" id="soundBtn" title="الصوت">🔊</button>
        <button class="btn btn-sm" id="statsBtn">📊</button>
      </div>
    </div>

    <div class="rank-bar">
      <div class="rank-head">
        <span id="rankName">مبتدئ</span>
        <span class="muted" id="rankNext"></span>
      </div>
      <div class="progress" style="height:6px;margin:0"><div class="progress-fill" id="rankFill" style="width:0%;background:#c9974a"></div></div>
    </div>

    <div class="stats-panel" id="statsPanel">
      <div class="stat-box"><div class="label">💰 الجاري</div><div class="value" id="statCash">0</div></div>
      <div class="stat-box"><div class="label">🛡 الطوارئ</div><div class="value" id="statEmergency">0</div></div>
      <div class="stat-box"><div class="label">📈 استثمارات</div><div class="value" id="statInvest">0</div></div>
      <div class="stat-box"><div class="label">💳 ديون</div><div class="value" id="statDebt">0</div></div>
      <div class="stat-box"><div class="label">🏠 المنزل</div><div class="value" id="statHome">0</div></div>
      <div class="stat-box"><div class="label">😊 الرضا</div><div class="value" id="statMorale">0</div></div>
      <div class="stat-box"><div class="label">🏅 ائتماني</div><div class="value" id="statCredit">0</div></div>
    </div>

    <div class="stage">
      <canvas id="game" width="512" height="640"></canvas>
      <button class="interact-btn hidden" id="interactBtn"></button>
    </div>

    <div class="controls">
      <div class="dpad-spacer"></div>
      <div class="dpad">
        <button class="dpad-btn" id="btnUp">▲</button>
        <div class="dpad-row">
          <button class="dpad-btn" id="btnLeft">◀</button>
          <button class="dpad-btn" id="btnDown">▼</button>
          <button class="dpad-btn" id="btnRight">▶</button>
        </div>
      </div>
      <div class="dpad-spacer"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script>
    const fmt = (n) => Math.round(n).toLocaleString("en-US");

    // كل نص يكتبه اللاعب (أسماء الأهداف مثلاً) يمرّ عبر هذه قبل الحقن في innerHTML.
    // بدونها كان اسم هدف مثل <img onerror=...> يُحقن كعنصر حقيقي في الصفحة.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));

    // ==================== القاموس المالي ====================
    const DICTIONARY = {
      "الفائدة المركبة": "الفائدة التي تُحسب على أصل المبلغ + الفوائد السابقة. قوتها تظهر مع الزمن.",
      "التضخم": "ارتفاع عام في الأسعار يقلل من القوة الشرائية للنقود مع الوقت.",
      "التنويع": "توزيع الاستثمارات على أصول مختلفة لتقليل المخاطر.",
      "نسبة الدين إلى الدخل": "إجمالي الأقساط الشهرية ÷ الدخل الشهري. يُنصح ألا تتجاوز 35%.",
      "الدين إلى الدخل السنوي": "إجمالي دينك ÷ دخلك السنوي. مقياس لحجم الدين نفسه لا لعبء قسطه، وهو ما يحرّك تصنيفك الائتماني في اللعبة.",
      "التصنيف الائتماني": "درجة من 300 إلى 850 تعكس انضباطك في الدين. كلما ارتفعت انخفضت الفائدة التي تدفعها على قروضك.",
      "الاستقلال المالي": "أن تكفي عوائد أصولك المُدِرّة للدخل مصروفاتك دون حاجة إلى راتب. لا يُحتسب فيه بيت السكن لأنه لا يولّد دخلاً.",
      "الثروة المُدِرّة للدخل": "الأصول التي تنتج عائدًا: النقد والطوارئ والاستثمارات. تُستثنى منها دار السكن لأنك تعيش فيها ولا تبيعها لتغطية مصروفاتك.",
      "منحة الأرض": "أرض سكنية تُخصَّص للمواطن العُماني بناءً على طلبه. تختصر أكبر بند في كلفة التملك، ويبقى عليك تمويل البناء.",
      "قرض الإسكان": "تمويل مدعوم طويل الأجل لبناء المسكن بفائدة منخفضة. قسطه ثابت شهريًا، ويقلّ رصيده مع كل دفعة.",
      "حقوق الملكية": "ما تملكه فعلاً من المنزل = ما أنفقته على بنائه ناقص ما تبقّى من قرضه.",
      "البناء التدريجي": "إنجاز المسكن على مراحل بحسب ما يتوفر من مال، بدل انتظار المبلغ كاملاً. شائع في عُمان ويقلل الحاجة للاقتراض.",
      "تضخّم نمط الحياة": "ارتفاع إنفاقك كلما ارتفع دخلك، فيبقى فائضك كما هو رغم زيادة الراتب.",
      "الزكاة": "ركن من أركان الإسلام: 2.5% سنويًا من المال الزكوي إذا بلغ النصاب وحال عليه الحول. تُستثنى دار السكن وحاجاتك الأصلية، ويُخصم الدين الحالّ وما يستحق من أقساط طويلة الأجل خلال السنة. (وللمسألة تفصيل عند أهل العلم، وما في اللعبة تبسيط تعليمي.)",
      "النصاب": "الحد الأدنى للمال الذي تجب فيه الزكاة، ويُقدَّر بقيمة 85 جرامًا من الذهب.",
      "الحول": "مرور سنة كاملة على بلوغ المال النصاب، وعندها تجب الزكاة.",
      "التأمين": "دفع مبلغ صغير منتظم لتفادي خسارة كبيرة مفاجئة. لا يمنع الحدث لكنه يحدّ من أثره على مالك.",
      "الاستثمار في الذات": "إنفاق على تعليمك ومهاراتك. عائده يظهر في دخلك مدى الحياة، وغالبًا يفوق عائد الأصول المالية.",
      "تكلفة الفرصة البديلة": "ما تخسره من أفضل خيار تركته. كل ريال تنفقه اليوم هو ريال لم يُستثمر لينمو.",
      "صندوق الطوارئ": "مبلغ يعادل 3-6 أشهر من المصروفات، يستخدم فقط في الحالات الطارئة.",
      "العائد على الاستثمار": "الربح أو الخسارة من الاستثمار مقارنة بتكلفته الأصلية.",
      "السيولة": "سرعة تحويل الأصل إلى نقد بدون خسارة كبيرة في القيمة.",
      "المخاطر": "احتمال خسارة جزء من رأس المال المستثمر.",
      "الرافعة المالية": "استخدام الديون لزيادة حجم الاستثمارات، مما يضخم الأرباح والخسائر."
    };

    // ==================== الحالة الأولية ====================
    // ==================== الزكاة ====================
    // 2.5% سنويًا على الأموال الزكوية إذا بلغت النصاب وحال عليها الحول.
    // تُستثنى دار السكن وحاجاتك الأصلية، ويُخصم الدين.
    const ZAKAT_RATE = 0.025;
    const ZAKAT_NISAB = 3000; // نصاب تقديري بقيمة 85 جرامًا من الذهب

    function zakatableWealth(s) {
      const inv = Object.values(s.investments).reduce((a, i) => a + i.amount, 0);
      // دار السكن ليست من أموال الزكاة. ويُخصم الدين الحالّ كاملاً، أما قرض
      // الإسكان طويل الأجل فيُخصم منه ما يستحق خلال السنة فقط لا رصيده كله —
      // وإلا لأسقط قرضٌ لخمس عشرة سنة الزكاةَ طوال مدته.
      const h = s.housing || INITIAL_STATE.housing;
      const housingDueThisYear = Math.min(h.loan || 0, (h.loanPayment || 0) * 12);
      return Math.max(0, s.cash + s.emergency + inv - s.debt - housingDueThisYear);
    }
    function zakatDue(s) {
      const w = zakatableWealth(s);
      return w >= ZAKAT_NISAB ? Math.round(w * ZAKAT_RATE) : 0;
    }

    // ==================== التعليم والمهارات ====================
    const COURSES = [
      { level: 1, name: "دورة مهنية", cost: 400, months: 3, raise: 0.08, desc: "شهادة قصيرة ترفع دخلك 8%." },
      { level: 2, name: "دبلوم تخصصي", cost: 1200, months: 5, raise: 0.15, desc: "دبلوم يرفع دخلك 15%." },
      { level: 3, name: "شهادة احترافية", cost: 3000, months: 8, raise: 0.25, desc: "اعتماد مهني يرفع دخلك 25%." },
    ];
    function nextCourse(s) {
      return COURSES.find((c) => c.level === (s.education?.level ?? 0) + 1) || null;
    }

    // ==================== الإنجازات ====================
    const ACHIEVEMENTS = [
      // يُقاس بما ادّخرته واستثمرته فعلاً لا بما بدأت به: اللاعب يبدأ
      // بـ1,150 قابلة للاستثمار، فشرط "أول ألف" كان يتحقق قبل أي فعل.
      { id: "first_save",  name: "أول ألف",            icon: "💰", test: (s, d) => s.emergency + d.totalInv >= 1000 },
      { id: "emergency",   name: "طوارئ ٦ أشهر",       icon: "🛡", test: (s, d) => s.emergency >= d.emergencyTarget },
      { id: "investor",    name: "أول استثمار",        icon: "📈", test: (s) => Object.values(s.investments).some((i) => i.cost > 0) },
      { id: "diversified", name: "محفظة متنوعة",       icon: "🧺", test: (s) => Object.values(s.investments).filter((i) => i.amount > 0).length >= 3 },
      // يتطلب أن تكون قد حملت دينًا ثم سدّدته؛ الشرط السابق كان يُمنح
      // لمن لم يستدن قط لأن اللاعب يبدأ بلا دين أصلاً.
      { id: "debt_free",   name: "سدّد ديونه",         icon: "🕊", test: (s) => s.hadDebt === true && s.debt === 0 },
      { id: "landowner",   name: "صاحب أرض",           icon: "🏜", test: (s) => ["land", "building", "owned"].includes(s.housing.stage) },
      { id: "homeowner",   name: "بيت تملكه",          icon: "🏡", test: (s) => s.housing.stage === "owned" },
      { id: "zakat3",      name: "زكّى ٣ سنوات",       icon: "🤲", test: (s) => (s.zakat?.paidCount ?? 0) >= 3 },
      { id: "educated",    name: "طوّر مهاراته",       icon: "🎓", test: (s) => (s.education?.level ?? 0) >= 1 },
      { id: "scholar",     name: "شهادة احترافية",     icon: "🏅", test: (s) => (s.education?.level ?? 0) >= 3 },
      { id: "insured",     name: "مؤمَّن",              icon: "☂", test: (s) => s.insurance?.health },
      { id: "goal_done",   name: "حقق هدفًا",           icon: "🎯", test: (s) => s.goals.some((g) => g.done) },
      { id: "excellent",   name: "ائتمان ممتاز",       icon: "⭐", test: (s) => s.creditScore >= 750 },
      { id: "independent", name: "استقلال مالي",       icon: "🏆", test: (s, d) => d.investableNetWorth >= fiTarget(s) },
    ];

    // ==================== الإسكان (المسار العُماني) ====================
    // في عُمان أغلب الأسر تمتلك مسكنها: منحة أرض سكنية، ثم بناء تدريجي
    // بتمويل جزئي من قرض إسكان مدعوم. متوسط بناء/شراء المنزل ~50,000 ريال.
    const HOME_COST = 50000;        // كلفة البناء الكاملة
    const LAND_WAIT_MONTHS = 6;     // انتظار تخصيص منحة الأرض
    const MAX_HOUSING_LOAN = 30000; // سقف قرض الإسكان
    const HOUSING_LOAN_RATE = 0.0025; // ~3% سنويًا (مدعوم)
    const HOUSING_LOAN_TERM = 180;  // 15 سنة

    const BUILD_PHASES = [
      { at: 0.00, name: "أرض فضاء" },
      { at: 0.15, name: "أساسات" },
      { at: 0.40, name: "هيكل وجدران" },
      { at: 0.70, name: "سقف ونوافذ" },
      { at: 0.90, name: "تشطيبات" },
      { at: 1.00, name: "مكتمل" },
    ];
    function buildPhase(progress) {
      let p = BUILD_PHASES[0];
      for (const ph of BUILD_PHASES) if (progress >= ph.at) p = ph;
      return p;
    }

    const INITIAL_STATE = {
      cash: 700,
      emergency: 450,
      investments: {
        stocks: { amount: 0, cost: 0 },
        bonds: { amount: 0, cost: 0 },
        realEstate: { amount: 0, cost: 0, rentalIncome: 0 },
        crypto: { amount: 0, cost: 0 },
      },
      debt: 0,
      monthlyIncome: 1000,          // متوسط الأجور في عُمان
      monthlyExpenses: 600,         // منها إيجار
      rent: 220,                    // جزء الإيجار، يسقط عند التملك
      creditScore: 700,
      morale: 70,
      hadDebt: false,
      insurance: { health: false, premium: 25 },

    // ==================== الأحداث المالية ====================
    const EVENTS = [
      // لا تُسرَّح من وظيفة أنت أصلاً خارجها: لا يظهر ما دام أثر خفض دخل نشطًا

      ]},
      { id: "hajj", title: "فريضة الحج", desc: "تتوفر لك فرصة أداء الحج هذا العام بتكلفة 1,200 ريال.",

        { label: "أؤجلها هذا العام", effect: (s) => ({ ...s, eventLog: [...s.eventLog, "أجّلت الحج"] }) }
      ]},
      // نذكر الاحتمال والعائدين صراحةً: المقامرة بلا معرفة الاحتمالات ليست
      // قرارًا ماليًا، والغرض أن يزن اللاعب المخاطرة لا أن يخمّن.
      { id: "side_business", title: "فرصة عمل حر",
        desc: "مشروع صغير برأس مال 800 ريال: فرصة نجاح تقارب 55% تعيد 1,600، وإلا استرددت 200 فقط.",
        when: (s) => s.cash >= 800, choices: [

              morale: Math.min(100, Math.max(0, (s.morale ?? 70) + (win ? 8 : -8))),

        { label: "احتفظ بنفس نمط الحياة", effect: (s) => ({ ...s, monthlyIncome: Math.round(s.monthlyIncome * 1.15), eventLog: [...s.eventLog, "ترقية - وفر الزيادة"] }) },
        { label: "ارفع مستوى المعيشة قليلاً", effect: (s) => ({ ...s, monthlyIncome: Math.round(s.monthlyIncome * 1.15), monthlyExpenses: Math.round(s.monthlyExpenses * 1.08), eventLog: [...s.eventLog, "ترقية - رفع معيشة"] }) }
      ]},
    ];

    // ==================== الدوال المساعدة ====================
    // ==================== الرضا (المعنويات) ====================
    // الإنفاق الشخصي يشتري رضًا حقيقيًا: المال يذهب فعلاً، لكن إهماله يسبب إرهاقًا
    // يخفض دخلك. فيصبح "ادخر كل شيء" استراتيجية لها ثمن، لا خيارًا مجانيًا.
    const MORALE_BURNOUT = 25, MORALE_HIGH = 85;
    function moraleModifier(morale) {
      if (morale < MORALE_BURNOUT) return -0.12; // إرهاق: أداء أضعف ودخل أقل
      if (morale >= MORALE_HIGH) return 0.04;    // اندفاع: أداء أفضل
      return 0;
    }
    function moraleLabel(morale) {
      if (morale < MORALE_BURNOUT) return { text: "مُرهَق", color: "#e74c3c", emoji: "😫" };
      if (morale < 50) return { text: "متوتر", color: "#e67e22", emoji: "😟" };
      if (morale < MORALE_HIGH) return { text: "مرتاح", color: "#c9974a", emoji: "🙂" };
      return { text: "متحمّس", color: "#2ecc71", emoji: "😄" };
    }

    // ==================== التصنيف الائتماني ====================
    // يتحرك مع نسبة الدين إلى الدخل، ويحدّد الفائدة الشهرية على ديونك.
    function creditTarget(s) {
      const dti = s.monthlyIncome > 0 ? s.debt / (s.monthlyIncome * 12) : 2;
      return Math.max(300, Math.min(850, Math.round(850 - dti * 700)));
    }
    function debtMonthlyRate(score) {
      return 0.004 + ((850 - score) / 550) * 0.010; // ~0.4% عند 850 و~1.4% عند 300
    }
    function creditLabel(score) {
      if (score >= 750) return { text: "ممتاز", color: "#2ecc71" };
      if (score >= 670) return { text: "جيد", color: "#c9974a" };
      if (score >= 580) return { text: "متوسط", color: "#e67e22" };
      return { text: "ضعيف", color: "#e74c3c" };
    }

    function derive(state) {
      const tempEffects = state.tempEffects || [];
      const incomeAdj = tempEffects.filter((e) => e.type === "income").reduce((a, e) => a + e.amount, 0);
      const expenseAdj = tempEffects.filter((e) => e.type === "expense").reduce((a, e) => a + e.amount, 0);
      const moraleMod = moraleModifier(state.morale ?? 70);
      // أرضية عند الصفر: مهما تراكمت آثار خفض الدخل لا يصبح الراتب سالبًا
      // (لا تدفع لصاحب العمل). كان تكرار فقدان الوظيفة يهبط بالدخل تحت الصفر.
      const effIncome = Math.max(0, Math.round((state.monthlyIncome + incomeAdj) * (1 + moraleMod)));
      const effExpenses = state.monthlyExpenses + expenseAdj;
      const surplus = effIncome - effExpenses;
      const totalInv = Object.values(state.investments).reduce((sum, inv) => sum + inv.amount, 0);
      // ما بنيته من المنزل أصل تملكه، وقرض الإسكان التزام عليك — وإلا بدا البناء
      // وكأنه تبديد لثروتك بينما هو تحويلها من نقد إلى عقار.
      const housing = state.housing || INITIAL_STATE.housing;
      const homeEquity = (housing.built || 0) - (housing.loan || 0);
      const netWorth = state.cash + state.emergency + totalInv + homeEquity - state.debt;
      // الثروة المُدِرّة للدخل: تستثني منزل السكن وقرضه، لأن البيت الذي تسكنه
      // لا يموّل مصروفاتك. الاستقلال المالي يُقاس بها لا بصافي الثروة كاملًا.
      const investableNetWorth = state.cash + state.emergency + totalInv - state.debt;
      const coverage = effExpenses > 0 ? state.emergency / effExpenses : 0;
      // هدف صندوق الطوارئ يتبع مصروفاتك الفعلية (6 أشهر) بدل رقم ثابت يتقادم
      const emergencyTarget = Math.round(effExpenses * 6);
      return { surplus, netWorth, investableNetWorth, homeEquity, totalInv, coverage, effIncome, effExpenses, emergencyTarget };
    }

    // ==================== نموذج الأصول ====================
    // عوائد شهرية واقعية: لا يوجد أصل يتفوّق على البقية في كل شيء.
    // العملات الرقمية أعلى عائدًا متوقعًا لكنها تحمل تقلبًا هائلاً واحتمال انهيار مفاجئ،
    // فيصبح التنويع خيارًا حقيقيًا بدل أن يكون نصيحة في القاموس فقط.
    const ASSETS = {
      bonds:      { label: "سندات",        mean: 0.0035, spread: 0.0015, income: 0,      crashP: 0,    crashMag: 0,    risk: "منخفضة جدًا" },
      stocks:     { label: "أسهم",          mean: 0.0085, spread: 0.055,  income: 0,      crashP: 0,    crashMag: 0,    risk: "متوسطة" },
      realEstate: { label: "عقار",          mean: 0.0035, spread: 0.012,  income: 0.0045, crashP: 0,    crashMag: 0,    risk: "منخفضة" },
      crypto:     { label: "عملات رقمية",   mean: 0.022,  spread: 0.22,   income: 0,      crashP: 0.03, crashMag: 0.30, risk: "عالية جدًا" },
    };
    // العائد السنوي المتوقع بعد احتساب احتمال الانهيار، لعرضه للاعب
    function expectedAnnual(key) {
      const a = ASSETS[key];
      const m = a.mean + a.income - a.crashP * a.crashMag;
      return (Math.pow(1 + m, 12) - 1) * 100;
    }
    function drawAssetReturn(key) {
      const a = ASSETS[key];
      let r = a.mean + (Math.random() * 2 - 1) * a.spread;
      let crashed = false;
      if (a.crashP && Math.random() < a.crashP) { r -= a.crashMag; crashed = true; }
      return { growth: r, income: a.income, crashed };
    }

    // ==================== الرتب ونهاية اللعبة ====================
    // هدف الاستقلال المالي: ثروة تعادل 8 أضعاف المصروفات السنوية.
    function fiTarget(s) { return s.monthlyExpenses * 12 * 8; }
    const BANKRUPT_AT = -2500;

    const RANKS = [
      { min: -Infinity, name: "متعثّر" },
      { min: 0, name: "مبتدئ" },
      { min: 2500, name: "مدّخر" },
      { min: 12000, name: "مستثمر" },
      { min: 30000, name: "مستثمر متمرّس" },
      { min: 50000, name: "قريب من الاستقلال" },
    ];

    // يُقاس السلّم بالثروة المُدِرّة للدخل لا بصافي الثروة، لأنه سلّم نحو
    // الاستقلال المالي: من يملك بيته ولا يملك استثمارات كان يُسمّى "قريب من
    // الاستقلال" وهو لم يقطع سُبع الطريق. أما "متعثّر" فتُقاس بصافي الثروة
    // كاملًا، إذ لا يصح وصف من يملك بيته خالصًا بالتعثّر.
    function rankInfo(s) {
      const d = derive(s);
      const fi = fiTarget(s);
      if (d.investableNetWorth >= fi) return { name: "مستقل ماليًا 🏆", pct: 1, nextLabel: "اكتمل" };
      if (d.netWorth < 0) {
        const pct = Math.max(0, Math.min(1, (d.netWorth - BANKRUPT_AT) / (0 - BANKRUPT_AT)));
        return { name: RANKS[0].name, pct, nextLabel: "التالي عند 0" };
      }
      const w = Math.max(0, d.investableNetWorth);
      let idx = 1;
      for (let i = 1; i < RANKS.length; i++) if (w >= RANKS[i].min) idx = i;
      const cur = RANKS[idx];
      const nextMin = idx + 1 < RANKS.length ? RANKS[idx + 1].min : fi;
      const pct = Math.max(0, Math.min(1, (w - cur.min) / (nextMin - cur.min)));
      return { name: cur.name, pct, nextLabel: `التالي عند ${fmt(nextMin)}` };
    }

    function cloneInvestments(inv) {
      return {
        stocks: { ...inv.stocks },
        bonds: { ...inv.bonds },
        realEstate: { ...inv.realEstate },
        crypto: { ...inv.crypto },
      };
    }

    // ==================== الحالة والحفظ ====================
    const SAVE_KEY = "zeroGameStateV1";
    let isFirstVisit = false;
    let lastStockDelta = 0;   // آخر تغيّر في الأسهم، يُستخدم لسهم المؤشر فوق البورصة
    let lastAssetMoves = {};  // آخر تغيّر لكل أصل، لعرضه في البورصة
    const FLOATERS = [];    // أرقام تطفو عند تغيّر صافي الثروة
    let state = loadState();

    // دمج عميق: الدمج السطحي كان يُبقي الكائنات المتداخلة من الحفظ القديم كما هي،
    // فيغيب عنها أي حقل أُضيف لاحقًا. مثال حقيقي: حفظ قديم في مرحلة "waiting"
    // بلا waitMonths كان يعطي undefined - 1 = NaN، و NaN <= 0 خطأ دائمًا،
    // فيعلق اللاعب في انتظار منحة الأرض إلى الأبد.
    function mergeDefaults(defaults, saved) {
      if (Array.isArray(defaults)) return Array.isArray(saved) ? saved : structuredClone(defaults);
      if (defaults && typeof defaults === "object") {
        const src = saved && typeof saved === "object" && !Array.isArray(saved) ? saved : {};
        const out = {};
        for (const k of Object.keys(defaults)) out[k] = mergeDefaults(defaults[k], src[k]);
        // نحتفظ بأي مفاتيح إضافية في الحفظ لا نعرفها (توافق للأمام)
        for (const k of Object.keys(src)) if (!(k in out)) out[k] = src[k];
        return out;
      }
      return saved === undefined || saved === null || (typeof defaults === "number" && !Number.isFinite(saved))
        ? defaults
        : saved;
    }

    // قد يرمي التخزين استثناءً (تصفّح خاص، امتلاء الحصة، تعطيله من المستخدم).
    // اللعبة تبقى قابلة للعب بلا حفظ، فنبتلع الخطأ بدل أن نُسقط الإجراء الجاري.
    function saveState() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch { /* اللعب يستمر بلا حفظ */ }
    }
    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { /* تجاهل */ } }
    function lsRemove(k) { try { localStorage.removeItem(k); } catch { /* تجاهل */ } }

    function loadState() {
      try {
        const saved = lsGet(SAVE_KEY);
        if (!saved) { isFirstVisit = true; return structuredClone(INITIAL_STATE); }
        const parsed = JSON.parse(saved);
        if (!parsed || typeof parsed !== "object") throw new Error("bad save");
        return mergeDefaults(structuredClone(INITIAL_STATE), parsed);
      } catch {
        isFirstVisit = true;
        return structuredClone(INITIAL_STATE);
      }
    }

    function setState(next) {
      const prevNetWorth = derive(state).netWorth;
      state = next;
      // نتذكّر أنك حملت دينًا يومًا، ليصبح إنجاز السداد مستحقًا لا مجانيًا
      if (state.debt > 0) state.hadDebt = true;
      saveState();
      const delta = derive(state).netWorth - prevNetWorth;
      if (Math.abs(delta) >= 1) {
        spawnFloater(delta);
        (delta > 0 ? SFX.coin : SFX.spend)();
      }
      checkAchievements();
      refreshHud();
      checkEnding();
    }

    // تُفحص بعد كل تغيير؛ الإنجاز يُمنح مرة واحدة ويظهر كشارة طائرة
    function checkAchievements() {
      const d = derive(state);
      if (!state.achievements) state.achievements = [];
      for (const a of ACHIEVEMENTS) {
        if (state.achievements.includes(a.id)) continue;
        let ok = false;
        try { ok = a.test(state, d); } catch { ok = false; }
        if (ok) {
          state.achievements.push(a.id);
          state.eventLog = [...state.eventLog, `${a.icon} إنجاز: ${a.name}`];
          BADGES.push({ icon: a.icon, name: a.name, life: 0, max: 2.6 });
          SFX.badge();
        }
      }
      saveState();
    }
    const BADGES = [];

    // تُستدعى بعد كل تغيير؛ تعرض شاشة النهاية مرة واحدة فقط
    function checkEnding() {
      if (state.finished) return;
      const d = derive(state);
      const nw = d.netWorth;
      // الفوز يقاس بالثروة المُدِرّة للدخل: امتلاك بيت السكن وحده لا يعني استقلالًا ماليًا
      if (d.investableNetWorth >= fiTarget(state)) {
        state.finished = "win";
        saveState();
        showEnding("win");
      } else if (nw <= BANKRUPT_AT) {
        state.finished = "lose";
        saveState();
        showEnding("lose");
      }
    }

    function resetGame() {
      lsRemove(SAVE_KEY);
      state = structuredClone(INITIAL_STATE);
      saveState();
      // نعيد اللاعب إلى الساحة أيضًا؛ بدونها تبدأ الجولة الجديدة وأنت واقف
      // عند باب مبنى من الجولة السابقة وزر الدخول ظاهر.
      if (typeof player !== "undefined") {
        player.x = 224; player.y = 352;
        player.facing = "down";
        if (typeof pressed !== "undefined") pressed.clear();
      }
      closeAllModals();
      refreshHud();
    }

    // ==================== الصوت (مولّد بالكامل، بلا ملفات خارجية) ====================
    let audioCtx = null;
    let soundOn = lsGet("zeroSound") !== "off";
    function ensureAudio() {
      if (!soundOn) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    // نغمة بسيطة؛ تُتجاهل بصمت إن لم يدعم المتصفح الصوت
    function tone(freq, dur = 0.12, type = "sine", gain = 0.05, delay = 0) {
      const ac = ensureAudio();
      if (!ac) return;
      try {
        const osc = ac.createOscillator(), g = ac.createGain();
        osc.type = type; osc.frequency.value = freq;
        const t0 = ac.currentTime + delay;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g); g.connect(ac.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.02);
      } catch { /* لا شيء: الصوت تحسين لا ضرورة */ }
    }
    const SFX = {
      coin:    () => { tone(880, 0.09, "triangle", 0.05); tone(1320, 0.12, "triangle", 0.04, 0.06); },
      spend:   () => tone(320, 0.14, "sine", 0.05),
      error:   () => tone(180, 0.2, "sawtooth", 0.04),
      success: () => { tone(523, 0.12, "triangle", 0.05); tone(659, 0.12, "triangle", 0.05, 0.1); tone(784, 0.2, "triangle", 0.05, 0.2); },
      build:   () => { tone(200, 0.07, "square", 0.035); tone(260, 0.07, "square", 0.03, 0.08); },
      alert:   () => { tone(400, 0.14, "sawtooth", 0.04); tone(300, 0.18, "sawtooth", 0.04, 0.12); },
      badge:   () => { tone(1046, 0.1, "triangle", 0.05); tone(1568, 0.16, "triangle", 0.04, 0.09); },
    };

    // معرّفة كتصريحات دوال (مرفوعة) كي يمكن استدعاؤها من setState قبل قسم الرسوميات
    let shake = 0; // شدة اهتزاز الشاشة الحالية

    function spawnFloater(delta) {
      FLOATERS.push({
        text: `${delta > 0 ? "+" : "−"}${fmt(Math.abs(delta))}`,
        color: delta > 0 ? "#2ecc71" : "#e74c3c",
        life: 0, max: 1.6, dx: (Math.random() - 0.5) * 10,
      });
      // الخسائر الكبيرة فقط تهزّ الشاشة، حتى لا يهتزّ كل راتب شهري
      if (delta <= -75) shake = Math.min(7, 2 + Math.abs(delta) / 175);
    }

    // ==================== منطق الشهر والأحداث ====================
    function advanceMonth(baseState) {
      const source = baseState || state;
      let s = {
        ...source,
        investments: cloneInvestments(source.investments),
        tempEffects: (source.tempEffects || []).map((e) => ({ ...e })),
        housing: { ...(source.housing || INITIAL_STATE.housing) },
        // education تُنسخ بعمق لأن pending يُعدَّل مباشرة أدناه؛ بدونها كان
        // العدّاد يُنقص في الحالة الأصلية أيضًا عبر مرجع مشترك.
        education: {
          ...(source.education || INITIAL_STATE.education),
          pending: source.education?.pending ? { ...source.education.pending } : null,
        },
        zakat: { ...(source.zakat || INITIAL_STATE.zakat) },
        insurance: { ...(source.insurance || INITIAL_STATE.insurance) },
      };

      // منحة الأرض: انتظار التخصيص من البلدية
      if (s.housing.stage === "waiting") {
        s.housing.waitMonths -= 1;
        if (s.housing.waitMonths <= 0) {
          s.housing.stage = "land";
          s.housing.waitMonths = 0;
          s.eventLog = [...s.eventLog, "🏜️ تم تخصيص منحة أرض سكنية لك"];
        }
      }

      // قسط قرض الإسكان
      if (s.housing.loan > 0) {
        const interest = Math.round(s.housing.loan * HOUSING_LOAN_RATE);
        const pay = Math.min(s.housing.loanPayment, s.housing.loan + interest);
        s.housing.loan = Math.max(0, s.housing.loan + interest - pay);
        s.cash -= pay;
        if (s.housing.loan === 0) {
          s.housing.loanPayment = 0;
          s.eventLog = [...s.eventLog, "✅ سُدّد قرض الإسكان بالكامل"];
        }
      }
      if (s.month % 12 === 0) {
        s.monthlyIncome = Math.round(s.monthlyIncome * 1.02);
        s.monthlyExpenses = Math.round(s.monthlyExpenses * 1.015);
      }
      // كل أصل يسحب عائده الشهري مستقلاً عن الآخر، فيقلّ تقلّب المحفظة كلما نوّعت
      lastAssetMoves = {};
      for (const key of Object.keys(ASSETS)) {
        const inv = s.investments[key];
        const { growth, income, crashed } = drawAssetReturn(key);
        lastAssetMoves[key] = { pct: growth + income, crashed };
        if (inv.amount <= 0) continue;
        if (income > 0) {
          inv.rentalIncome = Math.round(inv.amount * income);
          s.cash += inv.rentalIncome;
        }
        inv.amount = Math.max(0, Math.round(inv.amount * (1 + growth)));
        // إن أفنى الانهيار المركز بالكامل فقد تحققت الخسارة وأُغلق المركز:
        // إبقاء التكلفة كان يجعل أي شراء جديد يظهر خاسرًا بمبلغ قديم إلى الأبد.
        if (inv.amount === 0) { inv.cost = 0; inv.rentalIncome = 0; }
        if (crashed) s.eventLog = [...s.eventLog, `📉 انهيار مفاجئ في ${ASSETS[key].label}`];
      }
      lastStockDelta = lastAssetMoves.stocks.pct;

      // التصنيف الائتماني يتحرك تدريجيًا نحو ما تستحقه نسبة دينك إلى دخلك،
      // وهو من يحدد فائدة الدين بدل النسبة الثابتة السابقة.
      s.creditScore = Math.round(s.creditScore + (creditTarget(s) - s.creditScore) * 0.15);
      if (s.debt > 0) s.debt = Math.round(s.debt * (1 + debtMonthlyRate(s.creditScore)));

      // قسط التأمين الصحي
      if (s.insurance?.health) s.cash -= s.insurance.premium;

      // إتمام الدراسة: الزيادة تُصرف عند التخرّج لا عند الدفع
      if (s.education?.pending) {
        s.education.pending.monthsLeft -= 1;
        if (s.education.pending.monthsLeft <= 0) {
          const c = s.education.pending;
          s.monthlyIncome = Math.round(s.monthlyIncome * (1 + c.raise));
          s.education = { ...s.education, level: c.level, pending: null };
          s.morale = Math.min(100, (s.morale ?? 70) + 10);
          s.eventLog = [...s.eventLog, `🎓 أتممت ${c.name} — دخلك ارتفع ${Math.round(c.raise * 100)}%`];
        }
      }

      // الرضا يتآكل شهريًا، ويتأثر بضغط الدين وبراحة صندوق الطوارئ
      let morale = s.morale ?? 70;
      morale -= 4;
      if (s.debt > s.monthlyIncome * 3) morale -= 3;
      if (s.monthlyExpenses > 0 && s.emergency / s.monthlyExpenses >= 3) morale += 2;
      const wasBurntOut = (s.morale ?? 70) < MORALE_BURNOUT;
      s.morale = Math.max(0, Math.min(100, morale));
      if (!wasBurntOut && s.morale < MORALE_BURNOUT) {
        s.eventLog = [...s.eventLog, "😫 وصلت إلى الإرهاق — دخلك ينخفض حتى ترفع رضاك"];
      }

      const { surplus } = derive(s);
      s.cash += surplus;
      s.tempEffects = s.tempEffects.map((e) => ({ ...e, monthsLeft: e.monthsLeft - 1 })).filter((e) => e.monthsLeft > 0);
      s.month += 1;
      if (s.month > 12) { s.month = 1; s.year += 1; }

      // نستخدم derive نفسها كي يطابق المنحنى ما يعرضه الشريط العلوي؛
      // الحساب اليدوي السابق كان يُسقط قيمة المنزل فيختلف الرسم عن الواقع.
      const nw = derive(s).netWorth;
      s.history = [...s.history, { month: s.month + (s.year - 1) * 12, netWorth: nw }];
      // نحدّ من نمو الحفظ: يكفي آخر 600 شهر و400 حدث لأي جولة واقعية
      if (s.history.length > 600) s.history = s.history.slice(-600);
      if (s.eventLog.length > 400) s.eventLog = s.eventLog.slice(-400);

      setState(s);

      // حلول الحول: تُعرض الزكاة مرة واحدة كل سنة
      const due = zakatDue(s);
      if (s.year > (s.zakat?.lastDueYear ?? 0) && s.month === 1 && due > 0) {
        openZakat(due);
        return;
      }

      if (Math.random() < 0.5) {
        const pool = EVENTS.filter((e) => !e.when || e.when(s));
        if (pool.length) openEvent(pool[Math.floor(Math.random() * pool.length)]);
      }
    }

    // ==================== شاشة الزكاة السنوية ====================
    function openZakat(due) {
      const wealth = zakatableWealth(state);
      // المتأخرات جزء من الواجب: تأجيل سنة سابقة يبقى في الذمة حتى يُدفع فعلاً
      const arrears = state.zakat?.unpaid ?? 0;
      const total = due + arrears;
      const canPay = state.cash >= total;
      SFX.alert();
      pushModal(`
        <h2>🤲 حَال الحول — الزكاة</h2>
        <canvas class="event-art" id="zakatArt" width="340" height="110"></canvas>
        <p style="margin:12px 0;line-height:1.9;font-size:13px">
          مضت سنة على مالك. ${term("الزكاة")} واجبة بنسبة 2.5% على ما بلغ ${term("النصاب")}،
          وتُستثنى دار سكنك وحاجاتك الأصلية، ويُخصم دينك الحالّ وما يستحق من أقساط
          الإسكان خلال السنة.
        </p>
        <div class="card" style="padding:12px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">وعاء الزكاة</span><b>${fmt(wealth)}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">النصاب</span><b>${fmt(ZAKAT_NISAB)}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">زكاة هذا العام (2.5%)</span><b style="color:#c9974a">${fmt(due)}</b></div>
          ${arrears > 0 ? `<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">متأخرات في ذمتك</span><b style="color:#e74c3c">${fmt(arrears)}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid rgba(29,61,53,0.8);margin-top:3px"><span class="muted">الإجمالي الواجب</span><b style="color:#c9974a">${fmt(total)}</b></div>` : ""}
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">النقد المتاح</span><b style="color:${canPay ? "#2ecc71" : "#e74c3c"}">${fmt(state.cash)}</b></div>
        </div>
        <div class="inline-error" id="zakatErr"></div>
        <button class="btn" id="payZakat" ${canPay ? "" : "disabled"}>${canPay ? `أخرج الزكاة (${fmt(total)})` : "لا يوجد نقد كافٍ"}</button>
        <button class="btn btn-outline" style="margin-top:10px" id="deferZakat">أجّلها (تبقى دينًا في ذمتك)</button>
      `, (root) => {
        const cv = root.querySelector("#zakatArt");
        if (cv) animateZakatArt(cv);
        root.querySelector("#payZakat").addEventListener("click", once(() => {
          if (state.cash < total) { root.querySelector("#zakatErr").textContent = "النقد لا يكفي."; return; }
          const z = state.zakat || { paidCount: 0, totalPaid: 0, unpaid: 0 };
          SFX.success();
          setState({ ...state, cash: state.cash - total,
            morale: Math.min(100, (state.morale ?? 70) + 8),
            zakat: { ...z, paidCount: z.paidCount + 1, totalPaid: z.totalPaid + total, lastDueYear: state.year, unpaid: 0 },
            eventLog: [...state.eventLog, arrears > 0 ? `🤲 أخرجت زكاة ${fmt(total)} (منها ${fmt(arrears)} متأخرات)` : `🤲 أخرجت زكاة ${fmt(total)}`] });
          closeAllModals();
        }));
        root.querySelector("#deferZakat").addEventListener("click", once(() => {
          const z = state.zakat || { paidCount: 0, totalPaid: 0, unpaid: 0 };
          setState({ ...state,
            morale: Math.max(0, (state.morale ?? 70) - 6),
            zakat: { ...z, lastDueYear: state.year, unpaid: (z.unpaid || 0) + due },
            eventLog: [...state.eventLog, `⏳ أجّلت زكاة ${fmt(due)}`] });
          closeAllModals();
        }));
      }, { mandatory: true });
    }

    function animateZakatArt(canvas) {
      const c = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      const t0 = performance.now();
      (function frame() {
        if (!canvas.isConnected) return;
        const t = (performance.now() - t0) / 1000;
        c.clearRect(0, 0, W, H);
        // كفّان مفتوحتان
        c.fillStyle = "#e8b88a";
        for (const s of [-1, 1]) {
          c.save(); c.translate(W / 2 + s * 26, H - 26); c.rotate(s * 0.3);
          c.beginPath(); c.ellipse(0, 0, 22, 11, 0, Math.PI, 0); c.fill();
          c.restore();
        }
        // عملات تتساقط من الأعلى إلى الكفّين
        for (let i = 0; i < 7; i++) {
          const p = ((t * 0.55 + i / 7) % 1);
          const x = W / 2 + Math.sin(i * 2.1) * 34;
          const y = 8 + p * (H - 44);
          c.globalAlpha = p < 0.85 ? 1 : (1 - p) / 0.15;
          c.fillStyle = i % 2 ? "#c9974a" : "#f4d58d";
          c.beginPath(); c.ellipse(x, y, 6, 5, 0, 0, Math.PI * 2); c.fill();
          c.globalAlpha = 1;
        }
        c.fillStyle = "#c9974a"; c.font = "bold 13px sans-serif";
        c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("2.5%", W / 2, 18);
        requestAnimationFrame(frame);
      })();
    }

    function openEvent(ev) {
      pushModal(`
        <h2>${ev.title}</h2>
        <canvas class="event-art" id="eventArt" width="340" height="120"></canvas>
        <p style="margin:12px 0;line-height:1.8">${ev.desc}</p>
        ${ev.choices.map((c, i) => `<button class="event-btn" data-choice="${i}">${c.label}</button>`).join("")}
      `, (root) => {
        const artCanvas = root.querySelector("#eventArt");
        if (artCanvas) animateEventArt(artCanvas, ev.id);
        root.querySelectorAll("[data-choice]").forEach((btn) => {
          btn.addEventListener("click", once(() => {
            const choice = ev.choices[Number(btn.dataset.choice)];
            setState(choice.effect(state));
            closeAllModals();
          }));
        });
      }, { mandatory: true });
    }

    // ==================== رسوم توضيحية متحركة لبطاقات الأحداث ====================
    const EVENT_ART = {
      job_loss(c, w, h, t) {
        c.fillStyle = "#1d3d35"; c.fillRect(w / 2 - 34, h - 74, 68, 74);
        c.fillStyle = "#0a1e1a"; c.fillRect(w / 2 - 16, h - 52, 32, 52);
        c.fillStyle = "#c9974a"; c.beginPath(); c.arc(w / 2 + 10, h - 26, 2.5, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#e74c3c";
        c.save(); c.translate(w / 2, h - 88); c.rotate(Math.sin(t * 2) * 0.12);
        c.fillRect(-26, -9, 52, 18);
        c.fillStyle = "#fff"; c.font = "bold 11px sans-serif";
        c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("مغلق", 0, 0);
        c.restore();
        const px = w / 2 + 62 + Math.sin(t * 1.4) * 5;
        drawMiniPerson(c, px, h - 22, "#4a90c9", 0.4);
      },
      market_crash(c, w, h, t) {
        c.strokeStyle = "rgba(138,168,155,0.25)"; c.lineWidth = 1;
        for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(10, (h / 4) * i); c.lineTo(w - 10, (h / 4) * i); c.stroke(); }
        const pts = [0.25, 0.18, 0.34, 0.28, 0.5, 0.62, 0.58, 0.8, 0.92];
        const prog = Math.min(1, t / 1.2);
        c.beginPath(); c.strokeStyle = "#e74c3c"; c.lineWidth = 2.5;
        const n = Math.max(2, Math.floor(pts.length * prog));
        for (let i = 0; i < n; i++) {
          const x = 14 + (i / (pts.length - 1)) * (w - 28), y = 10 + pts[i] * (h - 26);
          i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.stroke();
        const lx = 14 + ((n - 1) / (pts.length - 1)) * (w - 28), ly = 10 + pts[n - 1] * (h - 26);
        c.fillStyle = "#e74c3c"; c.beginPath(); c.arc(lx, ly, 4, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#e74c3c"; c.font = "bold 15px sans-serif"; c.textAlign = "left"; c.textBaseline = "middle";
        c.fillText("▼ 25%", 16, h - 16);
      },
      bonus(c, w, h, t) {
        for (let i = 0; i < 5; i++) {
          const y = h - 12 - i * 9, rw = 34 - i * 2;
          c.fillStyle = i % 2 ? "#b5821f" : "#c9974a";
          c.beginPath(); c.ellipse(w / 2, y, rw, 7, 0, 0, Math.PI * 2); c.fill();
        }
        for (let i = 0; i < 6; i++) {
          const a = t * 1.6 + i;
          const sx = w / 2 + Math.cos(a) * (40 + i * 5), sy = h - 46 + Math.sin(a * 1.3) * 20;
          c.globalAlpha = 0.4 + 0.6 * ((Math.sin(t * 3 + i) + 1) / 2);
          c.fillStyle = "#f4d58d";
          c.beginPath(); c.arc(sx, sy, 2, 0, Math.PI * 2); c.fill();
          c.globalAlpha = 1;
        }
      },
      rent_increase(c, w, h, t) {
        const bob = Math.sin(t * 2) * 3;
        c.fillStyle = "#d98c4a"; c.fillRect(w / 2 - 34, h - 52, 68, 52);
        c.fillStyle = "#a86a33";
        c.beginPath(); c.moveTo(w / 2 - 42, h - 52); c.lineTo(w / 2, h - 82); c.lineTo(w / 2 + 42, h - 52); c.closePath(); c.fill();
        c.fillStyle = "#2a1c0d"; c.fillRect(w / 2 - 9, h - 26, 18, 26);
        c.fillStyle = "#f4d58d"; c.fillRect(w / 2 - 28, h - 44, 14, 14); c.fillRect(w / 2 + 14, h - 44, 14, 14);
        c.fillStyle = "#e74c3c";
        c.save(); c.translate(w / 2 + 70, h - 46 - bob);
        c.beginPath(); c.moveTo(0, -14); c.lineTo(11, 4); c.lineTo(-11, 4); c.closePath(); c.fill();
        c.fillRect(-5, 4, 10, 16);
        c.restore();
        c.fillStyle = "#e74c3c"; c.font = "bold 13px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("+5%", w / 2 + 70, h - 8);
      },
      medical(c, w, h, t) {
        const pulse = 1 + Math.sin(t * 3) * 0.06;
        c.save(); c.translate(w / 2, h / 2); c.scale(pulse, pulse);
        c.fillStyle = "#fff"; roundRect(c, -30, -30, 60, 60, 10); c.fill();
        c.fillStyle = "#e74c3c";
        c.fillRect(-6, -20, 12, 40); c.fillRect(-20, -6, 40, 12);
        c.restore();
        c.strokeStyle = "#e74c3c"; c.lineWidth = 2; c.beginPath();
        const baseY = h - 16;
        for (let x = 8; x < w - 8; x += 2) {
          const k = (x + t * 60) % 90;
          const spike = k < 10 ? (k < 5 ? -k * 2.4 : (k - 10) * 2.4) : 0;
          x === 8 ? c.moveTo(x, baseY + spike) : c.lineTo(x, baseY + spike);
        }
        c.stroke();
      },
      promotion(c, w, h, t) {
        const prog = Math.min(1, t / 1.2);
        c.beginPath(); c.strokeStyle = "#2ecc71"; c.lineWidth = 2.5;
        const pts = [0.85, 0.78, 0.66, 0.58, 0.42, 0.3, 0.2];
        const n = Math.max(2, Math.floor(pts.length * prog));
        for (let i = 0; i < n; i++) {
          const x = 14 + (i / (pts.length - 1)) * (w - 28), y = 10 + pts[i] * (h - 30);
          i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.stroke();
        const lx = 14 + ((n - 1) / (pts.length - 1)) * (w - 28), ly = 10 + pts[n - 1] * (h - 30);
        c.fillStyle = "#f4d58d";
        c.save(); c.translate(lx, ly); c.rotate(t * 1.5);
        c.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 ? 3.5 : 8, a = (i / 10) * Math.PI * 2;
          i === 0 ? c.moveTo(Math.cos(a) * r, Math.sin(a) * r) : c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        c.closePath(); c.fill(); c.restore();
        c.fillStyle = "#2ecc71"; c.font = "bold 15px sans-serif"; c.textAlign = "left"; c.textBaseline = "middle";
        c.fillText("▲ 15%", 16, h - 14);
      },
    };

    function drawMiniPerson(c, x, y, shirt, scale) {
      c.save(); c.translate(x, y); c.scale(scale * 2, scale * 2);
      c.fillStyle = "#2a1c0d"; c.fillRect(-6, 4, 5, 10); c.fillRect(1, 4, 5, 10);
      c.fillStyle = shirt; roundRect(c, -8, -6, 16, 14, 4); c.fill();
      c.fillStyle = "#e8b88a"; c.beginPath(); c.arc(0, -12, 7, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#3a2a1a"; c.beginPath(); c.arc(0, -15, 7.2, Math.PI, Math.PI * 2); c.fill();
      c.restore();
    }

    function animateEventArt(canvas, eventId) {
      const art = EVENT_ART[eventId];
      if (!art) return;
      const c = canvas.getContext("2d");
      const t0 = performance.now();
      (function frame() {
        if (!canvas.isConnected) return; // يتوقف تلقائيًا عند إغلاق البطاقة
        const t = (performance.now() - t0) / 1000;
        c.clearRect(0, 0, canvas.width, canvas.height);
        c.save();
        art(c, canvas.width, canvas.height, t);
        c.restore();
        requestAnimationFrame(frame);
      })();
    }

    // ==================== نظام الوحدات المنبثقة (Modals) ====================
    let modalStack = [];
    function isModalOpen() { return modalStack.length > 0; }

    function mountCommon(root) {
      root.querySelectorAll(".term").forEach((el) => {
        el.addEventListener("click", () => {
          const term = el.dataset.term;
          pushModal(`<h2>${term}</h2><p style="line-height:2">${DICTIONARY[term]}</p><button class="btn" data-close>فهمت</button>`);
        });
      });
      root.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", () => popModal()));
      root.querySelectorAll("[data-close-all]").forEach((el) => el.addEventListener("click", () => closeAllModals()));
    }

    // mandatory: بطاقة لا تُغلق بالنقر خارجها ولا بمفتاح Escape.
    // بدونها كان اللاعب يتفادى أي حدث سيئ (فقدان وظيفة، انهيار، طارئ صحي)
    // أو يتخطى الزكاة بنقرة واحدة خارج البطاقة، فيفقد نظام العواقب معناه.
    function pushModal(html, onMount, opts = {}) {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `<div class="modal">${html}</div>`;
      overlay.dataset.mandatory = opts.mandatory ? "1" : "";
      if (!opts.mandatory) {
        overlay.addEventListener("click", (e) => { if (e.target === overlay) popModal(); });
      }
      document.getElementById("modalRoot").appendChild(overlay);
      modalStack.push(overlay);
      mountCommon(overlay);
      if (onMount) onMount(overlay);
    }

    // يمنع تنفيذ الإجراء مرتين عند النقر/اللمس السريع مرّتين. المعالج يبني
    // النافذة من جديد، لكن النقرة الثانية تصل إلى الزر القديم المنفصل ومعه
    // قيم الحقول السابقة — فكان الإيداع يتضاعف والتخصيص يقدّم شهرين.
    function once(handler) {
      let used = false;
      return function (ev) {
        if (used) return;
        used = true;
        handler.call(this, ev);
      };
    }

    function topModalIsMandatory() {
      const top = modalStack[modalStack.length - 1];
      return !!(top && top.dataset.mandatory);
    }

    function popModal() {
      const overlay = modalStack.pop();
      if (overlay) overlay.remove();
      refreshHud();
    }

    function closeAllModals() {
      modalStack.forEach((o) => o.remove());
      modalStack = [];
      refreshHud();
    }

    function term(t) { return `<span class="term" data-term="${t}">${t}</span>`; }

    // ==================== مباني المدينة ====================
    function openBank() {

      pushModal(`

    const ASSET_LABELS = Object.fromEntries(Object.entries(ASSETS).map(([k, a]) => [k, a.label]));

            const inv = { ...state.investments[key], amount: state.investments[key].amount + amt, cost: state.investments[key].cost + amt };
            setState({ ...state, cash: state.cash - amt, investments: { ...state.investments, [key]: inv } });
            popModal(); openMarket();

          btn.addEventListener("click", once(() => {
            const key = btn.dataset.sell;

            // نصفّر الدخل الإيجاري أيضًا: بيع العقار يُنهي دخله، وإبقاء الرقم

            setState({ ...state, cash: state.cash + amount, investments: { ...state.investments, [key]: { ...state.investments[key], amount: 0, cost: 0, rentalIncome: 0 } } });
            popModal(); openMarket();

    function openWork() {
      const d = derive(state);
      if (d.surplus > 0) {
        openAllocation(d.surplus);
      } else {
        pushModal(`
          <h2>💼 العمل</h2>
          <p style="margin:12px 0;line-height:1.8">الدخل الشهري (${fmt(d.effIncome)}) لا يغطي المصروفات (${fmt(d.effExpenses)}) هذا الشهر. سينتقل الراتب مباشرة دون تخصيص فائض.</p>
          <button class="btn" id="proceedBtn">بدء الشهر التالي</button>
        `, (root) => {
          root.querySelector("#proceedBtn").addEventListener("click", () => {
            closeAllModals();
            advanceMonth();
          });
        });
      }

    const ALLOC_FIELDS = [
      ["emergency", "🛡 صندوق الطوارئ"], ["savings", "💰 ادخار عام"], ["investStocks", "📈 أسهم"],
      ["investBonds", "📋 سندات"], ["investReal", "🏠 عقار"], ["investCrypto", "₿ عملات رقمية"], ["leisure", "🎉 إنفاق شخصي (يُصرف، يرفع الرضا)"]
    ];

    function openAllocation(surplus) {
      const rows = ALLOC_FIELDS.map(([key, label]) => `
        <div style="margin-bottom:12px">
          <div class="slider-row"><span>${label}</span><span class="val" id="val_${key}">0</span></div>
          <input type="range" min="0" max="${surplus}" value="0" id="range_${key}" />
        </div>
      `).join("");
      pushModal(`
        <h2>💼 يوم الراتب — تخصيص الفائض</h2>
        <p class="muted" style="margin-bottom:6px">الفائض هذا الشهر: <b id="surplusLabel">${fmt(surplus)}</b> ريال · الموزّع: <span id="totalLabel">0</span></p>
        <p class="muted" style="margin-bottom:12px;font-size:11px">
          الرضا الآن <b id="moraleNow" style="color:${moraleLabel(state.morale ?? 70).color}">${Math.round(state.morale ?? 70)}</b>
          → بعد التوزيع <b id="moraleAfter">${Math.round(state.morale ?? 70)}</b>
          <span id="burnoutWarn" style="color:#e74c3c"></span>
        </p>
        ${(() => {
          // أهم تحذير واحد عند لحظة القرار نفسها، لا بعد فوات الأوان
          const top = currentAdvice(1)[0];
          return top ? `<div class="card" style="padding:10px;margin-bottom:12px;border-color:${SEV_COLOR[top.sev]}">
            <div style="font-size:11px;color:${SEV_COLOR[top.sev]};margin-bottom:3px">${top.icon} ${SEV_LABEL[top.sev]}</div>
            <p style="font-size:12px;line-height:1.7;margin:0">${top.body}</p>
          </div>` : "";
        })()}
        ${rows}
        <div class="inline-error" id="allocErr"></div>
        ${state.lastAlloc ? `<button class="btn btn-outline" style="margin-bottom:10px" id="repeatAlloc">↺ كرّر توزيع الشهر الماضي</button>` : ""}
        <button class="btn" id="confirmAlloc">تأكيد التخصيص</button>
      `, (root) => {
        const alloc = Object.fromEntries(ALLOC_FIELDS.map(([k]) => [k, 0]));
        const totalLabel = root.querySelector("#totalLabel");
        const err = root.querySelector("#allocErr");
        const moraleAfterEl = root.querySelector("#moraleAfter");
        const burnoutWarn = root.querySelector("#burnoutWarn");
        function refreshMoralePreview() {
          // ‎-4 هو التآكل الشهري الأساسي؛ نعرض للاعب أثر خياره قبل أن يؤكده
          const projected = Math.max(0, Math.min(100,
            (state.morale ?? 70) + moraleFromLeisure(alloc.leisure, state.monthlyExpenses) - 4));
          moraleAfterEl.textContent = Math.round(projected);
          moraleAfterEl.style.color = moraleLabel(projected).color;
          burnoutWarn.textContent = projected < MORALE_BURNOUT ? " ⚠ خطر الإرهاق (دخلك سينخفض)" : "";
        }
        ALLOC_FIELDS.forEach(([key]) => {
          root.querySelector(`#range_${key}`).addEventListener("input", (e) => {
            alloc[key] = Number(e.target.value);
            root.querySelector(`#val_${key}`).textContent = fmt(alloc[key]);
            totalLabel.textContent = fmt(Object.values(alloc).reduce((a, b) => a + b, 0));
            refreshMoralePreview();
          });
        });
        refreshMoralePreview();
        root.querySelector("#confirmAlloc").addEventListener("click", once(() => {
          const total = Object.values(alloc).reduce((a, b) => a + b, 0);
          if (total !== surplus) { err.textContent = `يجب أن يساوي التخصيص الفائض بالكامل (${fmt(surplus)}).`; return; }
          applyAllocation(alloc, surplus);
        }));

        const repeatBtn = root.querySelector("#repeatAlloc");
        if (repeatBtn) {
          repeatBtn.addEventListener("click", () => {
            applyAllocation(scaleAlloc(state.lastAlloc, surplus), surplus);
          });
        }
      });
    }

    // يحوّل نِسَب الشهر الماضي إلى مبالغ تساوي فائض هذا الشهر تمامًا،
    // مع إسناد فروق التقريب إلى أكبر بند حتى لا يختلّ المجموع.
    function scaleAlloc(ratios, surplus) {
      const out = Object.fromEntries(ALLOC_FIELDS.map(([k]) => [k, 0]));
      // نُطهّر النِّسَب أولاً: lastAlloc يُحفظ في المتصفح ولا يمرّ بتحقّق
      // القيم الافتراضية، فحفظ معدَّل أو تالف قد يحمل نِسَبًا سالبة أو مجموعًا
      // مخالفًا للواحد، فينتج توزيع سالب يخصم من نقدك بدل أن يضيف إليه.
      const clean = {};
      let sum = 0;
      for (const [key] of ALLOC_FIELDS) {
        const r = Number(ratios?.[key]);
        const v = Number.isFinite(r) && r > 0 ? r : 0;
        clean[key] = v;
        sum += v;
      }
      if (sum <= 0) { out.savings = surplus; return out; }

      let running = 0, biggestKey = ALLOC_FIELDS[0][0], biggestRatio = -1;
      for (const [key] of ALLOC_FIELDS) {
        const share = clean[key] / sum;                 // نُعيد التطبيع ليكون المجموع 1
        out[key] = Math.max(0, Math.floor(share * surplus));
        running += out[key];
        if (share > biggestRatio) { biggestRatio = share; biggestKey = key; }
      }
      out[biggestKey] = Math.max(0, out[biggestKey] + surplus - running);
      return out;
    }

    // كم رضًا يشتريه ريال واحد من الإنفاق الشخصي (نسبةً إلى مستوى معيشتك)
    function moraleFromLeisure(amount, monthlyExpenses) {
      const perPoint = Math.max(1, monthlyExpenses * 0.04);
      return Math.min(30, Math.round(amount / perPoint));
    }

    function applyAllocation(alloc, surplus) {
      let s = { ...state, investments: cloneInvestments(state.investments) };
      s.emergency += alloc.emergency;
      // الادخار العام يبقى نقدًا؛ أما الإنفاق الشخصي فيُصرف فعلاً ويشتري رضًا
      s.cash += alloc.savings;
      s.morale = Math.max(0, Math.min(100, (s.morale ?? 70) + moraleFromLeisure(alloc.leisure, s.monthlyExpenses)));
      s.investments.stocks.amount += alloc.investStocks; s.investments.stocks.cost += alloc.investStocks;
      s.investments.bonds.amount += alloc.investBonds; s.investments.bonds.cost += alloc.investBonds;
      s.investments.realEstate.amount += alloc.investReal; s.investments.realEstate.cost += alloc.investReal;
      s.investments.crypto.amount += alloc.investCrypto; s.investments.crypto.cost += alloc.investCrypto;
      s.cash -= surplus;
      // نحفظ التوزيع كنِسَب كي يصلح لفائض مختلف في الأشهر القادمة
      s.lastAlloc = Object.fromEntries(ALLOC_FIELDS.map(([k]) => [k, surplus > 0 ? alloc[k] / surplus : 0]));
      closeAllModals();
      advanceMonth(s);
    }

    function openHome() {
      pushModal(`
        <h2>🏠 المنزل</h2>
        ${(() => {
          // نعرض الأرقام الفعلية بعد الآثار المؤقتة (بطالة، أقساط) لا الأساسية،
          // فقد كان اللاعب يرى دخله كاملاً وهو عاطل عن العمل.
          const d = derive(state);
          const incDiff = d.effIncome !== state.monthlyIncome;
          const expDiff = d.effExpenses !== state.monthlyExpenses;
          return `
        <p class="muted" style="margin-bottom:4px">الدخل الشهري: <b style="color:${incDiff ? "#e67e22" : "inherit"}">${fmt(d.effIncome)}</b> ريال${incDiff ? ` <span style="font-size:11px">(الأساسي ${fmt(state.monthlyIncome)} — أثر مؤقت)</span>` : ""}</p>
        <p class="muted" style="margin-bottom:16px">المصروفات الشهرية: <b style="color:${expDiff ? "#e67e22" : "inherit"}">${fmt(d.effExpenses)}</b> ريال${expDiff ? ` <span style="font-size:11px">(الأساسي ${fmt(state.monthlyExpenses)} — أثر مؤقت)</span>` : ""}</p>`;
        })()}
        <div class="card" style="margin-bottom:14px;padding:12px">
          <div style="display:flex;justify-content:space-between;padding:3px 0">
            <span class="muted">${term("الدين إلى الدخل السنوي")}</span>
            <b>${state.monthlyIncome > 0 ? ((state.debt / (state.monthlyIncome * 12)) * 100).toFixed(0) : "—"}%</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:3px 0">
            <span class="muted">${term("نسبة الدين إلى الدخل")} (قسطك)</span>
            <b>${state.monthlyIncome > 0 ? (((state.housing.loanPayment || 0) + (state.tempEffects || []).filter(e => e.type === "expense").reduce((a, e) => a + e.amount, 0)) / state.monthlyIncome * 100).toFixed(0) : "—"}%</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:3px 0">
            <span class="muted">${term("التصنيف الائتماني")}</span>
            <b style="color:${creditLabel(state.creditScore).color}">${state.creditScore} · ${creditLabel(state.creditScore).text}</b>
          </div>
          <div style="display:flex;justify-content:space-between;padding:3px 0">
            <span class="muted">فائدة الدين الحالية</span>
            <b>${(debtMonthlyRate(state.creditScore) * 100).toFixed(2)}%/شهر</b>
          </div>
          <p class="muted" style="font-size:11px;margin-top:6px">كلما قلّ دينك مقابل دخلك ارتفع تصنيفك وانخفضت فائدتك.</p>
        </div>
        ${housingPanelHtml()}
        <div class="slider-row"><span>سداد جزء من الدين (${fmt(state.debt)})</span></div>
        <div class="row-actions">
          <input type="number" id="payAmt" min="0" max="${Math.max(0, Math.min(state.cash, state.debt))}" value="0" />
          <button class="btn btn-sm" id="payBtn">سداد</button>
        </div>
        <div class="inline-error" id="homeErr"></div>
        ${state.housing.stage !== "owned"
          ? `<button class="btn btn-outline" id="downsizeBtn" ${state.cash < 150 ? "disabled" : ""}>الانتقال لسكن أرخص (تكلفة 150، يخفض الإيجار 10%)</button>`
          : ""}
        <button class="btn btn-outline" style="margin-top:10px" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#homeErr");
        root.querySelector("#payBtn").addEventListener("click", once(() => {
          const amt = Math.floor(Number(root.querySelector("#payAmt").value));
          if (!amt || amt <= 0 || amt > state.cash || amt > state.debt) { err.textContent = "مبلغ غير صالح."; return; }
          setState({ ...state, cash: state.cash - amt, debt: state.debt - amt });
          popModal(); openHome();
        }));
        const downsize = root.querySelector("#downsizeBtn");
        if (downsize) {
          downsize.addEventListener("click", () => {
            if (state.cash < 150) return;
            const cut = Math.round(state.rent * 0.1);
            setState({ ...state, cash: state.cash - 150, rent: state.rent - cut, monthlyExpenses: state.monthlyExpenses - cut });
            popModal(); openHome();
          });
        }
        wireHousingPanel(root, err);
      });
    }

    // ==================== لوحة البناء داخل المنزل ====================
    function housingPanelHtml() {
      const h = state.housing;
      if (h.stage === "renting" || h.stage === "waiting") {
        return `<div class="card" style="margin-bottom:14px;padding:12px">
          <h3 style="font-size:14px;color:#c9974a;margin-bottom:6px">🏠 السكن</h3>
          <p class="muted" style="font-size:12px;line-height:1.8">
            أنت مستأجر — <b>${fmt(state.rent)}</b> ريالًا شهريًا من أصل ${fmt(state.monthlyExpenses)}.
            ${h.stage === "waiting"
              ? `طلب منحة الأرض قيد المعالجة (متبقٍ ${h.waitMonths} أشهر).`
              : `تقدّم بطلب منحة أرض من دار البلدية لتبدأ مسار التملك.`}
          </p>
        </div>`;
      }
      const progress = Math.min(1, h.built / HOME_COST);
      const remaining = Math.max(0, HOME_COST - h.built);
      const owned = h.stage === "owned";
      const maxLoan = Math.max(0, MAX_HOUSING_LOAN - h.loan);
      return `<div class="card" style="margin-bottom:14px;padding:12px${owned ? ";border-color:#2ecc71" : ""}">
        <h3 style="font-size:14px;color:${owned ? "#2ecc71" : "#c9974a"};margin-bottom:6px">🏠 ${owned ? "منزلك (مملوك)" : "بناء المنزل"}</h3>
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span class="muted">${buildPhase(progress).name}</span>
          <b>${fmt(h.built)} / ${fmt(HOME_COST)}</b>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${progress * 100}%;background:${owned ? "#2ecc71" : "#c9974a"}"></div></div>
        ${owned
          ? `<p class="muted" style="font-size:11px;margin-top:8px">لم تعد تدفع إيجارًا — وفّرت ${fmt(state.housing.savedRent || 0)} ريالًا شهريًا.</p>`
          : `<div class="row-actions" style="margin-top:10px">
               <input type="number" min="0" id="buildAmt" placeholder="مبلغ البناء (متبقٍ ${fmt(remaining)})" />
               <button class="btn btn-sm" id="buildBtn">ابنِ</button>
             </div>`}
        ${h.loan > 0
          ? `<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:10px">
               <span class="muted">قرض الإسكان المتبقي</span><b>${fmt(h.loan)} · قسط ${fmt(h.loanPayment)}/شهر</b>
             </div>
             <div class="row-actions" style="margin-top:8px">
               <input type="number" min="0" id="repayHousing" placeholder="سداد مبكر (حتى ${fmt(Math.min(state.cash, h.loan))})" />
               <button class="btn btn-sm btn-outline" id="repayHousingBtn">سدّد</button>
             </div>
             <p class="muted" style="font-size:11px;margin-top:6px">السداد المبكر يقلّل رصيد القرض وفائدته، ويخفض قسطك الشهري تناسبيًا.</p>`
          : ""}
        ${/* المتبقي من سقف التمويل يبقى متاحًا ما دام البناء جاريًا: كان الحقل
             يختفي بمجرد وجود أي قرض، فمن اقترض 5,000 يفقد 25,000 يستحقها. */""}
        ${!owned && maxLoan > 0
          ? `<div class="row-actions" style="margin-top:10px">
               <input type="number" min="0" max="${maxLoan}" id="loanAmt" placeholder="${h.loan > 0 ? "اقترض المتبقي" : "قرض إسكان"} (حتى ${fmt(maxLoan)})" />
               <button class="btn btn-sm btn-outline" id="loanBtn">اقترض</button>
             </div>
             <p class="muted" style="font-size:11px;margin-top:6px">${term("قرض الإسكان")}: مدعوم ${(HOUSING_LOAN_RATE * 1200).toFixed(1)}% سنويًا على ${HOUSING_LOAN_TERM / 12} سنة${h.loan > 0 ? ` · المتاح من السقف ${fmt(maxLoan)} من ${fmt(MAX_HOUSING_LOAN)}` : ""}.</p>`
          : ""}
      </div>`;
    }

    function wireHousingPanel(root, err) {
      const buildBtn = root.querySelector("#buildBtn");
      if (buildBtn) {
        buildBtn.addEventListener("click", once(() => {
          const remaining = HOME_COST - state.housing.built;
          const amt = Math.floor(Number(root.querySelector("#buildAmt").value));
          if (!amt || amt <= 0 || amt > state.cash || amt > remaining) { err.textContent = "مبلغ غير صالح."; return; }
          const built = state.housing.built + amt;
          const finished = built >= HOME_COST;
          let s = { ...state, cash: state.cash - amt, housing: { ...state.housing, built, stage: finished ? "owned" : "building" } };
          if (finished) {
            // التملك يُسقط الإيجار من المصروفات نهائيًا
            s.housing.savedRent = state.rent;
            s.monthlyExpenses = Math.max(0, state.monthlyExpenses - state.rent);
            s.rent = 0;
            s.morale = Math.min(100, (state.morale ?? 70) + 20);
            s.eventLog = [...state.eventLog, "🏡 اكتمل منزلك — لا إيجار بعد اليوم"];
          }
          setState(s);
          popModal();
          if (finished) celebrateHome(); else openHome();
        }));
      }
      const repayBtn = root.querySelector("#repayHousingBtn");
      if (repayBtn) {
        repayBtn.addEventListener("click", once(() => {
          const h = state.housing;
          const max = Math.min(state.cash, h.loan);
          const amt = Math.floor(Number(root.querySelector("#repayHousing").value));
          if (!amt || amt <= 0 || amt > max) { err.textContent = "مبلغ غير صالح."; return; }
          const remaining = h.loan - amt;
          // القسط ينكمش بنفس نسبة انكماش الرصيد، ويصفر عند السداد الكامل
          const payment = remaining <= 0 ? 0 : Math.max(1, Math.round(h.loanPayment * (remaining / h.loan)));
          SFX.spend();
          setState({ ...state, cash: state.cash - amt,
            housing: { ...h, loan: Math.max(0, remaining), loanPayment: payment },
            eventLog: [...state.eventLog, remaining <= 0 ? "✅ سدّدت قرض الإسكان بالكامل" : `🏦 سداد مبكر ${fmt(amt)} من قرض الإسكان`] });
          popModal(); openHome();
        }));
      }
      const loanBtn = root.querySelector("#loanBtn");
      if (loanBtn) {
        loanBtn.addEventListener("click", once(() => {
          const maxLoan = MAX_HOUSING_LOAN - state.housing.loan;
          const amt = Math.floor(Number(root.querySelector("#loanAmt").value));
          if (!amt || amt <= 0 || amt > maxLoan) { err.textContent = "مبلغ غير صالح."; return; }
          const payment = Math.ceil(amt / HOUSING_LOAN_TERM) + Math.ceil(amt * HOUSING_LOAN_RATE);
          setState({ ...state, cash: state.cash + amt,
            housing: { ...state.housing, loan: state.housing.loan + amt, loanPayment: state.housing.loanPayment + payment },
            eventLog: [...state.eventLog, `🏦 حصلت على قرض إسكان ${fmt(amt)}`] });
          popModal(); openHome();
        }));
      }
    }

    function celebrateHome() {
      pushModal(`
        <h2>🏡 أصبح لك بيت!</h2>
        <canvas class="celebrate-art" id="homeArt" width="340" height="140"></canvas>
        <p style="line-height:1.9;text-align:center">
          اكتمل بناء منزلك على أرض المنحة. توقّف الإيجار نهائيًا،
          وانخفضت مصروفاتك الشهرية إلى <b style="color:#2ecc71">${fmt(state.monthlyExpenses)}</b> ريالًا.
        </p>
        <button class="btn" style="margin-top:14px" data-close-all>الحمد لله</button>
      `, (root) => {

    function openGoals() {
      const goalsHtml = state.goals.length ? state.goals.map((g) => `
        <div class="card" style="margin:8px 0;padding:12px${g.done ? ";border-color:#2ecc71" : ""}">
          <div style="display:flex;justify-content:space-between"><span>${g.done ? "✅ " : ""}${esc(g.name)}</span><span>${fmt(g.saved)} / ${fmt(g.target)}</span></div>
          <div class="progress"><div class="progress-fill" style="width:${Math.min(100, (g.saved / g.target) * 100)}%;background:#2ecc71"></div></div>
          ${g.done
            ? `<p class="muted" style="margin-top:8px;font-size:13px;color:#2ecc71">مكتمل 🎉</p>`
            : `<div class="row-actions" style="margin-top:8px">
                 <input type="number" min="0" id="contrib_${g.id}" placeholder="مبلغ المساهمة" />

      `).join("") : `<p class="muted" style="margin-bottom:12px">لا توجد أهداف بعد.</p>`;
      pushModal(`
        <h2>🎯 لوحة الأهداف</h2>
        ${goalsHtml}
        <div class="inline-error" id="goalsErr"></div>
        <div style="margin-top:8px">
          <input id="newGoalName" placeholder="اسم الهدف" />
          <input id="newGoalTarget" type="number" min="1" placeholder="المبلغ المستهدف" />
          <button class="btn btn-sm btn-outline" id="addGoalBtn">+ إضافة هدف</button>

        <button class="btn btn-outline" style="margin-top:14px" data-close-all>خروج</button>
      `, (root) => {
        const err = root.querySelector("#goalsErr");
        root.querySelectorAll("[data-contrib]").forEach((btn) => {
          btn.addEventListener("click", once(() => {
            const id = Number(btn.dataset.contrib);
            const goal = state.goals.find((g) => g.id === id);
            const amt = Math.floor(Number(root.querySelector(`#contrib_${id}`).value));
            const room = goal.target - goal.saved;
            if (!amt || amt <= 0 || amt > state.cash || amt > room) { err.textContent = "مبلغ غير صالح."; return; }
            const justCompleted = !goal.done && goal.saved + amt >= goal.target;
            const goals = state.goals.map((g) => g.id === id
              ? { ...g, saved: g.saved + amt, done: g.done || g.saved + amt >= g.target }
              : g);
            const log = justCompleted ? [...state.eventLog, `🎯 تحقق الهدف: ${goal.name}`] : state.eventLog;
            setState({ ...state, cash: state.cash - amt, goals, eventLog: log });
            popModal();
            if (justCompleted) celebrateGoal(goal.name); else openGoals();
          }));
        });
        root.querySelector("#addGoalBtn").addEventListener("click", once(() => {
          const name = root.querySelector("#newGoalName").value.trim();
          const target = Math.floor(Number(root.querySelector("#newGoalTarget").value));
          if (!name || !target || target <= 0) { err.textContent = "أدخل اسمًا ومبلغًا صحيحين."; return; }
          setState({ ...state, goals: [...state.goals, { id: Date.now(), name, target, saved: 0 }] });
          popModal(); openGoals();
        }));
      });
    }

    function showEnding(kind) {
      const d = derive(state);

      const win = kind === "win";
      pushModal(`
        <h2>${win ? "🏆 استقلال مالي!" : "💸 إفلاس"}</h2>

        <p style="line-height:1.9;text-align:center">
          ${win
            ? `وصلت باستثماراتك إلى ما يكفي لتغطية مصروفاتك دون الحاجة إلى راتب.`
            : `تراكمت الديون وتجاوزت خسائرك ما تملك. جرّب توازنًا أفضل بين الطوارئ والاستثمار.`}
        </p>
        <div class="card" style="margin:14px 0;padding:12px">
          <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">صافي الثروة</span><b style="color:${win ? "#2ecc71" : "#e74c3c"}">${fmt(d.netWorth)}</b></div>
          <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">منها مُدِرّة للدخل</span><b>${fmt(d.investableNetWorth)}</b></div>
          ${state.housing.stage === "owned" ? `<div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">قيمة المنزل</span><b>${fmt(d.homeEquity)}</b></div>` : ""}
          <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">المدة</span><b>${months} شهرًا</b></div>

          <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">أحداث مررت بها</span><b>${state.eventLog.length}</b></div>

      }, { mandatory: true });
