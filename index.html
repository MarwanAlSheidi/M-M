<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ZERO+ · مدينة المال</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Kufi Arabic', sans-serif; background: #0a1e1a; color: #e0e8e4; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    /* عمود مرن بارتفاع الشاشة: لولاه كانت لوحة الاتجاه تنزل تحت الطيّة
       في كل هاتف شائع، فيضطر اللاعب للتمرير للوصول إلى أزرار الحركة. */
    .app { max-width: 520px; margin: 0 auto; height: 100vh; height: 100dvh; background: #0d2621; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
    .hud, .rank-bar, .stats-panel, .controls { flex: 0 0 auto; }

    .hud { padding: 14px 16px; background: #0a1e1a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1d3d35; }
    .hud-mid { text-align: center; }
    .hud-date { font-size: 12px; color: #8aa89b; }
    .hud-net { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: #c9974a; }
    .hud-net small { font-size: 13px; font-weight: 400; opacity: 0.7; }
    #moodEmoji { font-size: 28px; }

    .rank-bar { margin: 10px 14px 0; }
    .rank-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; font-size: 12px; }
    .rank-head span:first-child { color: #c9974a; font-weight: 700; }
    .rank-head .muted { font-size: 10px; }
    .stats-panel { display: none; margin: 10px 12px; }
    /* شبكة تلتفّ بدل صفّ واحد — سبعة صناديق لا تتّسع في عرض الهاتف */
    .stats-panel.open { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat-box { background: #122e27; border-radius: 12px; padding: 8px 4px; text-align: center; border: 1px solid #1d3d35; min-width: 0; }
    .stat-box .label { font-size: 9px; color: #8aa89b; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-box .value { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }

    /* الرقعة تتقلّص لتملأ ما تبقّى، واللوحة تحافظ على نسبتها 512:640 */
    .stage { position: relative; margin: 10px 12px; border-radius: 14px; overflow: hidden; border: 1px solid #1d3d35;
             flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .stage canvas { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; background: #0a1e1a; }
    .interact-btn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: #c9974a; color: #0a1e1a; border: none; padding: 10px 20px; border-radius: 22px; font-weight: 700; font-family: inherit; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.45); cursor: pointer; }
    .interact-btn.hidden { display: none; }

    .controls { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px max(14px, env(safe-area-inset-bottom)); }
    .dpad { direction: ltr; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .dpad-row { display: flex; gap: 6px; }
    .dpad-btn { width: 50px; height: 50px; border-radius: 10px; background: #122e27; border: 1px solid #1d3d35; color: #c9974a; font-size: 18px; cursor: pointer; touch-action: none; }
    .dpad-btn:active { background: #1d3d35; }
    .dpad-spacer { width: 50px; height: 50px; }

    .card { background: #122e27; border-radius: 14px; padding: 16px; margin: 12px; border: 1px solid #1d3d35; }
    .card h3 { font-size: 16px; color: #c9974a; margin-bottom: 12px; }
    .progress { height: 10px; background: #1d3d35; border-radius: 5px; overflow: hidden; margin: 6px 0; }
    .progress-fill { height: 100%; border-radius: 5px; transition: width 0.3s ease; }
    .btn { background: #c9974a; color: #0a1e1a; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; font-size: 15px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .btn-sm { padding: 8px 16px; width: auto; font-size: 13px; }
    .btn-outline { background: transparent; border: 1px solid #c9974a; color: #c9974a; }
    .term { color: #c9974a; text-decoration: underline dotted; cursor: pointer; }
    /* النوافذ تظهر وتختفي بتخفيف بدل أن تُقحَم دفعةً واحدة */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
      animation: overlayIn 0.16s ease-out both; }
    .modal { background: #122e27; border-radius: 18px; padding: 24px; max-width: 400px; width: 100%; border: 1px solid #c9974a; max-height: 80vh; overflow-y: auto;
      animation: modalIn 0.24s cubic-bezier(0.16, 1.02, 0.4, 1) both; }
    .modal-overlay.closing { animation: overlayOut 0.14s ease-in both; }
    .modal-overlay.closing .modal { animation: modalOut 0.14s ease-in both; }
    @keyframes overlayIn  { from { opacity: 0 } to { opacity: 1 } }
    @keyframes overlayOut { from { opacity: 1 } to { opacity: 0 } }
    @keyframes modalIn    { from { opacity: 0; transform: translateY(14px) scale(0.965) } to { opacity: 1; transform: none } }
    @keyframes modalOut   { from { opacity: 1; transform: none } to { opacity: 0; transform: translateY(8px) scale(0.98) } }
    @media (prefers-reduced-motion: reduce) {
      .modal-overlay, .modal, .modal-overlay.closing, .modal-overlay.closing .modal { animation: none !important; }
    }
    .modal h2 { color: #c9974a; margin-bottom: 16px; font-size: 20px; }
    input { width: 100%; padding: 10px; background: #0a1e1a; border: 1px solid #1d3d35; color: #e0e8e4; border-radius: 8px; font-family: inherit; margin: 6px 0 14px; font-size: 15px; }
    input[type=range] { accent-color: #c9974a; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .slider-row span { font-size: 13px; }
    .slider-row .val { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #c9974a; }
    .row-actions { display: flex; gap: 8px; align-items: center; }
    .row-actions input { margin: 0; }
    .event-art { width: 100%; height: auto; display: block; background: #0a1e1a; border: 1px solid #1d3d35; border-radius: 10px; margin-bottom: 4px; }
    .celebrate-art { width: 100%; height: auto; display: block; background: #0a1e1a; border-radius: 10px; margin-bottom: 12px; }
    .event-btn { background: #1d3d35; border: 1px solid #2a5043; color: #e0e8e4; padding: 12px; border-radius: 8px; width: 100%; margin: 6px 0; cursor: pointer; font-family: inherit; font-size: 14px; text-align: right; transition: background 0.2s; }
    .event-btn:hover { background: #2a5043; }
    .next-step { display: flex; align-items: center; gap: 8px; margin: 0 10px 6px;
      padding: 7px 10px; border-radius: 8px; background: rgba(201,151,74,0.12);
      border: 1px solid rgba(201,151,74,0.35); font-size: 12px; line-height: 1.6; }
    .next-step.hidden { display: none; }
    .next-step span { flex: 1; }
    .next-step b { color: #c9974a; }
    .next-step button { background: none; border: none; color: #8aa89b; font-size: 14px;
      cursor: pointer; padding: 0 2px; line-height: 1; }
    .choice-hint { display: block; font-size: 11px; color: #e67e22; margin-top: 4px; }
    .inline-error { color: #e74c3c; font-size: 13px; margin: -8px 0 12px; min-height: 16px; }
    .muted { color: #8aa89b; }
    .term-row { padding: 10px 0; border-bottom: 1px solid #1d3d35; cursor: pointer; }
    @media (max-width: 380px) { .stats-panel.open { grid-template-columns: repeat(3, 1fr); } }
    /* شاشات قصيرة: نقلّص الهوامش والأزرار كي تبقى الرقعة مفيدة الحجم */
    @media (max-height: 700px) {
      .hud { padding: 8px 14px; }
      .hud-net { font-size: 19px; }
      #moodEmoji { font-size: 23px; }
      .rank-bar { margin: 6px 14px 0; }
      .stage { margin: 6px 10px; }
      .dpad-btn { width: 44px; height: 44px; font-size: 16px; }
      .dpad { gap: 4px; }
      .dpad-row { gap: 4px; }
      .controls { padding: 6px 16px max(10px, env(safe-area-inset-bottom)); }
    }
    @media (max-height: 580px) {
      .dpad-btn { width: 38px; height: 38px; font-size: 14px; }
      .rank-bar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud">
      <span id="moodEmoji">🙂</span>
      <div class="hud-mid">
        <div class="hud-date" id="hudDate">السنة 1 · شهر 1</div>
        <div class="hud-net" id="hudNet">0 <small>ريال</small></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" id="soundBtn" title="الصوت">🔊</button>
        <button class="btn btn-sm" id="statsBtn">📊</button>
      </div>
    </div>

    <div class="rank-bar">
      <div class="rank-head">
        <span id="rankName">مبتدئ</span>
        <span class="muted" id="rankNext"></span>
      </div>
      <div class="progress" style="height:6px;margin:0"><div class="progress-fill" id="rankFill" style="width:0%;background:#c9974a"></div></div>
    </div>

    <div class="next-step hidden" id="nextStep">
      <span id="nextStepText"></span>
      <button id="nextStepClose" title="إخفاء الإرشاد">✕</button>
    </div>

    <div class="stats-panel" id="statsPanel">
      <div class="stat-box"><div class="label">💰 الجاري</div><div class="value" id="statCash">0</div></div>
      <div class="stat-box"><div class="label">🛡 الطوارئ</div><div class="value" id="statEmergency">0</div></div>
      <div class="stat-box"><div class="label">📈 استثمارات</div><div class="value" id="statInvest">0</div></div>
      <div class="stat-box"><div class="label">💳 ديون</div><div class="value" id="statDebt">0</div></div>
      <div class="stat-box"><div class="label">🏠 المنزل</div><div class="value" id="statHome">0</div></div>
      <div class="stat-box"><div class="label">😊 الرضا</div><div class="value" id="statMorale">0</div></div>
      <div class="stat-box"><div class="label">🏅 ائتماني</div><div class="value" id="statCredit">0</div></div>
    </div>

    <div class="stage">
      <canvas id="game" width="576" height="520"></canvas>
      <button class="interact-btn hidden" id="interactBtn"></button>
    </div>

    <div class="controls">
      <div class="dpad-spacer"></div>
      <div class="dpad">
        <button class="dpad-btn" id="btnUp">▲</button>
        <div class="dpad-row">
          <button class="dpad-btn" id="btnLeft">◀</button>
          <button class="dpad-btn" id="btnDown">▼</button>
          <button class="dpad-btn" id="btnRight">▶</button>
        </div>
      </div>
      <div class="dpad-spacer"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script>
    const fmt = (n) => Math.round(n).toLocaleString("en-US");

    // كل نص يكتبه اللاعب (أسماء الأهداف مثلاً) يمرّ عبر هذه قبل الحقن في innerHTML.
    // بدونها كان اسم هدف مثل <img onerror=...> يُحقن كعنصر حقيقي في الصفحة.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));

    // ==================== القاموس المالي ====================
    const DICTIONARY = {
      "الفائدة المركبة": "الفائدة التي تُحسب على أصل المبلغ + الفوائد السابقة. قوتها تظهر مع الزمن.",
      "التضخم": "ارتفاع عام في الأسعار يقلل من القوة الشرائية للنقود مع الوقت.",
      "التنويع": "توزيع الاستثمارات على أصول مختلفة لتقليل المخاطر.",
      "نسبة الدين إلى الدخل": "إجمالي الأقساط الشهرية ÷ الدخل الشهري. يُنصح ألا تتجاوز 35%.",
      "الدين إلى الدخل السنوي": "إجمالي دينك ÷ دخلك السنوي. مقياس لحجم الدين نفسه لا لعبء قسطه، وهو ما يحرّك تصنيفك الائتماني في اللعبة.",
      "التصنيف الائتماني": "درجة من 300 إلى 850 تعكس انضباطك في الدين. كلما ارتفعت انخفضت الفائدة التي تدفعها على قروضك.",
      "الاستقلال المالي": "أن تكفي عوائد أصولك المُدِرّة للدخل مصروفاتك دون حاجة إلى راتب. لا يُحتسب فيه بيت السكن لأنه لا يولّد دخلاً. والقاعدة الشائعة أن تبلغ ثروتك المُدِرّة 25 ضعف مصروفاتك السنوية (سحب 4% سنويًا). وهدف هذه اللعبة 8 أضعاف — تبسيطٌ يُبقي الجولة في حدود سنوات معدودة، وعائده يغطي نحو 80% من مصروفك، فاعتبره بداية الطريق لا نهايته.",
      "الثروة المُدِرّة للدخل": "الأصول التي تنتج عائدًا: النقد والطوارئ والاستثمارات ومدّخرات أهدافك، ناقصًا ديونك. تُستثنى منها دار السكن لأنك تعيش فيها ولا تبيعها لتغطية مصروفاتك.",
      "منحة الأرض": "أرض سكنية تُخصَّص للمواطن العُماني بناءً على طلبه. تختصر أكبر بند في كلفة التملك، ويبقى عليك تمويل البناء.",
      "قرض الإسكان": "تمويل مدعوم طويل الأجل لبناء المسكن بفائدة منخفضة. يقلّ رصيده مع كل قسط، وإن سدّدت جزءًا مبكرًا انخفض القسط تناسبيًا ووفّرت فائدة ما تبقّى.",
      "حقوق الملكية": "ما تملكه فعلاً من المنزل = ما أنفقته على بنائه ناقص ما تبقّى من قرضه.",
      "البناء التدريجي": "إنجاز المسكن على مراحل بحسب ما يتوفر من مال، بدل انتظار المبلغ كاملاً. شائع في عُمان ويقلل الحاجة للاقتراض.",
      "تضخّم نمط الحياة": "ارتفاع إنفاقك كلما ارتفع دخلك، فيبقى فائضك كما هو رغم زيادة الراتب.",
      "الزكاة": "ركن من أركان الإسلام: 2.5% سنويًا من المال الزكوي إذا بلغ النصاب وحال عليه الحول. تُستثنى دار السكن وحاجاتك الأصلية، ويُخصم الدين الحالّ وما يستحق من أقساط طويلة الأجل خلال السنة. (وللمسألة تفصيل عند أهل العلم، وما في اللعبة تبسيط تعليمي.)",
      "النصاب": "الحد الأدنى للمال الذي تجب فيه الزكاة، ويُقدَّر بقيمة 85 جرامًا من الذهب.",
      "الحول": "مرور سنة كاملة على بلوغ المال النصاب، وعندها تجب الزكاة.",
      "التأمين": "دفع مبلغ صغير منتظم لتفادي خسارة كبيرة مفاجئة. لا يمنع الحدث لكنه يحدّ من أثره على مالك.",
      "الاستثمار في الذات": "إنفاق على تعليمك ومهاراتك. عائده يظهر في دخلك مدى الحياة، وغالبًا يفوق عائد الأصول المالية.",
      "تكلفة الفرصة البديلة": "ما تخسره من أفضل خيار تركته. كل ريال تنفقه اليوم هو ريال لم يُستثمر لينمو.",
      "صندوق الطوارئ": "مبلغ يعادل 3-6 أشهر من خروجك الشهري — مصروفاتك مع التزاماتك الثابتة (قسط الإسكان والتأمين)، لأنها لا تتوقف حين يتوقف دخلك. يُستخدم في الطوارئ، وفي هذه اللعبة يُسحب منه تلقائيًا قبل أن تقترض إذا عجز شهرك.",
      "العائد على الاستثمار": "الربح أو الخسارة من الاستثمار مقارنة بتكلفته الأصلية.",
      "السيولة": "سرعة تحويل الأصل إلى نقد بدون خسارة كبيرة في القيمة.",
      "المخاطر": "احتمال خسارة جزء من رأس المال المستثمر.",
      "الرافعة المالية": "استخدام الديون لزيادة حجم الاستثمارات، مما يضخم الأرباح والخسائر."
    };

    // ==================== الحالة الأولية ====================
    // ==================== الزكاة ====================
    // 2.5% سنويًا على الأموال الزكوية إذا بلغت النصاب وحال عليها الحول.
    // تُستثنى دار السكن وحاجاتك الأصلية، ويُخصم الدين.
    const ZAKAT_RATE = 0.025;
    const ZAKAT_NISAB = 3000; // نصاب تقديري بقيمة 85 جرامًا من الذهب

    // ما ادّخرته في الأهداف مالٌ ما زلت تملكه، مخصَّصًا لا مفقودًا. كان يختفي
    // من صافي ثروتك ومن وعاء الزكاة معًا: يعاقب من يستعمل لوحة الأهداف كما
    // صُمّمت، ويفتح باب إسقاط الزكاة بإيداع المال في هدف قبل حلول الحول.
    function goalSavings(s) {
      return (Array.isArray(s.goals) ? s.goals : [])
        .filter((g) => g && !g.spent)
        .reduce((a, g) => a + (Number(g.saved) || 0), 0);
    }

    function zakatableWealth(s) {
      const inv = Object.values(s.investments).reduce((a, i) => a + i.amount, 0);
      // دار السكن ليست من أموال الزكاة. ويُخصم الدين الحالّ كاملاً، أما قرض
      // الإسكان طويل الأجل فيُخصم منه ما يستحق خلال السنة فقط لا رصيده كله —
      // وإلا لأسقط قرضٌ لخمس عشرة سنة الزكاةَ طوال مدته.
      const h = s.housing || INITIAL_STATE.housing;
      const housingDueThisYear = Math.min(h.loan || 0, (h.loanPayment || 0) * 12);
      return Math.max(0, s.cash + s.emergency + inv + goalSavings(s) - s.debt - housingDueThisYear);
    }
    function zakatDue(s) {
      const w = zakatableWealth(s);
      return w >= ZAKAT_NISAB ? Math.round(w * ZAKAT_RATE) : 0;
    }

    // ==================== التعليم والمهارات ====================
    const COURSES = [
      { level: 1, name: "دورة مهنية", cost: 400, months: 3, raise: 0.08, desc: "شهادة قصيرة ترفع دخلك 8%." },
      { level: 2, name: "دبلوم تخصصي", cost: 1200, months: 5, raise: 0.15, desc: "دبلوم يرفع دخلك 15%." },
      { level: 3, name: "شهادة احترافية", cost: 3000, months: 8, raise: 0.25, desc: "اعتماد مهني يرفع دخلك 25%." },
    ];
    function nextCourse(s) {
      return COURSES.find((c) => c.level === (s.education?.level ?? 0) + 1) || null;
    }

    // ==================== الإنجازات ====================
    const ACHIEVEMENTS = [
      // يُقاس بما ادّخرته واستثمرته فعلاً لا بما بدأت به: اللاعب يبدأ
      // بـ1,150 قابلة للاستثمار، فشرط "أول ألف" كان يتحقق قبل أي فعل.
      { id: "first_save",  name: "أول ألف",            icon: "💰", test: (s, d) => s.emergency + d.totalInv >= 1000 },
      { id: "emergency",   name: "طوارئ ٦ أشهر",       icon: "🛡", test: (s, d) => s.emergency >= d.emergencyTarget },
      { id: "investor",    name: "أول استثمار",        icon: "📈", test: (s) => Object.values(s.investments).some((i) => i.cost > 0) },
      { id: "diversified", name: "محفظة متنوعة",       icon: "🧺", test: (s) => Object.values(s.investments).filter((i) => i.amount > 0).length >= 3 },
      // يتطلب أن تكون قد حملت دينًا ثم سدّدته؛ الشرط السابق كان يُمنح
      // لمن لم يستدن قط لأن اللاعب يبدأ بلا دين أصلاً.

      if (v >= 3 && v <= 10) return `${v} ${few}`;

    // ==================== الأحداث المالية ====================
    // كانت خيارات الأحداث تطرح كلفتها مباشرة من الطوارئ أو النقد بلا تحقق، فيهبط
    // الرصيد تحت الصفر: مالٌ وهمي يُنفَق ولا يُقترض، ويشوّه صافي الثروة والزكاة.
    // الآن يُستنزف المصدر ثم النقد، وما بقي يُغطّى بدَين حقيقي عليه فائدة.
    function fundsFor(s, source) {
      return Math.max(0, s.cash) + (source === "emergency" ? Math.max(0, s.emergency) : 0);
    }
    function spend(s, cost, source) {
      let left = Math.max(0, Math.round(cost));
      const out = { ...s };
      if (source === "emergency") {
        const take = Math.min(Math.max(0, out.emergency), left);
        out.emergency -= take; left -= take;
      }
      const fromCash = Math.min(Math.max(0, out.cash), left);
      out.cash -= fromCash; left -= fromCash;
      if (left > 0) { out.debt += left; out.hadDebt = true; }
      return out;
    }
    // الفارق الذي سيُقترض — يُعرض على الزر قبل الاختيار لا بعده
    function gapOf(s, cost, source) {
      return Math.max(0, Math.round(cost) - fundsFor(s, source));
    }
    function gapHint(cost, source) {
      return (s) => { const g = gapOf(s, cost, source);
        return g > 0 ? `سيُقترض ${fmt(g)} ريالًا لتغطية الفارق` : ""; };
    }
    function gapNote(s, cost, source) {
      const g = gapOf(s, cost, source);
      return g > 0 ? ` (اقترض ${fmt(g)})` : "";
    }

      let r = Math.random(), acc = 0;
      for (const t of MEDICAL_TIERS) { acc += t.p; if (r <= acc) return t; }
      return MEDICAL_TIERS[MEDICAL_TIERS.length - 1];
    }

    }

      return MEDICAL_TIERS.reduce((a, t) => a + t.p * t.cost, 0);
    }

    // ==================== الدوال المساعدة ====================
    // ==================== الرضا (المعنويات) ====================
    // الإنفاق الشخصي يشتري رضًا حقيقيًا: المال يذهب فعلاً، لكن إهماله يسبب إرهاقًا
    // يخفض دخلك. فيصبح "ادخر كل شيء" استراتيجية لها ثمن، لا خيارًا مجانيًا.
    const MORALE_BURNOUT = 25, MORALE_HIGH = 85;
    function moraleModifier(morale) {
      if (morale < MORALE_BURNOUT) return -0.12; // إرهاق: أداء أضعف ودخل أقل
      if (morale >= MORALE_HIGH) return 0.04;    // اندفاع: أداء أفضل
      return 0;
    }
    function moraleLabel(morale) {
      if (morale < MORALE_BURNOUT) return { text: "مُرهَق", color: "#e74c3c", emoji: "😫" };
      if (morale < 50) return { text: "متوتر", color: "#e67e22", emoji: "😟" };
      if (morale < MORALE_HIGH) return { text: "مرتاح", color: "#c9974a", emoji: "🙂" };
      return { text: "متحمّس", color: "#2ecc71", emoji: "😄" };
    }

    // ==================== التصنيف الائتماني ====================
    // يتحرك مع نسبة الدين إلى الدخل، ويحدّد الفائدة الشهرية على ديونك.
    function creditTarget(s) {
      const dti = s.monthlyIncome > 0 ? s.debt / (s.monthlyIncome * 12) : 2;
      return Math.max(300, Math.min(850, Math.round(850 - dti * 700)));
    }
    function debtMonthlyRate(score) {
      return 0.004 + ((850 - score) / 550) * 0.010; // ~0.4% عند 850 و~1.4% عند 300
    }
    function creditLabel(score) {
      if (score >= 750) return { text: "ممتاز", color: "#2ecc71" };
      if (score >= 670) return { text: "جيد", color: "#c9974a" };
      if (score >= 580) return { text: "متوسط", color: "#e67e22" };
      return { text: "ضعيف", color: "#e74c3c" };
    }

    function derive(state) {
      const tempEffects = state.tempEffects || [];
      const incomeAdj = tempEffects.filter((e) => e.type === "income").reduce((a, e) => a + e.amount, 0);
      const expenseAdj = tempEffects.filter((e) => e.type === "expense").reduce((a, e) => a + e.amount, 0);
      const moraleMod = moraleModifier(state.morale ?? 70);
      // أرضية عند الصفر: مهما تراكمت آثار خفض الدخل لا يصبح الراتب سالبًا
      // (لا تدفع لصاحب العمل). كان تكرار فقدان الوظيفة يهبط بالدخل تحت الصفر.
      const effIncome = Math.max(0, Math.round((state.monthlyIncome + incomeAdj) * (1 + moraleMod)));
      const effExpenses = state.monthlyExpenses + expenseAdj;
      // التزامات شهرية مؤكدة تُخصم خارج بند المصروفات: قسط الإسكان وقسط
      // التأمين. كانت شاشة الراتب تعرض الفائض قبلهما فتدعو اللاعب لتوزيع
      // مالٍ ملتزَم به أصلاً — يوزّع 658 وهو لا يملك سوى 416، فيجفّ نقده.
      const hh = state.housing || INITIAL_STATE.housing;
      const loanDue = hh.loan > 0
        ? Math.min(hh.loanPayment || 0, hh.loan + Math.round(hh.loan * HOUSING_LOAN_RATE)) : 0;
      const commitments = loanDue + (state.insurance?.health ? INSURANCE_PREMIUM : 0);
      const grossSurplus = effIncome - effExpenses;
      const surplus = grossSurplus - commitments;
      const totalInv = Object.values(state.investments).reduce((sum, inv) => sum + inv.amount, 0);
      // ما بنيته من المنزل أصل تملكه، وقرض الإسكان التزام عليك — وإلا بدا البناء
      // وكأنه تبديد لثروتك بينما هو تحويلها من نقد إلى عقار.
      const housing = state.housing || INITIAL_STATE.housing;
      const homeEquity = (housing.built || 0) - (housing.loan || 0);
      const goalsSaved = goalSavings(state);
      const netWorth = state.cash + state.emergency + totalInv + goalsSaved + homeEquity - state.debt;
      // الثروة المُدِرّة للدخل: تستثني منزل السكن وقرضه، لأن البيت الذي تسكنه
      // لا يموّل مصروفاتك. الاستقلال المالي يُقاس بها لا بصافي الثروة كاملًا.
      const investableNetWorth = state.cash + state.emergency + totalInv + goalsSaved - state.debt;
      // الشهر بلا دخل لا يتوقف فيه قسط الإسكان ولا قسط التأمين، فقياس
      // التغطية على المصروفات وحدها يبالغ في طمأنة اللاعب: صندوق بـ3,600
      // كان يُعرض كتغطية ستة أشهر بينما الخروج الحقيقي 853 شهريًا — 4.2 أشهر.
      const monthlyOutflow = effExpenses + commitments;
      const coverage = monthlyOutflow > 0 ? state.emergency / monthlyOutflow : 0;
      const emergencyTarget = Math.round(monthlyOutflow * 6);
      return { surplus, grossSurplus, commitments, netWorth, investableNetWorth, homeEquity,
               goalsSaved, totalInv, coverage, effIncome, effExpenses, emergencyTarget };
    }

    // ==================== نموذج الأصول ====================
    // عوائد شهرية واقعية: لا يوجد أصل يتفوّق على البقية في كل شيء.
    // العملات الرقمية أعلى عائدًا متوقعًا لكنها تحمل تقلبًا هائلاً واحتمال انهيار مفاجئ،
    // فيصبح التنويع خيارًا حقيقيًا بدل أن يكون نصيحة في القاموس فقط.
    const ASSETS = {
      bonds:      { label: "سندات",        mean: 0.0035, spread: 0.0015, income: 0,      crashP: 0,    crashMag: 0,    risk: "منخفضة جدًا" },
      stocks:     { label: "أسهم",          mean: 0.0085, spread: 0.055,  income: 0,      crashP: 0,    crashMag: 0,    risk: "متوسطة" },
      realEstate: { label: "عقار",          mean: 0.0035, spread: 0.012,  income: 0.0045, crashP: 0,    crashMag: 0,    risk: "منخفضة" },
      crypto:     { label: "عملات رقمية",   mean: 0.022,  spread: 0.22,   income: 0,      crashP: 0.03, crashMag: 0.30, risk: "عالية جدًا" },
    };
    // العائد السنوي المتوقع بعد احتساب احتمال الانهيار، لعرضه للاعب
    function expectedAnnual(key) {
      const a = ASSETS[key];
      const m = a.mean + a.income - a.crashP * a.crashMag;
      return (Math.pow(1 + m, 12) - 1) * 100;
    }
    function drawAssetReturn(key) {
      const a = ASSETS[key];
      let r = a.mean + (Math.random() * 2 - 1) * a.spread;
      let crashed = false;
      if (a.crashP && Math.random() < a.crashP) { r -= a.crashMag; crashed = true; }
      return { growth: r, income: a.income, crashed };
    }

    // ==================== الرتب ونهاية اللعبة ====================
    // هدف الاستقلال المالي: ثروة تعادل 8 أضعاف المصروفات السنوية.
    function fiTarget(s) { return s.monthlyExpenses * 12 * 8; }
    const BANKRUPT_AT = -2500;

    const RANKS = [
      { min: -Infinity, name: "متعثّر" },
      { min: 0, name: "مبتدئ" },
      { min: 2500, name: "مدّخر" },
      { min: 12000, name: "مستثمر" },
      { min: 30000, name: "مستثمر متمرّس" },
      { min: 50000, name: "قريب من الاستقلال" },
    ];

    // يُقاس السلّم بالثروة المُدِرّة للدخل لا بصافي الثروة، لأنه سلّم نحو
    // الاستقلال المالي: من يملك بيته ولا يملك استثمارات كان يُسمّى "قريب من
    // الاستقلال" وهو لم يقطع سُبع الطريق. أما "متعثّر" فتُقاس بصافي الثروة
    // كاملًا، إذ لا يصح وصف من يملك بيته خالصًا بالتعثّر.
    function rankInfo(s) {
      const d = derive(s);
      const fi = fiTarget(s);
      if (d.investableNetWorth >= fi) return { name: "مستقل ماليًا 🏆", pct: 1, nextLabel: "اكتمل" };
      if (d.netWorth < 0) {
        const pct = Math.max(0, Math.min(1, (d.netWorth - BANKRUPT_AT) / (0 - BANKRUPT_AT)));
        return { name: RANKS[0].name, pct, nextLabel: "التالي عند 0" };
      }
      const w = Math.max(0, d.investableNetWorth);
      let idx = 1;
      for (let i = 1; i < RANKS.length; i++) if (w >= RANKS[i].min) idx = i;
      const cur = RANKS[idx];
      const nextMin = idx + 1 < RANKS.length ? RANKS[idx + 1].min : fi;
      const pct = Math.max(0, Math.min(1, (w - cur.min) / (nextMin - cur.min)));
      return { name: cur.name, pct, nextLabel: `التالي عند ${fmt(nextMin)}` };
    }

    function cloneInvestments(inv) {
      return {
        stocks: { ...inv.stocks },
        bonds: { ...inv.bonds },
        realEstate: { ...inv.realEstate },
        crypto: { ...inv.crypto },
      };
    }

    // ==================== الحالة والحفظ ====================
    const SAVE_KEY = "zeroGameStateV1";
    let isFirstVisit = false;
    let lastStockDelta = 0;   // آخر تغيّر في الأسهم، يُستخدم لسهم المؤشر فوق البورصة
    let lastAssetMoves = {};  // آخر تغيّر لكل أصل، لعرضه في البورصة
    const FLOATERS = [];    // أرقام تطفو عند تغيّر صافي الثروة
    let state = loadState();

    // دمج عميق: الدمج السطحي كان يُبقي الكائنات المتداخلة من الحفظ القديم كما هي،
    // فيغيب عنها أي حقل أُضيف لاحقًا. مثال حقيقي: حفظ قديم في مرحلة "waiting"
    // بلا waitMonths كان يعطي undefined - 1 = NaN، و NaN <= 0 خطأ دائمًا،
    // فيعلق اللاعب في انتظار منحة الأرض إلى الأبد.
    function mergeDefaults(defaults, saved) {
      if (Array.isArray(defaults)) return Array.isArray(saved) ? saved : structuredClone(defaults);
      if (defaults && typeof defaults === "object") {
        const src = saved && typeof saved === "object" && !Array.isArray(saved) ? saved : {};
        const out = {};
        for (const k of Object.keys(defaults)) out[k] = mergeDefaults(defaults[k], src[k]);
        // نحتفظ بأي مفاتيح إضافية في الحفظ لا نعرفها (توافق للأمام)
        for (const k of Object.keys(src)) if (!(k in out)) out[k] = src[k];
        return out;
      }
      return saved === undefined || saved === null || (typeof defaults === "number" && !Number.isFinite(saved))
        ? defaults
        : saved;
    }

    // قد يرمي التخزين استثناءً (تصفّح خاص، امتلاء الحصة، تعطيله من المستخدم).
    // اللعبة تبقى قابلة للعب بلا حفظ، فنبتلع الخطأ بدل أن نُسقط الإجراء الجاري.
    function saveState() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch { /* اللعب يستمر بلا حفظ */ }
    }
    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { /* تجاهل */ } }
    function lsRemove(k) { try { localStorage.removeItem(k); } catch { /* تجاهل */ } }

    // ==================== سجل الجولات ====================
    // السيناريوهات بلا ذاكرة تبقى اختيارات بلا معنى. هذا السجل يعيش في مفتاح
    // منفصل عن الحفظ، فلا تمحوه إعادة البدء — وإلا ضاع أثر كل جولة سابقة.
    const RECORDS_KEY = "zeroRecordsV1";
    function loadRecords() {
      try {
        const raw = JSON.parse(lsGet(RECORDS_KEY) || "{}");
        if (!raw || typeof raw !== "object" || Array.isArray(raw)) return {};
        const out = {};
        for (const sc of SCENARIOS) {
          const r = raw[sc.id];
          if (!r || typeof r !== "object") continue;
          const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
          out[sc.id] = { runs: num(r.runs), wins: num(r.wins), losses: num(r.losses),
                         bestMonths: num(r.bestMonths) || null, bestNetWorth: num(r.bestNetWorth) };
        }
        return out;
      } catch { return {}; }
    }
    function recordOutcome(kind) {
      const id = scenarioById(state.scenario).id;
      const recs = loadRecords();
      const r = recs[id] || { runs: 0, wins: 0, losses: 0, bestMonths: null, bestNetWorth: 0 };
      const months = (state.year - 1) * 12 + state.month;
      const nw = Math.round(derive(state).netWorth);
      r.runs += 1;
      if (kind === "win") {
        r.wins += 1;
        if (!r.bestMonths || months < r.bestMonths) r.bestMonths = months;
        if (nw > r.bestNetWorth) r.bestNetWorth = nw;
      } else r.losses += 1;
      recs[id] = r;
      lsSet(RECORDS_KEY, JSON.stringify(recs));
      return r;
    }

    function loadState() {
      try {
        const saved = lsGet(SAVE_KEY);
        if (!saved) { isFirstVisit = true; return structuredClone(INITIAL_STATE); }
        const parsed = JSON.parse(saved);
        if (!parsed || typeof parsed !== "object") throw new Error("bad save");
        return mergeDefaults(structuredClone(INITIAL_STATE), parsed);
      } catch {
        isFirstVisit = true;
        return structuredClone(INITIAL_STATE);
      }
    }

    // opts.shock: تغيّر وقع عليك لا اخترته (حدث، أو نتيجة شهر) — وحده يهزّ الشاشة
    function setState(next, opts = {}) {
      const prevNetWorth = derive(state).netWorth;
      state = next;
      // نتذكّر أنك حملت دينًا يومًا، ليصبح إنجاز السداد مستحقًا لا مجانيًا
      if (state.debt > 0) state.hadDebt = true;
      saveState();
      const delta = derive(state).netWorth - prevNetWorth;
      if (Math.abs(delta) >= 1) {
        spawnFloater(delta, opts.shock === true);
        (delta > 0 ? SFX.coin : SFX.spend)();
      }
      checkAchievements();
      refreshHud();
      checkEnding();
    }

    // تُفحص بعد كل تغيير؛ الإنجاز يُمنح مرة واحدة ويظهر كشارة طائرة
    function checkAchievements() {
      const d = derive(state);
      if (!state.achievements) state.achievements = [];
      for (const a of ACHIEVEMENTS) {
        if (state.achievements.includes(a.id)) continue;
        let ok = false;
        try { ok = a.test(state, d); } catch { ok = false; }
        if (ok) {
          state.achievements.push(a.id);
          state.eventLog = [...state.eventLog, `${a.icon} إنجاز: ${a.name}`];
          BADGES.push({ icon: a.icon, name: a.name, life: 0, max: 2.6 });
          SFX.badge();
        }
      }
      saveState();
    }
    const BADGES = [];

    // تُستدعى بعد كل تغيير. الزر "تابع الاستكشاف" يُبقي اللعبة جارية بعد
    // النهاية، وكان العلم يُقفل حينها إلى الأبد: من أفلس ثم تعافى وبلغ
    // الاستقلال المالي لا يُخبَر بفوزه أبدًا. الآن يُسجَّل آخر مصير عُرض،
    // فتظهر النهاية المعاكسة إذا انقلبت حالك فعلاً.
    function checkEnding() {
      // أي قيمة غير "win"/"lose" تعني تعطيل شاشات النهاية (تستعملها المحاكاة)
      if (state.finished && state.finished !== "win" && state.finished !== "lose") return;
      const d = derive(state);
      // الفوز يقاس بالثروة المُدِرّة للدخل: امتلاك بيت السكن وحده لا يعني استقلالًا ماليًا
      const kind = d.investableNetWorth >= fiTarget(state) ? "win"
                 : d.netWorth <= BANKRUPT_AT ? "lose" : null;
      if (!kind || state.finished === kind) return;
      state.finished = kind;
      saveState();
      recordOutcome(kind);
      showEnding(kind);
    }

    function resetGame(scenarioId) {
      lsRemove(SAVE_KEY);
      state = scenarioState(typeof scenarioId === "string" ? scenarioId : (state?.scenario || "fresh"));
      saveState();
      // نعيد اللاعب إلى الساحة أيضًا؛ بدونها تبدأ الجولة الجديدة وأنت واقف
      // عند باب مبنى من الجولة السابقة وزر الدخول ظاهر.
      if (typeof player !== "undefined") {
        player.x = 224; player.y = 352;
        player.facing = "down";
        if (typeof pressed !== "undefined") pressed.clear();
      }
      closeAllModals();
      refreshHud();
    }

    // ==================== الصوت (مولّد بالكامل، بلا ملفات خارجية) ====================
    let audioCtx = null;
    let soundOn = lsGet("zeroSound") !== "off";
    function ensureAudio() {
      if (!soundOn) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    // نغمة بسيطة؛ تُتجاهل بصمت إن لم يدعم المتصفح الصوت
    function tone(freq, dur = 0.12, type = "sine", gain = 0.05, delay = 0) {
      const ac = ensureAudio();
      if (!ac) return;
      try {
        const osc = ac.createOscillator(), g = ac.createGain();
        osc.type = type; osc.frequency.value = freq;
        const t0 = ac.currentTime + delay;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g); g.connect(ac.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.02);
      } catch { /* لا شيء: الصوت تحسين لا ضرورة */ }
    }
    const SFX = {
      coin:    () => { tone(880, 0.09, "triangle", 0.05); tone(1320, 0.12, "triangle", 0.04, 0.06); },
      spend:   () => tone(320, 0.14, "sine", 0.05),
      error:   () => tone(180, 0.2, "sawtooth", 0.04),
      success: () => { tone(523, 0.12, "triangle", 0.05); tone(659, 0.12, "triangle", 0.05, 0.1); tone(784, 0.2, "triangle", 0.05, 0.2); },
      build:   () => { tone(200, 0.07, "square", 0.035); tone(260, 0.07, "square", 0.03, 0.08); },
      alert:   () => { tone(400, 0.14, "sawtooth", 0.04); tone(300, 0.18, "sawtooth", 0.04, 0.12); },
      badge:   () => { tone(1046, 0.1, "triangle", 0.05); tone(1568, 0.16, "triangle", 0.04, 0.09); },
    };

    // معرّفة كتصريحات دوال (مرفوعة) كي يمكن استدعاؤها من setState قبل قسم الرسوميات
    let shake = 0; // شدة اهتزاز الشاشة الحالية

    // الاهتزاز إنذار، والإنذار لا يكون على فعلٍ اخترته. كان يهتزّ حين تصرف
    // هدفًا ادّخرت له، وحين تلتحق بدورة، وحين تُخرج زكاتك — أي أن اللعبة
    // تُنذرك من قرارات تكافئك عليها. صار مقصورًا على ما يقع عليك: الأحداث
    // ونتيجة الشهر. والرقم الطائر يبقى في الحالتين لأن المال خرج فعلاً.
    function spawnFloater(delta, shock) {
      FLOATERS.push({
        text: `${delta > 0 ? "+" : "−"}${fmt(Math.abs(delta))}`,
        color: delta > 0 ? "#2ecc71" : "#e74c3c",
        life: 0, max: 1.6, dx: (Math.random() - 0.5) * 10,
      });
      if (shock && delta <= -75) shake = Math.min(7, 2 + Math.abs(delta) / 175);
    }

    // ==================== منطق الشهر والأحداث ====================
    function advanceMonth(baseState) {
      const source = baseState || state;
      let s = {
        ...source,
        investments: cloneInvestments(source.investments),
        tempEffects: (source.tempEffects || []).map((e) => ({ ...e })),
        housing: { ...(source.housing || INITIAL_STATE.housing) },
        // education تُنسخ بعمق لأن pending يُعدَّل مباشرة أدناه؛ بدونها كان
        // العدّاد يُنقص في الحالة الأصلية أيضًا عبر مرجع مشترك.
        education: {
          ...(source.education || INITIAL_STATE.education),
          pending: source.education?.pending ? { ...source.education.pending } : null,
        },
        zakat: { ...(source.zakat || INITIAL_STATE.zakat) },
        insurance: { ...(source.insurance || INITIAL_STATE.insurance) },
      };

      // منحة الأرض: انتظار التخصيص من البلدية
      if (s.housing.stage === "waiting") {
        s.housing.waitMonths -= 1;
        if (s.housing.waitMonths <= 0) {
          s.housing.stage = "land";
          s.housing.waitMonths = 0;
          s.eventLog = [...s.eventLog, "🏜️ تم تخصيص منحة أرض سكنية لك"];
        }
      }

      // تقرير الشهر: نلتقط ما تغيّر فعلاً كي يراه اللاعب بدل أن يتغيّر بصمت
      const rep = { assets: {}, rent: 0, loanPaid: 0, debtInterest: 0,
                    creditFrom: s.creditScore, moraleFrom: Math.round(s.morale ?? 70),
                    premium: 0, inflation: false };

      // قسط قرض الإسكان
      if (s.housing.loan > 0) {
        const interest = Math.round(s.housing.loan * HOUSING_LOAN_RATE);
        const pay = Math.min(s.housing.loanPayment, s.housing.loan + interest);
        s.housing.loan = Math.max(0, s.housing.loan + interest - pay);
        s.cash -= pay;
        rep.loanPaid = pay;
        if (s.housing.loan === 0) {
          s.housing.loanPayment = 0;
          s.eventLog = [...s.eventLog, "✅ سُدّد قرض الإسكان بالكامل"];
        }
      }
      if (s.month % 12 === 0) {
        s.monthlyIncome = Math.round(s.monthlyIncome * 1.02);
        s.monthlyExpenses = Math.round(s.monthlyExpenses * 1.015);
        rep.inflation = true;
      }
      // كل أصل يسحب عائده الشهري مستقلاً عن الآخر، فيقلّ تقلّب المحفظة كلما نوّعت
      lastAssetMoves = {};
      for (const key of Object.keys(ASSETS)) {
        const inv = s.investments[key];
        const { growth, income, crashed } = drawAssetReturn(key);
        lastAssetMoves[key] = { pct: growth + income, crashed };
        if (inv.amount <= 0) continue;
        const before = inv.amount;
        if (income > 0) {
          inv.rentalIncome = Math.round(inv.amount * income);
          s.cash += inv.rentalIncome;
          rep.rent += inv.rentalIncome;
        }
        inv.amount = Math.max(0, Math.round(inv.amount * (1 + growth)));
        rep.assets[key] = { delta: inv.amount - before, pct: growth, crashed };
        // إن أفنى الانهيار المركز بالكامل فقد تحققت الخسارة وأُغلق المركز:
        // إبقاء التكلفة كان يجعل أي شراء جديد يظهر خاسرًا بمبلغ قديم إلى الأبد.
        if (inv.amount === 0) {
          s.realizedPL = (s.realizedPL || 0) - inv.cost;
          inv.cost = 0; inv.rentalIncome = 0;
        }
        if (crashed) s.eventLog = [...s.eventLog, `📉 انهيار مفاجئ في ${ASSETS[key].label}`];
      }
      lastStockDelta = lastAssetMoves.stocks.pct;

      // التصنيف الائتماني يتحرك تدريجيًا نحو ما تستحقه نسبة دينك إلى دخلك،
      // وهو من يحدد فائدة الدين بدل النسبة الثابتة السابقة.
      s.creditScore = Math.round(s.creditScore + (creditTarget(s) - s.creditScore) * 0.15);
      if (s.debt > 0) {
        const before = s.debt;
        s.debt = Math.round(s.debt * (1 + debtMonthlyRate(s.creditScore)));
        rep.debtInterest = s.debt - before;
      }

      // قسط التأمين الصحي
      if (s.insurance?.health) { s.cash -= INSURANCE_PREMIUM; rep.premium = INSURANCE_PREMIUM; }

      // إتمام الدراسة: الزيادة تُصرف عند التخرّج لا عند الدفع
      if (s.education?.pending) {
        s.education.pending.monthsLeft -= 1;
        if (s.education.pending.monthsLeft <= 0) {
          const c = s.education.pending;
          s.monthlyIncome = Math.round(s.monthlyIncome * (1 + c.raise));
          s.education = { ...s.education, level: c.level, pending: null };
          s.morale = Math.min(100, (s.morale ?? 70) + 10);
          s.eventLog = [...s.eventLog, `🎓 أتممت ${c.name} — دخلك ارتفع ${Math.round(c.raise * 100)}%`];
        }
      }

      // الرضا يتآكل شهريًا، ويتأثر بضغط الدين وبراحة صندوق الطوارئ
      let morale = s.morale ?? 70;
      morale -= 4;
      if (s.debt > s.monthlyIncome * 3) morale -= 3;
      if (s.monthlyExpenses > 0 && s.emergency / s.monthlyExpenses >= 3) morale += 2;
      const wasBurntOut = (s.morale ?? 70) < MORALE_BURNOUT;
      s.morale = Math.max(0, Math.min(100, morale));
      if (!wasBurntOut && s.morale < MORALE_BURNOUT) {
        s.eventLog = [...s.eventLog, "😫 وصلت إلى الإرهاق — دخلك ينخفض حتى ترفع رضاك"];
      }

      // الراتب يدخل كاملاً؛ القسطان خُصما أعلاه صراحةً كي يظهرا في التقرير،
      // فلا يُخصمان هنا مرة أخرى. والفائض المعروض للتوزيع هو الصافي بعدهما.
      const { surplus, grossSurplus } = derive(s);
      s.cash += grossSurplus;

      // العجز لا يبقى نقدًا سالبًا: كان قسط الإسكان والتأمين وفائض الشهر
      // السالب تهبط بالنقد تحت الصفر بصمت — حفرة بلا فائدة ولا أثر على
      // التصنيف الائتماني، فيصير إهمال العجز أرخص من قرض صريح. الآن
      // يغطّيه البنك دينًا عليه فائدة، كما يفعل السحب على المكشوف.
      if (s.cash < 0) {
        let short = Math.round(-s.cash);
        s.cash = 0;
        // صندوق الطوارئ لهذا بالذات. كان العجز يُقترض بفائدة والصندوق ممتلئ
        // إلى جانبه — أي أن اللعبة تعلّمك ادّخاره ثم لا تستعمله حين يلزم.
        const fromEmergency = Math.min(Math.max(0, s.emergency), short);
        if (fromEmergency > 0) {
          s.emergency -= fromEmergency;
          short -= fromEmergency;
          rep.emergencyUsed = fromEmergency;
          s.eventLog = [...s.eventLog, `🛡 عجز ${fmt(fromEmergency)} — غطّاه صندوق الطوارئ`];
        }
        if (short > 0) {
          s.debt += short;
          s.hadDebt = true;
          rep.overdraft = short;
          s.eventLog = [...s.eventLog, `🏧 عجز ${fmt(short)} — غطّاه البنك دَينًا عليك`];
        }
      }

      s.tempEffects = s.tempEffects.map((e) => ({ ...e, monthsLeft: e.monthsLeft - 1 })).filter((e) => e.monthsLeft > 0);
      s.month += 1;
      if (s.month > 12) { s.month = 1; s.year += 1; }

      // نستخدم derive نفسها كي يطابق المنحنى ما يعرضه الشريط العلوي؛
      // الحساب اليدوي السابق كان يُسقط قيمة المنزل فيختلف الرسم عن الواقع.
      const nw = derive(s).netWorth;
      s.history = [...s.history, { month: s.month + (s.year - 1) * 12, netWorth: nw }];
      // نحدّ من نمو الحفظ: يكفي آخر 600 شهر و400 حدث لأي جولة واقعية
      if (s.history.length > 600) s.history = s.history.slice(-600);
      if (s.eventLog.length > 400) s.eventLog = s.eventLog.slice(-400);

      rep.creditTo = s.creditScore;
      rep.moraleTo = Math.round(s.morale ?? 70);
      rep.surplus = surplus;
      s.lastReport = rep;

      setState(s, { shock: true });

      // حلول الحول: تُعرض الزكاة مرة واحدة كل سنة
      // تُفتح أيضًا إذا كان في ذمته متأخرات ولو لم تجب زكاة جديدة هذا العام
      const due = zakatDue(s);
      const owed = s.zakat?.unpaid ?? 0;
      if (s.year > (s.zakat?.lastDueYear ?? 0) && s.month === 1 && (due > 0 || owed > 0)) {
        openZakat(due);
        return;
      }

      if (Math.random() < 0.5) {
        const pool = EVENTS.filter((e) => !e.when || e.when(s));
        if (pool.length) openEvent(pool[Math.floor(Math.random() * pool.length)]);
      }
    }

    // ==================== شاشة الزكاة السنوية ====================
    function openZakat(due) {
      const wealth = zakatableWealth(state);
      // المتأخرات جزء من الواجب: تأجيل سنة سابقة يبقى في الذمة حتى يُدفع فعلاً
      const arrears = state.zakat?.unpaid ?? 0;
      const total = due + arrears;
      const canPay = state.cash >= total;
      SFX.alert();
      pushModal(`
        <h2>🤲 حَال الحول — الزكاة</h2>
        <canvas class="event-art" id="zakatArt" width="340" height="110"></canvas>
        <p style="margin:12px 0;line-height:1.9;font-size:13px">
          مضت سنة على مالك. ${term("الزكاة")} واجبة بنسبة 2.5% على ما بلغ ${term("النصاب")}،
          وتُستثنى دار سكنك وحاجاتك الأصلية، ويُخصم دينك الحالّ وما يستحق من أقساط
          الإسكان خلال السنة.
        </p>
        <div class="card" style="padding:12px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">وعاء الزكاة</span><b>${fmt(wealth)}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">النصاب</span><b>${fmt(ZAKAT_NISAB)}</b></div>
          ${due > 0 ? `<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">زكاة هذا العام (2.5%)</span><b style="color:#c9974a">${fmt(due)}</b></div>` : `<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">زكاة هذا العام</span><b class="muted">لا شيء — مالك دون النصاب</b></div>`}
          ${arrears > 0 ? `<div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">متأخرات في ذمتك</span><b style="color:#e74c3c">${fmt(arrears)}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid rgba(29,61,53,0.8);margin-top:3px"><span class="muted">الإجمالي الواجب</span><b style="color:#c9974a">${fmt(total)}</b></div>` : ""}
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted">النقد المتاح</span><b style="color:${canPay ? "#2ecc71" : "#e74c3c"}">${fmt(state.cash)}</b></div>
        </div>
        <div class="inline-error" id="zakatErr"></div>
        <button class="btn" id="payZakat" ${canPay ? "" : "disabled"}>${canPay ? `أخرج الزكاة (${fmt(total)})` : "لا يوجد نقد كافٍ"}</button>
        <button class="btn btn-outline" style="margin-top:10px" id="deferZakat">أجّلها (تبقى دينًا في ذمتك)</button>
      `, (root) => {
        const cv = root.querySelector("#zakatArt");
        if (cv) animateZakatArt(cv);
        root.querySelector("#payZakat").addEventListener("click", once(() => {
          if (state.cash < total) { root.querySelector("#zakatErr").textContent = "النقد لا يكفي."; return; }
          const z = state.zakat || { paidCount: 0, totalPaid: 0, unpaid: 0 };
          SFX.success();
          setState({ ...state, cash: state.cash - total,
            morale: Math.min(100, (state.morale ?? 70) + 8),
            zakat: { ...z, paidCount: z.paidCount + 1, totalPaid: z.totalPaid + total, lastDueYear: state.year, unpaid: 0 },
            eventLog: [...state.eventLog, arrears > 0 ? `🤲 أخرجت زكاة ${fmt(total)} (منها ${fmt(arrears)} متأخرات)` : `🤲 أخرجت زكاة ${fmt(total)}`] });
          closeAllModals();
        }));
        root.querySelector("#deferZakat").addEventListener("click", once(() => {
          const z = state.zakat || { paidCount: 0, totalPaid: 0, unpaid: 0 };
          setState({ ...state,
            morale: Math.max(0, (state.morale ?? 70) - 6),
            zakat: { ...z, lastDueYear: state.year, unpaid: (z.unpaid || 0) + due },
            eventLog: [...state.eventLog, `⏳ أجّلت زكاة ${fmt(due)}`] });
          closeAllModals();
        }));
      }, { mandatory: true });
    }

    function animateZakatArt(canvas) {
      const c = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      const t0 = performance.now();
      (function frame() {
        if (!canvas.isConnected) return;
        const t = (performance.now() - t0) / 1000;
        c.clearRect(0, 0, W, H);
        // كفّان مفتوحتان
        c.fillStyle = "#e8b88a";
        for (const s of [-1, 1]) {
          c.save(); c.translate(W / 2 + s * 26, H - 26); c.rotate(s * 0.3);
          c.beginPath(); c.ellipse(0, 0, 22, 11, 0, Math.PI, 0); c.fill();
          c.restore();
        }
        // عملات تتساقط من الأعلى إلى الكفّين
        for (let i = 0; i < 7; i++) {
          const p = ((t * 0.55 + i / 7) % 1);
          const x = W / 2 + Math.sin(i * 2.1) * 34;
          const y = 8 + p * (H - 44);
          c.globalAlpha = p < 0.85 ? 1 : (1 - p) / 0.15;
          c.fillStyle = i % 2 ? "#c9974a" : "#f4d58d";
          c.beginPath(); c.ellipse(x, y, 6, 5, 0, 0, Math.PI * 2); c.fill();
          c.globalAlpha = 1;
        }
        c.fillStyle = "#c9974a"; c.font = "bold 13px sans-serif";
        c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("2.5%", W / 2, 18);
        requestAnimationFrame(frame);
      })();
    }

    function openEvent(ev) {
      // بعض الأحداث تسحب شدّتها مرة واحدة: تُسحب هنا وتُمرَّر إلى الوصف
      // والأزرار والأثر معًا، كي يطابق ما وُعد به اللاعبُ ما يقع فعلاً.
      const roll = ev.roll ? ev.roll() : null;
      const desc = typeof ev.desc === "function" ? ev.desc(state, roll) : ev.desc;
      pushModal(`
        <h2>${ev.title}</h2>
        <canvas class="event-art" id="eventArt" width="340" height="120"></canvas>
        <p style="margin:12px 0;line-height:1.8">${desc}</p>
        ${ev.choices.map((c, i) => {
          const hint = c.hint ? c.hint(state, roll) : "";
          return `<button class="event-btn" data-choice="${i}">${c.label}${hint ? `<span class="choice-hint">⚠ ${hint}</span>` : ""}</button>`;
        }).join("")}
      `, (root) => {
        const artCanvas = root.querySelector("#eventArt");
        if (artCanvas) animateEventArt(artCanvas, ev.id);
        root.querySelectorAll("[data-choice]").forEach((btn) => {
          btn.addEventListener("click", once(() => {
            const choice = ev.choices[Number(btn.dataset.choice)];
            setState(choice.effect(state, roll), { shock: true });
            closeAllModals();
          }));
        });
      }, { mandatory: true });
    }
