[project]
name = "costing-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "costing",
  "ml",
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "sqlalchemy==2.0.35",
  "alembic==1.13.3",
  "psycopg[binary]==3.2.3",
  "PyJWT==2.9.0",
  "bcrypt==4.2.0",
  "redis==5.1.1",
  "rq==2.1.0",
  "apscheduler==3.10.4",
  "tenacity==9.0.0",
  "openpyxl==3.1.5",
  "httpx==0.27.2",
  "python-multipart==0.0.12",
  "hijridate==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costing_api"]
