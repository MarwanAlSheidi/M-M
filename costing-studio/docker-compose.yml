x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://costing_app:${APP_PW}@db:5432/costing
  WORKER_DATABASE_URL: postgresql+psycopg://costing_worker:${WORKER_PW}@db:5432/costing
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  ENV: dev
  UPLOAD_ROOT: /var/lib/costing/uploads
  MODEL_STORE_ROOT: /var/lib/costing/models

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PW}
      POSTGRES_DB: costing
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d costing"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *app-env
      MIGRATOR_DATABASE_URL: postgresql+psycopg://costing_migrator:${MIG_PW}@db:5432/costing
      APP_DATABASE_URL: postgresql+psycopg://costing_app:${APP_PW}@db:5432/costing
      ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_SUPERUSER}:${POSTGRES_SUPERUSER_PW}@db:5432/costing
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: uvicorn costing_api.main:app --host 0.0.0.0 --port 8000
    volumes: [uploads:/var/lib/costing/uploads, models:/var/lib/costing/models]

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: python -m costing_api.worker
    volumes: [models:/var/lib/costing/models]

  scheduler:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: python -m costing_api.jobs.schedule

volumes:
  pgdata:
  uploads:
  models:
