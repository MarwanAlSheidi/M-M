[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "costing",
  "lightgbm==4.3.0",
  "scikit-learn==1.5.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "joblib==1.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
