# Synonym maps for the PRODUCTION taxonomy, keyed by direction then by field.
#
# Two directions because gold and predictions drift differently: gold carries
# what an annotator typed, predictions carry what a model emitted. A shared map
# leaks one vocabulary into the other.
#
# Keyed per field because a surface form's meaning depends on its field:
# "stone" is a colour under color_normalized and an embellishment under
# embellishment_type. A flat map turns one into the other silently.
#
# Identity entries (x -> x) are deliberately absent: a value already in the
# taxonomy passes through canonicalization unchanged.
#
# Every left-hand side below was observed in the 632-record catalogue or is a
# spelling the previous vocabulary used. Nothing was invented.
#
# `none` is deliberately absent as a synonym. It is a reserved null token —
# normalize_null() folds "none", "null", "nan", "n/a" and "" to null BEFORE
# canonicalization runs, so a mapping from it could never fire. An annotator
# who writes `none` for embellishment_type produces "the text is silent", not
# "the text says there is no embellishment". They must write
# `no_embellishment`, and validate_gold_vocabulary() reports any cell that
# says otherwise.

ai_synonyms:

  silhouette:
    coat style: coat
    coat-style: coat
    bisht style: bisht
    farashah: farasha
    farasha cut: farasha
    layered abaya: layered
    # The catalogue spells it "kloosh"; the taxonomy value is "klosh".
    kloosh: klosh
    kloosh style: klosh
    klosh cut: klosh
    a line: a-line
    aline: a-line
    alined: a-line
    # Stated silhouettes that this vocabulary does not enumerate. Mapping them
    # to `other` records "the text named a silhouette we do not list", which is
    # what happened — it is not the same as the text being silent.
    butterfly: other
    cape: other

