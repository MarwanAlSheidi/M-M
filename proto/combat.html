<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نموذج إحساس القتال</title>
<style>
  :root { --bg:#12161c; --panel:#1a2029; --line:#2b3542; --ink:#e8eef5; --dim:#8b9bb0; --hot:#e8b04b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: system-ui, "Segoe UI", sans-serif; display:flex; flex-wrap:wrap;
         gap:14px; padding:14px; align-items:flex-start; }
  canvas { background:#0d1117; border:1px solid var(--line); border-radius:6px;
           image-rendering: pixelated; touch-action:none; }
  #panel { width:290px; background:var(--panel); border:1px solid var(--line);
           border-radius:6px; padding:12px 14px; font-size:13px; }
  h1 { font-size:15px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin:0 0 12px; line-height:1.6; }
  .row { display:flex; align-items:center; gap:8px; margin:7px 0; }
  .row label { flex:1; }
  .row input[type=range] { width:104px; }
  .row .v { width:34px; text-align:left; color:var(--hot);
            font-variant-numeric:tabular-nums; }
  hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  .keys { color:var(--dim); font-size:12px; line-height:1.9; }
  kbd { background:#232c37; border:1px solid var(--line); border-radius:4px;
        padding:1px 6px; font-family:inherit; font-size:11px; color:var(--ink); }
  button { background:#232c37; color:var(--ink); border:1px solid var(--line);
           border-radius:5px; padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover { border-color:var(--hot); }
</style>
</head>
<body>

<canvas id="c" width="640" height="480"></canvas>

<div id="panel">
  <h1>إحساس القتال</h1>
  <p class="sub">مكعّبات ملوّنة عمدًا. الإحساس يُضبط قبل أن تُرسم بكسلة واحدة —
  أطفئ خانةً واحدة أدناه والعب ثانيةً لتعرف ما تفعله.</p>

  <div class="row"><label>تمهيد الضربة</label>
    <input type="range" id="s_windup" min="0" max="24" step="1"><span class="v" id="v_windup"></span></div>
  <div class="row"><label>إطارات الأذى</label>
    <input type="range" id="s_active" min="1" max="16" step="1"><span class="v" id="v_active"></span></div>
  <div class="row"><label>التعافي</label>
    <input type="range" id="s_recover" min="0" max="40" step="1"><span class="v" id="v_recover"></span></div>
  <div class="row"><label>تجميد الاصطدام</label>
    <input type="range" id="s_hitstop" min="0" max="18" step="1"><span class="v" id="v_hitstop"></span></div>
  <div class="row"><label>قوة الارتداد</label>
    <input type="range" id="s_knock" min="0" max="14" step="1"><span class="v" id="v_knock"></span></div>
  <div class="row"><label>إطارات المناعة</label>
    <input type="range" id="s_iframes" min="0" max="90" step="5"><span class="v" id="v_iframes"></span></div>
  <div class="row"><label>اهتزاز الشاشة</label>
    <input type="range" id="s_shake" min="0" max="14" step="1"><span class="v" id="v_shake"></span></div>
  <div class="row"><label>تمهيد العدو</label>
    <input type="range" id="s_tell" min="0" max="60" step="2"><span class="v" id="v_tell"></span></div>

  <hr>
  <div class="row"><label>إظهار الصناديق</label>
    <input type="checkbox" id="s_debug" checked></div>
  <div class="row"><label>تخزين ضغطة الهجوم</label>
    <input type="checkbox" id="s_buffer" checked></div>
  <button id="reset">إعادة الضبط</button>
  <button id="preset_bad">اضبطه سيّئًا</button>

  <hr>
  <div class="keys">
    <kbd>WASD</kbd> أو الأسهم — الحركة<br>
    <kbd>J</kbd> أو <kbd>مسافة</kbd> — ضربة<br>
    <kbd>K</kbd> أو <kbd>Shift</kbd> — تدحرج (مناعة أثناءه)<br>
    <kbd>R</kbd> — إحياء الجميع<br>
    <kbd>H</kbd> — إظهار/إخفاء الصناديق
  </div>
</div>

<script>
"use strict";
// ============================================================================
// نموذج إحساس القتال لزيلدا-لايك.
//
// كل التوقيت بالإطارات لا بالمللي ثانية، وبخطوة ثابتة 60/ثانية: القتال المبني
// على "بعد كم إطارًا يصير السيف مؤذيًا" ينهار إن اختلفت الخطوة بين جهاز وجهاز.
// والرسم يُفصل عن المحاكاة، فالتجميد يوقف المنطق ولا يوقف الشاشة.
// ============================================================================

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const STEP = 1000 / 60;

// ---- المعاملات القابلة للضبط. هذه هي *المنتَج*: الكود يُرمى، الأرقام تنتقل.
const DEFAULTS = {
  windup: 6,      // إطارات قبل أن يصير السيف مؤذيًا — تمهيد يقرأه الخصم
  active: 4,      // إطارات صندوق الأذى حيًّا
  recover: 14,    // إطارات بعدها لا تستطيع فعل شيء — ثمن الضربة
  hitstop: 5,     // تجميد الطرفين لحظة الاصطدام. هذا وحده نصف الإحساس
  knock: 6,       // اندفاع الارتداد بالبكسل/إطار، يخبو 0.82
  iframes: 45,    // مناعة بعد التلقّي، وإلا مات اللاعب في أربعة إطارات
  shake: 5,       // اهتزاز الشاشة
  tell: 22,       // تمهيد هجوم العدو — بدونه الضربة ظلم لا تحدٍّ
};
const P = { ...DEFAULTS };
let showDebug = true, useBuffer = true;

// ---- إدخال
const keys = new Set();
const DOWN = { attack: false, roll: false };
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
  if (keys.has(k)) return;                       // لا تكرار من نظام التشغيل
  keys.add(k);
  if (k === "j" || k === " ") DOWN.attack = true;
  if (k === "k" || k === "shift") DOWN.roll = true;
  if (k === "r") respawn();
  if (k === "h") { showDebug = !showDebug; document.getElementById("s_debug").checked = showDebug; }
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());

const held = (...ks) => ks.some((k) => keys.has(k));

// ---- كيانات
const DIRS = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] };

function makePlayer() {
  return { x: W / 2, y: H / 2, w: 18, h: 22, vx: 0, vy: 0,
           face: "down", hp: 6, maxHp: 6,
           state: "idle", t: 0,                  // t = عدّاد إطارات داخل الحالة
           iframe: 0, kx: 0, ky: 0, buffered: 0, flash: 0 };
}
function makeEnemy(x, y, patrolTo) {
  return { x, y, w: 20, h: 20, hp: 3, maxHp: 3, home: { x, y }, to: patrolTo,
           state: "patrol", t: 0, face: "down", iframe: 0, kx: 0, ky: 0,
           dead: false, flash: 0, lungeX: 0, lungeY: 0 };
}
let player, enemies, hitstop = 0, shake = 0, hitsLanded = 0, hitsTaken = 0;

function respawn() {
  player = makePlayer();
  enemies = [
    makeEnemy(150, 130, { x: 150, y: 330 }),
    makeEnemy(470, 130, { x: 470, y: 350 }),
    makeEnemy(320, 380, { x: 180, y: 380 }),
  ];
  hitstop = 0; shake = 0; hitsLanded = 0; hitsTaken = 0;
}
respawn();

// ---- هندسة
const overlaps = (a, b) =>
  Math.abs(a.x - b.x) * 2 < a.w + b.w && Math.abs(a.y - b.y) * 2 < a.h + b.h;

// صندوق الأذى منفصل عن صندوق الجسد: الأول يصيب، الثاني يُصاب. دمجهما
// يعني أن الاقتراب يؤذي، وهو ما يجعل القتال يبدو عشوائيًا.
function attackBox(e) {
  const [dx, dy] = DIRS[e.face];
  const reach = 22, thick = 26;
  return { x: e.x + dx * (e.w / 2 + reach / 2), y: e.y + dy * (e.h / 2 + reach / 2),
           w: dx ? reach : thick, h: dy ? reach : thick };
}

function applyKnock(t, fromX, fromY, power) {
  const dx = t.x - fromX, dy = t.y - fromY;
  const d = Math.hypot(dx, dy) || 1;
  t.kx = (dx / d) * power; t.ky = (dy / d) * power;
}

// ---- خطوة المحاكاة (إطار واحد ثابت)
function step() {
  // التجميد يوقف *المنطق* كله: الحركة، العدّادات، الذكاء. لو أوقف الرسم
  // بدا تعليقًا لا ضربة.
  if (hitstop > 0) { hitstop--; return; }

  if (shake > 0) shake = Math.max(0, shake - 0.6);
  stepPlayer();
  for (const e of enemies) stepEnemy(e);
  DOWN.attack = false; DOWN.roll = false;
}

function stepPlayer() {
  const p = player;
  if (p.iframe > 0) p.iframe--;
  if (p.flash > 0) p.flash--;

  // تخزين الضغطة: ضغطُك قبل انتهاء التعافي بقليل يُنفَّذ حين ينتهي، بدل أن
  // يُبتلع. بدون هذا يشعر اللاعب أن اللعبة لا تسمعه — وهو أكثر ما يُتهم به
  // القتالُ الرديء ظلمًا، فالمشكلة ليست في البطء بل في الابتلاع.
  if (DOWN.attack) p.buffered = useBuffer ? 8 : 1;
  if (p.buffered > 0) p.buffered--;

  const free = p.state === "idle";

  if (free && DOWN.roll) { p.state = "roll"; p.t = 0; }
  else if (free && p.buffered > 0) { p.state = "attack"; p.t = 0; p.buffered = 0; }

  if (p.state === "idle") {
    let mx = 0, my = 0;
    if (held("a", "arrowleft")) mx -= 1;
    if (held("d", "arrowright")) mx += 1;
    if (held("w", "arrowup")) my -= 1;
    if (held("s", "arrowdown")) my += 1;
    if (mx || my) {
      const d = Math.hypot(mx, my);
      p.vx = (mx / d) * 2.6; p.vy = (my / d) * 2.6;
      p.face = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? "right" : "left") : (my > 0 ? "down" : "up");
    } else { p.vx *= 0.6; p.vy *= 0.6; }
  } else if (p.state === "attack") {
    p.vx *= 0.5; p.vy *= 0.5;                    // الضربة تثبّتك: لها ثمن
    p.t++;
    const box = attackBox(p);
    if (p.t > P.windup && p.t <= P.windup + P.active) {
      for (const e of enemies) {
        if (e.dead || e.iframe > 0) continue;
        if (!overlaps(box, e)) continue;
        e.hp--; e.iframe = 12; e.flash = 8; hitsLanded++;
        applyKnock(e, p.x, p.y, P.knock);
        hitstop = P.hitstop; shake = P.shake;
        if (e.hp <= 0) { e.dead = true; shake = P.shake * 1.4; }
      }
    }
    if (p.t >= P.windup + P.active + P.recover) { p.state = "idle"; p.t = 0; }
  } else if (p.state === "roll") {
    const [dx, dy] = DIRS[p.face];
    p.vx = dx * 4.4; p.vy = dy * 4.4;
    p.iframe = Math.max(p.iframe, 2);            // المناعة أثناء التدحرج فقط
    p.t++;
    if (p.t >= 16) { p.state = "idle"; p.t = 0; }
  }

  p.x += p.vx + p.kx; p.y += p.vy + p.ky;
  p.kx *= 0.82; p.ky *= 0.82;
  p.x = Math.max(p.w / 2, Math.min(W - p.w / 2, p.x));
  p.y = Math.max(p.h / 2, Math.min(H - p.h / 2, p.y));
}

function stepEnemy(e) {
  if (e.dead) return;
  if (e.iframe > 0) e.iframe--;
  if (e.flash > 0) e.flash--;

  const dx = player.x - e.x, dy = player.y - e.y;
  const dist = Math.hypot(dx, dy);

  if (e.state === "patrol") {
    const tx = e.t % 240 < 120 ? e.to.x : e.home.x;
    const ty = e.t % 240 < 120 ? e.to.y : e.home.y;
    const ax = tx - e.x, ay = ty - e.y, ad = Math.hypot(ax, ay) || 1;
    e.x += (ax / ad) * 0.7; e.y += (ay / ad) * 0.7;
    e.t++;
    if (dist < 110) { e.state = "tell"; e.t = 0; }
  } else if (e.state === "tell") {
    // التمهيد شرط العدل لا زينة: اللاعب يجب أن يرى الضربة قادمة ويملك
    // وقتًا للتدحرج. أنزل "تمهيد العدو" إلى الصفر وستشعر بالفرق فورًا.
    e.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    e.t++;
    if (e.t >= P.tell) {
      const d = dist || 1;
      e.lungeX = (dx / d) * 5.2; e.lungeY = (dy / d) * 5.2;
      e.state = "lunge"; e.t = 0;
    }
    if (dist > 190) { e.state = "patrol"; e.t = 0; }
  } else if (e.state === "lunge") {
    e.x += e.lungeX; e.y += e.lungeY;
    e.lungeX *= 0.92; e.lungeY *= 0.92;
    e.t++;
    if (player.iframe <= 0 && overlaps(e, player)) {
      player.hp--; player.iframe = P.iframes; player.flash = 10; hitsTaken++;
      applyKnock(player, e.x, e.y, P.knock * 1.3);
      hitstop = P.hitstop; shake = P.shake * 1.2;
      if (player.hp <= 0) { player.hp = 0; }
    }
    if (e.t >= 22) { e.state = "rest"; e.t = 0; }
  } else if (e.state === "rest") {
    e.t++;
    if (e.t >= 34) { e.state = dist < 150 ? "tell" : "patrol"; e.t = 0; }
  }

  e.x += e.kx; e.y += e.ky;
  e.kx *= 0.82; e.ky *= 0.82;
  e.x = Math.max(e.w / 2, Math.min(W - e.w / 2, e.x));
  e.y = Math.max(e.h / 2, Math.min(H - e.h / 2, e.y));
}

// ---- الرسم
function box(o, fill, stroke) {
  ctx.fillStyle = fill;
  ctx.fillRect(Math.round(o.x - o.w / 2), Math.round(o.y - o.h / 2), o.w, o.h);
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(o.x - o.w / 2) + 0.5, Math.round(o.y - o.h / 2) + 0.5, o.w - 1, o.h - 1); }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0d1117"; ctx.fillRect(0, 0, W, H);
  if (shake > 0.1) ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);

  ctx.strokeStyle = "#161d26"; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 32) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }

  for (const e of enemies) {
    if (e.dead) continue;
    let fill = "#b6483f";
    if (e.state === "tell") {
      // التمهيد يُقرأ بصريًّا: يسطع كلما اقتربت الضربة
      const k = Math.min(1, e.t / Math.max(1, P.tell));
      fill = `rgb(${182 + 60 * k},${72 - 30 * k},${63 - 30 * k})`;
    } else if (e.state === "lunge") fill = "#ff6a4d";
    if (e.flash > 0 && e.flash % 4 < 2) fill = "#ffffff";
    box(e, fill, "#2b3542");
    if (showDebug) { ctx.strokeStyle = "#4fd67a"; ctx.lineWidth = 1;
      ctx.strokeRect(e.x - e.w / 2 - 1.5, e.y - e.h / 2 - 1.5, e.w + 3, e.h + 3); }
    if (e.state === "tell" && showDebug) {
      ctx.strokeStyle = "rgba(255,180,60,0.8)"; ctx.beginPath();
      ctx.arc(e.x, e.y, 14 + (P.tell - e.t) * 0.5, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = "#2b3542"; ctx.fillRect(e.x - 12, e.y - e.h / 2 - 8, 24, 3);
    ctx.fillStyle = "#e05a4a"; ctx.fillRect(e.x - 12, e.y - e.h / 2 - 8, 24 * (e.hp / e.maxHp), 3);
  }

  const p = player;
  // الوميض أثناء المناعة: يقول لك "لا تُصاب الآن" بلا نص
  const hidden = p.iframe > 0 && Math.floor(p.iframe / 3) % 2 === 0;
  if (!hidden) {
    let fill = p.state === "roll" ? "#6fd0ff" : "#4a90c9";
    if (p.flash > 0 && p.flash % 4 < 2) fill = "#ffffff";
    box(p, fill, "#2b3542");
    const [dx, dy] = DIRS[p.face];
    ctx.fillStyle = "#e8eef5";
    ctx.fillRect(p.x + dx * 7 - 2, p.y + dy * 8 - 2, 4, 4);
  }
  if (showDebug) {
    ctx.strokeStyle = "#4fd67a"; ctx.lineWidth = 1;
    ctx.strokeRect(p.x - p.w / 2 - 1.5, p.y - p.h / 2 - 1.5, p.w + 3, p.h + 3);
    if (p.state === "attack") {
      const b = attackBox(p);
      const live = p.t > P.windup && p.t <= P.windup + P.active;
      ctx.strokeStyle = live ? "#ffd24a" : "rgba(255,210,74,0.28)";
      ctx.lineWidth = live ? 2 : 1;
      ctx.strokeRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#e8eef5"; ctx.font = "12px system-ui"; ctx.textAlign = "left";
  const phase = p.state !== "attack" ? "—"
    : p.t <= P.windup ? `تمهيد ${p.t}/${P.windup}`
    : p.t <= P.windup + P.active ? `أذى ${p.t - P.windup}/${P.active}`
    : `تعافٍ ${p.t - P.windup - P.active}/${P.recover}`;
  ctx.fillText(`الحالة: ${p.state}   ${phase}`, 8, 16);
  ctx.fillText(`أصبتَ ${hitsLanded}   أُصبتَ ${hitsTaken}   تجميد ${hitstop}`, 8, 32);
  ctx.fillStyle = "#2b3542"; ctx.fillRect(8, 40, 120, 6);
  ctx.fillStyle = "#4fd67a"; ctx.fillRect(8, 40, 120 * (p.hp / p.maxHp), 6);
  if (p.hp <= 0) {
    ctx.fillStyle = "rgba(13,17,23,0.72)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#e8eef5"; ctx.font = "18px system-ui"; ctx.textAlign = "center";
    ctx.fillText("سقطتَ — اضغط R", W / 2, H / 2);
  }
}

// ---- الحلقة: خطوة ثابتة، رسم حر
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(200, now - last); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- لوحة الضبط
const SLIDERS = ["windup", "active", "recover", "hitstop", "knock", "iframes", "shake", "tell"];
function syncPanel() {
  for (const k of SLIDERS) {
    document.getElementById("s_" + k).value = P[k];
    document.getElementById("v_" + k).textContent = P[k];
  }
}
for (const k of SLIDERS) {
  document.getElementById("s_" + k).addEventListener("input", (e) => {
    P[k] = +e.target.value;
    document.getElementById("v_" + k).textContent = P[k];
  });
}
document.getElementById("s_debug").addEventListener("change", (e) => showDebug = e.target.checked);
document.getElementById("s_buffer").addEventListener("change", (e) => useBuffer = e.target.checked);
document.getElementById("reset").addEventListener("click", () => { Object.assign(P, DEFAULTS); syncPanel(); respawn(); });
// كل ما يُطفأ هنا مقصود: هكذا يبدو القتال حين تُهمَل هذه التفاصيل تحديدًا.
document.getElementById("preset_bad").addEventListener("click", () => {
  Object.assign(P, { windup: 0, active: 2, recover: 2, hitstop: 0, knock: 0, iframes: 0, shake: 0, tell: 0 });
  document.getElementById("s_buffer").checked = false; useBuffer = false;
  syncPanel(); respawn();
});
syncPanel();

// للاختبار الآلي
window.__proto = { P, get player() { return player; }, get enemies() { return enemies; },
                   get hitstop() { return hitstop; }, DOWN, keys, step, respawn,
                   stats: () => ({ hitsLanded, hitsTaken }) };
</script>
</body>
</html>
